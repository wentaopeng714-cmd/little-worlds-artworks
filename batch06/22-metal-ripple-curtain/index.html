<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>金属涟幕 · 第六组</title><style>:root{--bg:#101216;--ink:#eee8d9;--accent:#dccc78;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}header h1{letter-spacing:.08em}</style><body><header><div><h1>金属涟幕</h1><p>直接拖褶脊、揉出谷、翻层与雕压；密金属线会跟着整幕变形。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="金属涟幕，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="ridge" id="ridge">拖褶脊</button><button data-action="valley" id="valley">揉谷</button><button data-action="flip" id="flip">翻褶层</button><button data-action="stamp" id="stamp">雕压</button><button data-action="release" id="release">松悬幕</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=22;window.artMeta={"number": 22, "slug": "22-metal-ripple-curtain", "title": "金属涟幕", "group": "G", "mothers": ["metal_wave_generative_studio.html"], "innovation": "密金属线褶皱，拖脊、揉谷、分层翻褶与局部雕压", "description": "直接拖褶脊、揉出谷、翻层与雕压；密金属线会跟着整幕变形。", "ui": {"bg": "#101216", "ink": "#eee8d9", "accent": "#dccc78"}, "controls": [{"id": "ridge", "label": "拖褶脊"}, {"id": "valley", "label": "揉谷"}, {"id": "flip", "label": "翻褶层"}, {"id": "stamp", "label": "雕压"}, {"id": "release", "label": "松悬幕"}], "newMechanics": ["拖脊持久改变整个密线悬幕", "揉谷制造深谷，后续翻褶改变谷口", "分层翻折改变幕的真实外沿", "雕压留下与褶脊一起运动的纹路"], "artDirection": ["母本密行轮廓、白偏移高光与饱和彩丝", "整幅悬挂金属织面，褶谷有真实暗层", "不复用极光透明光帘"], "testPlan": [{"control": "ridge", "from": [0.32, 0.46], "to": [0.62, 0.52], "hold": 650}, {"control": "valley", "from": [0.63, 0.32], "to": [0.47, 0.45], "hold": 650}, {"control": "flip", "from": [0.52, 0.68], "to": [0.57, 0.45], "hold": 650}, {"control": "stamp", "from": [0.44, 0.66], "to": [0.44, 0.66], "hold": 650}, {"control": "release", "from": [0.39, 0.68], "to": [0.55, 0.58], "hold": 650}], "stateFields": ["bounded", "mode", "status", "processed", "persistentResult", "deformations", "engravings", "fold", "stress"], "css": "header h1{letter-spacing:.08em}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,cl=e.clamp;let dirty=true,cache=document.createElement('canvas'),cc=cache.getContext('2d'),lastPaint=0,mesh=null;const mark=()=>{dirty=true};let fields=[],stamps=[],mode='ridge',last=null,fold=0,processed=0,light=.4;const label={ridge:'拖褶脊：横向拉脊，纵向抬幕，形变持续',valley:'揉谷：沿手势压出深谷，可再拉开',flip:'翻褶层：拖動卷起局部边，露出暗金背面',stamp:'雕压：在已有褶皱上刻出扇纹',release:'松悬幕：缓释张力，雕纹仍随幕保留'};function reset(){mark();fields=[];stamps=[];mode='ridge';last=null;fold=0;processed=0;light=.4}function apply(p,down){mark();let q={x:cl(p.x/e.W,0,1),y:cl(p.y/e.H,0,1)};if(mode==='ridge'&&last){fields.push({x:q.x,y:q.y,dx:(q.x-last.x)*4,dy:(q.y-last.y)*3,r:.21});if(fields.length>75)fields.shift()}if(mode==='valley'){fields.push({x:q.x,y:q.y,dx:0,dy:.018,r:.13});if(fields.length>75)fields.shift()}if(mode==='flip'){fold=cl(fold+(last?(q.y-last.y)*3:.05),-.45,.55);fields.push({x:q.x,y:q.y,dx:.003,dy:-.007,r:.18});if(fields.length>75)fields.shift()}if(mode==='stamp'&&down){stamps.push({...q,a:processed*.31});if(stamps.length>24)stamps.shift()}last=q;processed++}function point(u,v,t){let pleat=Math.sin(u*30+Math.sin(v*5)*.6),small=Math.sin(u*71-v*2)*.15;let x=.09+.82*u+.018*Math.sin(v*5+u*9),y=.11+.73*v+(.035+.043*v)*pleat+.012*small;for(let f of fields){let d=(u-f.x)**2+(v-f.y)**2,fall=Math.exp(-d/(f.r*f.r));x+=f.dx*fall;y+=f.dy*fall}y-=fold*Math.pow(v,5)*(.65+.35*Math.cos(u*9));x=.09+.82*u+cl(x-(.09+.82*u),-.12,.12);y=cl(y,.06,.94);return{x:x*e.W,y:y*e.H,z:pleat+small+fold*v*2}}
function draw(dt,t){let W=e.W,H=e.H,m=Math.min(W,H);if(mode==='release'&&t-lastPaint>.15){for(let f of fields){f.dx*=.975;f.dy*=.975}dirty=true}if(cache.width!==Math.round(W)||cache.height!==Math.round(H)){cache.width=Math.round(W);cache.height=Math.round(H);dirty=true}if(!dirty){c.drawImage(cache,0,0,W,H);return}dirty=false;lastPaint=t;c.fillStyle='#101216';c.fillRect(0,0,W,H);let bg=c.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,W*.6);bg.addColorStop(0,'#383023');bg.addColorStop(1,'#101216');c.fillStyle=bg;c.fillRect(0,0,W,H);c.strokeStyle='#6c5e43';c.lineWidth=3;c.beginPath();c.moveTo(W*.07,H*.08);c.lineTo(W*.93,H*.08);c.stroke();for(let k=0;k<11;k++){let x=W*(.09+k*.082);c.fillStyle='#c0ad75';c.beginPath();c.ellipse(x,H*.095,3,5,0,0,7);c.fill()}const rows=Math.round(Math.max(190,Math.min(330,H*.53))),cols=95;mesh=Array.from({length:rows+1},(_,i)=>Array.from({length:cols+1},(_,j)=>point(j/cols,i/rows,t)));for(let pass=0;pass<2;pass++){c.lineWidth=pass?Math.max(.65,m/1000):1.8;for(let i=rows;i>=0;i--){let v=i/rows;for(let seg=0;seg<6;seg++){c.beginPath();let start=Math.floor(seg*cols/6),end=Math.ceil((seg+1)*cols/6),mid=mesh[i][Math.floor((start+end)/2)];let bright=cl(.4+.4*Math.sin(mid.z*1.8+light),.12,.95);let hue=[46,166,272,35,205,290][seg],sat=pass?55:12,lum=pass?Math.round(22+bright*58):Math.round(18+bright*63);c.strokeStyle=pass?'hsl('+hue+' '+sat+'% '+lum+'%)':'hsl(45 18% '+lum+'%)';for(let j=start;j<=end;j++){let p=mesh[i][j],x=p.x+(pass?0:1.2),y=p.y+(pass?0:1.1);j===start?c.moveTo(x,y):c.lineTo(x,y)}c.stroke()}}}for(let a of stamps){let p=point(a.x,a.y,t);c.save();c.translate(p.x,p.y);c.rotate(a.a);let r=m*.046;c.strokeStyle='#1f2118a0';c.lineWidth=1.1;for(let k=0;k<12;k++){let theta=-1.2+k*.22;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(Math.cos(theta)*r*.4,Math.sin(theta)*r*.3,Math.cos(theta)*r,Math.sin(theta)*r);c.stroke();c.strokeStyle=k%2?'#e9da9380':'#14281b80'}c.restore()}for(let u of [0,1]){c.strokeStyle='#e3da9580';c.lineWidth=1;c.beginPath();for(let i=0;i<=70;i++){let p=point(u,i/70,t);i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)}c.stroke()}cc.drawImage(e.canvas,0,0,e.canvas.width,e.canvas.height,0,0,cache.width,cache.height)}return{reset,draw,input(k,p){if(k==='down'||k==='move'&&last)apply(p,k==='down');if(k==='up'||k==='cancel')last=null},action(id){mark();mode=id;if(id==='release')fold*=.6},state(){return{bounded:true,mode,processed,persistentResult:fields.length+stamps.length,deformations:fields.length,engravings:stamps.length,fold,stress:fields.reduce((a,f)=>a+Math.abs(f.dx)+Math.abs(f.dy),0),status:label[mode]+' · '+fields.length+' 褶势 / '+stamps.length+' 雕纹'}}}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
