<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>风递小邮局 · 小小世界05</title><link rel="stylesheet" href="style.css"><style>:root{--bg:#f3e7d1;--stage:#f0e1c9;--ink:#5b726a}</style></head><body><main><header class="heading"><div><div class="kicker">C04 / AIRMAIL HOUSE</div><h1>风递小邮局</h1><p class="description">信沿着透明彩管跑。转动阀门、移动管线、倒转风，把一座邮局变成持续变化的信件装置。</p></div><div class="right"><button id="mute">声音 · 开</button><button id="reset">重置</button></div></header><section class="stage"><canvas id="art" aria-label="风递小邮局互动场景"></canvas></section><footer><nav class="toolbar"><button id="send" data-action="send">送三封信</button><button id="valve" data-action="valve">轮换三阀</button><button id="air" data-action="air">风力三档</button><button id="reverse" data-action="reverse">前进 / 回风</button><button id="return" data-action="return">收回信件</button><button id="palette" data-action="palette">更换信纸</button></nav><p id="status"></p><span class="small">首次点按启用原创合成音乐 · 鼠标与触控均可 · 本地打开可离线玩</span><details><summary>玩法与来源</summary>点三个彩色圆形阀门，改变它对应的收件箱；拖阀门可以弯曲整条管线。<br>送三封信会分别进入三条管道，风力三档改变运动速度。<br>倒转风让信返回入口再分流，收回信件会把箱里信送回管道。<br>更換信纸、不同阀门、拖动位置与正反风可以叠加；每箱只保留最近七封，不无限累积。<p>参考：<a href="https://www.moma.org/artists/4163-bruno-munari">Munari机械时代平面构成，只参考抽象机械结构成为玩具的思考，不复制作品。</a></p></details></footer></main><script src="audio.js"></script><script src="config.js"></script><script src="common.js"></script><script src="app.js"></script></body></html>
