</style></head><body data-number="10"><header><div><h1 id="title"></h1><div id="hint"></div></div><nav><button id="sound" type="button" aria-pressed="false">声音开启</button><button id="reset" type="button">重新开始</button><button id="capture" type="button">存画面</button></nav></header><main><canvas aria-label="可拖动的互动艺术画面"></canvas><output id="qa"></output></main><footer><div id="tools" role="group" aria-label="作品工具"></div><div id="soundnote"></div></footer><script>(function () {

    ellipse(c, -73, 59, 34, 20, C.rose); ellipse(c, 98, 47, 23, 16, C.rose);
