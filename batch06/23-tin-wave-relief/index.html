<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>锡浪浮刻 · 第六组</title><style>:root{--bg:#1c2424;--ink:#dbded2;--accent:#d79661;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}header h1{letter-spacing:.08em}</style><body><header><div><h1>锡浪浮刻</h1><p>在铜锡薄板压凸与刻槽，补缀重塑旧痕，旋光和氧化显出浮刻。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="锡浪浮刻，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="raise" id="raise">压凸</button><button data-action="groove" id="groove">刻槽</button><button data-action="light" id="light">旋光</button><button data-action="patch" id="patch">补缀</button><button data-action="patina" id="patina">氧化显色</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=23;window.artMeta={"number": 23, "slug": "23-tin-wave-relief", "title": "锡浪浮刻", "group": "G", "mothers": ["metal_wave_generative_studio.html"], "innovation": "密线铜锡浮刻，刻槽、压凸、旋光与补缀，留下持续浮雕", "description": "在铜锡薄板压凸与刻槽，补缀重塑旧痕，旋光和氧化显出浮刻。", "ui": {"bg": "#1c2424", "ink": "#dbded2", "accent": "#d79661"}, "controls": [{"id": "raise", "label": "压凸"}, {"id": "groove", "label": "刻槽"}, {"id": "light", "label": "旋光"}, {"id": "patch", "label": "补缀"}, {"id": "patina", "label": "氧化显色"}], "newMechanics": ["铜锡板局部压凸改变密等高线", "刻槽路径切开凸起并留下铜色沟边", "补缀重塑凹面与旧沟，不删除全板", "旋光控制高光并氧化显出加工区域"], "artDirection": ["母本极密金属轮廓形成体量", "锡灰亮边、铜锈橙绿、黑刻槽", "不规则片形外沿与局部凸凹雕刻"], "testPlan": [{"control": "raise", "from": [0.32, 0.46], "to": [0.67, 0.57], "hold": 650}, {"control": "groove", "from": [0.4, 0.3], "to": [0.7, 0.66], "hold": 650}, {"control": "light", "from": [0.32, 0.46], "to": [0.67, 0.57], "hold": 650}, {"control": "patch", "from": [0.53, 0.48], "to": [0.58, 0.5], "hold": 650}, {"control": "patina", "from": [0.39, 0.68], "to": [0.55, 0.58], "hold": 650}], "stateFields": ["bounded", "mode", "status", "processed", "persistentResult", "embossings", "grooves", "repairs", "light", "oxidized"], "css": "header h1{letter-spacing:.08em}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];

function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}

function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}

async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

})();
</script><script>window.createScene=function(e){const output=e.ctx,cl=e.clamp;let c=output,plate=document.createElement("canvas"),pc=plate.getContext("2d");let renderPerf={lastMs:0,maxMs:0,redraws:0,gridPoints:0},dirty=true,cache=document.createElement('canvas'),cc=cache.getContext('2d');const mark=()=>{dirty=true};let bumps=[],grooves=[],mode='raise',last=null,light=0,oxidized=false,processed=0;const label={raise:'压凸：连续压出凸面，密线向外绕行',groove:'刻槽：拖出铜色深沟，会切断旧凸面',light:'旋光：左右拖动，看明暗翻过浮刻',patch:'补缀：拖过旧沟与凹凸，留下修补锡片',patina:'氧化显色：铜色只在加工痕与凸脊显现'};function reset(){mark();bumps=[{x:.34,y:.39,z:.1,r:.17},{x:.66,y:.6,z:.08,r:.18},{x:.61,y:.29,z:.09,r:.13}];grooves=[];mode='raise';last=null;light=.4;oxidized=false;processed=0}function apply(p,down){mark();let q={x:cl(p.x/e.W,.05,.95),y:cl(p.y/e.H,.05,.95)};if(mode==='raise'&&(down||processed%3===0)){bumps.push({...q,z:.038,r:.11});if(bumps.length>55)bumps.shift()}if(mode==='groove'){if(down){grooves.push([q]);if(grooves.length>14)grooves.shift()}else{let a=grooves[grooves.length-1];if(a&&a.length<120)a.push(q)}for(let a of bumps)if(Math.hypot(a.x-q.x,a.y-q.y)<.08)a.z=Math.max(-.03,a.z-.007)}if(mode==='light'){light=q.x*Math.PI*4}if(mode==='patch'){for(let a of bumps)if(Math.hypot(a.x-q.x,a.y-q.y)<.13)a.z*=.85;for(let a of grooves)for(let v of a)if(Math.hypot(v.x-q.x,v.y-q.y)<.09)v.repaired=true;if(down){bumps.push({...q,z:.016,r:.15,patch:true});if(bumps.length>55)bumps.shift()}}last=q;processed++}function height(u,v){let h=.019*Math.sin(u*23+v*14)+.022*Math.sin(v*24-u*11);for(let b of bumps)h+=b.z*Math.exp(-((u-b.x)**2+(v-b.y)**2)/(b.r*b.r));return h}function boundary(c,t){let W=e.W,H=e.H;c.beginPath();for(let i=0;i<=180;i++){let a=i/180*Math.PI*2,r=1+.026*Math.sin(a*11)+.012*Math.cos(a*23);let x=W*.5+W*.415*Math.cos(a)*r,y=H*.51+H*.4*Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath()}
function draw(dt,t){let W=e.W,H=e.H,m=Math.min(W,H);if(cache.width!==Math.round(W)||cache.height!==Math.round(H)){cache.width=Math.round(W);cache.height=Math.round(H);dirty=true}if(!dirty){c.drawImage(cache,0,0,W,H);return}dirty=false;const renderStart=performance.now();c.fillStyle='#1c2424';c.fillRect(0,0,W,H);let shadow=c.createRadialGradient(W*.53,H*.57,m*.1,W*.5,H*.5,m*.6);shadow.addColorStop(0,'#000a');shadow.addColorStop(1,'#0000');c.fillStyle=shadow;c.fillRect(0,0,W,H);if(plate.width!==Math.round(W)||plate.height!==Math.round(H)){plate.width=Math.round(W);plate.height=Math.round(H)}pc.clearRect(0,0,plate.width,plate.height);c=pc;c.save();boundary(c,t);c.fillStyle='#3b4140';c.fill();let rows=Math.max(230,Math.min(370,H*.6)),cols=144;
// Gaussian deformation is separable: reuse each bump's horizontal weight
// over the complete row, then combine with its single vertical weight.
const bumpX=bumps.map(b=>{let values=new Float32Array(cols+1);for(let j=0;j<=cols;j++){let dx=j/cols-b.x;values[j]=Math.exp(-(dx*dx)/(b.r*b.r))}return values});
const rowHeight=new Float32Array(cols+1),rowX=new Float32Array(cols+1),rowY=new Float32Array(cols+1);
function gridSample(f){let j=Math.floor(f),mix=f-j;if(j<0)return rowHeight[0]+f*(rowHeight[1]-rowHeight[0]);if(j>=cols)return rowHeight[cols]+(f-cols)*(rowHeight[cols]-rowHeight[cols-1]);return rowHeight[j]*(1-mix)+rowHeight[j+1]*mix}
for(let i=0;i<=rows;i++){let v=i/rows;for(let j=0;j<=cols;j++){let u=j/cols;rowHeight[j]=.019*Math.sin(u*23+v*14)+.022*Math.sin(v*24-u*11)}for(let bi=0;bi<bumps.length;bi++){let b=bumps[bi],dy=v-b.y,weight=b.z*Math.exp(-(dy*dy)/(b.r*b.r)),horizontal=bumpX[bi];for(let j=0;j<=cols;j++)rowHeight[j]+=weight*horizontal[j]}for(let j=0;j<=cols;j++){let u=j/cols;rowX[j]=u*W+.015*W*Math.sin(v*19+u*11);rowY[j]=(v-rowHeight[j])*H}
for(let seg=0;seg<48;seg++){let j0=Math.floor(seg*cols/48),j1=Math.ceil((seg+1)*cols/48),mid=(j0+j1)*.5,u=mid/cols,z=gridSample(mid),slope=(gridSample(mid+.012*cols)-gridSample(mid-.012*cols))*20,shine=cl(.52+.38*Math.sin(slope*2+light)+z,.12,1),isCu=oxidized&&(z>.09||Math.sin(u*30+v*42)>.9);c.strokeStyle=isCu?'hsl('+Math.round(27+shine*18)+' 45% '+Math.round(22+shine*44)+'%)':'hsl('+Math.round(170+shine*45)+' '+Math.round(6+shine*12)+'% '+Math.round(20+shine*65)+'%)';c.lineWidth=Math.max(.7,m/800);c.beginPath();for(let j=j0;j<=j1;j++){j===j0?c.moveTo(rowX[j],rowY[j]):c.lineTo(rowX[j],rowY[j])}c.stroke();c.strokeStyle='#e4e7cf'+(shine>.65?'90':'24');c.lineWidth=.4;c.beginPath();for(let j=j0;j<=j1;j++){j===j0?c.moveTo(rowX[j],rowY[j]+1.1):c.lineTo(rowX[j],rowY[j]+1.1)}c.stroke()}}
renderPerf.gridPoints=(Math.floor(rows)+1)*(cols+1);
for(let a of grooves){if(a.length<2)continue;for(let pass=0;pass<3;pass++){c.strokeStyle=pass===0?'#131b1d':pass===1?'#b9764e':'#e5b880';c.lineWidth=pass===0?5:pass===1?2:1;c.beginPath();let prev=false;for(let v of a){if(v.repaired){prev=false;continue}let x=v.x*W,y=(v.y-height(v.x,v.y))*H+(pass===2?2:0);prev?c.lineTo(x,y):c.moveTo(x,y);prev=true}c.stroke()}}for(let b of bumps.filter(b=>b.patch)){let x=b.x*W,y=(b.y-height(b.x,b.y))*H;c.strokeStyle='#afc3b9';c.lineWidth=.6;c.setLineDash([2,3]);c.beginPath();c.ellipse(x,y,b.r*m*.6,b.r*m*.3,-.3,0,7);c.stroke();c.setLineDash([])}c.restore();c.globalCompositeOperation='destination-in';boundary(c,t);c.fillStyle='#fff';c.fill();c.globalCompositeOperation='source-over';c=output;c.drawImage(plate,0,0,W,H);boundary(c,t);c.strokeStyle='#9faaa0';c.lineWidth=2;c.stroke();for(let i=0;i<9;i++){let a=i/9*6.28,x=W*.5+W*.382*Math.cos(a),y=H*.51+H*.36*Math.sin(a);c.fillStyle='#171b1b';c.beginPath();c.arc(x,y,2.5,0,7);c.fill();c.strokeStyle='#c5c6a5';c.lineWidth=.6;c.stroke()}cc.drawImage(e.canvas,0,0,e.canvas.width,e.canvas.height,0,0,cache.width,cache.height);renderPerf.lastMs=performance.now()-renderStart;renderPerf.maxMs=Math.max(renderPerf.maxMs,renderPerf.lastMs);renderPerf.redraws++}return{reset,draw,input(k,p){if(k==='down'||k==='move'&&last)apply(p,k==='down');if(k==='up'||k==='cancel')last=null},action(id){mark();mode=id;if(id==='patina')oxidized=!oxidized},state(){return{bounded:true,renderMs:renderPerf.lastMs,maxRenderMs:renderPerf.maxMs,redraws:renderPerf.redraws,gridPoints:renderPerf.gridPoints,mode,processed,persistentResult:bumps.length+grooves.length,embossings:bumps.length,grooves:grooves.length,repairs:grooves.reduce((s,a)=>s+a.filter(v=>v.repaired).length,0),light,oxidized,status:label[mode]+' · '+bumps.length+' 凸面 / '+grooves.length+' 沟'}}}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});

function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
