<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拓墨龙卷 · 第六组</title><style>:root{--bg:#c37b32;--ink:#302326;--accent:#58436d;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>拓墨龙卷</h1><p>湿墨拖出分叉墨丝；拨卷改变墨团，吸墨留白，转印后继续叠染与干湿切换。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="拓墨龙卷，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="wet" id="wet">湿墨生丝</button><button data-action="curl" id="curl">拨卷</button><button data-action="absorb" id="absorb">吸墨隔版</button><button data-action="transfer" id="transfer">翻纸转印</button><button data-action="dry" id="dry">干湿切换</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=5;window.artMeta={"number": 5, "slug": "05-ink-tornado", "title": "拓墨龙卷", "group": "F", "mothers": ["pseudo_ink_drawing.html"], "description": "湿墨拖出分叉墨丝；拨卷改变墨团，吸墨留白，转印后继续叠染与干湿切换。", "ui": {"bg": "#c37b32", "ink": "#302326", "accent": "#58436d"}, "controls": [{"id": "wet", "label": "湿墨生丝"}, {"id": "curl", "label": "拨卷"}, {"id": "absorb", "label": "吸墨隔版"}, {"id": "transfer", "label": "翻纸转印"}, {"id": "dry", "label": "干湿切换"}], "newMechanics": ["透明墨丝一次分叉受控", "湿墨持续长形", "拨卷改墨团朝向与扭曲", "吸墨隔版形成留白", "翻纸转印与原版叠染"], "artDirection": ["赭纸纤维颗粒", "多色透明递归枝丝", "墨团卷成非对称龙卷与拓印"], "testPlan": [{"control": "wet", "from": [0.35, 0.7], "to": [0.53, 0.23], "hold": 1000}, {"control": "curl", "from": [0.5, 0.5], "to": [0.72, 0.58], "hold": 900}, {"control": "absorb", "from": [0.42, 0.45], "to": [0.54, 0.42], "hold": 650}, {"control": "transfer", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 650}], "stateFields": {"inkPatches": "湿墨后增加；计数最多999，活墨丝上限3200", "absorbMasks": "吸墨后>0", "prints": "转印后>0", "dry": "切换干湿状态", "liveInkThreads": "湿墨时>0，最多3200；干版冻结", "curlFields": "拨卷后>0，最多6"}};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,P=['#be234d','#7e258e','#087886','#254492','#427144'];const layer=document.createElement('canvas'),lc=layer.getContext('2d');let motes=[],patches=0,masks=[],winds=[],printings=[],mode='wet',drag=null,dry=false,transfers=0,clock=0,birth=0;const R=n=>{let v=Math.sin(n*97.217+14.31)*43758.54;return v-Math.floor(v)};function emit(x,y,count=25,col){for(let k=0;k<count&&motes.length<3200;k++){let n=birth++;motes.push({x:x+(R(n)-.5)*.025,y:y+(R(n+11)-.5)*.018,vx:(R(n+20)-.5)*.018,vy:(R(n+40)-.5)*.015,col:col===undefined?Math.floor(R(n+80)*5):col,life:1.5+R(n+90)*1.8,age:0,branched:false})}}function reset(){layer.width=Math.max(1,e.W);layer.height=Math.max(1,e.H);motes=[];masks=[];winds=[];printings=[];mode='wet';drag=null;dry=false;transfers=0;clock=0;birth=0;patches=5;for(let k=0;k<700;k++){let u=R(k),x=.5+Math.sin(u*9+.4)*.11;emit(x,.1+u*.8,2,Math.floor(u*5))}for(let k=0;k<50;k++)advance(.02,true)}function maskPath(ctx,m){let W=layer.width,H=layer.height,S=Math.min(W,H),r=S*m.r;ctx.beginPath();for(let k=0;k<28;k++){let a=k*Math.PI/14,rr=r*(.85+R(k+m.seed)*.22),x=m.x*W+Math.cos(a)*rr,y=m.y*H+Math.sin(a)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function advance(dt,warm=false){if(dry)return;const W=layer.width,H=layer.height;lc.lineCap='round';let born=[];for(let k=motes.length-1;k>=0;k--){let p=motes[k],px=p.x,py=p.y,u=e.clamp((p.y-.1)/.8,0,1),spine=.5+Math.sin(u*9+.4)*.11,dx=spine-p.x;let ax=Math.sin(p.y*43+Math.cos(p.x*23))* .13+dx*.55,ay=Math.cos(p.x*37+Math.sin(p.y*19))*.07-.012;for(let w of winds){let xx=p.x-w.x,yy=p.y-w.y,d=Math.hypot(xx,yy);if(d<.23){ax+=(-yy*.8+w.vx*.3)*(1-d/.23);ay+=(xx*.8+w.vy*.3)*(1-d/.23)}}p.vx=(p.vx+ax*dt)*Math.pow(.97,dt*60);p.vy=(p.vy+ay*dt)*Math.pow(.97,dt*60);p.x+=p.vx*dt;p.y+=p.vy*dt;p.age+=dt;p.life-=dt;if(p.life<=0||p.x<.01||p.x>.99||p.y<.01||p.y>.99){motes.splice(k,1);continue}if(masks.some(m=>Math.hypot(p.x-m.x,p.y-m.y)<m.r*.8))continue;lc.strokeStyle=P[p.col%5];lc.globalAlpha=.18*(Math.min(1,p.life));lc.lineWidth=.45+R(k+4)*1.1;lc.beginPath();lc.moveTo(px*W,py*H);lc.lineTo(p.x*W,p.y*H);lc.stroke();if(p.age>.65&&!p.branched){p.branched=true;if(motes.length+born.length<3200){let a=Math.atan2(p.vy,p.vx)+(R(k+7)-.5)*1.8;born.push({...p,vx:Math.cos(a)*.03,vy:Math.sin(a)*.03,col:(p.col+1)%5,life:1.1,age:0,branched:true})}}}motes.push(...born);lc.globalAlpha=1}
function paper(){let W=e.W,H=e.H,g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#d39147');g.addColorStop(.5,'#c1792f');g.addColorStop(1,'#b9742e');c.fillStyle=g;c.fillRect(0,0,W,H);for(let k=0;k<1350;k++){let x=R(k)*W,y=R(k+4000)*H;c.globalAlpha=.08+R(k+700)*.08;c.strokeStyle=k%3?'#704320':'#f2c58b';c.lineWidth=.5;c.beginPath();c.moveTo(x,y);c.lineTo(x+1+R(k+900)*5,y+.7);c.stroke()}c.globalAlpha=1}
function draw(dt,t){clock+=dt;paper();if(layer.width!==Math.round(e.W)||layer.height!==Math.round(e.H)){let old=document.createElement('canvas');old.width=layer.width;old.height=layer.height;old.getContext('2d').drawImage(layer,0,0);layer.width=e.W;layer.height=e.H;lc.drawImage(old,0,0,layer.width,layer.height)}advance(dt);const W=e.W,H=e.H;if(transfers){c.fillStyle='rgba(243,201,139,.22)';c.fillRect(0,0,W*.49,H);c.save();c.translate(W*.48,0);c.scale(-1,1);c.globalAlpha=.9;c.drawImage(printings[printings.length-1],0,0,W*.46,H);c.restore();c.drawImage(layer,W*.53,0,W*.46,H);c.strokeStyle='#855728';c.lineWidth=.9;c.beginPath();c.moveTo(W*.5,0);c.lineTo(W*.51,H*.5);c.lineTo(W*.5,H);c.stroke()}else c.drawImage(layer,0,0,W,H);c.font='10px system-ui';c.fillStyle='#704321';c.fillText(transfers?'左：纤维拓印 · 右：继续拨卷的湿版':'透明彩墨在赭纸纤维里缓缓分叉，拖画留下新的卷丝',18,H-17)}function transfer(){let a=document.createElement('canvas');a.width=layer.width;a.height=layer.height;a.getContext('2d').drawImage(layer,0,0);printings.push(a);if(printings.length>3)printings.shift();transfers++;artAudio.fx(3,.8)}function absorb(x,y,r=.045){let m={x,y,r,seed:masks.length*11};masks.push(m);if(masks.length>35)masks.shift();lc.save();lc.globalCompositeOperation='destination-out';maskPath(lc,m);lc.fill();lc.restore()}
function input(kind,p){let x=p.x/e.W,y=p.y/e.H;if(transfers&&x>.52)x=e.clamp((x-.53)/.46,0,1);if(kind==='down'){if(mode==='wet'){emit(x,y,48);patches=Math.min(999,patches+1);drag={x,y}}else if(mode==='curl'){let w={x,y,vx:0,vy:0};winds.push(w);if(winds.length>6)winds.shift();drag={w,x,y};dry=false}else if(mode==='absorb'){absorb(x,y);drag={x,y}}else if(mode==='transfer')transfer()}else if(kind==='move'&&drag){if(mode==='wet'&&Math.hypot(x-drag.x,y-drag.y)>.01){emit(x,y,30);patches=Math.min(999,patches+1);drag.x=x;drag.y=y}else if(mode==='curl'){drag.w.x=x;drag.w.y=y;drag.w.vx=(x-drag.x)*30;drag.w.vy=(y-drag.y)*30;drag.x=x;drag.y=y;emit(x,y,6,Math.floor(clock)%5)}else if(mode==='absorb'&&Math.hypot(x-drag.x,y-drag.y)>.025){absorb(x,y,.034);drag.x=x;drag.y=y}}else if(kind==='up'||kind==='cancel')drag=null}function action(id){if(id==='dry')dry=!dry;else if(id==='transfer'){mode=id;transfer()}else mode=id}function state(){return{bounded:true,status:({wet:'拖画湿墨：透明墨丝一次分叉，生长后保留在纸上',curl:'拖拨卷：建立持续旋流，近处墨丝被重新卷绕',absorb:'拖吸墨：让纸纤维露出空白，再回湿墨叠染',transfer:'左纸保留镜像拓印，右版继续吸墨或卷染'})[mode]+' · 墨笔 '+patches+' / 拓印 '+transfers+' · '+(dry?'干版':'湿版'),mode,inkPatches:patches,absorbMasks:masks.length,prints:transfers,dry,liveInkThreads:motes.length,curlFields:winds.length}}return{reset,draw,input,action,state}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
