<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>荧光裂隙矿 · 第六组</title><style>:root{--bg:#221922;--ink:#e6c7cf;--accent:#81d2b1;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>荧光裂隙矿</h1><p>点染矿脉，拖压打开宽裂隙；跨裂口缝桥，封晶后又能局部重开。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="荧光裂隙矿，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="vein" id="vein">种矿脉</button><button data-action="stress" id="stress">压开裂隙</button><button data-action="stitch" id="stitch">缝晶桥</button><button data-action="seal" id="seal">封晶</button><button data-action="reopen" id="reopen">重新开矿</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=4;window.artMeta={"number": 4, "slug": "04-fluorescent-fissures", "title": "荧光裂隙矿", "group": "F", "mothers": ["bioluminescent_poisson_growth_studio.html"], "description": "点染矿脉，拖压打开宽裂隙；跨裂口缝桥，封晶后又能局部重开。", "ui": {"bg": "#221922", "ink": "#e6c7cf", "accent": "#81d2b1"}, "controls": [{"id": "vein", "label": "种矿脉"}, {"id": "stress", "label": "压开裂隙"}, {"id": "stitch", "label": "缝晶桥"}, {"id": "seal", "label": "封晶"}, {"id": "reopen", "label": "重新开矿"}], "newMechanics": ["矿种逐渐长密", "应力拖线持续裂开矿片", "跨裂口缝桥闭合", "裂缝封晶成多面细晶", "重开保留旧矿脉"], "artDirection": ["多层角面矿片与微脉枝丝", "粉晶青铜紫金四矿区", "粗裂口与细晶针密度反差"], "testPlan": [{"control": "vein", "from": [0.3, 0.34], "to": [0.3, 0.34], "hold": 650}, {"control": "stress", "from": [0.1, 0.5], "to": [0.86, 0.65], "hold": 850}, {"control": "stitch", "from": [0.43, 0.42], "to": [0.55, 0.67], "hold": 850}, {"control": "reopen", "from": [0.5, 0.53], "to": [0.5, 0.53], "hold": 650}], "stateFields": {"mineralSeeds": "种矿后5以上", "fissures": "应力后2以上", "stitches": "缝桥后1以上", "sealedFissures": "封晶后增大，重开减少"}};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,P=['#ff8b9e','#75f2cb','#bcb0ff','#ffd073'];let slabs=[],veins=[],cracks=[],stitches=[],mode='vein',drag=null,sealedCount=0,stress=0;const R=n=>{let v=Math.sin(n*57.931+88.12)*43758.54;return v-Math.floor(v)};function reset(){slabs=[{x:.26,y:.29,col:0,a:-.3},{x:.7,y:.25,col:2,a:.2},{x:.28,y:.75,col:1,a:.35},{x:.74,y:.71,col:3,a:-.4}];veins=slabs.map((s,i)=>({x:s.x,y:s.y,col:s.col,age:1}));cracks=[{pts:[{x:.06,y:.57},{x:.3,y:.47},{x:.52,y:.53},{x:.78,y:.45},{x:.94,y:.52}],sealed:false}];stitches=[];mode='vein';drag=null;sealedCount=0;stress=0}function shape(s,W,H){let sx=W*.32,sy=H*.36;c.beginPath();for(let k=0;k<9;k++){let a=k*Math.PI*2/9+s.a,r=.85+R(k+s.col*10)*.2,x=s.x*W+Math.cos(a)*sx*r,y=s.y*H+Math.sin(a)*sy*r;k?c.lineTo(x,y):c.moveTo(x,y)}c.closePath()}
function draw(dt,t){const W=e.W,H=e.H,S=Math.min(W,H);c.fillStyle='#151019';c.fillRect(0,0,W,H);for(let s of slabs){c.save();shape(s,W,H);c.clip();let g=c.createRadialGradient(s.x*W,s.y*H,5,s.x*W,s.y*H,S*.65);g.addColorStop(0,['#62293f','#25554c','#3c3267','#645038'][s.col]);g.addColorStop(1,'#17161e');c.fillStyle=g;c.fillRect(0,0,W,H);for(let k=0;k<1150;k++){let u=R(k+s.col*510),v=R(k+123)-.5,ang=s.a+.8,dx=Math.cos(ang),dy=Math.sin(ang),x=s.x*W+(u-.5)*W*.75*dx-v*W*.15*dy,y=s.y*H+(u-.5)*H*.65*dy+v*H*.2*dx;c.strokeStyle=P[s.col];c.globalAlpha=.27+R(k*5)*.33;c.lineWidth=.5+R(k+33)*.7;c.beginPath();c.moveTo(x,y);for(let j=1;j<7;j++){let d=j*S*.012,br=Math.sin(j*1.8+k)*S*.006;c.lineTo(x+Math.cos(ang+v*2)*d-br,y+Math.sin(ang+v*2)*d+br)}c.stroke();if(k%3===0){c.fillStyle=P[s.col];c.globalAlpha=.18;c.fillRect(x,y,.6,2)}}for(let k=0;k<32;k++){let x=s.x*W+(R(k+20)-.5)*W*.5,y=s.y*H+(R(k+55)-.5)*H*.5;c.globalAlpha=.12;c.fillStyle=P[k%7===0?(s.col+1)%4:s.col];c.beginPath();c.moveTo(x,y);c.lineTo(x+S*.095,y-S*.035);c.lineTo(x+S*.062,y+S*.017);c.lineTo(x+S*.04,y+S*.135);c.lineTo(x-S*.016,y+S*.07);c.closePath();c.fill();c.strokeStyle=P[s.col];c.lineWidth=.5;c.globalAlpha=.24;c.stroke()}c.restore();c.save();shape(s,W,H);c.strokeStyle='#927b89';c.globalAlpha=.22;c.lineWidth=1;c.stroke();c.restore()}for(let v of veins){v.age=Math.min(1,v.age+dt*.15);c.save();c.translate(v.x*W,v.y*H);c.strokeStyle=P[v.col];for(let k=0;k<160;k++){let a=k*2.399,len=S*(.04+R(k+v.col*123)*.1)*v.age;c.globalAlpha=.3+R(k)*.4;c.lineWidth=.5;c.beginPath();c.moveTo(0,0);let xx=0,yy=0;for(let j=1;j<10;j++){xx=Math.cos(a)*len*j/10+Math.sin(j+k)*3;yy=Math.sin(a)*len*j/10+Math.cos(j*2+k)*3;c.lineTo(xx,yy)}c.stroke();c.beginPath();c.moveTo(xx*.5,yy*.5);c.lineTo(xx*.65+Math.cos(a+.8)*len*.2,yy*.65+Math.sin(a+.8)*len*.2);c.stroke()}c.restore()}for(let cr of cracks){c.save();c.lineJoin='bevel';c.lineCap='round';c.beginPath();cr.pts.forEach((p,i)=>i?c.lineTo(p.x*W,p.y*H):c.moveTo(p.x*W,p.y*H));c.strokeStyle='#00050d';c.lineWidth=S*(cr.sealed?.026:(.04+(cr.strain||0)*.04));c.globalAlpha=.9;c.stroke();c.strokeStyle=cr.sealed?'#8adaaf':'#da7693';c.lineWidth=1.2;c.globalAlpha=.6;c.stroke();if(cr.sealed){for(let j=1;j<cr.pts.length;j++){let a=cr.pts[j-1],b=cr.pts[j],ang=Math.atan2((b.y-a.y)*H,(b.x-a.x)*W);for(let k=0;k<8;k++){let u=k/8,x=(a.x+(b.x-a.x)*u)*W,y=(a.y+(b.y-a.y)*u)*H,r=S*(.016+R(k+j)*.014);c.save();c.translate(x,y);c.rotate(ang);c.globalAlpha=.65;c.fillStyle=P[(j+k)%4];c.beginPath();c.moveTo(-r,0);c.lineTo(-r*.25,-r*.35);c.lineTo(r*.6,-r*.22);c.lineTo(r,0);c.lineTo(r*.25,r*.45);c.closePath();c.fill();c.strokeStyle='#fff1ba';c.globalAlpha=.4;c.lineWidth=.5;c.beginPath();c.moveTo(-r,0);c.lineTo(r,0);c.lineTo(r*.25,r*.45);c.stroke();c.restore()}}}c.restore()}for(let st of stitches){c.save();c.strokeStyle='#d8c7a5';c.globalAlpha=.75;c.lineWidth=.7;for(let j=0;j<12;j++){let u=j/12;c.beginPath();c.moveTo((st.a.x+(st.b.x-st.a.x)*u)*W-4,(st.a.y+(st.b.y-st.a.y)*u)*H);c.lineTo((st.a.x+(st.b.x-st.a.x)*u)*W+4,(st.a.y+(st.b.y-st.a.y)*u)*H+8);c.stroke()}c.restore()}c.globalAlpha=1;for(let k=0;k<650;k++){c.fillStyle=k%2?'#efc496':'#bbafc3';c.globalAlpha=.12;c.fillRect(R(k)*W,R(k+2000)*H,.6,.7)}c.globalAlpha=1}
function nearest(x,y,onlySealed=false){let best=null,d=Infinity;cracks.filter(cr=>!onlySealed||cr.sealed).forEach(cr=>{for(let j=1;j<cr.pts.length;j++){let a=cr.pts[j-1],b=cr.pts[j],dx=b.x-a.x,dy=b.y-a.y,u=e.clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1),0,1),r=Math.hypot(x-a.x-dx*u,y-a.y-dy*u);if(r<d){d=r;best=cr}}});return best||cracks[0]}function input(kind,p){let x=p.x/e.W,y=p.y/e.H;if(kind==='down'){if(mode==='vein'){veins.push({x,y,col:veins.length%4,age:.05});if(veins.length>22)veins.shift()}else if(mode==='stress'){cracks.push({pts:[{x,y}],sealed:false});if(cracks.length>12)cracks.shift();drag={cr:cracks[cracks.length-1],x,y};stress++}else if(mode==='stitch')drag={a:{x,y},x,y};else if(mode==='seal'){let cr=nearest(x,y);if(cr&&!cr.sealed){cr.sealed=true;sealedCount++}}else if(mode==='reopen'){let cr=nearest(x,y,true);if(cr){cr.sealed=false;cr.strain=(cr.strain||0)+.4;cr.pts.forEach((a,j)=>{if(j>0&&j<cr.pts.length-1)a.y=e.clamp(a.y+(R(j+stress)-.5)*.035,.02,.98)});stress++}}}else if(kind==='move'&&drag){if(drag.cr&&Math.hypot(x-drag.x,y-drag.y)>.014){if(drag.cr.pts.length<65)drag.cr.pts.push({x:x+(R(drag.cr.pts.length)-.5)*.014,y});drag.x=x;drag.y=y}else{drag.x=x;drag.y=y}}else if(kind==='up'||kind==='cancel'){if(drag&&mode==='stitch'&&kind==='up'){stitches.push({a:drag.a,b:{x,y}});if(stitches.length>12)stitches.shift();let cr=nearest((drag.a.x+x)/2,(drag.a.y+y)/2);if(cr){cr.sealed=true;sealedCount++}}drag=null}}function action(id){mode=id;if(id==='seal'){cracks.forEach(cr=>{if(!cr.sealed){cr.sealed=true;sealedCount++}});artAudio.fx(4,.9)}}function state(){return{bounded:true,status:({vein:'点染晶种：新矿脉会慢慢分叉长密',stress:'拖压矿片：打开宽裂隙，矿片内细脉仍保留',stitch:'跨裂隙拖缝晶桥：先闭合最近裂口，再封晶',seal:'裂口已封出多面细晶；点按也可局部封晶',reopen:'点近裂缝重新开矿，保留原来的矿脉'})[mode]+' · 矿种 '+veins.length+' / 封晶 '+cracks.filter(x=>x.sealed).length,mode,mineralSeeds:veins.length,fissures:cracks.length,sealedFissures:cracks.filter(x=>x.sealed).length,stitches:stitches.length,sealEvents:sealedCount,stressEvents:stress}}return{reset,draw,input,action,state}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
