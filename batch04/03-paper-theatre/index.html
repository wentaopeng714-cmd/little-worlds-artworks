<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>纸幕剧场 · Paper Theatre</title><style>
:root{--ink:#253a3b;--paper:#f4e8d4;--muted:#667270}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Songti SC",serif;overflow:hidden}header{height:90px;padding:20px 30px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b7a99066}h1{font-size:26px;letter-spacing:5px;margin:0}header p{font:12px system-ui;margin:7px 0 0;color:#667270;letter-spacing:2px}.number{font:12px system-ui;letter-spacing:2px}.studio{height:calc(100dvh - 220px);min-height:230px;padding:14px 30px 10px;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none;border:1px solid #afa48d;box-shadow:0 3px 18px #77694d21;background:#e9dcc8;cursor:grab}canvas:active{cursor:grabbing}.note{position:absolute;bottom:20px;left:42px;background:#f4e8d4df;padding:5px 8px;pointer-events:none;font:11px system-ui;letter-spacing:1px}footer{height:130px;padding:8px 30px 12px}.row{display:flex;gap:7px;align-items:center;justify-content:center;margin:0 0 8px}button{min-width:44px;min-height:44px;border:1px solid #a99d86;background:#f5ebdc;color:#293d3d;padding:9px 13px;font:13px system-ui;cursor:pointer;border-radius:2px}button:hover,button[aria-pressed=true]{background:#293d3d;color:#f6ecdc}button:focus-visible{outline:3px solid #c4754c;outline-offset:2px}.label{font:11px system-ui;color:#64706d;letter-spacing:1px;margin-right:3px}#hint{font:11px system-ui;letter-spacing:.8px;text-align:center;color:#69736d;min-height:15px}#sound-status{font-size:11px;padding:6px;min-width:65px}#qa{display:none}@media(max-width:600px){header{height:79px;padding:15px 16px 10px}h1{font-size:23px;letter-spacing:3px}.number{font-size:10px}.studio{height:calc(100dvh - 238px);padding:12px 14px 9px}footer{height:159px;padding:6px 10px}.row{gap:5px;margin-bottom:7px}button{padding:8px 9px;font-size:12px}.label{display:none}.note{left:22px;bottom:16px;font-size:10px}header p{font-size:10px;letter-spacing:1px}#hint{font-size:10px}#sound-status{font-size:10px;min-width:58px}}.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body>
<header><div><h1>纸幕剧场</h1><p>PAPER THEATRE · 一盏光，一场小戏</p></div><div class="number">03 / 10<br><span style="font-size:10px;line-height:22px">剪纸与投影</span></div></header>
<main class="studio"><canvas id="art" aria-label="拖动纸片或带光环的灯，改变剪纸场景和影子" tabindex="0"></canvas><div class="note">拖纸片演戏 · 拖 ☼ 牵动投影</div></main>
<footer><div class="row"><span class="label">幕场</span><button id="forest" aria-pressed="true">候鸟入林</button><button id="harbor" aria-pressed="false">月湾归帆</button><button id="garden" aria-pressed="false">花间来信</button><button id="reset" title="重置当前幕场">重置</button><span id="sound-status" class="sound-status">无声作品</span></div><div class="row"><span class="label">选中纸片</span><button id="turnLeft" title="将选中纸片逆时针转动">↶ 转动</button><button id="turnRight" title="将选中纸片顺时针转动">转动 ↷</button><button id="lift">抬高纸片</button><button id="front">移到前景</button></div><div id="hint" role="status">先点选一片纸；纸片越高，影子越远。</div></footer><div id="qa" data-frames="0" data-inputs="0" data-resets="0" data-audio="none" data-bounded="true" data-objects="11" data-cap="14"></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),qa=document.getElementById('qa'),hint=document.getElementById('hint');let W=1,H=1,dpr=1,objects=[],selected=null,scene='forest',drag=null,light={x:.72,y:.22},frames=0,inputs=0,resets=0;let textures=[];const palettes={forest:{back:'#e8ddc6',dark:'#29474a',sun:'#cf8158',floor:'#b8bd9d'},harbor:{back:'#d5e2de',dark:'#183f49',sun:'#dcaf5d',floor:'#99bec3'},garden:{back:'#ead8cc',dark:'#47574b',sun:'#c65f4f',floor:'#babc9b'}};
function shape(type){let p=new Path2D();if(type==='bird'){p.moveTo(-.98,.15);p.bezierCurveTo(-.7,-.08,-.35,-.18,-.02,-.09);p.bezierCurveTo(.08,-.52,.49,-.9,.86,-.82);p.bezierCurveTo(.56,-.52,.6,-.16,.37,.03);p.bezierCurveTo(.7,-.13,.87,-.06,.93,.13);p.lineTo(1.18,.2);p.lineTo(.92,.26);p.bezierCurveTo(.65,.5,.26,.39,.01,.27);p.lineTo(-.81,.49);p.lineTo(-.59,.26);p.closePath();}else if(type==='leaf'){p.moveTo(0,1);p.bezierCurveTo(-.96,.22,-.64,-.62,.15,-1);p.bezierCurveTo(.94,-.34,.7,.43,0,1);p.closePath();}else if(type==='flower'){for(let j=0;j<8;j++){let a=j*Math.PI/4;p.ellipse(Math.cos(a)*.47,Math.sin(a)*.47,.45,.22,a,0,Math.PI*2)}p.arc(0,0,.34,0,Math.PI*2);}else if(type==='boat'){p.moveTo(-1,.42);p.lineTo(1,.42);p.lineTo(.57,.84);p.lineTo(-.7,.84);p.closePath();p.moveTo(-.13,.25);p.lineTo(-.13,-1);p.lineTo(-.88,.25);p.closePath();p.moveTo(.03,.25);p.lineTo(.03,-.76);p.lineTo(.77,.25);p.closePath();}else if(type==='cloud'){p.moveTo(-1,.22);p.bezierCurveTo(-1,-.12,-.74,-.26,-.56,-.21);p.bezierCurveTo(-.6,-.58,.05,-.68,.23,-.24);p.bezierCurveTo(.62,-.41,1,-.12,.93,.24);p.closePath();}else if(type==='letter'){p.rect(-.8,-.55,1.6,1.1);}else if(type==='moon'){p.arc(0,0,1,-Math.PI/2,Math.PI/2);p.bezierCurveTo(-.15,.7,-.15,-.7,0,-1);p.closePath();}else {p.moveTo(-.8,1);p.lineTo(-.55,-.6);p.lineTo(.1,-1);p.lineTo(.72,-.2);p.lineTo(.55,1);p.closePath()}return p}
const paths={};for(const t of ['bird','leaf','flower','boat','cloud','letter','moon','rock'])paths[t]=shape(t);
function obj(type,x,y,s,c,angle=0,depth=.6){return{type,x,y,s,c,angle,depth,seed:objects.length*19+3}}
function setup(name){scene=name;objects=[];const add=(...a)=>objects.push(obj(...a));if(name==='forest'){add('leaf',.16,.73,.15,'#304d4b',-.35,.3);add('leaf',.81,.77,.21,'#3c5a50',.5,.3);add('leaf',.27,.53,.12,'#87966e',.5,.45);add('leaf',.91,.44,.1,'#9ea57a',-.4,.6);add('cloud',.35,.23,.15,'#ece5d3',.08,.2);add('cloud',.76,.38,.11,'#e0cfb0',-.03,.25);add('bird',.43,.47,.22,'#c06c4e',-.22,1);add('bird',.7,.58,.13,'#e2ad64',.19,.65);add('bird',.3,.72,.11,'#29494b',-.45,.8);add('rock',.56,.87,.075,'#a79d7c',.1,.25);add('leaf',.59,.82,.09,'#899871',-.25,.45)}else if(name==='harbor'){add('cloud',.27,.25,.14,'#e8e4d4',.02,.3);add('cloud',.67,.34,.12,'#bdd2d0',.02,.4);add('moon',.8,.23,.09,'#f3d68a',-.3,.6);add('rock',.14,.86,.15,'#557274',-.12,.3);add('rock',.87,.85,.12,'#35565e',.09,.4);add('boat',.44,.53,.23,'#bb674e',.03,.9);add('boat',.74,.67,.13,'#e4b469',-.06,.6);add('bird',.3,.35,.085,'#36565a',-.1,.7);add('bird',.54,.28,.065,'#688786',.06,.6);add('leaf',.18,.71,.08,'#547773',-.5,.4)}else{add('leaf',.2,.78,.16,'#677657',-.7,.4);add('leaf',.84,.72,.19,'#41584c',.7,.35);add('flower',.34,.4,.12,'#c45f53',-.15,.75);add('flower',.72,.45,.15,'#d7a362',.24,.65);add('flower',.58,.76,.1,'#bd8171',-.13,.45);add('leaf',.34,.67,.13,'#94a174',.15,.5);add('leaf',.69,.64,.12,'#8b956e',-.35,.4);add('letter',.47,.55,.17,'#f1e4cc',-.17,1);add('bird',.55,.23,.13,'#56766c',-.2,.8);add('cloud',.23,.21,.095,'#e2cdb9',.1,.3)}selected=null;light={x:.74,y:.18};for(const id of ['forest','harbor','garden'])document.getElementById(id).setAttribute('aria-pressed',id===scene);qa.dataset.objects=objects.length;hint.textContent='先点选一片纸；纸片越高，影子越远。'}
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);textures=[];let seed=17;for(let i=0;i<650;i++){seed=(seed*16807)%2147483647;let x=seed/2147483647*W;seed=(seed*16807)%2147483647;let y=seed/2147483647*H;textures.push([x,y,(i%5+1)*.3])}}
function size(o){return o.s*Math.min(W,H)*1.3}
function transform(o,shadow=false){let x=o.x*W,y=o.y*H,s=size(o);if(shadow){x+=(o.x-light.x)*W*o.depth*.22;y+=(o.y-light.y)*H*o.depth*.22}ctx.translate(x,y);ctx.rotate(o.angle);ctx.scale(s,s)}
function decorate(o){ctx.strokeStyle='#fff9e434';ctx.lineWidth=.012;ctx.beginPath();if(o.type==='leaf'){ctx.moveTo(0,.86);ctx.lineTo(.06,-.8);for(let j=-3;j<=3;j++){const y=j*.18;ctx.moveTo(.03,y);ctx.lineTo(j%2?.5:-.5,y-.2)}}if(o.type==='bird'){for(let j=0;j<5;j++){ctx.moveTo(.05+j*.08,.03);ctx.quadraticCurveTo(.28+j*.06,-.25,.72-j*.02,-.69)}ctx.stroke();ctx.fillStyle='#253b3b';ctx.beginPath();ctx.arc(.84,.12,.025,0,Math.PI*2);ctx.fill();return}if(o.type==='boat'){ctx.moveTo(-1,.48);ctx.lineTo(1,.48);ctx.moveTo(-.13,-1);ctx.lineTo(-.13,.42)}if(o.type==='flower'){ctx.moveTo(-.12,0);ctx.lineTo(.12,0);ctx.moveTo(0,-.12);ctx.lineTo(0,.12)}if(o.type==='letter'){ctx.strokeStyle='#a485663b';ctx.moveTo(-.76,-.48);ctx.lineTo(0,.13);ctx.lineTo(.76,-.48);ctx.moveTo(-.74,.48);ctx.lineTo(-.2,0);ctx.moveTo(.74,.48);ctx.lineTo(.2,0);ctx.stroke();ctx.fillStyle='#c77054';ctx.beginPath();ctx.arc(0,.12,.12,0,Math.PI*2);ctx.fill();return}ctx.stroke()}
function render(t){frames++;qa.dataset.frames=frames;ctx.setTransform(dpr,0,0,dpr,0,0);const pal=palettes[scene];ctx.fillStyle=pal.back;ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(light.x*W,light.y*H,0,light.x*W,light.y*H,Math.max(W,H)*.85);g.addColorStop(0,'#fff8dc77');g.addColorStop(1,'#182f2b12');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=pal.floor;ctx.beginPath();ctx.moveTo(0,H*.83);ctx.bezierCurveTo(W*.18,H*.7,W*.55,H*.93,W,H*.78);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.strokeStyle=pal.dark+'25';ctx.lineWidth=1;for(let j=0;j<5;j++){ctx.beginPath();ctx.moveTo(0,H*(.89+j*.035));ctx.bezierCurveTo(W*.3,H*(.81+j*.035),W*.7,H*(.95+j*.035),W,H*(.86+j*.035));ctx.stroke()}ctx.fillStyle='#493b2721';for(const [x,y,s]of textures)ctx.fillRect(x,y,s,.4);for(const o of objects){ctx.save();transform(o,true);ctx.fillStyle='#283a372b';ctx.shadowColor='#283a3728';ctx.shadowBlur=(4+o.depth*6)/size(o);ctx.fill(paths[o.type]);ctx.restore()}for(const o of objects){ctx.save();transform(o);ctx.fillStyle=o.c;ctx.shadowColor='#5e4a322a';ctx.shadowBlur=2/size(o);ctx.shadowOffsetY=1/size(o);ctx.fill(paths[o.type]);ctx.shadowBlur=0;ctx.shadowOffsetY=0;decorate(o);if(o===selected){ctx.strokeStyle='#f9f2da';ctx.lineWidth=2/size(o);ctx.setLineDash([6/size(o),4/size(o)]);ctx.stroke(paths[o.type]);ctx.setLineDash([])}ctx.restore()}const lx=light.x*W,ly=light.y*H;ctx.save();ctx.translate(lx,ly);ctx.strokeStyle=pal.sun;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.stroke();ctx.fillStyle=pal.sun;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();for(let j=0;j<12;j++){let a=j*Math.PI/6;ctx.beginPath();ctx.moveTo(Math.cos(a)*21,Math.sin(a)*21);ctx.lineTo(Math.cos(a)*25,Math.sin(a)*25);ctx.stroke()}ctx.restore();requestAnimationFrame(render)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hit(p){for(let i=objects.length-1;i>=0;i--){const o=objects[i];ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);transform(o);let found=ctx.isPointInPath(paths[o.type],p.x*dpr,p.y*dpr);ctx.restore();if(found)return o}return null}
function count(){inputs++;qa.dataset.inputs=inputs}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();let p=pos(e);count();canvas.setPointerCapture(e.pointerId);if(Math.hypot(p.x-light.x*W,p.y-light.y*H)<32){drag={id:e.pointerId,kind:'light'};hint.textContent='光的方向改变整幕的投影。';return}const o=hit(p);if(o){selected=o;drag={id:e.pointerId,kind:'paper',o,dx:p.x/W-o.x,dy:p.y/H-o.y};hint.textContent='已选纸片：拖移、转动、抬高，或移到前景。'}else{selected=null;drag=null;hint.textContent='点选彩色纸片，或拖动带光环的灯。'}});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=pos(e);count();if(drag.kind==='light'){light.x=Math.max(.04,Math.min(.96,p.x/W));light.y=Math.max(.04,Math.min(.95,p.y/H))}else{drag.o.x=Math.max(.05,Math.min(.95,p.x/W-drag.dx));drag.o.y=Math.max(.08,Math.min(.92,p.y/H-drag.dy))}});
function end(e){if(drag&&drag.id===e.pointerId)drag=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);canvas.addEventListener('wheel',e=>{if(selected){e.preventDefault();selected.angle+=Math.sign(e.deltaY)*.09;count()}},{passive:false});
for(const name of ['forest','harbor','garden'])document.getElementById(name).onclick=()=>{count();setup(name)};document.getElementById('reset').onclick=()=>{count();resets++;qa.dataset.resets=resets;setup(scene)};function choose(fn,msg){count();if(selected){fn(selected);hint.textContent=msg}else hint.textContent='先在画面中点选一片纸。'}document.getElementById('turnLeft').onclick=()=>choose(o=>o.angle-=Math.PI/12,'纸片向左转了 15°。');document.getElementById('turnRight').onclick=()=>choose(o=>o.angle+=Math.PI/12,'纸片向右转了 15°。');document.getElementById('lift').onclick=()=>choose(o=>o.depth=o.depth>=1.4?.2:o.depth+.3,'高度改变了：注意影子的距离。');document.getElementById('front').onclick=()=>choose(o=>{objects.splice(objects.indexOf(o),1);objects.push(o)},'纸片来到最前面。');canvas.addEventListener('keydown',e=>{if(!selected)return;let changed=true;if(e.key==='ArrowLeft')selected.x=Math.max(.05,selected.x-.02);else if(e.key==='ArrowRight')selected.x=Math.min(.95,selected.x+.02);else if(e.key==='ArrowUp')selected.y=Math.max(.08,selected.y-.02);else if(e.key==='ArrowDown')selected.y=Math.min(.92,selected.y+.02);else changed=false;if(changed){e.preventDefault();count()}});window.addEventListener('resize',resize);new ResizeObserver(resize).observe(canvas);setup('forest');resize();requestAnimationFrame(render);
})();
</script></body></html>
