<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>点彩盐湖 · 第六组</title><style>:root{--bg:#20282e;--ink:#f5e9d9;--accent:#ec957f;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}header h1{letter-spacing:.08em}</style><body><header><div><h1>点彩盐湖</h1><p>在纸上拖潮、挪光、聚云；晒出的盐晶会保留，再用回水溶开。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="点彩盐湖，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="tide" id="tide">拖潮线</button><button data-action="sun" id="sun">挪日光</button><button data-action="cloud" id="cloud">聚散云</button><button data-action="salt" id="salt">晒盐</button><button data-action="wash" id="wash">回水</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=19;window.artMeta={"number": 19, "slug": "19-pointillist-salt-lake", "title": "点彩盐湖", "group": "G", "mothers": ["pointillism_landscape.html"], "innovation": "网点风景拖潮线，挪光、聚散云点、晒盐与倒影重组", "description": "在纸上拖潮、挪光、聚云；晒出的盐晶会保留，再用回水溶开。", "ui": {"bg": "#20282e", "ink": "#f5e9d9", "accent": "#ec957f"}, "controls": [{"id": "tide", "label": "拖潮线"}, {"id": "sun", "label": "挪日光"}, {"id": "cloud", "label": "聚散云"}, {"id": "salt", "label": "晒盐"}, {"id": "wash", "label": "回水"}], "newMechanics": ["潮线形变改变盐区与倒影边界", "移动日光改变网点太阳、长倒影与结晶", "云点聚散形成保留的孔洞与云团", "晒盐后可重新回水溶解"], "artDirection": ["母本规则半色调网点与纸白孔隙", "珊瑚盐岸、淡紫云、青绿湖与赭远山", "全幅竖横自适应纸画框"], "testPlan": [{"control": "tide", "from": [0.32, 0.68], "to": [0.64, 0.54], "hold": 650}, {"control": "sun", "from": [0.71, 0.2], "to": [0.28, 0.2], "hold": 650}, {"control": "cloud", "from": [0.27, 0.2], "to": [0.6, 0.15], "hold": 650}, {"control": "salt", "from": [0.32, 0.75], "to": [0.65, 0.79], "hold": 650}, {"control": "wash", "from": [0.45, 0.75], "to": [0.55, 0.8], "hold": 650}], "stateFields": ["bounded", "mode", "status", "processed", "persistentResult", "crystalClusters", "shoreMean", "sun", "cloudCount"], "css": "header h1{letter-spacing:.08em}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,cl=e.clamp;let mode='tide',shore=[],sun,clouds=[],salts=[],ripples=[],last=null,saltAnchor=null,processed=0;const labels={tide:'拖潮线：上下牵引湖岸，盐晶随岸重排',sun:'挪日光：拖动日光与长倒影',cloud:'聚散云：拖成云团，短点拨开云孔',salt:'晒盐：在岸边涂出晶簇',wash:'回水：拖过盐区溶开旧晶'};const rnd=n=>{let v=Math.sin(n*127.19+91.7)*43758.54;return v-Math.floor(v)};function reset(){mode='tide';shore=Array.from({length:61},(_,i)=>.69+.045*Math.sin(i*.17)+.025*Math.cos(i*.5));sun={x:.71,y:.2};clouds=[{x:.27,y:.2,s:.16,a:.7},{x:.69,y:.12,s:.18,a:.6}];salts=[];ripples=[];last=null;saltAnchor=null;processed=0}function norm(p){return{x:cl(p.x/e.W,0,1),y:cl(p.y/e.H,0,1)}}function apply(p,down){let q=norm(p);if(mode==='tide'){for(let i=0;i<shore.length;i++){let f=Math.exp(-Math.pow((i/60-q.x)/.17,2));shore[i]=cl(shore[i]+(q.y-shore[i])*f*.18,.5,.86)}ripples.push({...q,age:0});if(ripples.length>12)ripples.shift()}if(mode==='sun'){sun.x=q.x;sun.y=cl(q.y,.07,.39)}if(mode==='cloud'){if(down){clouds.push({...q,s:.08,a:.9});if(clouds.length>8)clouds.shift()}else if(last){let a=clouds[clouds.length-1];a.x=q.x;a.y=cl(q.y,.05,.4);a.s=cl(a.s+Math.hypot(q.x-last.x,q.y-last.y)*.3,.06,.25)}}if(mode==='salt'&&(down||!saltAnchor||Math.hypot(q.x-saltAnchor.x,q.y-saltAnchor.y)>.014)){saltAnchor=q;salts.push({...q,s:.023+rnd(processed)*.018,a:1});if(salts.length>110)salts.shift()}if(mode==='wash'){for(const s of salts)if(Math.hypot(s.x-q.x,s.y-q.y)<.11)s.a=Math.max(0,s.a-.22);salts=salts.filter(s=>s.a>.02);for(let i=0;i<shore.length;i++)if(Math.abs(i/60-q.x)<.13)shore[i]=cl(shore[i]+.003,.5,.86)}last=q;processed++}function input(k,p){if(k==='down')apply(p,true);if(k==='move'&&last)apply(p,false);if(k==='up'||k==='cancel')last=null}function draw(dt,t){const W=e.W,H=e.H,pad=Math.min(W,H)*.045; c.fillStyle='#20282e';c.fillRect(0,0,W,H);c.save();c.translate(pad,pad);let w=W-pad*2,h=H-pad*2;c.fillStyle='#f5ede0';c.fillRect(0,0,w,h);const step=Math.max(3.4,Math.min(w,h)/148);for(let j=0,y=0;y<h;y+=step,j++)for(let i=0,x=0;x<w;x+=step,i++){let u=x/w,v=y/h,n=rnd(i+j*213),sx=Math.min(59,Math.floor(u*60)),sy=shore[sx]+(shore[sx+1]-shore[sx])*(u*60-sx),mount=.42+.035*Math.sin(u*19)+.038*Math.cos(u*9),col,r,xx=x,yy=y;let cloud=0;for(let a of clouds)cloud+=Math.exp(-Math.pow((u-a.x)/a.s,2)-Math.pow((v-a.y)/(a.s*.36),2))*a.a;let disk=Math.hypot((u-sun.x)*w,(v-sun.y)*h);if(v<mount){col=['#aa99b3','#95a2ba','#c3adbb','#858ba8'][Math.floor(n*4)];r=step*(.26+.17*Math.sin(u*13+v*9))*(1-cl(cloud,0,.95));if(disk<Math.min(w,h)*.063){col='#d69978';r=step*.44}}else if(v<.48){col=['#846e88','#ad879b','#846784','#b997a0'][Math.floor(n*4)];r=step*(.2+.24*n)}else if(v<sy){col=['#658a91','#477981','#95b2af','#799c9f'][Math.floor(n*4)];r=step*(.31+.1*Math.sin(v*70+u*8+t*.55));let reflection=Math.exp(-Math.pow((u-sun.x)/(.018+(v-.45)*.2),2));if(reflection>.45&&n>.2){col='#d9af87';r*=1.06}yy+=Math.sin(u*20+v*39+t)*step*1.5;for(let r of ripples){let d=Math.hypot(u-r.x,(v-r.y)*.6);yy+=Math.sin(d*80-r.age*8)*Math.exp(-d*7)*h*.02*Math.exp(-r.age)}}else{col=['#c59b9b','#d59c98','#a87485','#cfad9b','#b58d94'][Math.floor(n*5)];r=step*(.18+.21*n);yy+=step*(rnd(i*7+j*11)-.5);if(v-sy<.013)col='#faf2dc'}c.fillStyle=col;if(r>.06){c.beginPath();c.arc(xx,yy,Math.max(.12,r),0,Math.PI*2);c.fill()}}for(let a of salts){let x=a.x*w,y=a.y*h,r=a.s*Math.min(w,h)*a.a;c.save();c.translate(x,y);c.rotate(a.x*31);for(let z=0;z<6;z++){c.rotate(Math.PI/3);c.fillStyle=z%2?'#eee9d7':'#fff9ed';c.strokeStyle='#ac8e97';c.lineWidth=.5;c.beginPath();c.moveTo(0,0);c.lineTo(r*.55,-r*.22);c.lineTo(r,0);c.lineTo(r*.55,r*.22);c.closePath();c.fill();c.stroke();for(let k=1;k<4;k++){c.fillStyle='#cba99f';c.beginPath();c.arc(r*k/4,0,.7,0,7);c.fill()}}c.restore()}c.strokeStyle='#fff8e7';c.lineWidth=2;c.strokeRect(0,0,w,h);c.restore();for(let r of ripples)r.age+=dt;ripples=ripples.filter(r=>r.age<3)}return{reset,draw,input,action(id){mode=id},state(){return{bounded:true,mode,processed,persistentResult:salts.length,crystalClusters:salts.length,shoreMean:shore.reduce((a,b)=>a+b,0)/61,sun:[sun.x,sun.y],cloudCount:clouds.length,status:labels[mode]+' · 盐簇 '+salts.length}}}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
