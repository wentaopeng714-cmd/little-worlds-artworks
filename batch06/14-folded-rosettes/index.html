<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>花砖折锦 · 第六组</title><style>:root{--bg:#e8e2d1;--ink:#4b4c48;--accent:#ab624e;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>花砖折锦</h1><p>拉开纸雕花瓣，裁去一翼，再翻面嵌色；搭扣让邻砖一起错织成锦。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="花砖折锦，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="fold" id="fold">伸缩折翼</button><button data-action="clasp" id="clasp">搭扣邻砖</button><button data-action="cut" id="cut">裁开纸瓣</button><button data-action="inlay" id="inlay">反面嵌色</button><button data-action="weave" id="weave">错织移砖</button><button data-action="bloom" id="bloom">错层开合</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=14;window.artMeta={"number": 14, "slug": "14-folded-rosettes", "title": "花砖折锦", "group": "G", "mothers": ["code_artifact (1)_副本.html"], "innovation": "纸雕花砖伸缩折翼、搭扣邻接、裁开与反面嵌色", "description": "拉开纸雕花瓣，裁去一翼，再翻面嵌色；搭扣让邻砖一起错织成锦。", "ui": {"bg": "#e8e2d1", "ink": "#4b4c48", "accent": "#ab624e"}, "controls": [{"id": "fold", "label": "伸缩折翼"}, {"id": "clasp", "label": "搭扣邻砖"}, {"id": "cut", "label": "裁开纸瓣"}, {"id": "inlay", "label": "反面嵌色"}, {"id": "weave", "label": "错织移砖"}, {"id": "bloom", "label": "错层开合"}], "newMechanics": ["四向瓣真实变宽收拢", "逐瓣裁开/接回保存缺口", "反面纤维嵌色独立保留", "搭扣邻砖共享错位"], "artDirection": ["保留用户母本厚纸裁切纹路、细颗粒纸纤维、乳白薄边与大幅投影", "矿色大理石纹在每张纸内独立裁切，随实体折面改变轮廓"], "testPlan": [{"control": "fold", "from": [0.5, 0.5], "to": [0.67, 0.37], "hold": 450}, {"control": "clasp", "from": [0.5, 0.5], "to": [0.38, 0.64], "hold": 450}, {"control": "cut", "from": [0.5, 0.5], "to": [0.67, 0.37], "hold": 450}, {"control": "inlay", "from": [0.5, 0.5], "to": [0.38, 0.64], "hold": 450}, {"control": "weave", "from": [0.5, 0.5], "to": [0.67, 0.37], "hold": 450}], "stateFields": ["folds拖动持久变化", "claspedPairs增加不超过20", "cutPetals裁开增加再次点击恢复", "reverseTiles点嵌色翻面"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,clamp=env.clamp,TAU=Math.PI*2,pal=['#de705c','#497f82','#625996','#dbb55c','#86a588','#ebadb7'];let nc,nr,tiles,mode,selected,drag,links,cutCount,flips;
const textures=pal.map((col,s)=>{const a=document.createElement('canvas');a.width=a.height=160;const g=a.getContext('2d');g.fillStyle=col;g.fillRect(0,0,160,160);for(let i=0;i<18;i++){g.globalAlpha=.22;g.strokeStyle=pal[(i+s+2)%6];g.lineWidth=4+i%3*8;g.beginPath();g.ellipse(30+Math.sin(i*2.7+s)*80,80+Math.cos(i)*80,40+i*2,18+i*3,i*.31,0,TAU);g.stroke()}g.globalAlpha=1;for(let k=0;k<650;k++){g.fillStyle=k%2?'#fff8e52f':'#1b3f4b21';g.fillRect(Math.abs(Math.sin(k*73+s)*43758)%1*160,Math.abs(Math.sin(k*13+s)*93843)%1*160,1,1)}return a});
function reset(){nc=env.W<650?4:7;nr=env.W<650?6:4;tiles=Array.from({length:nc*nr},(_,i)=>({col:i%nc,row:Math.floor(i/nc),open:.72+(i%3)*.1,rotation:(i%2)*.16,back:false,cuts:[false,false,false,false],dx:0,dy:0,stamp:0,seed:i%6}));mode='fold';selected=5;drag=null;links=[];cutCount=0;flips=0}
function geo(){let size=Math.min(env.W*.92/nc,env.H*.86/nr);return{size,x:(env.W-size*nc)/2,y:(env.H-size*nr)/2}}
function center(t){let g=geo();return{x:g.x+(t.col+.5)*g.size+t.dx*g.size,y:g.y+(t.row+.5)*g.size+t.dy*g.size,size:g.size}}
function petal(r,open){const p=new Path2D();p.moveTo(0,0);p.lineTo(-r*.44*open,-r*.42);p.lineTo(-r*.22,-r*.83);p.lineTo(0,-r);p.lineTo(r*.22,-r*.83);p.lineTo(r*.44*open,-r*.42);p.closePath();return p}
function tile(t,i){const {x,y,size}=center(t),r=size*.56;c.save();c.translate(x,y);c.rotate(t.rotation);for(let k=0;k<4;k++){c.save();c.rotate(k*Math.PI/2);if(t.cuts[k]){c.strokeStyle='#98887066';c.setLineDash([3,5]);c.beginPath();c.moveTo(0,0);c.lineTo(0,-r);c.stroke();c.restore();continue}let p=petal(r,t.open);c.shadowColor='#30322b50';c.shadowBlur=7;c.shadowOffsetX=3;c.shadowOffsetY=5+t.open*5;c.fillStyle='#b8aa91';c.translate(0,3);c.fill(p);c.translate(0,-3);c.shadowBlur=0;c.shadowOffsetX=c.shadowOffsetY=0;c.fillStyle=pal[(t.seed+(t.back?3:0))%6];c.fill(p);c.save();c.clip(p);if(!t.back)c.drawImage(textures[t.seed],-r,-r,r*2,r*2);else{c.strokeStyle='#fff3d748';c.lineWidth=1;for(let n=-r;n<r;n+=7){c.beginPath();c.moveTo(n,-r);c.lineTo(n+r,r);c.stroke()}}c.beginPath();c.moveTo(0,0);c.lineTo(0,-r);c.strokeStyle='#fbeacd';c.lineWidth=1.5;c.stroke();c.beginPath();c.moveTo(0,-r);c.lineTo(r*.44*t.open,-r*.42);c.lineTo(0,0);c.fillStyle='#1c374635';c.fill();if(t.stamp){c.fillStyle='#e9cf83';for(let n=1;n<5;n++){c.save();c.translate(0,-r*n*.17);c.rotate(Math.PI/4);c.fillRect(-2,-2,4,4);c.restore()}}c.restore();c.strokeStyle='#fff2ddbb';c.lineWidth=1.3;c.stroke(p);c.restore()}c.beginPath();c.arc(0,0,size*.11,0,TAU);c.fillStyle=t.back?'#e1c571':'#eee4c9';c.fill();c.strokeStyle='#8c694b';c.stroke();c.fillStyle='#b78d3e';c.beginPath();c.arc(0,0,size*.038,0,TAU);c.fill();if(selected===i){c.strokeStyle='#aa5b43';c.setLineDash([2,4]);c.beginPath();c.arc(0,0,size*.16,0,TAU);c.stroke()}c.restore()}
function nearest(p){let b=-1,d=Infinity;tiles.forEach((t,i)=>{let n=center(t),a=Math.hypot(p.x-n.x,p.y-n.y);if(a<d){d=a;b=i}});return d<geo().size*.8?b:-1}
function input(kind,p){if(kind==='down'){let i=nearest(p);if(i<0)return;selected=i;let t=tiles[i],g=center(t);drag={i,x:p.x,y:p.y,o:t.open,r:t.rotation,dx:t.dx,dy:t.dy};if(mode==='cut'){let k=(Math.round((Math.atan2(p.y-g.y,p.x-g.x)-t.rotation+Math.PI/2)/(Math.PI/2))+4)%4;t.cuts[k]=!t.cuts[k];cutCount=tiles.reduce((n,t)=>n+t.cuts.filter(Boolean).length,0)}if(mode==='inlay'){t.back=!t.back;flips++;t.stamp++}if(mode==='clasp'){let j=i%nc<nc-1?i+1:i-1;if(!links.some(l=>l[0]===i&&l[1]===j))links.push([i,j]);links=links.slice(-20);tiles[j].open=t.open;t.rotation=-.18;tiles[j].rotation=.18}}if(kind==='move'&&drag){let t=tiles[drag.i];if(mode==='fold')t.open=clamp(drag.o+(p.x-drag.x)/geo().size*.9-(p.y-drag.y)/geo().size*.6,.13,1.25);if(mode==='weave'){t.dx=clamp(drag.dx+(p.x-drag.x)/geo().size,-.38,.38);t.dy=clamp(drag.dy+(p.y-drag.y)/geo().size,-.38,.38);for(let l of links)if(l.includes(drag.i)){let q=tiles[l.find(i=>i!==drag.i)];q.dx=t.dx;q.dy=t.dy}}}if(kind==='up'||kind==='cancel')drag=null}
function action(id){mode=id;if(id==='turn'){tiles[selected].rotation+=Math.PI/4;mode='weave'}if(id==='bloom'){tiles.forEach((t,i)=>{t.open=i%2?.32:1.18;t.rotation+=i%2?.1:-.1});mode='fold'}}
function draw(dt,time){c.fillStyle='#e8e2d1';c.fillRect(0,0,env.W,env.H);c.fillStyle='#96856a';c.font='11px serif';c.fillText('ROSETTES / INTERLOCKED PAPER',18,25);c.strokeStyle='#aaa18d25';for(let n=0;n<170;n++){let x=Math.abs(Math.sin(n*91)*42719)%1*env.W,y=Math.abs(Math.sin(n*17)*82173)%1*env.H;c.beginPath();c.moveTo(x,y);c.lineTo(x+3,y+1);c.stroke()}links.forEach(l=>{let a=center(tiles[l[0]]),b=center(tiles[l[1]]);c.strokeStyle='#b4904c';c.lineWidth=3;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()});tiles.forEach(tile)}
return{reset,draw,input,action,state:()=>({bounded:true,status:({fold:'折翼：拖动花砖，展开或收成尖瓣；结果保留',clasp:'搭扣：点花砖扣上邻砖；再用错织一同移位',cut:'裁瓣：点一侧纸瓣裁开，再点可接回',inlay:'反面嵌色：点花砖翻到细纤维背面并留金纹',weave:'错织：拖动花砖；搭扣过的邻砖一起错位'})[mode],mode,selected,folds:tiles.map(t=>+t.open.toFixed(2)),claspedPairs:links.length,cutPetals:cutCount,reverseTiles:tiles.filter(t=>t.back).length,flips})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
