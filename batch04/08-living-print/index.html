<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菌纹印花 · Living Print</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#efe6d5;color:#313d46;font-family:Georgia,'Songti SC',serif}body{display:flex;flex-direction:column;padding:17px 24px 12px;gap:11px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:26px;margin:0;font-weight:normal;letter-spacing:.12em}.eyebrow{font:10px sans-serif;letter-spacing:.24em;color:#887b68;margin-bottom:5px}.caption{font:11px/1.6 sans-serif;text-align:right;color:#887b68}.stage{position:relative;flex:1;min-height:170px;width:100%;max-width:1100px;margin:auto;box-shadow:0 4px 26px #89775b20;border:1px solid #d5c8ac;background:#f9f2df;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.stamp{position:absolute;bottom:16px;right:20px;pointer-events:none;font:10px sans-serif;letter-spacing:.2em;color:#80745e}.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}button{min-height:44px;border-radius:20px;border:1px solid #b3aa95;background:#f7f0df;color:#384854;font-size:13px;padding:9px 15px;cursor:pointer}button.active{background:#254961;color:#fbf3df;border-color:#254961}#seed-red.active{background:#b55037;border-color:#b55037}button:focus-visible{outline:3px solid #b55037;outline-offset:2px}button:disabled{opacity:.7;cursor:default}.help{font:12px/1.5 sans-serif;color:#867963;text-align:center;margin:0}#qa{display:none}@media(max-width:600px){body{padding:13px 11px 10px;gap:9px}h1{font-size:23px}.caption{font-size:9px}button{padding:8px 10px;font-size:12px;flex:1 0 auto}.toolbar{gap:6px}.help{font-size:11px}.stamp{right:12px;bottom:12px;font-size:9px}}.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body><header><div><div class="eyebrow">CULTURE / PRINT GARDEN 08</div><h1>菌纹印花</h1></div><div class="caption">LIVING PRINT<br><span id="status">两种菌纹 · 慢慢生长</span></div></header><div class="stage"><canvas id="art" aria-label="播种菌纹或画出阻隔"></canvas><div class="stamp">PETRI / PAPER / 08</div></div><div class="toolbar"><button id="seed-blue" class="active">靛蓝菌种</button><button id="seed-red">朱红菌种</button><button id="barrier">画阻隔</button><button id="erase">开通道</button><button id="pause">暂停生长</button><button id="weather">换养分</button><button id="harvest">拓印</button><button id="reset">重置培养</button><span id="sound-status" class="sound-status">无声作品</span></div><p class="help">点播或拖动菌种，沿菌纹边缘画阻隔，再擦开小口。两种菌纹会争夺养分；拓印可留下当下的纹样。</p><div id="qa" data-frames="0" data-inputs="0" data-resets="0" data-bounded="true" data-audio="none"></div><script>
(()=>{'use strict';const c=document.getElementById('art'),ctx=c.getContext('2d'),qa=document.getElementById('qa'),status=document.getElementById('status'),W=176,H=144,N=W*H;let u=new Float32Array(N),v=new Float32Array(N),w=new Float32Array(N),nu=new Float32Array(N),nv=new Float32Array(N),nw=new Float32Array(N);const diagonals=new Int32Array([-W-1,-W+1,W-1,W+1]),wall=new Uint8Array(N),off=document.createElement('canvas');off.width=W;off.height=H;const ox=off.getContext('2d'),img=ox.createImageData(W,H),grain=[];let tool='seed-blue',paused=false,harvested=false,season=0,cw=800,ch=650,dpr=1,frames=0,inputs=0,resets=0,last=0,pointer=null,dirty=true;let rng=24081;function random(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}for(let k=0;k<3200;k++)grain.push([random(),random(),random()]);function seedAt(x,y,type,r=4){for(let j=Math.max(1,Math.floor(y-r));j<Math.min(H-1,y+r+1);j++)for(let i=Math.max(1,Math.floor(x-r));i<Math.min(W-1,x+r+1);i++){if((i-x)**2+(j-y)**2>r*r)continue;let k=j*W+i;if(wall[k])continue;u[k]=.5;if(type===0){v[k]=.9+.03*random();w[k]*=.3}else{w[k]=.9+.03*random();v[k]*=.3}}}
function initialize(){u.fill(1);v.fill(0);w.fill(0);wall.fill(0);rng=24081;const clusters=[[.3,.34,0,18],[.68,.62,1,19],[.25,.75,0,8],[.72,.25,1,8]];for(const [x,y,t,r]of clusters){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx/(r*r)+dy*dy/(r*r*.74)>1)continue;const k=Math.round(y*H+dy)*W+Math.round(x*W+dx);u[k]=.45+.15*random();if(t===0)v[k]=.32+.42*random();else w[k]=.32+.42*random()}for(let k=0;k<15;k++)seedAt(x*W+(random()-.5)*r*1.4,y*H+(random()-.5)*r*1.2,t,2+random()*3)}for(let i=0;i<900;i++)step();dirty=true}
function step(){const feed=season===0?.033:.025,kill=season===0?.061:.055;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;if(wall[i]){nu[i]=1;nv[i]=0;nw[i]=0;continue}const U=u[i],V=v[i],C=w[i];let lu=-U,lv=-V,lw=-C;const a=i-1,b=i+1,d=i-W,e=i+W;lu+=(wall[a]?U:u[a])*.2+(wall[b]?U:u[b])*.2+(wall[d]?U:u[d])*.2+(wall[e]?U:u[e])*.2;lv+=(wall[a]?V:v[a])*.2+(wall[b]?V:v[b])*.2+(wall[d]?V:v[d])*.2+(wall[e]?V:v[e])*.2;lw+=(wall[a]?C:w[a])*.2+(wall[b]?C:w[b])*.2+(wall[d]?C:w[d])*.2+(wall[e]?C:w[e])*.2;for(let k=0;k<4;k++){const j=i+diagonals[k];lu+=(wall[j]?U:u[j])*.05;lv+=(wall[j]?V:v[j])*.05;lw+=(wall[j]?C:w[j])*.05}const r1=U*V*V,r2=U*C*C,competition=.013*V*C;nu[i]=Math.max(0,Math.min(1,U+lu-r1-r2+feed*(1-U)));nv[i]=Math.max(0,Math.min(1,V+.48*lv+r1-(kill+feed)*V-competition));nw[i]=Math.max(0,Math.min(1,C+.52*lw+r2-(kill+feed+.001)*C-competition))}for(let x=0;x<W;x++){nu[x]=nu[(H-1)*W+x]=1;nv[x]=nv[(H-1)*W+x]=0;nw[x]=nw[(H-1)*W+x]=0}for(let y=0;y<H;y++){let i=y*W;nu[i]=nu[i+W-1]=1;nv[i]=nv[i+W-1]=0;nw[i]=nw[i+W-1]=0}let t=u;u=nu;nu=t;t=v;v=nv;nv=t;t=w;w=nw;nw=t}
function resize(){const r=c.getBoundingClientRect();cw=r.width;ch=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(cw*dpr);c.height=Math.round(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);dirty=true}new ResizeObserver(resize).observe(c);function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}function mark(p){harvested=false;document.getElementById('harvest').classList.remove('active');if(tool==='seed-blue'||tool==='seed-red')seedAt(p.x,p.y,tool==='seed-blue'?0:1,3.8);else{const r=tool==='erase'?4.8:2.3;for(let y=Math.max(1,Math.floor(p.y-r));y<=Math.min(H-2,Math.ceil(p.y+r));y++)for(let x=Math.max(1,Math.floor(p.x-r));x<=Math.min(W-2,Math.ceil(p.x+r));x++){if((x-p.x)**2+(y-p.y)**2>r*r)continue;const i=y*W+x;wall[i]=tool==='barrier'?1:0;u[i]=1;v[i]=w[i]=0}}dirty=true}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);pointer={...pos(e),id:e.pointerId};mark(pointer);inputs++;qa.dataset.inputs=inputs});c.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;let p=pos(e),dx=p.x-pointer.x,dy=p.y-pointer.y,n=Math.min(32,Math.max(1,Math.ceil(Math.hypot(dx,dy)/1.5)));for(let i=1;i<=n;i++)mark({x:pointer.x+dx*i/n,y:pointer.y+dy*i/n});pointer={...p,id:e.pointerId};inputs++;qa.dataset.inputs=inputs});function up(e){if(pointer&&pointer.id===e.pointerId)pointer=null}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('lostpointercapture',()=>pointer=null);
function select(id){tool=id;['seed-blue','seed-red','barrier','erase'].forEach(t=>document.getElementById(t).classList.toggle('active',id===t));status.textContent=id==='barrier'?'留白的墙 · 阻止菌纹穿过':id==='erase'?'擦开通道 · 让纹样相遇':id==='seed-blue'?'靛蓝菌种 · 播出冷色枝纹':'朱红菌种 · 播出暖色枝纹';inputs++;qa.dataset.inputs=inputs}['seed-blue','seed-red','barrier','erase'].forEach(id=>document.getElementById(id).onclick=()=>select(id));document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续生长':'暂停生长';document.getElementById('pause').classList.toggle('active',paused);inputs++;qa.dataset.inputs=inputs;dirty=true};document.getElementById('weather').onclick=()=>{season=1-season;document.getElementById('weather').textContent=season?'养分：丰沛':'换养分';status.textContent=season?'丰沛养分 · 枝纹变密':'稀薄养分 · 细纹伸展';inputs++;qa.dataset.inputs=inputs};document.getElementById('harvest').onclick=()=>{harvested=!harvested;document.getElementById('harvest').classList.toggle('active',harvested);status.textContent=harvested?'拓印留样 · 再落笔继续培养':'继续培养';dirty=true;inputs++;qa.dataset.inputs=inputs};document.getElementById('reset').onclick=()=>{pointer=null;paused=false;harvested=false;season=0;initialize();document.getElementById('pause').textContent='暂停生长';document.getElementById('weather').textContent='换养分';['pause','harvest'].forEach(id=>document.getElementById(id).classList.remove('active'));status.textContent='两种菌纹 · 慢慢生长';inputs++;qa.dataset.inputs=inputs;resets++;qa.dataset.resets=resets};
function draw(){let alive=0;for(let i=0;i<N;i++){if(v[i]+w[i]>.08)alive++;const p=i*4;if(wall[i]){img.data[p]=182;img.data[p+1]=164;img.data[p+2]=132;img.data[p+3]=255;continue}let sum=v[i]+w[i],density=Math.min(1,Math.max(0,(sum-.11)*7.5)),ratio=sum>.001?w[i]/sum:0;let ir=(harvested?24:31)*(1-ratio)+(harvested?175:188)*ratio,ig=(harvested?52:72)*(1-ratio)+(harvested?54:77)*ratio,ib=(harvested?73:96)*(1-ratio)+(harvested?33:52)*ratio;if(harvested)density=Math.floor(density*5)/5;img.data[p]=249*(1-density)+ir*density;img.data[p+1]=243*(1-density)+ig*density;img.data[p+2]=223*(1-density)+ib*density;img.data[p+3]=255}qa.dataset.activeCells=alive;ox.putImageData(img,0,0);ctx.fillStyle='#f9f3df';ctx.fillRect(0,0,cw,ch);ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,cw,ch);ctx.globalAlpha=.1;for(const [x,y,r]of grain){ctx.fillStyle=r>.6?'#766245':'#fff9ec';ctx.fillRect(x*cw,y*ch,r>.75?2:1,1)}ctx.globalAlpha=1;ctx.strokeStyle='#98856b44';ctx.strokeRect(13,13,cw-26,ch-26);ctx.fillStyle='#918166';ctx.font='italic 12px Georgia';ctx.fillText('A living impression',26,34);ctx.font='9px sans-serif';ctx.fillText('INDIGO × VERMILION / TWO CULTURES',26,51);ctx.strokeStyle='#bb9d70';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cw-31,32,6,0,Math.PI*2);ctx.moveTo(cw-40,32);ctx.lineTo(cw-22,32);ctx.moveTo(cw-31,23);ctx.lineTo(cw-31,41);ctx.stroke();dirty=false}
function loop(t){requestAnimationFrame(loop);if(document.hidden){last=t;return}if(t-last<33)return;last=t;frames++;qa.dataset.frames=frames;qa.dataset.cells=N;qa.dataset.bounded='true';if(!paused&&!harvested){for(let i=0;i<4;i++)step();dirty=true}if(dirty)draw()}initialize();resize();requestAnimationFrame(loop);
})();
