<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131f"><title>Glass Orchard — Little Worlds</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131f;color:#eff8fa;font-family:Inter,Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(23px,env(safe-area-inset-top));left:28px;pointer-events:none;z-index:2}h1{margin:0;font-size:14px;letter-spacing:.22em;font-weight:500;text-transform:uppercase}header p{margin:9px 0 0;font-size:12px;letter-spacing:.12em;opacity:.65}.panel{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;width:max-content;max-width:calc(100% - 24px);padding:9px 12px;border:1px solid #ffffff23;border-radius:22px;background:#06131fc7;backdrop-filter:blur(18px);box-shadow:0 12px 40px #0003}.bar{display:flex;gap:6px;align-items:center;justify-content:center}button,select,.range{height:44px;min-width:48px;color:#eaf9fa;background:#ffffff09;border:1px solid #ffffff16;border-radius:12px;font:12px Arial,sans-serif;padding:0 12px;cursor:pointer;white-space:nowrap}button:hover,select:hover{background:#ffffff20}button[aria-pressed=true]{background:#d9faff25;border-color:#c9fcf978;box-shadow:inset 0 0 18px #a7fffa10}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #a4f5f1;outline-offset:3px}.range{display:flex;align-items:center;gap:6px;padding:0 9px;font-size:12px}.range input{width:72px;accent-color:#b6efef;cursor:pointer}.hint{margin:8px 0 0;text-align:center;color:#dceef1a3;font-size:12px;letter-spacing:.055em;pointer-events:none}#qa{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){header{left:22px;top:25px}h1{font-size:12px}.panel{width:calc(100% - 24px);padding:8px;border-radius:18px;bottom:max(12px,env(safe-area-inset-bottom))}.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}button,select,.range{width:100%;min-width:0;padding:0 3px;font-size:12px}.range{gap:3px}.range input{width:38px;min-width:25px}.hint{margin-top:7px;font-size:12px}}</style></head><body><canvas id="art" aria-label="Glass Orchard interactive artwork"></canvas><header><h1>Glass Orchard</h1><p>01 / PRISMATIC BOTANY</p></header><div class="panel"><div class="bar"><button id="grow" aria-pressed="true">Grow</button><button id="prune" aria-pressed="false">Prune</button><button id="bloom" aria-pressed="true">Bloom</button><button id="night" aria-pressed="true">Night</button><label class="range">Wind<input id="wind" aria-label="Wind strength" type="range" min="0" max="1" value="0.45" step="0.01"></label><button id="reset" aria-label="Reset artwork">Reset</button><button id="mute" aria-pressed="false" aria-label="Toggle synthesized sound">Sound off</button></div><p class="hint">Tap to seed · hold to grow · drag to tint / prune</p></div><output id="qa" aria-live="off"></output><script>const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false}),qa=document.getElementById('qa');let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),frames=0,inputs=0,resets=0,muted=true,ac=null,voices=0,lastSound=0,lastFrame=0,clock=0,fps=0,countFrames=0,fpsAt=0,hidden=false;const pointers=new Map();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;const rnd=(a=0,b=1)=>a+Math.random()*(b-a);const hs=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;function size(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);if(typeof onResize==='function')onResize()}function usable(){return H-(W<600?148:100)}function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(ac.state==='suspended')ac.resume().catch(()=>{})}function tone(freq=220,length=.3,vol=.055){if(muted||!ac||ac.state!=='running'||voices>=6||performance.now()-lastSound<65)return;lastSound=performance.now();voices++;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.5,ac.currentTime+length);g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(vol,ac.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+length);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+length+.03);o.onended=()=>{voices--;o.disconnect();g.disconnect()}}function setPressed(id,v){document.getElementById(id).setAttribute('aria-pressed',v)}function bind(id,fn){document.getElementById(id).addEventListener('click',()=>{unlock();inputs++;fn();tone(330,.22,.03)})}bind('mute',()=>{muted=!muted;document.getElementById('mute').textContent=muted?'Sound off':'Sound on';setPressed('mute',!muted)});bind('reset',()=>{resets++;reset();pointers.clear()});function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,px:e.clientX,py:e.clientY,id:e.pointerId}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();unlock();inputs++;const p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);down(p)});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();inputs++;const p=point(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);move(p,old)});function end(e){if(!pointers.has(e.pointerId))return;up(pointers.get(e.pointerId));pointers.delete(e.pointerId)}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{hidden=document.hidden;lastFrame=0;if(hidden&&ac&&ac.state==='running')ac.suspend().catch(()=>{});else if(ac&&!muted)ac.resume().catch(()=>{})});setInterval(()=>{qa.dataset.frames=frames;qa.dataset.fps=fps.toFixed(1);qa.dataset.entities=entities();qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.muted=muted;qa.dataset.width=W;qa.dataset.height=H;qa.dataset.audio=ac?ac.state:'locked';qa.textContent=`${frames} frames; ${fps.toFixed(1)} FPS; ${entities()} entities; ${inputs} inputs`},1000);function loop(now){requestAnimationFrame(loop);if(hidden)return;const dt=lastFrame?Math.min(.04,(now-lastFrame)/1000):.016;lastFrame=now;clock+=dt;frames++;countFrames++;if(now-fpsAt>1000){fps=countFrames*1000/(now-fpsAt);countFrames=0;fpsAt=now}update(dt);ctx.setTransform(D,0,0,D,0,0);draw()};
let trees=[],dust=[],rings=[],mode='grow',night=true,bloom=true,wind=.45,hold=0;const MAX_TREES=6,MAX_BRANCHES=235;function makeTree(x,y,instant=false){const tree={x:clamp(x,.07,.93),y:clamp(y,.35,.86),seed:rnd(100),factor:instant?1:.72,nodes:[],age:instant?13:0,hue:rnd(145,230)};function branch(parent,angle,len,level){if(tree.nodes.length>=MAX_BRANCHES||level>7)return;let sx=parent<0?0:tree.nodes[parent].ex,sy=parent<0?0:tree.nodes[parent].ey;const i=tree.nodes.length,ex=sx+Math.cos(angle)*len,ey=sy+Math.sin(angle)*len;tree.nodes.push({parent,sx,sy,ex,ey,angle,len,level,born:level*.9+rnd(.2,.9),alive:true,w:rnd(.8,1.15),leaf:rnd(),hue:rnd(-40,55)});if(level<7){branch(i,angle-rnd(.22,.55),len*rnd(.64,.79),level+1);branch(i,angle+rnd(.24,.59),len*rnd(.62,.79),level+1);if(level<3&&Math.random()>.4)branch(i,angle+rnd(-.14,.14),len*.79,level+1)}}branch(-1,-Math.PI/2,instant?.195:rnd(.145,.185),0);trees.push(tree);if(trees.length>MAX_TREES)trees.shift();rings.push({x:tree.x,y:tree.y,age:0});tone(130+tree.hue,1,.045);return tree}function reset(){trees=[];rings=[];dust=Array.from({length:90},()=>({x:rnd(),y:rnd(),r:rnd(.3,1.7),speed:rnd(.004,.018),phase:rnd(TAU)}));makeTree(.51,.81,true);let a=makeTree(.22,.845);a.factor=.62;a.age=5.8;let b=makeTree(.8,.835);b.factor=.65;b.age=4.2;mode='grow';setPressed('grow',true);setPressed('prune',false)}function nearest(p){let best=null,d=.2;for(const tr of trees){const q=Math.hypot((tr.x-p.x)*W,(tr.y-p.y)*H)/Math.min(W,H);if(q<d){d=q;best=tr}}return best}function pruneAt(p){let hit=null,dist=24;for(const tr of trees){const sc=Math.min(W*2.15,(tr.y*H-110)*1.2)*tr.factor;for(let i=0;i<tr.nodes.length;i++){const n=tr.nodes[i];if(!n.alive||tr.age<n.born)continue;const progress=clamp((tr.age-n.born)/.85,0,1),sway=Math.sin(clock*.65+tr.seed+n.level*.2)*wind*.06,bend=q=>sway*q*q;let sx=tr.x*W+(n.sx+bend(-n.sy))*sc,sy=tr.y*H+n.sy*sc,ex=tr.x*W+(mix(n.sx,n.ex,progress)+bend(-mix(n.sy,n.ey,progress)))*sc,ey=tr.y*H+mix(n.sy,n.ey,progress)*sc;let dx=ex-sx,dy=ey-sy,f=clamp(((p.px-sx)*dx+(p.py-sy)*dy)/(dx*dx+dy*dy||1),0,1),d=Math.hypot(sx+dx*f-p.px,sy+dy*f-p.py);if(d<dist){dist=d;hit={tr,i}}}}if(hit){const gone=new Set([hit.i]);hit.tr.nodes[hit.i].alive=false;for(let i=hit.i+1;i<hit.tr.nodes.length;i++)if(gone.has(hit.tr.nodes[i].parent)){hit.tr.nodes[i].alive=false;gone.add(i)}rings.push({x:p.x,y:p.y,age:0});tone(650,.15,.045)}}function down(p){hold=0;if(mode==='prune'){pruneAt(p);return}let tr=nearest(p);if(!tr||p.y<.63){tr=makeTree(p.x,clamp(p.y+.1,.45,.86));}else{if(tr.nodes.some(n=>!n.alive)){for(const n of tr.nodes)n.alive=true;tr.age=1.5}tr.age=Math.min(16,tr.age+1.5);rings.push({x:p.x,y:p.y,age:0});tone(430,.6,.03)}}function move(p,old){if(mode==='prune'){const n=Math.ceil(Math.hypot(p.px-old.px,p.py-old.py)/16);for(let i=1;i<=n;i++){const f=i/n;pruneAt({x:mix(old.x,p.x,f),y:mix(old.y,p.y,f),px:mix(old.px,p.px,f),py:mix(old.py,p.py,f)})}}else{const tr=nearest(p)||trees[trees.length-1];tr.age=Math.min(16,tr.age+.08);tr.hue=(tr.hue+(p.x-old.x)*200+360)%360}}function up(){}bind('grow',()=>{mode='grow';setPressed('grow',true);setPressed('prune',false)});bind('prune',()=>{mode='prune';setPressed('grow',false);setPressed('prune',true)});bind('bloom',()=>{bloom=!bloom;setPressed('bloom',bloom)});bind('night',()=>{night=!night;setPressed('night',night);document.getElementById('night').textContent=night?'Night':'Day'});document.getElementById('wind').addEventListener('input',e=>{unlock();inputs++;wind=+e.target.value});function onResize(){}function entities(){return trees.reduce((a,t)=>a+t.nodes.filter(n=>n.alive).length,0)+dust.length+rings.length}function update(dt){for(const tr of trees)tr.age=Math.min(16,tr.age+dt*(pointers.size&&mode==='grow'?1.6:.36));for(const d of dust){d.y-=dt*d.speed;d.x+=Math.sin(clock*.4+d.phase)*wind*dt*.01;if(d.y<.08){d.y=.88;d.x=rnd()}}rings=rings.filter(r=>(r.age+=dt)<2);if(rings.length>20)rings.splice(0,rings.length-20)}function poly(points,fill){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}function draw(){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,night?'#050f1b':'#b9d7d2');bg.addColorStop(.6,night?'#113047':'#e5e8ca');bg.addColorStop(1,night?'#142c38':'#d4c4a2');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let halo=ctx.createRadialGradient(W*.5,H*.4,10,W*.5,H*.4,Math.max(W,H)*.65);halo.addColorStop(0,night?'#164b6550':'#fff9d688');halo.addColorStop(1,'#00000000');ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);const moonX=W*.8,moonY=H*.15;ctx.fillStyle=night?'#bce5ee':'#fff6ce';ctx.beginPath();ctx.arc(moonX,moonY,Math.min(W,H)*.047,0,TAU);ctx.fill();ctx.fillStyle=night?'#0c1f30':'#dce2c5';ctx.beginPath();ctx.arc(moonX+8,moonY-6,Math.min(W,H)*.044,0,TAU);ctx.fill();ctx.strokeStyle=night?'#bed7db09':'#8b998810';ctx.lineWidth=1;for(let k=0;k<10;k++){ctx.beginPath();let y=H*(.79+k*.018);ctx.moveTo(0,y);ctx.bezierCurveTo(W*.3,y-20,W*.7,y+20,W,y);ctx.stroke()}for(const d of dust){ctx.globalAlpha=.22+.2*Math.sin(clock+d.phase);ctx.fillStyle=night?'#c3ecf1':'#ffffff';ctx.beginPath();ctx.arc(d.x*W,d.y*H,d.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;for(const tr of trees){const sc=Math.min(W*2.15,(tr.y*H-110)*1.2)*tr.factor,baseX=tr.x*W,baseY=tr.y*H;let ground=ctx.createRadialGradient(baseX,baseY,0,baseX,baseY,sc*.19);ground.addColorStop(0,hs(tr.hue,75,65,.15));ground.addColorStop(1,hs(tr.hue,70,50,0));ctx.save();ctx.translate(baseX,baseY);ctx.scale(1,.2);ctx.fillStyle=ground;ctx.beginPath();ctx.arc(0,0,sc*.2,0,TAU);ctx.fill();ctx.restore();for(const n of tr.nodes){if(!n.alive)continue;const progress=clamp((tr.age-n.born)/.85,0,1);if(!progress)continue;const sway=Math.sin(clock*.65+tr.seed+n.level*.2)*wind*.06;const bend=q=>sway*q*q;const sx=baseX+(n.sx+bend(-n.sy))*sc,sy=baseY+n.sy*sc,ex=baseX+(mix(n.sx,n.ex,progress)+bend(-mix(n.sy,n.ey,progress)))*sc,ey=baseY+mix(n.sy,n.ey,progress)*sc;const thickness=Math.max(.55,(8-n.level)*.82*n.w*(sc/400)),dx=ex-sx,dy=ey-sy,L=Math.hypot(dx,dy)||1,nx=-dy/L*thickness,ny=dx/L*thickness;poly([[sx+nx,sy+ny],[ex+nx*.35,ey+ny*.35],[ex-nx*.35,ey-ny*.35],[sx-nx,sy-ny]],hs(tr.hue+n.hue,night?67:48,night?68:47,.33+.4*progress));ctx.strokeStyle=hs(tr.hue+n.hue+45,75,night?85:80,.7);ctx.lineWidth=Math.max(.4,thickness*.16);ctx.beginPath();ctx.moveTo(sx+nx*.35,sy+ny*.35);ctx.lineTo(ex,ey);ctx.stroke();if(n.level>4&&progress>.75){const rr=(bloom?7:3.5)*(sc/400)*(1+.2*Math.sin(clock*1.2+n.leaf*20));ctx.save();ctx.translate(ex,ey);ctx.rotate(n.angle+Math.PI*.5+sway);ctx.fillStyle=hs(tr.hue+n.hue+60,76,night?77:66,bloom?.7:.35);ctx.beginPath();ctx.moveTo(0,-rr*1.4);ctx.bezierCurveTo(rr,0,rr*.5,rr,0,rr*.7);ctx.bezierCurveTo(-rr*.6,rr,-rr,0,0,-rr*1.4);ctx.fill();ctx.strokeStyle='#eafcff90';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,-rr*1.1);ctx.lineTo(0,rr*.4);ctx.stroke();if(bloom&&n.leaf>.68){ctx.fillStyle=hs(tr.hue+150,70,85,.8);ctx.beginPath();ctx.arc(0,0,rr*.3,0,TAU);ctx.fill()}ctx.restore()}}ctx.strokeStyle=hs(tr.hue,80,78,.45);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(baseX,baseY,11,3,0,0,TAU);ctx.stroke()}for(const r of rings){ctx.strokeStyle=night?`rgba(177,244,241,${(1-r.age/2)*.4})`:`rgba(100,146,146,${(1-r.age/2)*.4})`;ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(r.x*W,r.y*H,5+r.age*35,2+r.age*9,0,0,TAU);ctx.stroke()}ctx.fillStyle=night?'#eff7ef6b':'#4160607b';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText('A FOREST OF LIGHT · '+trees.length+' / 6',W*.5,H-(W<600?158:106))}
size();reset();requestAnimationFrame(loop);</script></body></html>
