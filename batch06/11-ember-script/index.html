<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>焰书 · 第六组</title><style>:root{--bg:#0d1015;--ink:#e4ccb3;--accent:#eb784b;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>焰书</h1><p>按住聚焰写光字，松手释放火种；牵引笔画、分火、共振，再用金印封存。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="焰书，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="write" id="write">聚焰书写</button><button data-action="pull" id="pull">牵引光字</button><button data-action="split" id="split">划字分火</button><button data-action="resonate" id="resonate">交叉共振</button><button data-action="seal" id="seal">金印封存</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=11;window.artMeta={"number": 11, "slug": "11-ember-script", "title": "焰书", "group": "F", "mothers": ["magical_trail_shader.html"], "innovation": "聚焰书写，牵引光字，分裂火种与交叉共振；限亮保留熔光细节", "description": "按住聚焰写光字，松手释放火种；牵引笔画、分火、共振，再用金印封存。", "ui": {"bg": "#0d1015", "ink": "#e4ccb3", "accent": "#eb784b"}, "controls": [{"id": "write", "label": "聚焰书写"}, {"id": "pull", "label": "牵引光字"}, {"id": "split", "label": "划字分火"}, {"id": "resonate", "label": "交叉共振"}, {"id": "seal", "label": "金印封存"}], "newMechanics": ["可保留而非消失光字", "牵引持续改变笔画坐标", "松手释放限量火种", "封印锁住邻近光字", "共振提高光字能量与轮换火色", "共振检测笔画真实交点，在交点释放火结"], "artDirection": ["母本黑底熔光多色尾迹", "局部辉光限亮避免白屏", "有曲率的纤维笔锋/火种"], "testPlan": [{"control": "write", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "pull", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "split", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "resonate", "from": [0.55, 0.5], "to": [0.6, 0.55], "hold": 700}, {"control": "seal", "from": [0.62, 0.52], "to": [0.7, 0.55], "hold": 650}], "stateFields": ["strokes书写增长", "sealed金印上升", "splitBursts分火增长", "sparks不超过850", "lastCrossings只计真实笔画交点"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx;let mode='write',strokes=[],sparks=[],pointer=null,current=null,lastSeal=null,seals=[],knots=[],lastCrossings=0,resonance=0,splits=0;const colors=['#ef7541','#f6c478','#40cbbc','#8ba7ed','#cb6fb0'];let ink=0;
function spark(x,y,col,fast=false){let a=Math.random()*6.28,v=(fast?100:30)+Math.random()*80;return{x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.3+Math.random()*2.3,col};}
function reset(){strokes=[];sparks=[];seals=[];knots=[];lastCrossings=0;resonance=splits=ink=0;mode='write';pointer=current=lastSeal=null;for(let j=0;j<5;j++){let pts=[];for(let i=0;i<110;i++){let u=i/109;pts.push({x:.12+u*.76+.055*Math.sin(u*13+j),y:.19+j*.14+.065*Math.sin(u*12+j*1.3)+.026*Math.cos(u*27+j),width:1.2+Math.sin(u*3.14)*2});}strokes.push({pts,col:j%5,locked:false,charge:.4});}}
function spawn(p,n){for(let i=0;i<n;i++)sparks.push(spark(p.x,p.y,ink,true));if(sparks.length>850)sparks.splice(0,sparks.length-850);}
function deform(p){let x=p.x/e.W,y=p.y/e.H;for(let s of strokes)for(let q of s.pts){let d=Math.hypot((q.x-x)*e.W,(q.y-y)*e.H);if(d<130&&!s.locked){if(mode==='pull'){q.x+=(x-q.x)*.045;q.y+=(y-q.y)*.045;}if(mode==='split'){q.x+=(q.x-x)*.05;q.y+=(q.y-y)*.05;}q.x=e.clamp(q.x,.035,.965);q.y=e.clamp(q.y,.055,.94);}}}
function stamp(p){if(lastSeal&&Math.hypot(p.x-lastSeal.x,p.y-lastSeal.y)<35)return;lastSeal={...p};seals.push({x:p.x/e.W,y:p.y/e.H,r:.075,col:ink});if(seals.length>9)seals.shift();let closest=null,best=Infinity;for(let s of strokes){let d=Math.min(...s.pts.map(q=>Math.hypot(q.x*e.W-p.x,q.y*e.H-p.y)));if(d<best){best=d;closest=s;}if(d<Math.min(e.W,e.H)*.18)s.locked=true;}if(closest&&best<Math.min(e.W,e.H)*.32)closest.locked=true;}
function crossingFire(){let found=[];for(let a=0;a<strokes.length;a++)for(let b=a+1;b<strokes.length;b++){let A=strokes[a].pts,B=strokes[b].pts;for(let i=3;i<A.length;i+=3)for(let j=3;j<B.length;j+=3){let p=A[i-3],q=A[i],r=B[j-3],z=B[j],dx=q.x-p.x,dy=q.y-p.y,ex=z.x-r.x,ey=z.y-r.y,det=dx*ey-dy*ex;if(Math.abs(det)<.0000001)continue;let u=((r.x-p.x)*ey-(r.y-p.y)*ex)/det,v=((r.x-p.x)*dy-(r.y-p.y)*dx)/det;if(u>=0&&u<=1&&v>=0&&v<=1){let x=p.x+u*dx,y=p.y+u*dy;if(found.every(k=>Math.hypot((k.x-x)*e.W,(k.y-y)*e.H)>18)){found.push({x,y,col:strokes[a].col,life:2.5});strokes[a].charge=strokes[b].charge=1;spawn({x:x*e.W,y:y*e.H},15);}if(found.length>=32)break;} } }lastCrossings=found.length;knots=found;}

return{reset,input(k,p){if(k==='down'){pointer=p;if(mode==='write'){current={pts:[],col:ink,locked:false,charge:0};strokes.push(current);if(strokes.length>18)strokes.shift();}if(mode==='seal')stamp(p);}
if((k==='down'||k==='move')&&pointer){pointer=p;if(mode==='write'&&current){current.pts.push({x:p.x/e.W,y:p.y/e.H,width:1+Math.random()*2});if(current.pts.length>280)current.pts.shift();current.charge=Math.min(1,current.charge+.01);}else if(mode==='seal')stamp(p);else deform(p);spawn(p,3);}
if(k==='up'||k==='cancel'){if(pointer){spawn(p,60);resonance=.95;if(mode==='split')splits++;}pointer=current=lastSeal=null;}},action(id){if(id==='resonate'){crossingFire();resonance=1;for(let s of strokes)s.charge=Math.min(1,s.charge+.35);ink=(ink+1)%5;}else mode=id;},draw(dt,t){let W=e.W,H=e.H;let g=c.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,W*.8);g.addColorStop(0,'#151318');g.addColorStop(1,'#030406');c.fillStyle=g;c.fillRect(0,0,W,H);resonance*=Math.exp(-dt*1.8);if(pointer&&Math.random()<dt*100){spawn(pointer,2);if(current)current.charge=Math.min(1,current.charge+dt*.22);}
for(let s of strokes){let pts=s.pts;if(pts.length<2)continue;let col=colors[s.col];s.charge*=Math.exp(-dt*.09);for(let layer=0;layer<3;layer++){c.beginPath();for(let i=0;i<pts.length;i++){let p=pts[i],f=s.locked?0:Math.sin(t*1.7+i*.12)*(.8+s.charge*1.5),x=p.x*W,y=p.y*H+f;i?c.lineTo(x,y):c.moveTo(x,y);}c.strokeStyle=layer===2?'#ffe1ad':col;c.globalAlpha=layer===0?.13:layer===1?.65:.72;c.lineWidth=layer===0?13+s.charge*10:layer===1?3.7+s.charge*2:1;c.shadowColor=col;c.shadowBlur=layer===1?12:0;c.lineJoin=c.lineCap='round';c.stroke();}c.globalAlpha=1;c.shadowBlur=0;for(let f=0;f<17;f++){c.beginPath();for(let i=0;i<pts.length;i++){let p=pts[i],q=pts[Math.max(0,i-1)],a=Math.atan2((p.y-q.y)*H,(p.x-q.x)*W),b=(f-8)*(1.5+3*Math.pow(Math.sin(i*.21+f*.7),2))*(.75+s.charge),curl=Math.sin(i*.29-f*.8+t*2.1)*(5+s.charge*9);let x=p.x*W-Math.sin(a)*(b+curl),y=p.y*H+Math.cos(a)*(b+curl);i?c.lineTo(x,y):c.moveTo(x,y);}c.strokeStyle=colors[(s.col+(f===0?1:0))%5];c.globalAlpha=.14+(f%3)*.045;c.lineWidth=.45+(f%2)*.25;c.stroke();}for(let i=2;i<pts.length;i+=2){let p=pts[i],q=pts[i-1],a=Math.atan2((p.y-q.y)*H,(p.x-q.x)*W),length=14+Math.sin(i*.8+t*2)*9;c.strokeStyle=col;c.globalAlpha=.45;c.lineWidth=.6;c.beginPath();c.moveTo(p.x*W,p.y*H);c.bezierCurveTo(p.x*W-Math.sin(a)*length,p.y*H+Math.cos(a)*length,p.x*W-Math.cos(a)*length-Math.sin(a)*length*2,p.y*H-Math.sin(a)*length+Math.cos(a)*length*2,p.x*W-Math.sin(a)*length*3,p.y*H+Math.cos(a)*length*3);c.stroke();}c.globalAlpha=1;if(Math.random()<dt*12&&sparks.length<850){let q=pts[Math.floor(Math.random()*pts.length)];let v=spark(q.x*W,q.y*H,s.col);v.vx*=.35;v.vy=-20-Math.random()*30;sparks.push(v);}}

for(let s of sparks){s.px=s.x;s.py=s.y;if(pointer){let dx=pointer.x-s.x,dy=pointer.y-s.y,d=Math.hypot(dx,dy)+1;s.vx+=dx/d*160*dt;s.vy+=dy/d*160*dt;s.vx*=.98;s.vy*=.98;}else{s.vx+=Math.sin(s.y*.02+t)*18*dt;s.vy-=9*dt;}s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;c.globalAlpha=Math.min(.8,s.life*.4);c.strokeStyle=colors[s.col];c.lineWidth=1;c.shadowColor=c.strokeStyle;c.shadowBlur=7;c.beginPath();c.moveTo(s.px,s.py);c.lineTo(s.x,s.y);c.stroke();}c.shadowBlur=0;c.globalAlpha=1;sparks=sparks.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);
for(let s of seals){let x=s.x*W,y=s.y*H,r=s.r*Math.min(W,H);c.strokeStyle=colors[s.col]+'bb';c.lineWidth=.7;for(let k=0;k<3;k++){c.beginPath();for(let i=0;i<=48;i++){let a=i/48*6.28,rr=r*(.6+k*.17)*(1+.08*Math.sin(a*8));let xx=x+Math.cos(a)*rr,yy=y+Math.sin(a)*rr;i?c.lineTo(xx,yy):c.moveTo(xx,yy);}c.stroke();}}
for(let k of knots){k.life-=dt;let x=k.x*W,y=k.y*H;c.strokeStyle=colors[k.col];c.globalAlpha=Math.max(0,k.life/2.5)*.65;c.lineWidth=.8;for(let j=0;j<9;j++){let a=j/9*6.28+t*.25,l=6+(2.5-k.life)*20;c.beginPath();c.moveTo(x+Math.cos(a)*4,y+Math.sin(a)*4);c.quadraticCurveTo(x+Math.cos(a+.3)*l,y+Math.sin(a+.3)*l,x+Math.cos(a)*l*1.4,y+Math.sin(a)*l*1.4);c.stroke();}}knots=knots.filter(k=>k.life>0);c.globalAlpha=1;

if(resonance>.06){c.strokeStyle='#eeb990';c.globalAlpha=resonance*.32;c.lineWidth=1;for(let s of strokes){let q=s.pts[Math.floor(s.pts.length/2)];if(q){c.beginPath();c.arc(q.x*W,q.y*H,(1-resonance)*120+15,0,6.28);c.stroke();}}c.globalAlpha=1;}},state(){let names={write:'聚焰：按住书写，松手释放火种，光字留下',pull:'牵字：扫过未封存的光字，笔画向手势聚拢',split:'分火：划开光字，松手甩出新火种',seal:'封存：点按光字，金印锁住邻近笔画'};return{bounded:true,mode,strokes:strokes.length,sparks:sparks.length,sealed:strokes.filter(s=>s.locked).length,splitBursts:splits,lastCrossings,charge:+resonance.toFixed(2),status:names[mode]+' · 光字 '+strokes.length+' · 封存 '+strokes.filter(s=>s.locked).length};}}
};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
