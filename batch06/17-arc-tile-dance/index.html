<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>弧砖舞阵 · 第六组</title><style>:root{--bg:#2a3433;--ink:#e4d9c4;--accent:#dd795c;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>弧砖舞阵</h1><p>转动一块弧砖，推挤整片色域；让染色沿同色邻接走一次，再翻面或并片。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="弧砖舞阵，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="hinge" id="hinge">弧砖转铰</button><button data-action="shove" id="shove">连片推挤</button><button data-action="flood" id="flood">波行换色</button><button data-action="flip" id="flip">连片翻面</button><button data-action="merge" id="merge">拖接并片</button><button data-action="align" id="align">归齐留色</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=17;window.artMeta={"number": 17, "slug": "17-arc-tile-dance", "title": "弧砖舞阵", "group": "G", "mothers": ["code_artifact.html"], "innovation": "邻接弧砖真实转铰、波行换色、推挤与连片翻面", "description": "转动一块弧砖，推挤整片色域；让染色沿同色邻接走一次，再翻面或并片。", "ui": {"bg": "#2a3433", "ink": "#e4d9c4", "accent": "#dd795c"}, "controls": [{"id": "hinge", "label": "弧砖转铰"}, {"id": "shove", "label": "连片推挤"}, {"id": "flood", "label": "波行换色"}, {"id": "flip", "label": "连片翻面"}, {"id": "merge", "label": "拖接并片"}, {"id": "align", "label": "归齐留色"}], "newMechanics": ["转铰角度/压窄松手保留", "同色连片整体错移", "有限邻接传播按拓扑层距留下协调矿色色带，薄墨透出原纸色", "翻面改变材料纹理及邻接轮廓", "拖并两个色域重构连接"], "artDirection": ["严格以相邻同色格关系决定四分之一圆边，保留母本连片包豪斯弧面", "七色实际独立取色；哑光纸面细印压纹与斜转薄边投影", "传播保留原纸色层并形成宽细印墨带，反复组合维持七色材料层次"], "testPlan": [{"control": "hinge", "from": [0.5, 0.5], "to": [0.58, 0.56], "hold": 450}, {"control": "shove", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "flood", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "flip", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "merge", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}], "stateFields": ["distinctColors初始7", "turnedTiles转铰后增加", "pushedTiles推挤后增加", "queuedFlood最终0", "waves增加", "reverseTiles翻面后增加", "visibleColorLayers传播后持续7；inkedTiles增加；传播色带按层距变化"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,clamp=env.clamp;const pal=['#e5d4b4','#6c767e','#c85f4c','#d5a03b','#487773','#586193','#9b7584'];let nc,nr,tiles,mode,drag,queue,waves,flips,hinges,selected,phase;
function geo(){let s=Math.min(env.W*.93/nc,env.H*.91/nr);return{s,x:(env.W-s*nc)/2,y:(env.H-s*nr)/2}}
function reset(){nc=env.W<650?7:17;nr=env.W<650?11:9;const seeds=Array.from({length:18},(_,i)=>({x:(Math.sin(i*3.77)*.5+.5)*nc,y:(Math.cos(i*1.97)*.5+.5)*nr,col:i%7}));tiles=Array.from({length:nc*nr},(_,i)=>{let x=i%nc,y=Math.floor(i/nc),seed=seeds.map(s=>({s,d:Math.hypot(x-s.x,y-s.y)})).sort((a,b)=>a.d-b.d)[0].s;return{x,y,col:seed.col,paperCol:seed.col,inked:false,waveLevel:0,dx:0,dy:0,angle:0,flip:false,pinch:1,bounce:0}});mode='hinge';drag=null;queue=[];waves=flips=hinges=phase=0;selected=0}
function idx(x,y){return x>=0&&x<nc&&y>=0&&y<nr?y*nc+x:-1}function same(x,y,col){let i=idx(x,y);return i>=0&&tiles[i].col===col}
function component(i){let col=tiles[i].col,seen=new Set([i]),q=[i];for(let j=0;j<q.length;j++){let t=tiles[q[j]];for(let [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let n=idx(t.x+dx,t.y+dy);if(n>=0&&!seen.has(n)&&tiles[n].col===col){seen.add(n);q.push(n)}}}return q}
function nearest(p){let g=geo(),x=Math.floor((p.x-g.x)/g.s),y=Math.floor((p.y-g.y)/g.s);return idx(x,y)}
function arcShape(t,s){let r=s/2;let a=!same(t.x-1,t.y,t.col)&&!same(t.x,t.y-1,t.col)?r:0,b=!same(t.x+1,t.y,t.col)&&!same(t.x,t.y-1,t.col)?r:0,d=!same(t.x-1,t.y,t.col)&&!same(t.x,t.y+1,t.col)?r:0,e=!same(t.x+1,t.y,t.col)&&!same(t.x,t.y+1,t.col)?r:0;let p=new Path2D();p.moveTo(-r+a,-r);p.lineTo(r-b,-r);p.quadraticCurveTo(r,-r,r,-r+b);p.lineTo(r,r-e);p.quadraticCurveTo(r,r,r-e,r);p.lineTo(-r+d,r);p.quadraticCurveTo(-r,r,-r,r-d);p.lineTo(-r,-r+a);p.quadraticCurveTo(-r,-r,-r+a,-r);p.closePath();return p}
function waveComponent(i){let source=tiles[i].col,seen=new Set([i]),q=[{i,d:0}];for(let k=0;k<q.length;k++){let t=tiles[q[k].i];for(let [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let j=idx(t.x+dx,t.y+dy);if(j>=0&&!seen.has(j)&&tiles[j].col===source){seen.add(j);q.push({i:j,d:q[k].d+1})}}}return q}
function touch(i){selected=i;let t=tiles[i];if(mode==='flood'){let q=waveComponent(i),source=t.col,harmonic=[0,3,2,6,5,1,4],start=harmonic.indexOf(source);queue=q.map((n,k)=>({i:n.i,col:k===q.length-1&&q.length>2?source:harmonic[(start+1+Math.floor(n.d/2))%7],level:n.d,delay:n.d*.09+k*.003}));waves++}if(mode==='flip'){component(i).forEach(i=>{tiles[i].flip=!tiles[i].flip;tiles[i].col=(tiles[i].col+3)%7;tiles[i].bounce=1});flips++}}
function input(kind,p){if(kind==='down'){let i=nearest(p);if(i<0)return;touch(i);let t=tiles[i];drag={i,x:p.x,y:p.y,dx:t.dx,dy:t.dy,a:t.angle};if(mode==='hinge')hinges++}if(kind==='move'&&drag){let t=tiles[drag.i],g=geo(),dx=(p.x-drag.x)/g.s,dy=(p.y-drag.y)/g.s;if(mode==='hinge'){t.angle=clamp(drag.a+dx*.95,-1.4,1.4);t.pinch=clamp(1-Math.abs(dy)*.35,.3,1.4)}if(mode==='shove'){component(drag.i).forEach(i=>{let n=tiles[i];n.dx=clamp(drag.dx+dx,-.6,.6);n.dy=clamp(drag.dy+dy,-.3,.3)})}}if(kind==='up'&&drag){if(mode==='merge'){let j=nearest(p);if(j>=0&&j!==drag.i){let col=tiles[drag.i].col;component(j).forEach(i=>tiles[i].col=col);tiles[j].angle=tiles[drag.i].angle}}drag=null}if(kind==='cancel')drag=null}
function action(id){if(id==='align'){tiles.forEach(t=>{t.angle=0;t.dx=t.dy=0;t.pinch=1});return}mode=id}
function draw(dt,time){phase+=dt;for(let v of queue)v.delay-=dt;let ready=queue.filter(v=>v.delay<=0).slice(0,5);for(let v of ready){tiles[v.i].col=v.col;tiles[v.i].waveLevel=v.level;tiles[v.i].inked=true;tiles[v.i].bounce=1;queue.splice(queue.indexOf(v),1)}c.fillStyle='#2a3433';c.fillRect(0,0,env.W,env.H);let g=geo();c.fillStyle='#ded2bc';c.fillRect(g.x-4,g.y-4,g.s*nc+8,g.s*nr+8);tiles.forEach((t,i)=>{let s=g.s,p=arcShape(t,s);t.bounce=Math.max(0,t.bounce-dt*2);c.save();c.translate(g.x+(t.x+.5+t.dx)*s,g.y+(t.y+.5+t.dy)*s);c.rotate(t.angle);c.scale(t.pinch,1+t.bounce*.1);if(Math.abs(t.angle)+Math.abs(t.dx)+Math.abs(t.dy)>.03){c.shadowColor='#1829236b';c.shadowBlur=6;c.shadowOffsetX=3;c.shadowOffsetY=4}c.fillStyle=pal[t.col];c.fill(p);c.shadowBlur=0;c.shadowOffsetX=c.shadowOffsetY=0;c.save();c.clip(p);if(t.inked){let r=s/2,band=(t.waveLevel%3-1)*s*.08;c.globalAlpha=.57;c.fillStyle=pal[t.paperCol];c.beginPath();c.moveTo(-r,-s*.18+band);c.bezierCurveTo(-s*.13,-s*.28+band,s*.17,s*.02+band,r,-s*.11+band);c.lineTo(r,s*.18+band);c.bezierCurveTo(s*.13,s*.26+band,-s*.14,-s*.01+band,-r,s*.12+band);c.closePath();c.fill();c.globalAlpha=.28;c.strokeStyle=pal[(t.paperCol+3)%7];c.lineWidth=s*.035;c.beginPath();c.moveTo(-r,-s*.27+band);c.bezierCurveTo(-s*.1,-s*.38+band,s*.17,-s*.03+band,r,-s*.23+band);c.stroke();c.globalAlpha=1;}c.strokeStyle=t.flip?'#f9edd344':'#1e333b16';c.lineWidth=.7;for(let k=0;k<11;k++){let y=(k/11-.5)*s;c.beginPath();c.moveTo(-s/2,y);c.lineTo(s/2,y+(t.flip?3:0));c.stroke()}for(let k=0;k<14;k++){let x=Math.sin(k*6.31+i)*s*.45,y=Math.cos(k*3.77+i)*s*.45;c.fillStyle='#f7eddb24';c.fillRect(x,y,1,1)}c.restore();if(t.angle!==0||t.flip){c.strokeStyle='#eedcbc99';c.lineWidth=.8;c.stroke(p)}if(selected===i){c.fillStyle='#ece1bc';c.beginPath();c.arc(0,0,3,0,Math.PI*2);c.fill()}c.restore()});c.fillStyle='#e4d9c4';c.font='10px monospace';c.fillText('ARC TILE / LINKED KINETICS',16,18)}
return{reset,draw,input,action,state:()=>({bounded:true,status:({hinge:'转铰：横拖转动弧砖，纵拖压窄；角度松手保留',shove:'推挤：拖同色连片整体错位，格缝与投影会留下',flood:'波行染色：点同色域，按邻接层距留下矿色带，旧纸色从薄墨里透出',flip:'连片翻面：点一色域，反面纹理改变圆角邻接',merge:'并片：从一片拖到另一片，合并其颜色与连接'})[mode],mode,cells:tiles.length,turnedTiles:tiles.filter(t=>Math.abs(t.angle)>.05).length,pushedTiles:tiles.filter(t=>Math.abs(t.dx)+Math.abs(t.dy)>.1).length,reverseTiles:tiles.filter(t=>t.flip).length,distinctColors:new Set(tiles.map(t=>t.col)).size,visibleColorLayers:new Set(tiles.flatMap(t=>t.inked?[t.col,t.paperCol]:[t.col])).size,inkedTiles:tiles.filter(t=>t.inked).length,colorCounts:pal.map((_,col)=>tiles.filter(t=>t.col===col).length),queuedFlood:queue.length,waves,flips,hinges})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
