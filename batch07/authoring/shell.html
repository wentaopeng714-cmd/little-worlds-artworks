<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Little Worlds</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{--bg:#191820;--ink:#f9dfba;--accent:#e69065;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;display:grid;grid-template-rows:auto 1fr auto}header{padding:18px 24px 10px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}h1{font:500 clamp(23px,3vw,34px) Georgia,serif;margin:0 0 5px;letter-spacing:.035em}#hint{font-size:14px;line-height:1.6;max-width:750px;opacity:.84}nav{display:flex;gap:7px;align-items:center;flex-shrink:0}button,a{font:inherit;color:inherit}button{min-height:44px;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:999px;padding:9px 16px;background:transparent;cursor:pointer;font-size:14px;touch-action:manipulation}button:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}main{position:relative;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}footer{padding:10px 24px max(12px,env(safe-area-inset-bottom));border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent);display:flex;justify-content:space-between;gap:16px;align-items:center}#tools{display:flex;flex-wrap:wrap;gap:7px}#soundnote{font-size:12px;opacity:.65;max-width:160px;line-height:1.5}#qa{position:absolute;left:0;bottom:0;max-height:70px;overflow:auto;z-index:5;display:none;font:10px monospace;color:#fff;background:#000b;pointer-events:none;white-space:pre-wrap;width:100%}body.qa #qa{display:block}.back{text-decoration:none;font-size:12px;opacity:.6;white-space:nowrap} @media(max-width:650px){header{padding:12px 13px 8px;display:block}header nav{position:absolute;top:10px;right:12px}header nav button{min-height:44px;font-size:12px;padding:7px 10px}#capture{display:none}h1{font-size:23px;padding-right:155px}#hint{font-size:14px;line-height:1.6;padding-top:4px}footer{padding:8px 12px max(10px,env(safe-area-inset-bottom));display:block}#tools{gap:6px}#tools button{font-size:14px;min-height:44px;padding:8px 12px}#soundnote{display:none}.back{position:absolute;right:15px;bottom:10px;display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body data-number="__NUMBER__"><header><div><h1 id="title"></h1><div id="hint"></div></div><nav><button id="sound" type="button" aria-pressed="false">声音开启</button><button id="reset" type="button">重新开始</button><button id="capture" type="button">存画面</button></nav></header><main><canvas aria-label="可拖动的互动艺术画面"></canvas><output id="qa"></output></main><footer><div id="tools" role="group" aria-label="作品工具"></div><div id="soundnote"></div></footer><script>__ART__</script><script>__RUNTIME__</script></body></html>
