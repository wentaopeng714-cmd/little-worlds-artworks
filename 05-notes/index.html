<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Gravity choir</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#152b35;color:#f2e8d4;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(26px,env(safe-area-inset-top));left:26px;pointer-events:none}small{font-size:10px;letter-spacing:3px}h1{font-size:clamp(30px,6vw,52px);font-weight:400;letter-spacing:-2px;margin:8px 0}header p{font-size:12px;line-height:1.65;opacity:.65;margin:0;max-width:250px}.tools button{padding:0 10px;font-size:10px}.tools{position:absolute;bottom:max(23px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;align-items:center;gap:9px}button{font:11px Arial;letter-spacing:1px;color:inherit;background:transparent;border:1px solid currentColor;border-radius:30px;min-height:42px;padding:0 17px;cursor:pointer}button:focus-visible{outline:3px solid #ff8748;outline-offset:3px}#hint{margin-left:auto;font-size:10px;letter-spacing:1px;opacity:.6;text-align:right;max-width:75px}#badge{position:absolute;right:24px;top:30px;border-top:1px solid currentColor;padding-top:8px;font-size:10px;letter-spacing:2px;opacity:.55}@media(max-width:430px){#hint{display:none}.tools{gap:8px;justify-content:space-between}#badge{font-size:8px;top:27px;right:18px}header{left:20px}header small{font-size:8px;letter-spacing:2px}}@media(max-height:620px){header{top:18px}h1{font-size:30px;margin:5px 0}header p{font-size:10px}.tools{bottom:15px}}</style></head><body><canvas id="art" aria-label="Tap or hold to drop musical balls onto the curved note bars"></canvas><header><small>LITTLE WORLDS / 05</small><h1>Gravity choir</h1><p>Drop notes. BUILD: draw ramps, drag their ends.<br>Tap a ramp to change its voice.</p></header><span id="badge">KINETIC SOUND</span><div class="tools"><button id="mute" aria-pressed="true">SOUND ON</button><button id="reset">RESET</button><button id="build">BUILD</button><button id="gravity">FLOAT</button><span id="hint">DROP · BUILD · REMIX</span></div><script>'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,D=1,muted=false,ac=null,interactions=0,resets=0,frame=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}function tone(f=220,d=.15,type='sine',vol=.08){if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(vol,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.01)}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'SOUND OFF':'SOUND ON';document.getElementById('mute').setAttribute('aria-pressed',String(!muted));tone(440)};function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function line(x,y,a,b,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}function disc(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}let balls=[],sparks=[],held=false,spawnX=0,spawnY=0,timer=0,total=0,ramps=[],editing=false,low=false,gesture=null,collisions=0,changes=0,drawn=0,splitCount=0,voiceChanges=0;
const pal=['#f17153','#e9bd5d','#a8c5b0','#7695bf','#d695a2'],freq=[196,220,261.63,293.66,329.63,392,440];
function reset(){balls=[];sparks=[];held=false;timer=0;total=0;ramps=[{a:{x:.15,y:.43},b:{x:.52,y:.48},voice:0,glow:0,hits:0},{a:{x:.55,y:.62},b:{x:.88,y:.56},voice:1,glow:0,hits:0}];editing=false;low=false;gesture=null;collisions=0;changes=0;drawn=0;splitCount=0;voiceChanges=0;document.getElementById('build').textContent='BUILD';document.getElementById('gravity').textContent='FLOAT'}
function state(){return{balls:balls.length,totalNotes:total,holding:held,editing,lowGravity:low,platforms:ramps.length,collisions,structureChanges:changes,drawn,splitCount,voiceChanges,geometry:ramps.map(r=>({a:{x:r.a.x*W,y:r.a.y*H},b:{x:r.b.x*W,y:r.b.y*H},voice:r.voice,hits:r.hits}))}}
function spawn(x,y,extra=false){balls.push({x:clamp(x,12,W-12),y:clamp(y,140,H*.78),vx:rand(-.6,.6),vy:0,r:extra?6:9,color:pal[total%5],bounces:0,cool:0,life:0,extra});if(balls.length>55)balls.shift();total++;interactions++;tone(freq[total%7]*2,.08,'sine',.016)}
document.getElementById('build').onclick=()=>{unlock();editing=!editing;held=false;gesture=null;document.getElementById('build').textContent=editing?'PLAY':'BUILD';document.getElementById('hint').textContent=editing?'DRAW / DRAG / TAP':'HOLD FOR CHORUS';interactions++};document.getElementById('gravity').onclick=()=>{unlock();low=!low;document.getElementById('gravity').textContent=low?'FALL':'FLOAT';interactions++;tone(low?523:196,.4)};
function segDist(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,u=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return Math.hypot(p.x-a.x-dx*u,p.y-a.y-dy*u)}
canvas.onpointerdown=e=>{unlock();canvas.setPointerCapture(e.pointerId);let p=pos(e);if(!editing){held=true;spawnX=p.x;spawnY=p.y;spawn(p.x,p.y);timer=0;return}gesture={start:p,p,ri:-1,end:null,moved:false};let best=28;ramps.forEach((r,i)=>{for(let k of ['a','b']){let d=Math.hypot(p.x-r[k].x*W,p.y-r[k].y*H);if(d<best){best=d;gesture.ri=i;gesture.end=k}}});interactions++};
canvas.onpointermove=e=>{let p=pos(e);if(held){spawnX=p.x;spawnY=p.y}if(gesture){gesture.p=p;gesture.moved=Math.hypot(p.x-gesture.start.x,p.y-gesture.start.y)>8;if(gesture.end&&gesture.moved){ramps[gesture.ri][gesture.end]={x:clamp(p.x/W,.05,.95),y:clamp(p.y/H,.25,.8)}}}};
canvas.onpointerup=e=>{held=false;if(!gesture)return;let q=gesture;if(q.moved){if(q.end){let r=ramps[q.ri];if(Math.hypot((r.a.x-r.b.x)*W,(r.a.y-r.b.y)*H)<35)r.b.x=clamp(r.a.x+.15,.05,.95);changes++}else if(Math.hypot(q.p.x-q.start.x,q.p.y-q.start.y)>35){ramps.push({a:{x:clamp(q.start.x/W,.05,.95),y:clamp(q.start.y/H,.25,.8)},b:{x:clamp(q.p.x/W,.05,.95),y:clamp(q.p.y/H,.25,.8)},voice:drawn%3,glow:1,hits:0});if(ramps.length>8)ramps.shift();drawn++;changes++}}else{let near=-1,dist=30;ramps.forEach((r,i)=>{let d=segDist(q.p,{x:r.a.x*W,y:r.a.y*H},{x:r.b.x*W,y:r.b.y*H});if(d<dist){dist=d;near=i}});if(near>=0){ramps[near].voice=(ramps[near].voice+1)%3;voiceChanges++;changes++;tone(freq[ramps[near].voice+2],.2)}}gesture=null};canvas.onpointercancel=()=>{held=false;gesture=null};
function floorY(x){return H*.80+Math.sin(x/W*Math.PI)*H*.035}
function strike(b,x,y,v){collisions++;b.bounces++;b.cool=8;let note=Math.min(6,Math.floor(x/W*7));tone(freq[note]*(v===2?2:1),v===1?.5:.22,v===0?'sine':'triangle',.035);sparks.push({x,y,r:1,a:1,c:pal[v]});if(sparks.length>70)sparks.shift()}
function draw(dt,t){ctx.fillStyle='#152b35';ctx.fillRect(0,0,W,H);for(let i=0;i<35;i++)disc((i*83+31)%W,170+((i*47)%(Math.max(20,H-280))),1,'#35505a');for(let i=0;i<7;i++){let x=(i+.5)*W/7,y=floorY(x);line(x-W/17,y,x+W/17,y,pal[i%5],4);ctx.fillStyle='#789091';ctx.font='9px Arial';ctx.textAlign='center';ctx.fillText(['G','A','C','D','E','G','A'][i],x,y+22)}
ramps.forEach(r=>{r.glow*=.94;let a={x:r.a.x*W,y:r.a.y*H},b={x:r.b.x*W,y:r.b.y*H};line(a.x,a.y,b.x,b.y,pal[r.voice],5+r.glow*7);disc(a.x,a.y,editing?9:4,pal[r.voice]);disc(b.x,b.y,editing?9:4,pal[r.voice]);ctx.fillStyle='#b1c1bd';ctx.font='9px Arial';ctx.textAlign='center';ctx.fillText(['BOUNCE','GLIDE','SPLIT'][r.voice],(a.x+b.x)/2,(a.y+b.y)/2-13)});
if(gesture&&!gesture.end&&gesture.moved)line(gesture.start.x,gesture.start.y,gesture.p.x,gesture.p.y,'#ffffff80',3);
if(held){timer+=dt;if(timer>16){spawn(spawnX,spawnY);timer=0}}let newborn=[];
balls.forEach(b=>{b.life+=dt;b.cool-=dt;let py=b.y;b.vy+=(low?.045:.17)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r||b.x>W-b.r){b.vx*=-.9;b.x=clamp(b.x,b.r,W-b.r)}
if(b.cool<=0)for(let r of ramps){let a=r.a,c=r.b;if(a.x>c.x){a=r.b;c=r.a}let dx=(c.x-a.x)*W;if(dx<8)continue;let u=(b.x-a.x*W)/dx,sy=(a.y+(c.y-a.y)*u)*H;if(u>=0&&u<=1&&b.vy>0&&py+b.r<=sy+5&&b.y+b.r>=sy){b.y=sy-b.r;r.glow=1;r.hits++;strike(b,b.x,sy,r.voice);let slope=(c.y-a.y)*H/dx;b.vx+=clamp(slope*2,-2,2);b.vy=-Math.max(r.voice===1?1:3,Math.abs(b.vy)*(r.voice===0?.91:.55));if(r.voice===1)b.vx+=slope>=0?1.2:-1.2;if(r.voice===2&&!b.extra&&b.bounces<4){newborn.push({x:b.x+10,y:b.y-15});splitCount++;b.extra=true}break}}
let fy=floorY(b.x)-b.r;if(b.y>fy&&b.vy>0){b.y=fy;strike(b,b.x,fy+b.r,0);b.vy=-Math.max(3,Math.abs(b.vy)*.8);b.vx+=rand(-.6,.6)}disc(b.x,b.y,b.r,b.color);line(b.x,b.y,b.x-b.vx*4,b.y-b.vy*3,b.color,2);if(b.bounces>20||b.life>2100)b.y=H+100});balls=balls.filter(b=>b.y<H+50);newborn.forEach(p=>spawn(p.x,p.y,true));sparks.forEach(s=>{s.r+=1.5*dt;s.a-=.025*dt;ctx.globalAlpha=Math.max(0,s.a);ctx.strokeStyle=s.c;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(s.x,s.y,s.r,s.r*.3,0,0,7);ctx.stroke()});ctx.globalAlpha=1;sparks=sparks.filter(s=>s.a>0);if(!balls.length){ctx.fillStyle='#a8c5b0';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText(editing?'DRAW A NEW PATH':'TAP ABOVE A RAMP',W*.5,H*.29)} }


document.getElementById('reset').onclick=()=>{unlock();reset();interactions=0;resets++;tone(130,.2)};window.__artTest={getState:()=>({title:document.title,interactions,resets,muted,audioState:ac?.state||'locked',width:W,height:H,...state()})};let prev=performance.now();function loop(t){const dt=Math.min((t-prev)/16.667,2);prev=t;frame++;draw(dt,t);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);</script></body></html>
