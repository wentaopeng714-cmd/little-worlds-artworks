<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soft Botany — Little Worlds</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3eddc;color:#30433c;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(26px,env(safe-area-inset-top));left:7%;right:7%;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.65}h1{font-size:clamp(27px,5vw,46px);font-weight:500;letter-spacing:-1.5px;margin:12px 0 0}.tools{position:absolute;right:0;top:0;display:flex;gap:8px;pointer-events:auto}button{border:1px solid currentColor;border-radius:30px;color:inherit;background:#f3eddc;font:10px Arial;letter-spacing:1px;padding:10px 12px;cursor:pointer;min-height:38px}button:focus-visible{outline:3px solid currentColor;outline-offset:3px}footer{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:7%;right:7%;font-size:11px;letter-spacing:.6px;pointer-events:none;line-height:1.7}.num{float:right;opacity:.45}@media(max-width:480px){header{top:max(24px,env(safe-area-inset-top))}.tools{top:74px}}</style></head><body><canvas id="art" aria-label="Soft Botany interactive canvas"></canvas><header><div class="eyebrow">Little Worlds / A garden of gestures</div><h1>Soft Botany</h1><div class="tools"><button id="mute" aria-label="Toggle sound" aria-pressed="false">SOUND ON</button><button id="reset" aria-label="Reset artwork">RESET</button></div></header><footer>Plant & hold. Pull a bloom. Brush flowers together.<span class="num">02</span></footer><script>const c=document.getElementById('art'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,D=1,muted=false,ac=null,interactions=0,resets=0;function unlock(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});}function tone(f,d=.18,v=.045,type='sine'){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(v,ac.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02);}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'SOUND OFF':'SOUND ON';document.getElementById('mute').setAttribute('aria-pressed',String(muted));};function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}size();

const colors=['#e86548','#dfa92d','#81965e','#9c88ac'];let plants=[],active=null,time=0,last=0,notes=0,plantings=0,bends=0,pollinations=0,mutations=0,hybrids=0,links=[],gesture=null,message='Plant a little possibility';const ground=.81;
function make(x,h=.16,col=null){return{x,y:ground,h,target:h,bend:0,vel:0,seed:Math.random()*9,kind:Math.floor(Math.random()*3),color:col||colors[Math.floor(Math.random()*4)],open:1,pulse:0,generation:0};}
function head(p){return{x:p.x+p.bend+Math.sin(time*1.3+p.seed)*.009,y:ground-p.h};}
function init(){plants=[make(.23,.18),make(.47,.31),make(.76,.22)];plants.forEach((p,i)=>p.kind=i);active=null;gesture=null;links=[];plantings=bends=pollinations=mutations=hybrids=0;message='Plant · bend · brush flowers together';}init();
function near(q){let best=null,dist=48;for(const p of plants){let h=head(p),d=Math.hypot((h.x-q.x)*W,(h.y-q.y)*H);if(d<dist){best=p;dist=d;}}return best;}
function blend(a,b){return '#'+[1,3,5].map(i=>Math.round((parseInt(a.slice(i,i+2),16)+parseInt(b.slice(i,i+2),16))/2).toString(16).padStart(2,'0')).join('');}
function cross(a,b){if(a===b||gesture.visited.has(b))return;gesture.visited.add(b);pollinations++;a.pulse=b.pulse=1;links.push({a,b,life:2});let seed=make(Math.max(.08,Math.min(.92,(a.x+b.x)/2+(Math.random()-.5)*.09)),.08,blend(a.color,b.color));seed.target=.14+Math.random()*.25;seed.kind=(a.kind+b.kind+1)%3;seed.generation=Math.max(a.generation,b.generation)+1;plants.push(seed);hybrids++;if(plants.length>28){let remove=plants.findIndex(p=>p!==a&&p!==b&&p!==active);plants.splice(remove,1);}message='A new hybrid takes root';tone(440+seed.kind*110,.55,.035,'triangle');}
c.onpointerdown=e=>{if(active)return;e.preventDefault();unlock();c.setPointerCapture(e.pointerId);let q=pos(e);if(q.y<.23||q.y>.88)return;let chosen=near(q);gesture={id:e.pointerId,start:q,last:q,age:0,visited:new Set(),held:false,existing:!!chosen};active=chosen||make(Math.max(.07,Math.min(.93,q.x)),.025);if(!chosen){plants.push(active);if(plants.length>28)plants.shift();active.target=Math.max(.08,Math.min(.5,ground-q.y));plantings++;message='Hold to grow · lift to blossom';}else{gesture.visited.add(chosen);message='Sweep into another flower';}interactions++;tone(220+active.kind*90,.25);};
c.onpointermove=e=>{if(!active||e.pointerId!==gesture.id)return;let q=pos(e);if(gesture.existing){let other=near(q);if(other&&other!==active)cross(active,other);}active.bend=Math.max(-.3,Math.min(.3,q.x-active.x));active.target=Math.max(.07,Math.min(.5,ground-q.y));gesture.last=q;};
function release(e){if(!active||e.pointerId!==gesture.id)return;active.vel=active.bend*1.6;active.pulse=1;if(gesture.existing){bends++;message=gesture.held?'New petals, same little soul':'Elastic bloom · try brushing two flowers';}active=null;gesture=null;tone([330,392,440,523][notes++%4],.5,.04,'triangle');}c.onpointerup=release;c.onpointercancel=release;
document.getElementById('reset').onclick=()=>{unlock();init();resets++;};addEventListener('resize',size);
function leaf(x,y,s,a,col){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(s*.42,0,s*.6,s*.25,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function draw(ms){let dt=Math.min((ms-last)/1000,.04)||.016;last=ms;time+=dt;ctx.fillStyle='#f3eddc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e7e0c9';ctx.beginPath();ctx.ellipse(W*.5,H*.83,W*.6,H*.06,0,0,Math.PI*2);ctx.fill();if(active){gesture.age+=dt;if(!gesture.existing)active.target=Math.min(.5,active.target+dt*.065);else if(gesture.age>.7&&!gesture.held&&Math.hypot(gesture.last.x-gesture.start.x,gesture.last.y-gesture.start.y)<.035){active.kind=(active.kind+1)%3;active.color=colors[(colors.indexOf(active.color)+1+colors.length)%colors.length];active.pulse=1;gesture.held=true;mutations++;message=['Round petals','Starburst petals','Bell petals'][active.kind];tone(600+active.kind*90,.35);} }
for(const l of links){l.life-=dt;let a=head(l.a),b=head(l.b);ctx.globalAlpha=Math.max(0,l.life/2);ctx.strokeStyle='#d4a537';ctx.lineWidth=2;ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.quadraticCurveTo((a.x+b.x)*W/2,Math.min(a.y,b.y)*H-60,b.x*W,b.y*H);ctx.stroke();ctx.setLineDash([]);}links=links.filter(l=>l.life>0);ctx.globalAlpha=1;
for(const p of plants){p.h+=(p.target-p.h)*dt*5;p.pulse=Math.max(0,p.pulse-dt*1.2);p.open+=((p===active?.7:1)-p.open)*dt*3;if(p!==active){p.vel+=(-p.bend*15-p.vel*2.7)*dt;p.bend+=p.vel*dt;}let h=head(p),x=p.x*W,y=ground*H,b=(h.x-p.x)*W,ht=p.h*H;ctx.strokeStyle=p.generation?'#64876e':'#426957';ctx.lineWidth=Math.max(3,W*.006);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x-b*.2,y-ht*.3,x+b*.9,y-ht*.72,h.x*W,h.y*H);ctx.stroke();leaf(x+b*.28,y-ht*.38,Math.min(W,H)*.05,-.9,'#6c8960');leaf(x+b*.63,y-ht*.64,Math.min(W,H)*.044,-2.3,'#96a877');let r=Math.min(W,H)*(.023+p.h*.07)*(1+p.pulse*.3);ctx.save();ctx.translate(h.x*W,h.y*H);ctx.rotate(p.bend*.7);let petals=[6,9,4][p.kind];for(let i=0;i<petals;i++){ctx.save();ctx.rotate(i*Math.PI*2/petals);ctx.fillStyle=p.color;ctx.beginPath();if(p.kind===1){ctx.moveTo(-r*.35,0);ctx.lineTo(0,-r*2*p.open);ctx.lineTo(r*.35,0);}else ctx.ellipse(0,-r*p.open,r*(p.kind===2?.9:.65),r,0,0,Math.PI*2);ctx.fill();ctx.restore();}ctx.fillStyle=p.generation?'#f3eddc':'#f4d66a';ctx.beginPath();ctx.arc(0,0,r*.5,0,7);ctx.fill();ctx.fillStyle='#4b5241';ctx.beginPath();ctx.arc(-r*.15,-r*.07,r*.06,0,7);ctx.arc(r*.15,-r*.07,r*.06,0,7);ctx.fill();ctx.restore();}
ctx.fillStyle='#647563';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText(message,W*.5,H*.9);ctx.textAlign='left';requestAnimationFrame(draw);}requestAnimationFrame(draw);
window.__artTest={getState:()=>({plants:plants.length,growing:!!active,plantings,bends,pollinations,hybrids,mutations,kinds:[...new Set(plants.map(p=>p.kind))],generations:plants.map(p=>p.generation),interactions,resets,muted,audio:ac?ac.state:'locked',width:W,height:H}),geometry:()=>({flowers:plants.map(p=>{let h=head(p);return{x:h.x*W,y:h.y*H,kind:p.kind}})}),actions:'Tap empty space to plant; hold to grow; drag a flower onto another to cross-pollinate; hold a flower 0.7s to mutate; release dragged flower to spring.'};

</script></body></html>
