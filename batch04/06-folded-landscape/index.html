<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>纸上山谷 · 折纸浮雕</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce5e1;color:#45504a;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}#art{display:block;width:100vw;height:100dvh;touch-action:none;cursor:crosshair}.head{position:absolute;top:26px;left:28px;pointer-events:none}h1{font-family:ui-serif,Georgia,serif;font-weight:400;font-size:32px;letter-spacing:.15em;margin:0 0 8px}.sub{font-size:10px;letter-spacing:.14em}.mark{position:absolute;top:29px;right:26px;font-size:11px;letter-spacing:.13em}.caption{position:absolute;left:29px;bottom:215px;font-size:11px;line-height:1.8;color:#697971;pointer-events:none}.panel{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);border:1px solid #c4cec3;background:#f2f0e6ed;border-radius:18px;padding:10px;box-shadow:0 8px 32px #3a4e3914;backdrop-filter:blur(10px)}.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}.row+.row{margin-top:5px}button{font:inherit;font-size:12px;background:transparent;color:#536457;border:1px solid transparent;border-radius:10px;min-height:44px;min-width:46px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#576b56;color:#fffcef}button:hover{border-color:#82917c}#hint{font-size:11px;text-align:center;margin:8px 3px 2px;min-height:17px;color:#718070}@media(max-width:560px){.head{left:20px;top:24px}h1{font-size:27px}.mark{right:18px}.panel{width:calc(100% - 24px);bottom:15px;padding:8px}button{padding:8px 11px}.caption{left:20px;bottom:240px;font-size:10px;line-height:1.6}}.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body><canvas id="art" aria-label="可用山折谷折、抓角及熨平雕塑的纸面"></canvas><div class="head"><h1>纸上山谷</h1><div class="sub">A SHEET REMEMBERS YOUR HAND</div></div><div class="mark">06 / MATERIAL STUDIES</div><div class="caption">折痕是路径<br>光，让路径成为山谷</div><div class="panel"><div class="row"><button id="mountain" aria-pressed="true">山折</button><button id="valley" aria-pressed="false">谷折</button><button id="corner" aria-pressed="false">抓角</button><button id="flatten" aria-pressed="false">熨平</button><button id="light" aria-pressed="false">转光</button></div><div class="row"><button id="paper">换纸色</button><button id="sun" aria-pressed="false">日光漫游</button><button id="blank">空白纸</button><button id="undo">退一步</button><button id="reset">重置</button><span id="sound-status" class="sound-status">无声作品</span></div><div id="hint">沿纸面拖出一条折痕；长折像山脊，短折像局部起伏。</div></div><div id="qa" hidden data-frames="0" data-inputs="0" data-resets="0" data-bounded="true" data-audio="none" data-cap="18 creases; 40 flatten spots; 20 undo states; 5120 triangles"></div><script>
(()=>{'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),qa=document.getElementById('qa'),hint=document.getElementById('hint');let W,H,D,frames=0,inputs=0,resets=0,mode='mountain',paper=0,sun=false,lightAngle=-.9,lightHeight=.85,creases=[],flats=[],corners=[0,0,0,0],history=[],drag=null,last=0,dirty=true;const NX=64,NY=40,papers=[[241,234,214],[228,208,190],[198,219,213],[217,214,232]],cornerPos=[[0,0],[1,0],[1,1],[0,1]];let paperTexture;function sync(){qa.dataset.frames=frames;qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.audio='none';qa.dataset.bounded=String(creases.length<=18&&flats.length<=40&&history.length<=20);qa.dataset.objects=creases.length+flats.length+4}function touch(){inputs++;dirty=true;sync()}function remember(){history.push(JSON.stringify({creases,flats,corners}));if(history.length>20)history.shift()}const help={mountain:'沿纸面拖出折痕；向上抬起形成山脊，长度决定范围。',valley:'沿纸面拖出折痕；压下形成谷线，可以穿过已有山脊。',corner:'在纸面按住后上下拖动，抬起或放下最近的纸角。',flatten:'用手指缓慢熨过纸面，局部放平；不会清掉远处的折痕。',light:'在画面里移动光源；左右转方向，上下改变光的高度。'};function setMode(m){mode=m;drag=null;['mountain','valley','corner','flatten','light'].forEach(k=>document.getElementById(k).setAttribute('aria-pressed',String(k===m)));hint.textContent=help[m];dirty=true}function reset(){creases=[{x:.36,y:.4,a:.48,len:1.25,amp:.14},{x:.65,y:.57,a:-.75,len:1.05,amp:-.105},{x:.42,y:.76,a:-.27,len:.7,amp:.075}];flats=[];corners=[-.025,.06,.01,.025];history=[];paper=0;sun=false;lightAngle=-.9;lightHeight=.85;document.getElementById('sun').setAttribute('aria-pressed','false');setMode('mountain');sync()}function geom(){const width=Math.min(W*.9,H*.91,820),height=width*.69;return{cx:W*.5,cy:H*(W<560?.42:.46),width,height}}function toUV(e){const g=geom();return{x:(e.clientX-g.cx)/g.width+.5,y:(e.clientY-g.cy)/g.height+.5}}function project(u,v,z){const g=geom();return{x:g.cx+(u-.5)*g.width+(v-.5)*g.width*.08-z*g.width*.13,y:g.cy+(v-.5)*g.height-z*g.width*.29+(u-.5)*g.width*.055}}function height(u,v){let z=0;for(const c of creases){const dx=u-c.x,dy=v-c.y,along=dx*Math.cos(c.a)+dy*Math.sin(c.a),across=-dx*Math.sin(c.a)+dy*Math.cos(c.a),width=.23;const end=Math.max(0,1-Math.pow(Math.abs(along)/(c.len*.5+.045),6));z+=c.amp*Math.max(0,1-Math.abs(across)/width)*end}for(let i=0;i<4;i++){const p=cornerPos[i];z+=corners[i]*Math.exp(-((u-p[0])**2+(v-p[1])**2)/.085)}for(const f of flats)z*=1-.72*Math.exp(-((u-f.x)**2+(v-f.y)**2)/(.008));return Math.max(-.16,Math.min(.28,z))}function noiseTexture(){paperTexture=document.createElement('canvas');paperTexture.width=800;paperTexture.height=600;const g=paperTexture.getContext('2d');let seed=489;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<8500;i++){const x=rand()*800,y=rand()*600;g.strokeStyle=rand()>.5?'rgba(120,93,57,.1)':'rgba(255,255,247,.2)';g.lineWidth=.7;g.beginPath();g.moveTo(x,y);g.lineTo(x+1+rand()*3,y+rand()*1.2);g.stroke()}}function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);drag=null;dirty=true}function addFlat(p){if(p.x<0||p.y<0||p.x>1||p.y>1)return;flats.push({x:p.x,y:p.y});if(flats.length>40)flats.shift()}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);touch();const p=toUV(e);remember();drag={id:e.pointerId,start:p,last:p,screenY:e.clientY,index:0,base:0};if(mode==='corner'){let best=Infinity;cornerPos.forEach((c,i)=>{const d=(p.x-c[0])**2+(p.y-c[1])**2;if(d<best){best=d;drag.index=i}});drag.base=corners[drag.index]}if(mode==='flatten')addFlat(p);if(mode==='light')adjustLight(e)});function adjustLight(e){lightAngle=(e.clientX/W-.5)*Math.PI*2;lightHeight=Math.max(.22,Math.min(1.4,(1-e.clientY/H)*1.4));sun=false;document.getElementById('sun').setAttribute('aria-pressed','false')}canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();touch();const p=toUV(e);if(mode==='corner'){corners[drag.index]=Math.max(-.12,Math.min(.28,drag.base+(drag.screenY-e.clientY)/geom().width*.65))}else if(mode==='flatten'){if(Math.hypot(p.x-drag.last.x,p.y-drag.last.y)>.012){addFlat(p);drag.last=p}}else if(mode==='light'){adjustLight(e)}else drag.last=p});function release(e){if(!drag||drag.id!==e.pointerId)return;if(mode==='mountain'||mode==='valley'){const p=drag.last,s=drag.start,dx=p.x-s.x,dy=p.y-s.y,len=Math.hypot(dx,dy);if(len>.03){creases.push({x:Math.max(0,Math.min(1,(s.x+p.x)/2)),y:Math.max(0,Math.min(1,(s.y+p.y)/2)),a:Math.atan2(dy,dx),len:Math.min(1.3,len),amp:(mode==='mountain'?1:-1)*(.05+Math.min(.1,len*.11))});if(creases.length>18)creases.shift()}}drag=null;dirty=true;sync()}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',e=>{drag=null;dirty=true});['mountain','valley','corner','flatten','light'].forEach(m=>document.getElementById(m).onclick=()=>{touch();setMode(m)});document.getElementById('paper').onclick=()=>{touch();paper=(paper+1)%papers.length;hint.textContent='换一张染色纸，同样的折痕有了不同的气息。'};document.getElementById('sun').onclick=e=>{touch();sun=!sun;e.currentTarget.setAttribute('aria-pressed',String(sun));hint.textContent=sun?'日光缓慢漫游，折痕的明暗逐渐变化。':'光停在当前方向。'};document.getElementById('blank').onclick=()=>{touch();remember();creases=[];flats=[];corners=[0,0,0,0];hint.textContent='一张平纸。从第一条山折或谷折开始。'};document.getElementById('undo').onclick=()=>{touch();if(history.length){const s=JSON.parse(history.pop());creases=s.creases;flats=s.flats;corners=s.corners}hint.textContent='退回上一次折、抓或熨的动作。'};document.getElementById('reset').onclick=()=>{touch();resets++;reset()};function polygon(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}function render(){frames++;ctx.fillStyle='#dce5e1';ctx.fillRect(0,0,W,H);const g=geom(),b=papers[paper],lx=Math.cos(lightAngle),ly=Math.sin(lightAngle),lz=lightHeight;const len=Math.hypot(lx,ly,lz),L=[lx/len,ly/len,lz/len];const bounds=[[0,0],[1,0],[1,1],[0,1]].map(([u,v])=>project(u,v,height(u,v)));ctx.save();ctx.translate(10,20);ctx.shadowColor='#43594932';ctx.shadowBlur=30;ctx.shadowOffsetX=-lx*12;ctx.shadowOffsetY=-ly*12;ctx.fillStyle='#66756631';polygon(bounds);ctx.fill();ctx.restore();const grid=[];for(let j=0;j<=NY;j++){grid[j]=[];for(let i=0;i<=NX;i++){const u=i/NX,v=j/NY,z=height(u,v);grid[j][i]={u,v,z,...project(u,v,z)}}}function tri(a,c,d){const ux=(c.u-a.u),uy=(c.v-a.v),uz=c.z-a.z,vx=d.u-a.u,vy=d.v-a.v,vz=d.z-a.z;let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const n=Math.hypot(nx,ny,nz);nx/=n;ny/=n;nz/=n;const lit=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]),shade=.65+lit*.36,ambient=1-Math.min(.07,Math.max(0,-(a.z+c.z+d.z)/3)*.45);ctx.fillStyle=`rgb(${Math.min(255,b[0]*shade*ambient)},${Math.min(255,b[1]*shade*ambient)},${Math.min(255,b[2]*shade*ambient)})`;ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.7;polygon([a,c,d]);ctx.fill();ctx.stroke()}for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const a=grid[j][i],b0=grid[j][i+1],c=grid[j+1][i+1],d=grid[j+1][i];tri(a,b0,c);tri(a,c,d)}ctx.save();polygon(bounds);ctx.clip();ctx.globalAlpha=.65;ctx.drawImage(paperTexture,g.cx-g.width*.57,g.cy-g.height*.65,g.width*1.14,g.height*1.3);ctx.restore();ctx.lineWidth=1;ctx.strokeStyle='#fffef58a';polygon(bounds);ctx.stroke();if(mode==='corner'){ctx.fillStyle='#8d927755';for(let i=0;i<4;i++){const c=cornerPos[i],p=project(c[0],c[1],height(...c));ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill()}}if(drag&&(mode==='mountain'||mode==='valley')){ctx.setLineDash([5,5]);ctx.lineWidth=1.5;ctx.strokeStyle=mode==='mountain'?'#886e45':'#4a766c';const a=project(drag.start.x,drag.start.y,height(drag.start.x,drag.start.y)),b0=project(drag.last.x,drag.last.y,height(drag.last.x,drag.last.y));ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b0.x,b0.y);ctx.stroke();ctx.setLineDash([])}const sunX=W-34,sunY=H*(W<560?.64:.7);ctx.strokeStyle='#839483';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sunX,sunY,12,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#c49a49';ctx.beginPath();ctx.arc(sunX+lx*12,sunY+ly*12,3.5,0,Math.PI*2);ctx.fill();sync();dirty=false}function tick(t){if(sun){lightAngle+=.003;dirty=true}if(t-last>32&&(dirty||sun)){render();last=t}requestAnimationFrame(tick)}window.addEventListener('resize',resize);noiseTexture();resize();reset();requestAnimationFrame(tick)})();
