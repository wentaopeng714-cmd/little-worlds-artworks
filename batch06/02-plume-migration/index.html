<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>羽焰迁徙 · 第六组</title><style>:root{--bg:#261c2c;--ink:#edc8b2;--accent:#ed976e;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>羽焰迁徙</h1><p>拖羽尖牵弯长羽，剪出持久航路；合羽把两群牵到一起，逆焰与迁徙重组羽流。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="羽焰迁徙，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="plume" id="plume">牵羽尖</button><button data-action="cut" id="cut">剪航路</button><button data-action="fuse" id="fuse">合羽群</button><button data-action="reverse" id="reverse">逆羽焰</button><button data-action="migrate" id="migrate">放迁徙</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=2;window.artMeta={"number": 2, "slug": "02-plume-migration", "title": "羽焰迁徙", "group": "F", "mothers": ["attraction_particles.html"], "description": "拖羽尖牵弯长羽，剪出持久航路；合羽把两群牵到一起，逆焰与迁徙重组羽流。", "ui": {"bg": "#261c2c", "ink": "#edc8b2", "accent": "#ed976e"}, "controls": [{"id": "plume", "label": "牵羽尖"}, {"id": "cut", "label": "剪航路"}, {"id": "fuse", "label": "合羽群"}, {"id": "reverse", "label": "逆羽焰"}, {"id": "migrate", "label": "放迁徙"}], "newMechanics": ["羽尖驱动整片羽形", "持久剪道与牵形组合", "近邻羽尖合群留下联羽丝", "定时迁徙改变基部"], "artDirection": ["宽窄变化长羽轮廓", "数百羽枝与密细轴丝", "暖灰紫底与铜红青碧羽焰"], "testPlan": [{"control": "plume", "from": [0.38, 0.14], "to": [0.5, 0.25], "hold": 650}, {"control": "cut", "from": [0.15, 0.5], "to": [0.8, 0.58], "hold": 700}, {"control": "fuse", "from": [0.58, 0.2], "to": [0.5, 0.25], "hold": 750}, {"control": "migrate", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 1500}], "stateFields": {"routes": "剪道后1以上", "joinedFlocks": "把相邻羽尖拖近后1以上", "migrating": "迁徙后true", "direction": "逆焰后-1"}};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,T=Math.PI*2,pal=['#ff934f','#ef5c88','#efcc7a','#42cbbb','#ac88ef'];let motes=[],trail=document.createElement('canvas'),tc=trail.getContext('2d'),flocks=[],cuts=[],links=[],mode='plume',drag=null,reverse=1,migration=0,merged=0;const R=n=>{let v=Math.sin(n*78.233+25.17)*43758.545;return v-Math.floor(v)};function reset(){flocks=[{x:.16,y:.23,bx:.1,by:.91,col:0,bend:-.08},{x:.38,y:.14,bx:.28,by:.88,col:1,bend:.13},{x:.58,y:.2,bx:.55,by:.93,col:2,bend:-.1},{x:.79,y:.16,bx:.8,by:.9,col:3,bend:.08},{x:.9,y:.43,bx:.94,by:.91,col:4,bend:-.1}];cuts=[];links=[];mode='plume';drag=null;reverse=1;migration=0;merged=0;trail.width=e.W;trail.height=e.H;motes=Array.from({length:1600},(_,k)=>({j:k%5,u:R(k),v:(R(k+90)-.5)*1.8,speed:.04+R(k+200)*.09,prev:null}));}function movingPoint(p,t){let f=flocks[p.j],W=e.W,H=e.H,S=Math.min(W,H),dx=(f.x-f.bx)*W,dy=(f.y-f.by)*H,L=Math.hypot(dx,dy)||1,u=p.u,span=Math.pow(Math.sin(Math.PI*u),.72)*S*.14,bend=(f.bend+Math.sin(t*.6+p.j)*.025)*Math.sin(Math.PI*u)*S;return{x:f.bx*W+dx*u-dy/L*(bend+p.v*span),y:f.by*H+dy*u+dx/L*(bend+p.v*span)}}function advance(dt,t){if(trail.width!==Math.round(e.W)||trail.height!==Math.round(e.H)){trail.width=e.W;trail.height=e.H;motes.forEach(p=>p.prev=null)}tc.globalCompositeOperation='destination-out';tc.fillStyle='rgba(0,0,0,.03)';tc.fillRect(0,0,e.W,e.H);tc.globalCompositeOperation='source-over';for(let p of motes){let before=p.u;p.u=(p.u+dt*p.speed*reverse+1)%1;if(Math.abs(p.u-before)>.5){p.prev=null;if(links.length){let l=links[Math.floor(R(before+t)*links.length)];if(l.includes(p.j))p.j=l.find(j=>j!==p.j)}}let q=movingPoint(p,t),blocked=cuts.some(s=>s.some(a=>Math.hypot(a.x-q.x/e.W,a.y-q.y/e.H)<.023));if(blocked){p.v=e.clamp(p.v+dt*.25*Math.sign(p.v||1),-1.3,1.3);p.prev=null;continue}if(p.prev){tc.strokeStyle=pal[p.j];tc.globalAlpha=.4;tc.lineWidth=.55;tc.beginPath();tc.moveTo(p.prev.x,p.prev.y);tc.lineTo(q.x,q.y);tc.stroke()}p.prev=q}tc.globalAlpha=1;}function plume(f,j,t){let W=e.W,H=e.H,S=Math.min(W,H),tx=f.x*W,ty=f.y*H,bx=f.bx*W,by=f.by*H;let dx=tx-bx,dy=ty-by,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;const loc=(u,v)=>{let bend=(f.bend+Math.sin(t*.6+j)*.025)*Math.sin(Math.PI*u)*S,span=Math.pow(Math.sin(Math.PI*u),.72)*S*(.14+.025*Math.sin(j)),streak=v*span;return [bx+dx*u+nx*(bend+streak),by+dy*u+ny*(bend+streak)]};c.save();c.globalCompositeOperation='screen';for(let k=0;k<500;k++){let side=k%2?1:-1,u=(k/500)*.9+.05,sp=side*(.3+R(k+j*310)*.75);c.strokeStyle=pal[(k%29===0?(j+1):j)%5];c.globalAlpha=.2+R(k*7)*.3;c.lineWidth=.35+R(k+4)*.6;c.beginPath();for(let z=0;z<10;z++){let v=z/9,uu=u+v*.12*(reverse),p=loc(Math.min(.985,Math.max(.02,uu)),sp*v);z?c.lineTo(...p):c.moveTo(...p)}c.stroke();if(k%7===0){let p=loc(u+.07,sp*.85);c.globalAlpha=.5;c.fillStyle=pal[j];c.fillRect(p[0],p[1],1,.5)}}for(let k=0;k<90;k++){c.beginPath();for(let z=0;z<50;z++){let u=z/49,p=loc(u,(k-45)*.005);z?c.lineTo(...p):c.moveTo(...p)}c.globalAlpha=.2;c.strokeStyle=pal[j];c.lineWidth=.8;c.stroke()}c.restore();c.save();c.translate(tx,ty);c.rotate(Math.atan2(dy,dx));c.fillStyle=pal[j];c.globalAlpha=.55;c.beginPath();c.moveTo(12,0);c.lineTo(-10,-4);c.lineTo(-4,0);c.lineTo(-10,4);c.closePath();c.fill();c.restore()}
function draw(dt,t){const W=e.W,H=e.H;c.fillStyle='#191523';c.fillRect(0,0,W,H);let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#292332');g.addColorStop(.5,'#342027');g.addColorStop(1,'#121f28');c.fillStyle=g;c.fillRect(0,0,W,H);advance(dt,t);for(let k=0;k<350;k++){c.globalAlpha=.15;c.fillStyle=pal[k%5];c.fillRect(R(k)*W,R(k+400)*H,.5,2)}c.globalAlpha=1;if(migration>0){migration=Math.max(0,migration-dt);flocks.forEach((f,j)=>{f.bx=e.clamp(f.bx+dt*.016*Math.sin(t*.6+j),.02,.98);f.x=e.clamp(f.x+dt*.009*Math.sin(t*.4+j),.04,.96)})}for(let j=0;j<flocks.length;j++)plume(flocks[j],j,t);c.save();c.globalCompositeOperation='screen';c.drawImage(trail,0,0,W,H);c.restore();for(let l of links){let a=flocks[l[0]],b=flocks[l[1]];c.strokeStyle='#ebbba5';c.globalAlpha=.45;for(let k=0;k<24;k++){c.beginPath();c.moveTo(a.x*W,a.y*H);c.quadraticCurveTo((a.x+b.x)*W*.5,(a.y+b.y)*H*.5+Math.sin(k)*30,b.x*W,b.y*H);c.stroke()}}c.globalAlpha=1;for(let s of cuts){c.strokeStyle='#191523';c.lineWidth=Math.min(W,H)*.055;c.lineCap='round';c.beginPath();s.forEach((p,i)=>i?c.lineTo(p.x*W,p.y*H):c.moveTo(p.x*W,p.y*H));c.stroke();c.strokeStyle='#bb7e5d';c.globalAlpha=.5;c.lineWidth=.7;c.setLineDash([2,5]);c.stroke();c.setLineDash([]);c.globalAlpha=1}c.font='10px system-ui';c.fillStyle='#b498a0';c.fillText('长羽可以牵弯，剪开的航路会一直保留',18,H-18)}
function near(x,y){let n=0,d=Infinity;flocks.forEach((f,i)=>{let v=Math.hypot(f.x-x,f.y-y);if(v<d){d=v;n=i}});return n}function input(kind,p){let x=p.x/e.W,y=p.y/e.H;if(kind==='down'){if(mode==='cut'){cuts.push([{x,y}]);if(cuts.length>10)cuts.shift();drag={cut:cuts[cuts.length-1]}}else drag={i:near(x,y),x,y};}else if(kind==='move'&&drag){if(drag.cut){if(drag.cut.length<90)drag.cut.push({x,y})}else{let f=flocks[drag.i];f.x=e.clamp(x,.04,.96);f.y=e.clamp(y,.03,.89);f.bend+=(x-drag.x)*.2;drag.x=x;drag.y=y;if(mode==='fuse'){flocks.forEach((b,j)=>{if(j!==drag.i&&Math.hypot(b.x-x,b.y-y)<.12&&!links.some(l=>l.includes(j)&&l.includes(drag.i))){links.push([j,drag.i]);b.x=f.x-.02;b.y=f.y+.03;merged++;artAudio.fx(2,.8)}})}}}else if(kind==='up'||kind==='cancel')drag=null}function action(id){if(id==='reverse'){reverse*=-1;flocks.forEach(f=>f.bend*=-1)}else if(id==='migrate'){migration=18}else mode=id}function state(){return{bounded:true,status:({plume:'拖亮羽尖：长羽火焰整片弯曲',cut:'拖出暗航路：剪开密羽，再牵尖绕路',fuse:'把一个羽尖拖到另一个羽尖旁，两个彩羽群连结'})[mode]+' · 联羽 '+links.length+' / 剪道 '+cuts.length+(migration>0?' · 正在迁徙':''),mode,flocks:flocks.length,routes:cuts.length,joinedFlocks:links.length,merged,direction:reverse,migrating:migration>0,trajectoryParticles:motes.length}}return{reset,draw,input,action,state}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
