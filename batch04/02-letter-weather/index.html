*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5edda;color:#292923;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}#art{position:fixed;inset:0;width:100%;height:100%;touch-action:none}button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}.mast{position:absolute;z-index:2;left:6vw;top:max(28px,env(safe-area-inset-top));pointer-events:none}.mast .eyebrow{font-size:10px;letter-spacing:.22em;font-weight:700}.mast h1{font-family:ui-serif,"Songti SC",serif;font-weight:400;font-size:clamp(55px,7vw,100px);letter-spacing:.05em;line-height:1;margin:20px 0 13px}.mast p{font-size:12px;line-height:1.7;width:235px;opacity:.8}.folio{position:absolute;right:6vw;top:30px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.13em}.weather-note{position:absolute;right:6vw;top:85px;writing-mode:vertical-rl;font-size:11px;letter-spacing:.17em;pointer-events:none}.controls{position:absolute;z-index:3;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 28px));display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}.tools{display:flex;gap:1px;background:#292923;border:1px solid #292923;border-radius:6px;overflow:hidden}.tools button{border:0;background:#f4e8be;min-width:76px;height:46px;padding:0 12px;font-size:12px;font-weight:600}.tools button[aria-pressed=true]{background:#355971;color:#fff7e1}.tools button:hover{background:#edcc58}.tools button:active{background:#d4ae38}.extra{display:flex;gap:5px}.extra button{min-width:44px;height:44px;padding:0 12px;border:1px solid #29292330;border-radius:6px;background:#faf5e6e8;font-size:11px}#weather{background:#e75937;color:#fff8e8;border-color:#e75937}#mute{cursor:default;opacity:.65}.hint{width:100%;text-align:center;font-size:10px;min-height:16px;line-height:1.5;letter-spacing:.02em}button:focus-visible{outline:2px solid #e75937;outline-offset:3px}@media(max-width:700px){.mast{left:25px;top:28px}.mast h1{font-size:62px}.mast p{font-size:11px;max-width:180px}.folio{right:24px}.weather-note{top:90px;right:26px}.controls{bottom:max(16px,env(safe-area-inset-bottom));gap:7px}.tools{width:100%;justify-content:center}.tools button{flex:1}.extra{width:100%;justify-content:center;gap:4px}.extra button{padding:0 6px;font-size:10px;min-width:44px}.extra{gap:3px}.tools button{min-width:65px;padding:0 6px}.sound-status{font-size:10px;padding:0 3px}.hint{max-width:340px}.mast h1{margin-top:18px}}
.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:auto;white-space:nowrap;border:1px solid currentColor;background:none;cursor:pointer;}</style></head><body><canvas id="art" aria-label="字雨、可移动旋转挡板与可拖动固定的文字"></canvas><header class="mast"><div class="eyebrow">LITTLE WORLDS / 02</div><h1>字雨</h1><p>有些字落下，有些字停留。<br>接住它们，摆成你自己的天气。</p></header><div class="folio">LETTER WEATHER</div><div class="weather-note" id="weather-note">微 雨 · 轻 风</div><nav class="controls" aria-label="字雨操作"><div class="tools"><button id="add-board">＋ 挡板</button><button id="add-umbrella">＋ 雨伞</button><button id="add-bowl">＋ 接字槽</button><button id="wind-path" aria-pressed="false">画风轨</button></div><div class="extra"><button id="rotate">转 15°</button><button id="weather">微雨</button><button id="letters">换字</button><button id="compose">排字</button><button id="release">放飞</button><button id="reset">重置</button><button id="mute" class="sound-status" type="button" aria-pressed="false">声音 · 点按启用</button></div><div class="hint" id="hint" aria-live="polite">拖物件、转圆点；接字槽会蓄字。试试阵雨 → 排字 → 放飞。</div></nav><div id="qa" hidden data-frames="0" data-inputs="0" data-resets="0" data-audio="none" data-bounded="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false}),qa=document.getElementById('qa');
let W=innerWidth,H=innerHeight,dpr=1,letters=[],boards=[],tracks=[],selected=null,pointer=null,frames=0,inputs=0,resets=0,last=0,time=0,spawnTime=0,weather=0,wordIndex=0,composeIndex=0,flowMode=false,burst=0,eventTime=0,lastDT=.016,collisions=0,captures=0;
const words=['雨RAIN','PLAY','想象','SLOW'],MAX=240,MAXBOARDS=8,MAXTRACKS=6,MAXPINNED=64,TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),hint=t=>document.getElementById('hint').textContent=t;
function sound(kind,energy,x=W*.5,y=H*.5,throttle=0){const now=performance.now();if(throttle&&now-eventTime<throttle)return;eventTime=now;window.dispatchEvent(new CustomEvent('art-sound',{detail:{kind,energy:clamp(energy,0,1),x:clamp(x/W,0,1),y:clamp(y/H,0,1)}}));}
let grain=document.createElement('canvas');grain.width=grain.height=160;const gc=grain.getContext('2d');for(let i=0;i<4500;i++){gc.globalAlpha=rnd(.025,.065);gc.fillStyle='#675c40';gc.fillRect(rnd(0,160),rnd(0,160),1,1)}const texture=ctx.createPattern(grain,'repeat');
function resize(){const ow=W,oh=H;W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(ow&&oh){for(const a of letters){a.x*=W/ow;a.y*=H/oh;}for(const a of boards){a.x*=W/ow;a.y*=H/oh;a.size*=Math.min(W/ow,H/oh)}for(const t of tracks)for(const q of t.points){q.x*=W/ow;q.y*=H/oh}}}resize();
function glyph(x,y,i){const chars=[...words[wordIndex]],s=rnd(W<650?17:22,W<650?26:35);return{x,y,vx:rnd(-15,15),vy:rnd(35,80),s,r:s*.39,a:rnd(-.15,.15),spin:rnd(-.6,.6),text:chars[((i%chars.length)+chars.length)%chars.length],color:i%7===0?'#d95131':'#292923',pinned:false,capture:null,age:0,px:x,py:y};}
function addBoard(type,x,y){const sz=type==='umbrella'?Math.min(W*.29,190):type==='bowl'?Math.min(W*.36,240):Math.min(W*.41,270);const b={type,x,y,size:sz,a:type==='bar'?-Math.PI/9:0,color:type==='bar'?'#d94d30':type==='bowl'?'#355971':'#ddba45',flash:0};boards.push(b);if(boards.length>MAXBOARDS){const old=boards.shift();for(const l of letters)if(l.capture===old){l.capture=null;l.vy=90}}selected=b;return b;}
function reset(){letters=[];boards=[];tracks=[];pointer=null;weather=0;wordIndex=0;composeIndex=0;spawnTime=0;burst=0;flowMode=false;document.getElementById('wind-path').setAttribute('aria-pressed','false');document.getElementById('weather').textContent='微雨';document.getElementById('weather-note').textContent='微 雨 · 轻 风';addBoard('umbrella',W*.69,H*.36);addBoard('bar',W*.46,H*.54);addBoard('bowl',W*.62,H*.72);selected=boards[1];for(let i=0;i<(W<650?48:85);i++)letters.push(glyph(rnd(W<650?W*.54:W*.34,W*.88),rnd(-H*.1,H*.67),i));resets++;qa.dataset.resets=resets;hint('拖物件、转圆点；接字槽会蓄字。试试阵雨 → 排字 → 放飞。');updateQA();}
function updateQA(){qa.dataset.frames=frames;qa.dataset.inputs=inputs;qa.dataset.objects=letters.length+boards.length+tracks.length;qa.dataset.cap=MAX+MAXBOARDS+MAXTRACKS;qa.dataset.letters=letters.length;qa.dataset.boards=boards.length;qa.dataset.pinned=letters.filter(l=>l.pinned).length;qa.dataset.captured=letters.filter(l=>l.capture).length;qa.dataset.tracks=tracks.length;qa.dataset.collisions=collisions;qa.dataset.captures=captures;qa.dataset.weather=weather;qa.dataset.burst=burst.toFixed(2);qa.dataset.bounded=String(letters.length<=MAX&&boards.length<=MAXBOARDS&&tracks.length<=MAXTRACKS&&letters.filter(l=>l.pinned).length<=MAXPINNED);}
function pushLetter(l){if(letters.length>=MAX){const i=letters.findIndex(x=>!x.pinned&&!x.capture);if(i>=0)letters.splice(i,1);else return false;}letters.push(l);return true;}
function pin(l){const pins=letters.filter(q=>q.pinned&&q!==l);if(pins.length>=MAXPINNED){pins[0].pinned=false;pins[0].vy=80;}l.pinned=true;l.capture=null;l.vx=l.vy=0;l.a=0;}
for(const [id,type]of[['add-board','bar'],['add-umbrella','umbrella'],['add-bowl','bowl']])document.getElementById(id).onclick=()=>{const b=addBoard(type,rnd(W*.32,W*.78),rnd(H*.37,H*.64));inputs++;sound('place',.55,b.x,b.y);hint('拖到字流下方；转动斜面改变方向。接字槽最多接24枚字。');updateQA();};
document.getElementById('rotate').onclick=()=>{if(selected){selected.a+=Math.PI/12;selected.flash=.7;sound('rotate',.42,selected.x,selected.y)}inputs++;};
document.getElementById('wind-path').onclick=()=>{flowMode=!flowMode;document.getElementById('wind-path').setAttribute('aria-pressed',String(flowMode));inputs++;sound('tool',.25);hint(flowMode?'在纸面拖一笔风轨：字会沿线疾行。再点“画风轨”返回拖物件。':'现在可以拖物件或拖字。已经画出的风轨会继续导流。');};
document.getElementById('weather').onclick=()=>{weather=(weather+1)%3;document.getElementById('weather').textContent=['微雨','阵雨','逆风'][weather];document.getElementById('weather-note').textContent=['微 雨 · 轻 风','阵 雨 · 密 集','逆 风 · 翻 页'][weather];for(const l of letters)if(!l.pinned&&!l.capture){l.vx=weather===2?-160:weather===1?100:10;l.vy=weather===2?-230:weather===1?220:55;l.spin=weather===2?rnd(-3,3):rnd(-.7,.7)}if(weather===1)for(let i=0;i<60;i++){const l=glyph(rnd(W*.35,W*.96),rnd(-100,H*.35),i);l.vy=rnd(160,240);pushLetter(l)}inputs++;sound('weather',weather===0?.3:.8);hint(['微雨，轻轻落。旋转挡板让字从两端滑落。','阵雨来了：字流更密、更快。用接字槽蓄成一片字阵。','逆风把纸页翻起。放飞接住的字，整片排版会向上散开。'][weather]);};
document.getElementById('letters').onclick=()=>{wordIndex=(wordIndex+1)%words.length;for(let i=0;i<22;i++)pushLetter(glyph(rnd(W<650?W*.54:W*.34,W*.9),rnd(-65,H*.24),i));inputs++;sound('letters',.55);hint('现在落下：'+words[wordIndex]+'。点“排字”排成持久字阵，再逐字拖改。');};
document.getElementById('compose').onclick=()=>{for(const l of letters)if(l.pinned){l.pinned=false;l.vy=-60;l.capture=null;}const chars=[...words[wordIndex]],rows=W<650?4:3,cols=W<650?6:10,startX=W*.2,endX=W*.84,gap=(endX-startX)/(cols-1),baseY=H*.37,rowGap=Math.min(H*.083,W<650?53:77),sz=Math.min(W<650?31:49,gap*.85);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=startX+c*gap+(composeIndex%2?r*gap*.16:0),y=baseY+r*rowGap+(composeIndex%2?(c%3)*rowGap*.18:0);const l=glyph(x,y,c+r*cols);l.text=chars[c%chars.length];l.s=sz;l.r=sz*.39;l.color=(r+c)%7===0?'#d95131':'#292923';pin(l);pushLetter(l);}composeIndex++;inputs++;sound('compose',.8);hint('字阵已经留下。拖动任意字改排版；雨仍会绕着它落。再点排字换阶梯构图。');updateQA();};
document.getElementById('release').onclick=()=>{burst=3.4;for(const l of letters){l.pinned=false;l.capture=null;l.age=0;const dx=(l.x-W*.5)/Math.max(W*.25,1);l.vx=dx*180+rnd(-70,70);l.vy=-rnd(230,430);l.spin=rnd(-3.4,3.4);}for(const b of boards)b.flash=.9;inputs++;sound('release',1);hint('把整页字放飞。它们会抬升、散开，再回到新的天气里。');updateQA();};
document.getElementById('reset').onclick=()=>{reset();inputs++;sound('reset',.4);};
function local(b,x,y){const dx=x-b.x,dy=y-b.y;return{x:dx*Math.cos(b.a)+dy*Math.sin(b.a),y:-dx*Math.sin(b.a)+dy*Math.cos(b.a)}}function world(b,x,y){return{x:b.x+x*Math.cos(b.a)-y*Math.sin(b.a),y:b.y+x*Math.sin(b.a)+y*Math.cos(b.a)}}function handle(b){return world(b,b.size*.6,0)}
function segments(b){const s=b.size;if(b.type==='bar')return[[-s/2,0,s/2,0]];if(b.type==='bowl')return[[-s/2,-s*.22,-s*.38,s*.15],[-s*.38,s*.15,s*.38,s*.15],[s*.38,s*.15,s/2,-s*.22]];const out=[];for(let i=0;i<10;i++){const a=Math.PI+i*Math.PI/10,c=Math.PI+(i+1)*Math.PI/10;out.push([Math.cos(a)*s*.5,Math.sin(a)*s*.31,Math.cos(c)*s*.5,Math.sin(c)*s*.31])}return out;}
function boardHit(b,p){const q=local(b,p.x,p.y),s=b.size;return Math.abs(q.x)<s*.56&&q.y>(b.type==='umbrella'?-s*.35:-s*.25)&&q.y<s*.32;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p={x:e.clientX,y:e.clientY};inputs++;sound(flowMode?'wind':'pick',.35,p.x,p.y);if(flowMode){const t={points:[p],life:25};tracks.push(t);if(tracks.length>MAXTRACKS)tracks.shift();pointer={id:e.pointerId,type:'track',item:t};return;}if(selected){const h=handle(selected);if(Math.hypot(p.x-h.x,p.y-h.y)<24){pointer={id:e.pointerId,type:'rotate',item:selected,startAngle:Math.atan2(p.y-selected.y,p.x-selected.x),a:selected.a};return;}}const l=letters.slice().reverse().find(l=>Math.hypot(p.x-l.x,p.y-l.y)<l.s*.65),b=boards.slice().reverse().find(b=>boardHit(b,p));if(l&&(!b||l.pinned||l.capture)){pin(l);pointer={id:e.pointerId,type:'letter',item:l,dx:p.x-l.x,dy:p.y-l.y};hint('这个字留下了。继续拖几枚重排；固定字会挡开新的字雨。');}else if(b){selected=b;pointer={id:e.pointerId,type:'board',item:b,dx:p.x-b.x,dy:p.y-b.y,lastX:p.x,lastY:p.y};}else{const n=glyph(p.x,p.y,letters.filter(l=>l.pinned).length);pin(n);pushLetter(n);pointer={id:e.pointerId,type:'letter',item:n,dx:0,dy:0};}updateQA();});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p={x:e.clientX,y:e.clientY},o=pointer.item;inputs++;if(pointer.type==='track'){const a=o.points[o.points.length-1];if(Math.hypot(p.x-a.x,p.y-a.y)>7){o.points.push(p);if(o.points.length>48)o.points.splice(1,1);}sound('wind',.45,p.x,p.y,110);}else if(pointer.type==='rotate'){o.a=pointer.a+Math.atan2(p.y-o.y,p.x-o.x)-pointer.startAngle;o.flash=.3;sound('rotate',.35,p.x,p.y,110);}else{const oldX=o.x,oldY=o.y;o.x=clamp(p.x-pointer.dx,16,W-16);o.y=clamp(p.y-pointer.dy,14,H-150);if(pointer.type==='letter')o.a=0;else{const dx=o.x-oldX,dy=o.y-oldY;for(const l of letters)if(!l.pinned&&!l.capture&&Math.hypot(l.x-o.x,l.y-o.y)<o.size*.7){l.vx+=dx*7;l.vy+=dy*7;}o.flash=.3;}sound(pointer.type==='letter'?'type':'move',.3,p.x,p.y,100);}updateQA();});
function end(e){if(pointer&&pointer.id===e.pointerId){sound(pointer.type==='track'?'wind-end':'drop',.42,e.clientX,e.clientY);pointer=null;updateQA();}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);window.addEventListener('resize',resize);
function captureInBowl(l,b){if(b.type!=='bowl'||l.capture||l.pinned||burst>0||l.vy<0)return false;const q=local(b,l.x,l.y),n=letters.filter(o=>o.capture===b).length;if(n>=24||Math.abs(q.x)>b.size*.34||q.y<-b.size*.24||q.y>b.size*.18)return false;l.capture=b;const occupied=new Set(letters.filter(o=>o.capture===b&&o!==l).map(o=>o.slot));l.slot=0;while(occupied.has(l.slot))l.slot++;l.age=0;l.vx=l.vy=0;l.s=Math.min(b.size*.105,W<650?21:29);l.r=l.s*.39;b.flash=.8;captures++;sound('catch',.38,l.x,l.y,140);return true;}
function capturedPlace(l){const b=l.capture,col=l.slot%6,row=Math.floor(l.slot/6),p=world(b,(col-2.5)*b.size*.118,b.size*.115-l.s*.55-row*l.s*1.06);l.x=p.x;l.y=p.y;l.a=b.a;}
function collide(l,b){if(captureInBowl(l,b))return;let q=local(b,l.x,l.y);const cs=Math.cos(b.a),sn=Math.sin(b.a);for(const [x1,y1,x2,y2]of segments(b)){const dx=x2-x1,dy=y2-y1,t=clamp(((q.x-x1)*dx+(q.y-y1)*dy)/(dx*dx+dy*dy),0,1),cx=x1+t*dx,cy=y1+t*dy;let nx=q.x-cx,ny=q.y-cy,d=Math.hypot(nx,ny),limit=l.r+4;if(d<limit){if(d<.001){nx=0;ny=-1;d=1;}else{nx/=d;ny/=d;}const wx=nx*cs-ny*sn,wy=nx*sn+ny*cs;l.x+=wx*(limit-d);l.y+=wy*(limit-d);const dot=l.vx*wx+l.vy*wy;if(dot<0){l.vx-=dot*1.18*wx;l.vy-=dot*1.18*wy;if(b.type==='bar'){const downhill=Math.sin(b.a),v=(weather===1?260:180)*downhill;const vt=l.vx*cs+l.vy*sn;l.vx+=(v-vt)*.32*cs;l.vy+=(v-vt)*.32*sn;l.spin+=downhill*.3;}else{l.vx*=.88;l.vy*=.88;}collisions++;if(Math.abs(dot)>35)sound('collision',Math.abs(dot)/370,l.x,l.y,200);}q=local(b,l.x,l.y);}}}
function letterContacts(){const cell=54;for(let pass=0;pass<2;pass++){const grid=new Map();for(const l of letters){if(l.capture)continue;const gx=Math.floor(l.x/cell),gy=Math.floor(l.y/cell);for(let yy=gy-1;yy<=gy+1;yy++)for(let xx=gx-1;xx<=gx+1;xx++){const near=grid.get(xx+','+yy);if(!near)continue;for(const o of near){if(l.pinned&&o.pinned)continue;let dx=l.x-o.x,dy=l.y-o.y,d=Math.hypot(dx,dy),min=l.r+o.r;if(d>=min)continue;if(d<.01){dx=.01;dy=0;d=.01;}const nx=dx/d,ny=dy/d,overlap=min-d,wl=l.pinned?0:o.pinned?1:.5,wo=o.pinned?0:l.pinned?1:.5;l.x+=nx*overlap*wl;l.y+=ny*overlap*wl;o.x-=nx*overlap*wo;o.y-=ny*overlap*wo;const dot=(l.vx-o.vx)*nx+(l.vy-o.vy)*ny;if(dot<0){l.vx-=dot*nx*wl*1.08;l.vy-=dot*ny*wl*1.08;o.vx+=dot*nx*wo*1.08;o.vy+=dot*ny*wo*1.08;}}}const key=gx+','+gy;if(!grid.has(key))grid.set(key,[]);grid.get(key).push(l);}}}
function guide(l,dt){for(const t of tracks){let best=1e9,tx=0,ty=0;for(let i=1;i<t.points.length;i++){const a=t.points[i-1],b=t.points[i],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<1)continue;const f=clamp(((l.x-a.x)*dx+(l.y-a.y)*dy)/(len*len),0,1),x=a.x+f*dx,y=a.y+f*dy,d=Math.hypot(l.x-x,l.y-y);if(d<best){best=d;tx=dx/len;ty=dy/len;}}const radius=W<650?45:72;if(best<radius){const strength=(1-best/radius)*Math.min(t.life/4,1);l.vx+=(tx*290-l.vx)*strength*dt*8;l.vy+=(ty*290-l.vy)*strength*dt*8;l.spin*=.97;}}}

function draw(){ctx.fillStyle='#f5edda';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#9b8e6723';ctx.lineWidth=1;for(let x=W*.29;x<W*.95;x+=W*.15){ctx.beginPath();ctx.moveTo(x,25);ctx.lineTo(x,H-155);ctx.stroke();}ctx.save();ctx.fillStyle='#dbb947';ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(W*.8,H*.21,Math.min(W,H)*.067,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#d65435';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(W*.8,H*.21,Math.min(W,H)*.084,.8,4.95);ctx.stroke();ctx.restore();ctx.save();ctx.translate(W*.09,H*.65);ctx.rotate(-Math.PI/2);ctx.fillStyle='#807357';ctx.font='10px ui-monospace,monospace';ctx.fillText('TYPE / GRAVITY / WIND',0,0);ctx.restore();if(weather!==0||burst>0){ctx.strokeStyle=weather===2?'#35597123':'#d6543520';ctx.lineWidth=.9;for(let i=0;i<24;i++){const x=((i*97+time*(weather===2?-115:70))%(W*.85)+W*.85)%(W*.85)+W*.12,y=((i*63+time*(weather===2?-130:180))%(H*.68)+H*.68)%(H*.68)+H*.17;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(weather===2?-25:12),y+(weather===2?-38:35));ctx.stroke();}}for(const t of tracks){if(t.points.length<2)continue;ctx.save();ctx.globalAlpha=Math.min(1,t.life/4)*.55;ctx.strokeStyle='#355971';ctx.lineWidth=1.6;ctx.setLineDash([5,4]);ctx.beginPath();for(let i=0;i<t.points.length;i++){const p=t.points[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.stroke();ctx.setLineDash([]);for(let i=2;i<t.points.length;i+=4){const a=t.points[i-1],b=t.points[i],ang=Math.atan2(b.y-a.y,b.x-a.x);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(-6,-3);ctx.lineTo(0,0);ctx.lineTo(-6,3);ctx.stroke();ctx.restore();}ctx.restore();}for(const b of boards)drawBoard(b);for(const l of letters){if(l.y>H-148||(!l.pinned&&l.x<(W<650?210:365)&&l.y<225))continue;if(!l.pinned&&!l.capture&&(weather===1||weather===2||burst>0)){ctx.strokeStyle=l.color+'28';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x-l.vx*.045,l.y-l.vy*.045);ctx.stroke();}ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.a);ctx.font=(l.pinned?'600 ':l.color==='#d95131'?'650 ':'450 ')+l.s+'px ui-sans-serif,system-ui,"PingFang SC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=l.color;if(l.pinned){ctx.fillStyle='#ebd48320';ctx.fillRect(-l.s*.56,-l.s*.6,l.s*1.12,l.s*1.3);ctx.strokeStyle='#d7bc64';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(-l.s*.48,l.s*.65);ctx.lineTo(l.s*.48,l.s*.65);ctx.stroke();ctx.fillStyle=l.color;}ctx.fillText(l.text,0,0);ctx.restore();}ctx.fillStyle=texture;ctx.fillRect(0,0,W,H);}
function tick(now){const dt=Math.min((now-last)/1000||.016,.035);last=now;lastDT=dt;update(dt);draw();frames++;if(frames%15===0)updateQA();requestAnimationFrame(tick);}reset();resets=0;qa.dataset.resets='0';requestAnimationFrame(tick);

</script><script id="material-audio">/* Original procedural material sounds. No recordings or external resources. */
(()=>{'use strict';
const profile=1, C=window.AudioContext||window.webkitAudioContext;
const configurations=[

 ['noise',1100,.22,'纸响 / 折页'],['sine',880,.3,'玻璃 / 拼接'],
 ['noise',620,.2,'纱摩擦 / 拉幅'],['noise',370,.23,'折纸 / 压痕'],
 ['triangle',190,.16,'刻版 / 隆起'],['sine',340,.25,'菌纹 / 生长'],

];
const config=configurations[profile],button=document.querySelector('#mute'),qa=document.querySelector('#qa');

const source=config[0]==='noise'?ctx.createBufferSource():ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain(),pan=ctx.createStereoPanner(),duration=config[2]+energy*.14;const pitch=config[1]*Math.pow(2,((hash%7)-3)/12)*(1.1-y*.25);

gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.12+energy*.2,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);pan.pan.value=(x-.5)*1.25;source.connect(filter);filter.connect(gain);gain.connect(pan);pan.connect(master);const v={source,nodes:[source,filter,gain,pan],done:false};voices.push(v);created+=4;peakVoices=Math.max(peakVoices,voices.length);source.onended=()=>clean(v);source.start(t);source.stop(t+duration+.02);events++;ui();}
function position(e){const r=document.querySelector('#art').getBoundingClientRect();return{x:(e.clientX-r.x)/r.width,y:(e.clientY-r.y)/r.height};}

document.addEventListener('keydown',e=>{if(e.isTrusted&&['Enter',' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))unlock(e).then(()=>{if(!['mute','reset'].includes(e.target.id))note({kind:e.target.id||'key',energy:.25});});},true);

document.querySelector('#reset')?.addEventListener('click',()=>{stop();ui();});
function pause(){paused=true;stop();if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(0,ctx.currentTime);ctx.suspend().catch(()=>errors++);}ui();}

window.artAudio=Object.freeze({snapshot(){let rms=null,peak=null;if(analyser){const wave=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(wave);let sum=0;peak=0;for(const n of wave){sum+=n*n;peak=Math.max(peak,Math.abs(n));}rms=Math.sqrt(sum/wave.length);}return{profile:config[3],state:ctx?.state||'not-created',unlocked,muted,paused,rms,peak,voices:voices.length,peakVoices,nodeCount:ctx?2+voices.length*4:0,nodeCap:26,createdNodes:created,releasedNodes:ended,events,gestureCount,errors};}});ui();
})();
