<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>纱间 · 织屏摩尔纹</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eedf;color:#253d42;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}#art{display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab}.head{position:absolute;left:28px;top:24px;pointer-events:none}h1{font-size:30px;font-weight:500;letter-spacing:.22em;margin:0 0 8px}.sub{font-size:11px;letter-spacing:.13em;color:#536568}.number{position:absolute;right:28px;top:28px;font-size:11px;letter-spacing:.12em}.panel{position:absolute;left:50%;bottom:23px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:12px;background:rgba(249,247,237,.93);border:1px solid #d6ddd1;border-radius:20px;box-shadow:0 10px 35px #243e4410;backdrop-filter:blur(10px)}.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.row+.row{margin-top:6px}button{font:inherit;font-size:12px;color:#34565b;background:transparent;border:1px solid transparent;border-radius:11px;min-width:46px;min-height:44px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#284f58;color:#faf7e9}button.layer{border-color:#bccfc6}button:hover{border-color:#284f58}#hint{margin:9px 6px 1px;font-size:11px;text-align:center;min-height:16px;color:#5b6c69}.tag{position:absolute;bottom:210px;right:28px;writing-mode:vertical-rl;font-size:11px;letter-spacing:.25em;color:#667c77;pointer-events:none}@media(max-width:560px){.head{left:20px;top:23px}h1{font-size:25px}.number{right:18px}.panel{bottom:15px;width:calc(100% - 24px);padding:8px}.row{gap:2px}button{padding:8px 10px}.tag{right:17px;bottom:230px}}
.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body><canvas id="art" aria-label="三层纱网，可用手指拖动、旋转、梳理并掀起"></canvas><div class="head"><h1>纱间</h1><div class="sub">THREE SCREENS, ONE CHANGING FIELD</div></div><div class="number">05 / MATERIAL STUDIES</div><div class="tag">疏密之间，颜色会呼吸</div><div class="panel"><div class="row"><button class="layer" id="layer0" aria-pressed="true">青纱</button><button class="layer" id="layer1" aria-pressed="false">桃纱</button><button class="layer" id="layer2" aria-pressed="false">金纱</button></div><div class="row"><button id="move" aria-pressed="true">挪纱</button><button id="turn" aria-pressed="false">转纱</button><button id="comb" aria-pressed="false">梳曲</button><button id="lift" aria-pressed="false">掀纱</button></div><div class="row"><button id="palette">换染色</button><button id="undo">退一步</button><button id="pause" aria-pressed="false">停驻</button><button id="reset">重置</button><span id="sound-status" class="sound-status">无声作品</span></div><div id="hint">选一层纱，在画面里挪动；试试叠出更宽的波带。</div></div><div id="qa" hidden data-frames="0" data-inputs="0" data-resets="0" data-bounded="true" data-audio="none" data-cap="3 layers; 12 combs/layer; 8 apertures/layer; 24 undo states"></div><script>
(()=>{'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),qa=document.getElementById('qa'),hint=document.getElementById('hint');let W,H,D,selected=0,mode='move',paused=false,frames=0,inputs=0,resets=0,palette=0,layers=[],history=[],drag=null,clock=0;const T=1000,sets=[['#357a88','#d36866','#ae953c'],['#4b5783','#b16190','#58a699'],['#356c5e','#ce8553','#706daf']];function fresh(){return[{x:-.11,y:-.04,a:-.1,warp:[],holes:[]},{x:.08,y:.06,a:.052,warp:[],holes:[]},{x:.19,y:-.035,a:.19,warp:[],holes:[]}]}function sync(){qa.dataset.frames=frames;qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.audio='none';qa.dataset.bounded=String(layers.every(l=>l.warp.length<=12&&l.holes.length<=8)&&history.length<=24)}function touch(){inputs++;sync()}function save(){history.push(layers.map(({tex,...l})=>JSON.parse(JSON.stringify(l))));if(history.length>24)history.shift()}function makeTexture(l,i){const c=document.createElement('canvas');c.width=T;c.height=T;const g=c.getContext('2d'),col=sets[palette][i];g.fillStyle=col+'0d';g.fillRect(0,0,T,T);g.strokeStyle=col;g.lineWidth=1.12;g.globalAlpha=.79;const gap=i===0?5.5:i===1?5.7:7.2;for(let x=-70;x<T+70;x+=gap){g.beginPath();for(let y=0;y<=T;y+=10){let u=x+18*Math.sin(y/190+i*.8)+8*Math.cos(y/98+x/195);for(const w of l.warp){const dy=y-w.y,dx=x-w.x,r2=dx*dx+dy*dy;u+=w.amount*Math.exp(-r2/(2*w.r*w.r))}if(y===0)g.moveTo(u,y);else g.lineTo(u,y)}g.stroke()}g.globalAlpha=.14;g.lineWidth=.65;for(let y=0;y<T;y+=11){g.beginPath();g.moveTo(0,y);g.lineTo(T,y+6*Math.sin(y/67));g.stroke()}g.globalAlpha=.3;g.strokeStyle=col;g.lineWidth=1;g.strokeRect(.5,.5,T-1,T-1);l.tex=c}function reset(){layers=fresh();history=[];palette=0;selected=0;mode='move';paused=false;drag=null;layers.forEach(makeTexture);setMode('move');select(0);document.getElementById('pause').setAttribute('aria-pressed','false');document.getElementById('pause').textContent='停驻';sync()}function select(i){selected=i;for(let j=0;j<3;j++)document.getElementById('layer'+j).setAttribute('aria-pressed',String(j===i))}const help={move:'拖动选中的纱；一层的微小位移，会改变整片波纹。',turn:'绕画面中心拖动，转动选中的纱；慢慢试小角度。',comb:'横向梳过纱面，留下局部弯曲；可叠加十二处。',lift:'按住并拖动，掀开选中纱的一小片；留下透气的圆窗。'};function setMode(m){mode=m;['move','turn','comb','lift'].forEach(k=>document.getElementById(k).setAttribute('aria-pressed',String(k===m)));hint.textContent=help[m];canvas.style.cursor=m==='move'?'grab':'crosshair'}function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);drag=null}function geom(l){const sz=Math.min(W*.9,H*.68,650);return{sz,cx:W*.5+l.x*sz,cy:H*(W<560?.405:.46)+l.y*sz}}function local(p,l){const {sz,cx,cy}=geom(l),a=-l.a,dx=p.x-cx,dy=p.y-cy;return{x:(dx*Math.cos(a)-dy*Math.sin(a))/sz*T+T/2,y:(dx*Math.sin(a)+dy*Math.cos(a))/sz*T+T/2}}function point(e){return{x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);touch();save();const p=point(e),l=layers[selected],g=geom(l),q=local(p,l);drag={id:e.pointerId,start:p,last:p,ox:l.x,oy:l.y,oa:l.a,angle:Math.atan2(p.y-g.cy,p.x-g.cx),idx:-1};if(mode==='lift'){if(l.holes.length===8)l.holes.shift();l.holes.push({x:q.x,y:q.y,r:42});drag.idx=l.holes.length-1}if(mode==='comb'){if(l.warp.length===12)l.warp.shift();l.warp.push({x:q.x,y:q.y,r:170,amount:0});drag.idx=l.warp.length-1}});canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();touch();const p=point(e),l=layers[selected],g=geom(l);if(mode==='move'){l.x=Math.max(-.65,Math.min(.65,drag.ox+(p.x-drag.start.x)/g.sz));l.y=Math.max(-.4,Math.min(.45,drag.oy+(p.y-drag.start.y)/g.sz))}else if(mode==='turn'){l.a=drag.oa+Math.atan2(p.y-g.cy,p.x-g.cx)-drag.angle}else if(mode==='comb'){l.warp[drag.idx].amount=Math.max(-120,Math.min(120,(p.x-drag.start.x)/g.sz*T*.5));makeTexture(l,selected)}else if(mode==='lift'){const q=local(p,l),hole=l.holes[drag.idx];hole.x=q.x;hole.y=q.y;hole.r=Math.max(42,Math.min(150,42+Math.hypot(p.x-drag.start.x,p.y-drag.start.y)/g.sz*T*.25))}drag.last=p;sync()});function release(e){if(drag&&e.pointerId===drag.id){drag=null;sync()}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);for(let i=0;i<3;i++)document.getElementById('layer'+i).onclick=()=>{touch();drag=null;select(i)};['move','turn','comb','lift'].forEach(m=>document.getElementById(m).onclick=()=>{touch();drag=null;setMode(m)});document.getElementById('palette').onclick=()=>{touch();palette=(palette+1)%sets.length;layers.forEach(makeTexture);hint.textContent='纱的颜色变了；形状、角度和圆窗仍然保留。'};document.getElementById('undo').onclick=()=>{touch();if(history.length){layers=history.pop();layers.forEach(makeTexture)}hint.textContent='退回上一次画布操作。'};document.getElementById('pause').onclick=e=>{touch();paused=!paused;e.currentTarget.setAttribute('aria-pressed',String(paused));e.currentTarget.textContent=paused?'继续漂移':'停驻'};document.getElementById('reset').onclick=()=>{touch();resets++;reset()};function draw(){frames++;if(!paused)clock+=.002;ctx.clearRect(0,0,W,H);ctx.fillStyle='#f1eedf';ctx.fillRect(0,0,W,H);const sz=Math.min(W*.9,H*.68,650),cy=H*(W<560?.405:.46);ctx.fillStyle='#d9e6dd';ctx.beginPath();ctx.ellipse(W*.48,cy,sz*.61,sz*.47,-.12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4d6c6';ctx.fillRect(W*.5-sz*.43,cy-sz*.43,sz*.89,sz*.87);for(let i=0;i<3;i++){const l=layers[i],g=geom(l);ctx.save();ctx.translate(g.cx+Math.sin(clock+i)*2,g.cy+Math.cos(clock*.7+i)*1.6);ctx.rotate(l.a);ctx.scale(g.sz/T,g.sz/T);ctx.translate(-T/2,-T/2);ctx.beginPath();ctx.rect(0,0,T,T);for(const h of l.holes){ctx.moveTo(h.x+h.r,h.y);ctx.arc(h.x,h.y,h.r,0,Math.PI*2,true)}ctx.clip('evenodd');ctx.globalCompositeOperation='multiply';ctx.drawImage(l.tex,0,0);ctx.restore()}ctx.strokeStyle='#486e682c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W*.5-sz*.56,cy+sz*.53);ctx.lineTo(W*.5+sz*.56,cy+sz*.53);ctx.stroke();if(frames%20===0)sync();requestAnimationFrame(draw)}window.addEventListener('resize',resize);resize();reset();draw();})();
</script></body></html>
