<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>光的拼片 · Stained Glass</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d6;color:#304449;font-family:Georgia,"Songti SC",serif;overflow:hidden}header{height:84px;padding:18px 30px 10px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:27px;letter-spacing:5px}header p{font:11px system-ui;letter-spacing:2px;margin:6px 0 0;color:#717873}.number{font:12px system-ui;letter-spacing:2px}.studio{height:calc(100dvh - 232px);min-height:260px;padding:4px 30px 10px;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none;background:#e4ded0;border:1px solid #b6b4a2;cursor:grab}canvas:active{cursor:grabbing}footer{height:148px;padding:6px 25px 12px}.row{display:flex;gap:6px;justify-content:center;margin:0 0 7px;align-items:center}button{min-width:44px;min-height:44px;border:1px solid #a7aca0;background:#eee8db;color:#304449;padding:8px 12px;font:12px system-ui;cursor:pointer;border-radius:2px}button:hover,button[aria-pressed=true]{background:#30494d;color:#f5efdb}button:focus-visible{outline:3px solid #ba7961;outline-offset:2px}.label{font:11px system-ui;margin-right:2px;color:#72786f}#hint{font:11px system-ui;text-align:center;color:#68756c;line-height:17px}#sound-status{font-size:10px;min-width:58px;padding:5px}.note{position:absolute;bottom:17px;left:42px;pointer-events:none;font:11px system-ui;background:#e9e3d6dc;padding:5px 8px}#qa{display:none}@media(max-width:600px){header{height:76px;padding:14px 16px 9px}h1{font-size:23px;letter-spacing:3px}header p{font-size:10px;letter-spacing:1px}.number{font-size:10px}.studio{height:calc(100dvh - 251px);padding:5px 14px 9px}footer{height:175px;padding:5px 8px 10px}button{font-size:11px;padding:8px 8px}.row{gap:4px;margin-bottom:8px}.label{display:none}.note{left:22px;font-size:10px}#hint{font-size:10px;line-height:16px}#sound-status{font-size:9px;min-width:54px}}.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body><header><div><h1>光的拼片</h1><p>STAINED GLASS · 切开，再让光穿过去</p></div><div class="number">04 / 10<br><span style="font-size:10px;line-height:22px">玻璃与铅线</span></div></header><main class="studio"><canvas id="art" aria-label="选择玻璃片拖动，切片模式划线分片，拖动太阳改变折射光" tabindex="0"></canvas><div class="note">拖 ☼ 调光 · 分片后可以继续拼合</div></main><footer><div class="row"><span class="label">手艺</span><button id="arrange" aria-pressed="true">移片</button><button id="cut" aria-pressed="false">划线切片</button><button id="rotate">转动 15°</button><button id="weld">焊合邻片</button><button id="home">选片归位</button></div><div class="row"><span class="label">采光</span><button id="blue" aria-pressed="true">海蓝午光</button><button id="red" aria-pressed="false">石榴暮色</button><button id="green" aria-pressed="false">苔色清晨</button><button id="reset">重置</button><span id="sound-status" class="sound-status">无声作品</span></div><div id="hint" role="status">移片可拖动玻璃；切片需划过一片玻璃，再焊回或重组。</div></footer><div id="qa" data-frames="0" data-inputs="0" data-resets="0" data-audio="none" data-bounded="true" data-objects="30" data-cap="56"></div><script>
(()=>{'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),qa=document.getElementById('qa'),hint=document.getElementById('hint');let W=1,H=1,dpr=1,cells=[],selected=null,mode='arrange',palette='blue',sun={x:.88,y:.89},drag=null,frames=0,inputs=0,resets=0,nextId=1,grain=[];const CAP=56;const palettes={blue:['#237a91','#50a9ae','#e1b45e','#bc685d','#235561','#bad3b3','#e9cf87'],red:['#9e405a','#cc735c','#e2a66d','#496673','#71506f','#d4b786','#ecceac'],green:['#57785d','#84976a','#c5b177','#426b71','#a46951','#a9c0a1','#e0ce93']};function count(){qa.dataset.inputs=++inputs}function info(){qa.dataset.objects=cells.length;qa.dataset.bounded=String(cells.length<=CAP)}
function make(poly,c){return{id:nextId++,poly:poly.map(p=>({...p})),home:poly.map(p=>({...p})),c,seed:nextId*11}}function setup(){cells=[];nextId=1;let nodes=[];for(let y=0;y<=5;y++){nodes[y]=[];for(let x=0;x<=5;x++){nodes[y][x]={x:.105+x*.158+(x>0&&x<5?Math.sin(x*11+y*17)*.022:0),y:.095+y*.147+(y>0&&y<5?Math.cos(x*7+y*13)*.022:0)}}}for(let y=0;y<5;y++)for(let x=0;x<5;x++){let p=[nodes[y][x],nodes[y][x+1],nodes[y+1][x+1],nodes[y+1][x]],c=(x*3+y*2+(x===2&&y===2?2:0))%7;if((x+y)%4===1){cells.push(make([p[0],p[1],p[2]],c),make([p[0],p[2],p[3]],(c+1)%7))}else cells.push(make(p,c))}selected=null;sun={x:.88,y:.89};info()}
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);grain=[];let s=31;for(let i=0;i<650;i++){s=s*16807%2147483647;let x=s/2147483647*W;s=s*16807%2147483647;grain.push([x,s/2147483647*H,(i%6+1)*.17])}}
function centroid(p){return{x:p.reduce((s,a)=>s+a.x,0)/p.length,y:p.reduce((s,a)=>s+a.y,0)/p.length}}function path(p,dx=0,dy=0){let out=new Path2D();p.forEach((a,i)=>i?out.lineTo((a.x+dx)*W,(a.y+dy)*H):out.moveTo((a.x+dx)*W,(a.y+dy)*H));out.closePath();return out}function arch(){let p=new Path2D();p.moveTo(.09*W,.83*H);p.lineTo(.09*W,.36*H);p.bezierCurveTo(.09*W,.04*H,.91*W,.04*H,.91*W,.36*H);p.lineTo(.91*W,.83*H);p.closePath();return p}function alpha(hex,a){return hex+Math.round(a*255).toString(16).padStart(2,'0')}
function render(){qa.dataset.frames=++frames;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#e5dfd0';ctx.fillRect(0,0,W,H);let wall=ctx.createLinearGradient(0,0,W,H);wall.addColorStop(0,'#f2ede0');wall.addColorStop(1,'#cbd0bf');ctx.fillStyle=wall;ctx.fillRect(0,0,W,H);const colors=palettes[palette];for(const c of cells){let ctr=centroid(c.poly),dx=(ctr.x-sun.x)*.26,dy=.19+(ctr.y-sun.y)*.08;ctx.save();ctx.globalAlpha=.13;ctx.fillStyle=colors[c.c];ctx.fill(path(c.poly,dx,dy));ctx.restore()}ctx.fillStyle='#5d665414';for(const [x,y,s]of grain)ctx.fillRect(x,y,s,.5);const window=arch();ctx.save();ctx.shadowColor='#172e3640';ctx.shadowBlur=17;ctx.shadowOffsetY=5;ctx.fillStyle='#203b40';ctx.fill(window);ctx.restore();ctx.save();ctx.clip(window);for(const c of cells){let ctr=centroid(c.poly);let color=colors[c.c];let grad=ctx.createLinearGradient(sun.x*W,sun.y*H,ctr.x*W,ctr.y*H);grad.addColorStop(0,color);grad.addColorStop(.65,color);grad.addColorStop(1,alpha(color,.86));ctx.fillStyle=grad;ctx.fill(path(c.poly));ctx.save();ctx.clip(path(c.poly));ctx.fillStyle='#fff8dd0c';for(let j=0;j<9;j++){const xx=(ctr.x+(Math.sin(j*8+c.seed)*.09))*W,yy=(ctr.y+Math.cos(j*9+c.seed)*.08)*H;ctx.beginPath();ctx.ellipse(xx,yy,Math.min(W,H)*.035,Math.min(W,H)*.07,j*.7,0,Math.PI*2);ctx.fill()}let glow=ctx.createRadialGradient(sun.x*W,sun.y*H,0,sun.x*W,sun.y*H,Math.max(W,H)*.85);glow.addColorStop(0,'#ffffdd65');glow.addColorStop(1,'#001c3228');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.restore();ctx.strokeStyle='#233b42';ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke(path(c.poly));ctx.strokeStyle='#bcc4ab55';ctx.lineWidth=.7;ctx.stroke(path(c.poly));if(c===selected){ctx.strokeStyle='#fff9d5';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke(path(c.poly));ctx.setLineDash([])}}ctx.restore();ctx.strokeStyle='#334c4c';ctx.lineWidth=10;ctx.stroke(window);ctx.strokeStyle='#a7ac9466';ctx.lineWidth=1.3;ctx.stroke(window);ctx.fillStyle='#899a8999';ctx.fillRect(.066*W,.84*H,.868*W,.016*H);ctx.fillStyle='#617d7225';ctx.fillRect(.07*W,.856*H,.86*W,.012*H);const lx=sun.x*W,ly=sun.y*H;ctx.strokeStyle='#a5793e';ctx.fillStyle='#d4b465';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(lx,ly,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(lx,ly,17,0,Math.PI*2);ctx.stroke();for(let j=0;j<8;j++){let a=j*Math.PI/4;ctx.beginPath();ctx.moveTo(lx+Math.cos(a)*21,ly+Math.sin(a)*21);ctx.lineTo(lx+Math.cos(a)*25,ly+Math.sin(a)*25);ctx.stroke()}if(drag&&drag.kind==='cut'){ctx.strokeStyle='#ffefbc';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(drag.start.x*W,drag.start.y*H);ctx.lineTo(drag.last.x*W,drag.last.y*H);ctx.stroke();ctx.setLineDash([])}requestAnimationFrame(render)}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/W,y:(e.clientY-r.top)/H}}function hit(p){if(!ctx.isPointInPath(arch(),p.x*W*dpr,p.y*H*dpr))return null;for(let i=cells.length-1;i>=0;i--)if(ctx.isPointInPath(path(cells[i].poly),p.x*W*dpr,p.y*H*dpr))return cells[i];return null}
function clip(poly,a,b,side){let out=[];const value=p=>((b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x))*side;for(let i=0;i<poly.length;i++){let p=poly[i],q=poly[(i+1)%poly.length],vp=value(p),vq=value(q);if(vp>=-1e-9)out.push({...p});if((vp>1e-9&&vq< -1e-9)||(vp< -1e-9&&vq>1e-9)){let t=vp/(vp-vq);out.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t})}}return out}function area(poly){return Math.abs(poly.reduce((s,p,i)=>{let q=poly[(i+1)%poly.length];return s+p.x*q.y-q.x*p.y},0))/2}
function split(a,b){if(Math.hypot((b.x-a.x)*W,(b.y-a.y)*H)<24){hint.textContent='把切线划长一点，跨过玻璃边缘。';return}let changed=0,all=[];for(const c of cells){let p=clip(c.poly,a,b,1),q=clip(c.poly,a,b,-1);if(p.length>=3&&q.length>=3&&area(p)>.0005&&area(q)>.0005&&cells.length+changed<CAP){all.push(make(p,c.c),make(q,(c.c+1)%7));changed++}else all.push(c)}cells=all;selected=null;info();hint.textContent=changed?'切出 '+changed+' 道铅线。切换移片，试着拼走一块。':cells.length>=CAP?'已到 56 片上限；焊合一些玻璃后可继续切。':'这道线没有穿过玻璃内部。'}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);count();let p=pos(e);if(Math.hypot((p.x-sun.x)*W,(p.y-sun.y)*H)<34){drag={id:e.pointerId,kind:'sun'};hint.textContent='拖光源，看窗外墙面上的彩色投影。';return}if(mode==='cut'){drag={id:e.pointerId,kind:'cut',start:p,last:p};return}let c=hit(p);selected=c;if(c){drag={id:e.pointerId,kind:'move',c,last:p};hint.textContent='玻璃已选中：可以位移、转动，或焊合共边邻片。'}else{drag=null;hint.textContent='点选窗内的玻璃，或拖动 ☼ 光源。'}});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;count();let p=pos(e);if(drag.kind==='sun'){sun={x:Math.max(.03,Math.min(.97,p.x)),y:Math.max(.03,Math.min(.97,p.y))}}else if(drag.kind==='cut')drag.last=p;else{let ctr=centroid(drag.c.poly),dx=Math.max(.1,Math.min(.9,ctr.x+p.x-drag.last.x))-ctr.x,dy=Math.max(.08,Math.min(.84,ctr.y+p.y-drag.last.y))-ctr.y;for(const a of drag.c.poly){a.x+=dx;a.y+=dy}drag.last=p}});
function end(e){if(!drag||drag.id!==e.pointerId)return;if(drag.kind==='cut'&&e.type==='pointerup'){count();split(drag.start,drag.last)}drag=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',e=>{if(drag&&drag.id===e.pointerId)drag=null});
function setMode(m){mode=m;for(const id of ['arrange','cut'])document.getElementById(id).setAttribute('aria-pressed',id===m);hint.textContent=m==='cut'?'一笔划过玻璃，形成新的分片与铅线。':'点选后拖移；将分片归位后，可以重新焊合共边。';count()}document.getElementById('arrange').onclick=()=>setMode('arrange');document.getElementById('cut').onclick=()=>setMode('cut');document.getElementById('rotate').onclick=()=>{count();if(!selected){hint.textContent='先点选一片玻璃。';return}let ctr=centroid(selected.poly),a=Math.PI/12;for(const p of selected.poly){let x=p.x-ctr.x,y=(p.y-ctr.y)*H/W;p.x=ctr.x+x*Math.cos(a)-y*Math.sin(a);p.y=ctr.y+(x*Math.sin(a)+y*Math.cos(a))*W/H}hint.textContent='转动 15°；移片可让新的留白透出来。'};document.getElementById('home').onclick=()=>{count();if(selected){selected.poly=selected.home.map(p=>({...p}));hint.textContent='选片已回到切出时的位置，可以焊合邻片。'}else hint.textContent='先点选一片需要归位的玻璃。'};
const same=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<.000001;function union(p,q){let edges=[];for(const poly of [p,q])for(let i=0;i<poly.length;i++)edges.push([poly[i],poly[(i+1)%poly.length]]);let removed=0,keep=[];for(let i=0;i<edges.length;i++){let reverse=edges.findIndex((e,j)=>i!==j&&same(e[0],edges[i][1])&&same(e[1],edges[i][0]));if(reverse>=0)removed++;else keep.push(edges[i])}if(!removed||!keep.length)return null;let poly=[],edge=keep.shift();poly.push({...edge[0]});let current=edge[1],guard=0;while(!same(current,poly[0])&&guard++<100){poly.push({...current});let idx=keep.findIndex(e=>same(e[0],current));if(idx<0)return null;current=keep.splice(idx,1)[0][1]}return keep.length?null:poly}
document.getElementById('weld').onclick=()=>{count();if(!selected){hint.textContent='先点选一片与邻片共边的玻璃。';return}for(const c of cells){if(c===selected)continue;let poly=union(selected.poly,c.poly);if(poly){let merged=make(poly,selected.c);cells=cells.filter(a=>a!==selected&&a!==c);cells.push(merged);selected=merged;info();hint.textContent='共边铅线已焊开，合成更大的一片玻璃。';return}}hint.textContent='这片暂时没有共边邻片；先点“选片归位”，再试焊合。'};
for(const name of ['blue','red','green'])document.getElementById(name).onclick=()=>{palette=name;count();for(const id of ['blue','red','green'])document.getElementById(id).setAttribute('aria-pressed',id===name);hint.textContent='采光配色已改变，分片与位置继续保留。'};document.getElementById('reset').onclick=()=>{count();qa.dataset.resets=++resets;setup();hint.textContent='彩窗重新完整。配色保留，可以从另一条切线开始。'};canvas.addEventListener('keydown',e=>{if(!selected)return;let dx=0,dy=0;if(e.key==='ArrowLeft')dx=-.015;else if(e.key==='ArrowRight')dx=.015;else if(e.key==='ArrowUp')dy=-.015;else if(e.key==='ArrowDown')dy=.015;else return;e.preventDefault();const ctr=centroid(selected.poly);dx=Math.max(.1,Math.min(.9,ctr.x+dx))-ctr.x;dy=Math.max(.08,Math.min(.84,ctr.y+dy))-ctr.y;for(const p of selected.poly){p.x+=dx;p.y+=dy}count()});window.addEventListener('resize',resize);new ResizeObserver(resize).observe(canvas);setup();resize();requestAnimationFrame(render);
})();
</script></body></html>
