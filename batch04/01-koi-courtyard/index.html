<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>青庭 · Koi Courtyard</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#83c5b4;color:#133d35;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#art{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.mast{position:absolute;z-index:2;left:6vw;top:max(26px,env(safe-area-inset-top));pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.28em;font-weight:650}.mast h1{font-family:ui-serif,"Songti SC",serif;font-size:clamp(44px,6vw,82px);font-weight:400;letter-spacing:.12em;margin:15px 0 5px;line-height:1.08}.mast p{font-size:12px;line-height:1.7;opacity:.76;margin:10px 0;max-width:230px}.number{position:absolute;right:6vw;top:32px;font-size:10px;letter-spacing:.24em}.controls{position:absolute;z-index:4;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 28px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.toolset{display:flex;border-radius:40px;background:#ecf3dbe8;padding:5px;box-shadow:0 6px 25px #143e3520;gap:2px}.toolset button{height:46px;min-width:76px;padding:0 17px;border:0;background:transparent;border-radius:28px;font-size:12px;font-weight:600}.toolset button[aria-pressed=true]{background:#234f42;color:#fbf5db}.extra{display:flex;gap:6px}.extra button{height:44px;min-width:44px;padding:0 13px;background:#ecf3dbcb;border:1px solid #24524122;border-radius:30px;font-size:11px}.extra button:active{transform:scale(.97)}#sound-status{cursor:default;opacity:.7;padding:0 12px}.hint{width:100%;text-align:center;font-size:10px;letter-spacing:.08em;line-height:1.5;min-height:16px;color:#194a3d}.count{position:absolute;left:6vw;bottom:35px;font-size:10px;letter-spacing:.13em;opacity:.65;pointer-events:none}.side-note{position:absolute;right:6vw;bottom:38px;writing-mode:vertical-rl;font-size:10px;letter-spacing:.28em;opacity:.65;pointer-events:none}button:focus-visible{outline:2px solid #c63f24;outline-offset:3px}@media(max-width:650px){.mast{left:26px;top:28px}.mast h1{font-size:48px}.mast p{font-size:11px;width:175px}.number{right:25px}.count,.side-note{display:none}.controls{bottom:max(19px,env(safe-area-inset-bottom));gap:7px}.toolset{width:100%;justify-content:center}.toolset button{flex:1;max-width:130px}.extra button{font-size:10px;padding:0 12px}.hint{font-size:10px}.mast p{max-width:170px}}
.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body>
<canvas id="art" aria-label="可投饵、画水流与拖动荷叶的青绿鱼庭"></canvas>
<header class="mast"><div class="eyebrow">LITTLE WORLDS / 01</div><h1>青庭</h1><p>把一段水流留在庭院里。<br>鱼会记得食物，也会绕过叶。</p></header><div class="number">KOI COURTYARD</div>
<div class="count" id="fish-count">十二尾 · 一池春水</div><div class="side-note">一笔水流，缓缓成庭</div>
<nav class="controls" aria-label="水庭操作"><div class="toolset"><button id="mode-feed" aria-pressed="true">• 投饵</button><button id="mode-current" aria-pressed="false">≈ 水流</button><button id="mode-lily" aria-pressed="false">◔ 荷叶</button></div><div class="extra"><button id="add-fish">＋ 一尾</button><button id="palette">薄暮</button><button id="clear-current">静水</button><button id="reset">重置</button><span id="sound-status" class="sound-status">无声作品</span></div><div class="hint" id="hint" aria-live="polite">轻点投饵；慢慢划过，可撒下一条食物的路径。</div></nav>
<div id="qa" hidden data-frames="0" data-inputs="0" data-resets="0" data-audio="none" data-bounded="true"></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false}),qa=document.getElementById('qa');let W=innerWidth,H=innerHeight,dpr=1,fish=[],food=[],flows=[],lilies=[],ripples=[],mode='feed',dusk=false,pointer=null,dragLeaf=null,lastStamp=0,last=0,frames=0,inputs=0,resets=0,time=0;const TAU=Math.PI*2;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const rnd=(a,b)=>a+Math.random()*(b-a);let grain=document.createElement('canvas');grain.width=grain.height=160;const gc=grain.getContext('2d');for(let i=0;i<6500;i++){gc.fillStyle=Math.random()>.5?'#fff':'#0e4139';gc.globalAlpha=rnd(.015,.045);gc.fillRect(rnd(0,160),rnd(0,160),1,1)}const grainPattern=ctx.createPattern(grain,'repeat');
function resize(){const oldW=W,oldH=H;W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(oldW&&oldH){for(const list of [fish,food,flows,lilies,ripples])for(const p of list){p.x*=W/oldW;p.y*=H/oldH}}}resize();
function makeFish(x,y,i){return{x,y,vx:Math.cos(i*2.4)*24,vy:Math.sin(i*2.4)*24,a:i*2.4,size:rnd(22,40),phase:rnd(0,TAU),skin:i%5,turn:rnd(-1,1),targetT:0}}
function reset(){fish=[];food=[];flows=[];lilies=[];ripples=[];const n=W<650?12:18;for(let i=0;i<n;i++)fish.push(makeFish(W*(.32+.5*Math.random()),H*(.29+.38*Math.random()),i));const scale=Math.min(W,H);for(const [x,y,r] of [[.22,.42,.064],[.16,.54,.044],[.79,.7,.074],[.88,.63,.049]])lilies.push({x:W*x,y:H*y,r:scale*r,angle:rnd(0,TAU),seed:rnd(0,100)});resets++;qa.dataset.resets=resets;updateCount();}
function updateCount(){document.getElementById('fish-count').textContent=fish.length+' 尾 · 水流 '+flows.length+' 笔';qa.dataset.objects=fish.length+food.length+flows.length+lilies.length+ripples.length;qa.dataset.cap='248';qa.dataset.fish=fish.length;qa.dataset.food=food.length;qa.dataset.flows=flows.length;qa.dataset.lilies=lilies.length;qa.dataset.bounded=String(fish.length<=28&&food.length<=48&&flows.length<=100&&lilies.length<=12&&ripples.length<=60)}
function ripple(x,y,strength=1){ripples.push({x,y,r:2,a:.5,s:strength});if(ripples.length>60)ripples.shift()}
function feed(x,y){food.push({x:x+rnd(-5,5),y:y+rnd(-5,5),life:24});if(food.length>48)food.shift();ripple(x,y,.6)}
function stamp(x,y,dx,dy){if(Math.hypot(dx,dy)>1){flows.push({x,y,vx:clamp(dx*6,-75,75),vy:clamp(dy*6,-75,75),life:12});if(flows.length>100)flows.shift();ripple(x,y,.25)}}
const instructions={feed:'轻点投饵；慢慢划过，可撒下一条食物的路径。',current:'在水上画一笔。鱼会随流转向；交叉画流，改变整池方向。',lily:'轻点空处添荷叶；拖动已有叶子，让鱼寻找新的绕行路线。'};
for(const key of ['feed','current','lily'])document.getElementById('mode-'+key).onclick=()=>{mode=key;for(const k of ['feed','current','lily'])document.getElementById('mode-'+k).setAttribute('aria-pressed',String(k===key));document.getElementById('hint').textContent=instructions[key];inputs++;};
document.getElementById('add-fish').onclick=()=>{if(fish.length<28){fish.push(makeFish(W*.5,H*.5,fish.length));ripple(W*.5,H*.5);updateCount()}else document.getElementById('hint').textContent='这方庭院最多容纳 28 尾鱼。让水流带它们游开。';inputs++};document.getElementById('palette').onclick=()=>{dusk=!dusk;document.getElementById('palette').textContent=dusk?'清晨':'薄暮';document.body.style.color=dusk?'#f2ebbd':'#133d35';document.querySelector('.hint').style.color=dusk?'#e9e7c7':'#194a3d';inputs++};document.getElementById('clear-current').onclick=()=>{flows=[];food=[];ripples=[];for(const f of fish){f.vx*=.7;f.vy*=.7}inputs++;updateCount()};document.getElementById('reset').onclick=()=>{reset();inputs++};
const point=e=>({x:e.clientX,y:e.clientY});canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer=point(e);pointer.id=e.pointerId;pointer.start=performance.now();inputs++;if(mode==='feed')feed(pointer.x,pointer.y);if(mode==='current')ripple(pointer.x,pointer.y,.6);if(mode==='lily'){dragLeaf=lilies.slice().reverse().find(l=>dist(l,pointer)<l.r);if(!dragLeaf){dragLeaf={x:pointer.x,y:pointer.y,r:Math.min(W,H)*rnd(.04,.075),angle:rnd(0,TAU),seed:rnd(0,100)};lilies.push(dragLeaf);if(lilies.length>12)lilies.shift();ripple(pointer.x,pointer.y,1.5)}}lastStamp=performance.now();updateCount()});canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const p=point(e),dx=p.x-pointer.x,dy=p.y-pointer.y,now=performance.now();if(mode==='lily'&&dragLeaf){dragLeaf.x=clamp(p.x,dragLeaf.r,W-dragLeaf.r);dragLeaf.y=clamp(p.y,dragLeaf.r,H-dragLeaf.r);if(now-lastStamp>100){ripple(p.x,p.y,.4);lastStamp=now}}else if(mode==='current'&&now-lastStamp>25){stamp(p.x,p.y,dx,dy);lastStamp=now}else if(mode==='feed'&&now-lastStamp>145){feed(p.x,p.y);lastStamp=now}pointer.x=p.x;pointer.y=p.y;inputs++;});function end(e){if(pointer&&e.pointerId===pointer.id){pointer=null;dragLeaf=null;updateCount()}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);window.addEventListener('resize',resize);
function update(dt){time+=dt;for(let i=food.length-1;i>=0;i--){const p=food[i];p.life-=dt;if(p.life<0){food.splice(i,1);continue}p.x+=Math.sin(time*.6+i)*dt*1.8;p.y+=Math.cos(time*.5+i)*dt*1.8;}for(let i=flows.length-1;i>=0;i--)if((flows[i].life-=dt)<=0)flows.splice(i,1);for(let i=ripples.length-1;i>=0;i--){let r=ripples[i];r.r+=dt*24*(.6+r.s);r.a-=dt*.095;if(r.a<=0)ripples.splice(i,1)}for(let i=0;i<fish.length;i++){const f=fish[i];let ax=Math.cos(f.phase+time*.16)*8,ay=Math.sin(f.phase+time*.2)*8;let nearest=null,nd=1e9;for(const p of food){let d=dist(p,f);if(d<nd){nearest=p;nd=d}}if(nearest){ax+=(nearest.x-f.x)/Math.max(nd,1)*32;ay+=(nearest.y-f.y)/Math.max(nd,1)*32;if(nd<f.size*.4){food.splice(food.indexOf(nearest),1);ripple(nearest.x,nearest.y,.35)}}for(const p of flows){let d=dist(f,p),radius=Math.min(W,H)*.19;if(d<radius){let force=(1-d/radius)*p.life/12;ax+=p.vx*force;ay+=p.vy*force}}for(const l of lilies){let dx=f.x-l.x,dy=f.y-l.y,d=Math.hypot(dx,dy),safe=l.r+f.size*.7;if(d<safe){ax+=dx/Math.max(1,d)*(safe-d)*5;ay+=dy/Math.max(1,d)*(safe-d)*5}}for(let j=0;j<fish.length;j++){if(i===j)continue;let other=fish[j],dx=f.x-other.x,dy=f.y-other.y,d=Math.hypot(dx,dy);if(d<38){ax+=dx/Math.max(1,d)*(38-d)*.9;ay+=dy/Math.max(1,d)*(38-d)*.9}}const margin=38;if(f.x<margin)ax+=(margin-f.x)*2;if(f.x>W-margin)ax-=(f.x-W+margin)*2;if(f.y<margin)ay+=(margin-f.y)*2;if(f.y>H-margin)ay-=(f.y-H+margin)*2;f.vx+=ax*dt;f.vy+=ay*dt;const speed=Math.hypot(f.vx,f.vy),top=nearest?64:40;if(speed>top){f.vx*=top/speed;f.vy*=top/speed}f.vx*=Math.pow(.96,dt*30);f.vy*=Math.pow(.96,dt*30);if(Math.hypot(f.vx,f.vy)<14){f.vx+=Math.cos(f.a)*dt*7;f.vy+=Math.sin(f.a)*dt*7}f.x=clamp(f.x+f.vx*dt,12,W-12);f.y=clamp(f.y+f.vy*dt,12,H-12);let target=Math.atan2(f.vy,f.vx),delta=Math.atan2(Math.sin(target-f.a),Math.cos(target-f.a));f.a+=delta*Math.min(1,dt*4);}}
function fishShape(f,shadow){ctx.save();ctx.translate(f.x+(shadow?6:0),f.y+(shadow?8:0));ctx.rotate(f.a);const s=f.size,tail=Math.sin(time*5.2+f.phase)*s*.16;const skins=dusk?['#ff9271','#f2d49c','#e8e1be','#a66b47','#eee4c7']:['#d64a2e','#f1c761','#fff0d4','#214c42','#f5e5ba'];ctx.globalAlpha=shadow?.14:1;ctx.fillStyle=shadow?'#123e36':skins[f.skin];ctx.beginPath();ctx.moveTo(s*.69,0);ctx.bezierCurveTo(s*.46,-s*.3,-s*.5,-s*.27,-s*.8,tail);ctx.bezierCurveTo(-s*.46,s*.3,s*.4,s*.28,s*.69,0);ctx.fill();ctx.beginPath();ctx.moveTo(-s*.64,tail*.7);ctx.lineTo(-s*1.1,-s*.3+tail);ctx.quadraticCurveTo(-s*.9,tail,-s*1.12,s*.28+tail);ctx.closePath();ctx.fill();if(!shadow){ctx.globalAlpha=.62;ctx.beginPath();ctx.moveTo(s*.14,-s*.15);ctx.quadraticCurveTo(-s*.15,-s*.64,-s*.38,-s*.35);ctx.lineTo(-s*.21,-s*.06);ctx.fill();ctx.beginPath();ctx.moveTo(s*.14,s*.15);ctx.quadraticCurveTo(-s*.15,s*.59,-s*.38,s*.35);ctx.lineTo(-s*.21,s*.06);ctx.fill();ctx.globalAlpha=.9;if(f.skin===0||f.skin===2||f.skin===4){ctx.fillStyle=f.skin===0?'#efe5c5':'#de4f29';ctx.beginPath();ctx.ellipse(s*.13,-s*.03,s*.23,s*.13,.25,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(-s*.36,s*.03,s*.13,s*.105,-.3,0,TAU);ctx.fill()}ctx.strokeStyle=f.skin===3?'#94ba96':'#633d282c';ctx.lineWidth=.6;for(let k=-3;k<=3;k++){ctx.beginPath();ctx.arc(k*s*.105,0,s*.14,-.7,.7);ctx.stroke()}ctx.fillStyle='#143a34';ctx.beginPath();ctx.arc(s*.46,-s*.085,1.2,0,TAU);ctx.arc(s*.46,s*.085,1.2,0,TAU);ctx.fill();ctx.strokeStyle='#fff9d775';ctx.beginPath();ctx.moveTo(s*.37,-s*.13);ctx.bezierCurveTo(s*.15,-s*.22,-s*.15,-s*.21,-s*.4,-s*.11);ctx.stroke()}ctx.restore()}
function draw(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,dusk?'#254e53':'#a3d8c2');g.addColorStop(.5,dusk?'#37696b':'#70bbae');g.addColorStop(1,dusk?'#244346':'#89c7b2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.strokeStyle=dusk?'#acd3bd12':'#fff4c12e';ctx.lineWidth=.7;const gap=36;for(let j=-2;j<H/gap+3;j++){ctx.beginPath();for(let x=-20;x<=W+20;x+=18){let y=j*gap+Math.sin(x*.022+time*.35+j)*9+Math.sin(x*.011-time*.2+j)*15;x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}ctx.restore();ctx.globalAlpha=dusk?.18:.5;ctx.strokeStyle=dusk?'#f8dc8d':'#e9edab';ctx.lineWidth=1.2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W*.88,H*.26,Math.min(W,H)*(.23+i*.035),-.5,2.8);ctx.stroke()}ctx.globalAlpha=1;for(const p of flows){ctx.save();ctx.globalAlpha=.21*p.life/12;ctx.strokeStyle=dusk?'#d6ecbc':'#e9f0cf';ctx.lineWidth=1;let a=Math.atan2(p.vy,p.vx);ctx.translate(p.x,p.y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(10,0);ctx.lineTo(5,-3);ctx.moveTo(10,0);ctx.lineTo(5,3);ctx.stroke();ctx.restore()}for(const f of fish)fishShape(f,true);for(const f of fish)fishShape(f,false);for(const p of food){ctx.fillStyle=dusk?'#ffc581':'#c85a26';ctx.beginPath();ctx.arc(p.x,p.y,2.1,0,TAU);ctx.fill();ctx.strokeStyle='#f2ce8a66';ctx.beginPath();ctx.arc(p.x,p.y,5+Math.sin(time*2)*2,0,TAU);ctx.stroke()}for(const r of ripples){ctx.globalAlpha=r.a;ctx.strokeStyle=dusk?'#a9d4c3':'#e4f0cb';ctx.lineWidth=.9;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.82,0,0,TAU);ctx.stroke();ctx.globalAlpha=1}for(const l of lilies){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.angle+Math.sin(time*.13+l.seed)*.025);ctx.fillStyle='#153f3c22';ctx.beginPath();ctx.arc(5,7,l.r,0,TAU);ctx.fill();ctx.fillStyle=dusk?'#406e50':'#46886b';ctx.beginPath();ctx.moveTo(-l.r*.15,0);ctx.arc(0,0,l.r,.12,TAU-.23);ctx.closePath();ctx.fill();ctx.strokeStyle=dusk?'#b7c99250':'#b9d89b70';ctx.lineWidth=.8;for(let k=0;k<12;k++){let a=.1+k*.5;ctx.beginPath();ctx.moveTo(-l.r*.12,0);ctx.lineTo(Math.cos(a)*l.r*.89,Math.sin(a)*l.r*.89);ctx.stroke()}ctx.strokeStyle='#204e3a33';ctx.beginPath();ctx.arc(0,0,l.r*.95,.15,TAU-.25);ctx.stroke();if(dragLeaf===l){ctx.strokeStyle='#f6e3a3';ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(0,0,l.r+5,0,TAU);ctx.stroke()}ctx.restore()}ctx.fillStyle=grainPattern;ctx.fillRect(0,0,W,H);}
function tick(now){const dt=Math.min((now-last)/1000||.016,.04);last=now;update(dt);draw();frames++;if(frames%15===0){qa.dataset.frames=frames;qa.dataset.inputs=inputs;updateCount()}requestAnimationFrame(tick)}reset();resets=0;qa.dataset.resets='0';requestAnimationFrame(tick);
})();
</script></body></html>
