*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#081519;color:#f0ddc5;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(26px,env(safe-area-inset-top));left:28px;pointer-events:none}h1{margin:0 0 7px;font:400 21px Georgia,serif;letter-spacing:.04em}header p{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.18em;opacity:.6}.ui{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);width:max-content;padding:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;border:1px solid #d8b78924;background:#081318c9;border-radius:14px;backdrop-filter:blur(20px)}button{border:0;border-radius:9px;background:none;color:#d9c7b3;font-size:12px;min-height:44px;min-width:53px;padding:8px 12px;cursor:pointer}button:hover,button:focus-visible{outline:1px solid #d7ae7a;color:#fff}button[aria-pressed=true]{background:#c9ae7933}.hint{position:fixed;left:0;width:100%;bottom:88px;text-align:center;pointer-events:none;font-size:12px;letter-spacing:.14em;color:#dccba38c}#qa{display:none}@media(max-width:600px){header{left:22px;top:26px}h1{font-size:19px}.ui{width:calc(100% - 28px);bottom:max(16px,env(safe-area-inset-bottom));gap:0;padding:5px}button{padding:6px 9px;min-width:50px}.hint{bottom:120px;letter-spacing:.05em;font-size:12px}}
</style></head><body><canvas id="art" aria-label="Deep layered cinematic bokeh moved and gathered by touch"></canvas><header><h1>Lantern Drift</h1><p>light caught between breaths</p></header><div class="hint">DRAG • HOLD TO GATHER • FLICK / DOUBLE TAP</div><nav class="ui" aria-label="Artwork controls"><button id="focus">Soft focus</button><button id="aperture">Round</button><button id="palette">Copper tide</button><button id="freeze" aria-pressed="false">Freeze</button><button id="reset">Reset</button><button id="mute" aria-pressed="true">Sound off</button></nav><div id="qa" aria-hidden="true"></div><script>
'use strict';const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),qa=document.querySelector('#qa');let w=innerWidth,h=innerHeight,dpr=1,frames=0,fps=0,inputs=0,resets=0,last=performance.now(),stamp=last,count=0,t=0,focus=0,aperture=0,palette=0,frozen=false,muted=true,ac=null,lastSound=0,voices=0,pointer=null,lastTap=0,pan={x:0,y:0,tx:0,ty:0},lights=[],sprites=[],pulse=[];const palettes=[['#07181d','#5ba6a2','#e9a75c','#c36c41','#f2d6a1'],['#12142a','#717fca','#e69f83','#9b5f8d','#e0c5ae'],['#1c1410','#7da889','#d39354','#bf513d','#f3d7a8']];
function sound(freq=330){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();if(ac.state!=='running'||voices>=4||performance.now()-lastSound<160)return;lastSound=performance.now();voices++;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.98,ac.currentTime+1);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.025,ac.currentTime+.1);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.9);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+1);o.onended=()=>voices--}catch{}}
function buildSprites(){sprites=[];for(let color=1;color<5;color++){let c=document.createElement('canvas');c.width=c.height=256;let x=c.getContext('2d'),r=100;x.translate(128,128);let g=x.createRadialGradient(-12,-15,3,0,0,r);g.addColorStop(0,palettes[palette][color]+(focus===1?'22':'0a'));g.addColorStop(.52,palettes[palette][color]+(focus===2?'32':'20'));g.addColorStop(.83,palettes[palette][color]+'77');g.addColorStop(.93,palettes[palette][color]+(focus===1?'c0':'60'));g.addColorStop(1,palettes[palette][color]+'00');x.fillStyle=g;x.beginPath();if(aperture===1){for(let j=0;j<12;j++){let a=j*Math.PI/6,rr=j%2?r*.96:r;let px=Math.cos(a)*rr,py=Math.sin(a)*rr;j===0?x.moveTo(px,py):x.lineTo(px,py)}x.closePath()}else if(aperture===2)x.ellipse(0,0,r*.62,r,0,0,Math.PI*2);else x.arc(0,0,r,0,Math.PI*2);x.fill();if(focus===1){x.strokeStyle=palettes[palette][color]+'77';x.lineWidth=.6;x.stroke()}sprites.push(c)}}
function seed(){lights=[];for(let i=0;i<82;i++){let depth=Math.random();lights.push({x:Math.random()*1.4-.2,y:Math.random()*1.4-.2,z:depth,r:.022+depth*depth*.1,c:i%4,vx:(Math.random()-.5)*.009,vy:(Math.random()-.5)*.007,phase:Math.random()*6.28,life:1});}pulse=[];pan.x=pan.y=pan.tx=pan.ty=0;pointer=null}buildSprites();seed();
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}resize();
function burst(x,y,strength=1){lights.forEach(l=>{let dx=l.x-x/w,dy=l.y-y/h,dist=Math.hypot(dx,dy)+.04;if(dist<.55){l.vx+=dx/dist*.13*strength*(.55-dist);l.vy+=dy/dist*.13*strength*(.55-dist)}});pulse.push({x:x/w,y:y/h,age:0});if(pulse.length>8)pulse.shift();for(let i=0;i<6;i++){if(lights.length>=120)lights.splice(82,1);let a=Math.random()*Math.PI*2;lights.push({x:x/w,y:y/h,z:.5+Math.random()*.4,r:.012+Math.random()*.03,c:Math.floor(Math.random()*4),vx:Math.cos(a)*.11,vy:Math.sin(a)*.11,phase:a,life:1})}sound(360+Math.random()*220)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);inputs++;const now=performance.now();if(now-lastTap<300)burst(e.clientX,e.clientY,2);lastTap=now;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,at:now,last:now,vx:0,vy:0,moved:0};pan.tx=(e.clientX/w-.5)*.12;pan.ty=(e.clientY/h-.5)*.1;sound(240)});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;inputs++;let now=performance.now(),dt=Math.max(.015,(now-pointer.last)/1000),dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.vx=dx/w/dt;pointer.vy=dy/h/dt;pointer.moved+=Math.hypot(dx,dy);pointer.px=pointer.x;pointer.py=pointer.y;pointer.x=e.clientX;pointer.y=e.clientY;pointer.last=now;pan.tx=(e.clientX/w-.5)*.22;pan.ty=(e.clientY/h-.5)*.17;lights.forEach(l=>{let distance=Math.hypot(l.x*w-e.clientX,l.y*h-e.clientY);if(distance<Math.min(w,h)*.3&&l.z>.55){l.vx+=dx/w*.5;l.vy+=dy/h*.5;l.x+=dx/w*.13;l.y+=dy/h*.13}});sound(220+Math.min(500,Math.abs(pointer.vx)*90))});
function release(e){if(!pointer||pointer.id!==e.pointerId)return;const hold=performance.now()-pointer.at;if(hold>500||Math.hypot(pointer.vx,pointer.vy)>.25){lights.forEach(l=>{if(Math.hypot(l.x-pointer.x/w,l.y-pointer.y/h)<.35){l.vx+=Math.max(-.7,Math.min(.7,pointer.vx))*.12;l.vy+=Math.max(-.7,Math.min(.7,pointer.vy))*.12}});if(hold>500)burst(pointer.x,pointer.y,.8)}pointer=null;pan.tx*=.4;pan.ty*=.4}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',e=>{if(pointer?.id===e.pointerId)pointer=null});
document.querySelector('#focus').onclick=e=>{focus=(focus+1)%3;e.currentTarget.textContent=['Soft focus','Glass focus','Dream focus'][focus];inputs++;buildSprites();sound(280+focus*90)};document.querySelector('#aperture').onclick=e=>{aperture=(aperture+1)%3;e.currentTarget.textContent=['Round','Six blades','Anamorphic'][aperture];inputs++;buildSprites()};document.querySelector('#palette').onclick=e=>{palette=(palette+1)%3;e.currentTarget.textContent=['Copper tide','Velvet dusk','Ember grove'][palette];inputs++;buildSprites()};document.querySelector('#freeze').onclick=e=>{frozen=!frozen;e.currentTarget.setAttribute('aria-pressed',String(frozen));e.currentTarget.textContent=frozen?'Resume':'Freeze';inputs++;sound(200)};
document.querySelector('#reset').onclick=()=>{resets++;inputs++;seed()};document.querySelector('#mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'Sound off':'Sound on';e.currentTarget.setAttribute('aria-pressed',String(muted));inputs++;if(muted)ac?.suspend();else sound(330)};addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)ac?.suspend();else if(!muted)ac?.resume()});
function render(now){requestAnimationFrame(render);if(document.hidden)return;let dt=Math.min(.04,(now-last)/1000);last=now;let motion=frozen?0:dt;t+=motion;frames++;count++;if(now-stamp>1000){fps=count*1000/(now-stamp);stamp=now;count=0;Object.assign(qa.dataset,{frames:String(frames),fps:fps.toFixed(1),entities:String(lights.length+pulse.length),inputs:String(inputs),resets:String(resets),muted:String(muted),width:String(w),height:String(h),audio:ac?.state||'uninitialized'})}let p=palettes[palette];ctx.fillStyle=p[0];ctx.fillRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,p[1]+'12');g.addColorStop(.5,'transparent');g.addColorStop(1,p[3]+'18');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);pan.x+=(pan.tx-pan.x)*dt*3;pan.y+=(pan.ty-pan.y)*dt*3;ctx.globalCompositeOperation='screen';const sorted=[...lights].sort((a,b)=>a.z-b.z);sorted.forEach(l=>{if(pointer&&now-pointer.last>440){let dx=pointer.x/w-l.x,dy=pointer.y/h-l.y;if(Math.hypot(dx,dy)<.65){l.vx+=dx*dt*.24;l.vy+=dy*dt*.24;l.x+=dx*dt*.22;l.y+=dy*dt*.22}if(Math.random()<dt*.5)sound(320+l.z*240)}l.x+=l.vx*(frozen&&pointer?dt:motion);l.y+=l.vy*(frozen&&pointer?dt:motion);l.vx*=Math.pow(.992,dt*60);l.vy*=Math.pow(.992,dt*60);if(l.x>1.25)l.x=-.25;if(l.x<-.25)l.x=1.25;if(l.y>1.25)l.y=-.25;if(l.y<-.25)l.y=1.25;let xx=(l.x+pan.x*l.z)*w+Math.sin(t*.15+l.phase)*18*l.z,yy=(l.y+pan.y*l.z)*h+Math.cos(t*.12+l.phase)*15*l.z;let radius=Math.min(w,h)*l.r*(focus===2?1.35:1);ctx.globalAlpha=(.15+l.z*.75)*(focus===1?.85:1);ctx.drawImage(sprites[l.c],xx-radius*1.28,yy-radius*1.28,radius*2.56,radius*2.56);if(l.z<.13){ctx.globalAlpha=.4;ctx.fillStyle=p[l.c+1];ctx.beginPath();ctx.arc(xx,yy,1.1,0,Math.PI*2);ctx.fill()}});ctx.globalAlpha=1;pulse.forEach(q=>{q.age+=dt;ctx.strokeStyle=p[4]+Math.floor(Math.max(0,1-q.age/1.4)*70).toString(16).padStart(2,'0');ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(q.x*w,q.y*h,q.age*80+8,q.age*65+5,0,0,Math.PI*2);ctx.stroke()});pulse=pulse.filter(q=>q.age<1.4);ctx.globalCompositeOperation='source-over';let vignette=ctx.createRadialGradient(w*.5,h*.49,Math.min(w,h)*.18,w*.5,h*.5,Math.max(w,h)*.7);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'#040c12bc');ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h);if(pointer&&now-pointer.last>440){ctx.strokeStyle=p[4]+'55';ctx.lineWidth=.6;ctx.beginPath();ctx.arc(pointer.x,pointer.y,18+Math.sin(t*2)*3,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=p[4]+'50';ctx.fillRect(w-30,h*.24,.6,h*.5)}requestAnimationFrame(render);
</script></body></html>
