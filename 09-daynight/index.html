<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The long way home · Little Worlds</title><style>:root{--bg:#efdbad;--ink:#3d4b48}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(26px,env(safe-area-inset-top));left:26px;pointer-events:none}small{font-size:10px;letter-spacing:.2em}h1{font-size:28px;font-weight:500;letter-spacing:-1.2px;margin:7px 0}footer{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:26px;right:26px;display:flex;align-items:center;justify-content:space-between;gap:12px}p{font-size:11px;line-height:1.6;letter-spacing:.03em;margin:0;pointer-events:none}.tools{display:flex;gap:7px}button{background:transparent;border:1px solid currentColor;border-radius:50%;width:40px;height:40px;color:inherit;font-size:15px;cursor:pointer}button:focus-visible{outline:3px solid currentColor;outline-offset:4px}@media(min-width:800px){header{left:48px;top:38px}h1{font-size:34px}footer{left:48px;right:48px;bottom:32px}}@media(max-height:500px){header{top:12px}h1{font-size:23px}footer{bottom:10px}footer p{font-size:9px}}</style></head><body><canvas id="art" aria-label="The long way home interactive artwork"></canvas><header><small>LITTLE WORLDS / 09</small><h1>The long way home</h1></header><footer><p>Turn the sun. Tap sky & ground.<br>Light three windows. Mix the hours.</p><div class="tools"><button id="mute" title="Toggle sound" aria-label="Toggle sound" aria-pressed="false">♪</button><button id="reset" title="Reset" aria-label="Reset">↺</button></div></footer><script>const c=document.getElementById('art'),g=c.getContext('2d');let W,H,D,t=0,muted=false,audio=null,events=0;function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();function unlock(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume().catch(()=>{})}function tone(freq=220,duration=.15,kind='sine',volume=.08){if(muted||!audio)return;const o=audio.createOscillator(),v=audio.createGain();o.type=kind;o.frequency.setValueAtTime(freq,audio.currentTime);v.gain.setValueAtTime(0,audio.currentTime);v.gain.linearRampToValueAtTime(volume,audio.currentTime+.012);v.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+duration+.02)}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'♪̸':'♪';document.getElementById('mute').setAttribute('aria-pressed',String(muted));};function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,Math.max(.1,r),0,Math.PI*2);g.fill()}function line(x,y,xx,yy,color,width){g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(xx,yy);g.stroke()}function loop(){t+=1/60;draw();requestAnimationFrame(loop)}
let phase=.24,target=.24,drag=false,windows=[false,false,false],changed=0,flowers=[],constellations=[],weather=0,visits=0,story='TURN THE SUN · TOUCH THE LAND',lastStory='',orbiting=false;
function geo(){let s=Math.min(W*.31,H*.2,150);return {cx:W/2,cy:H*.59,s,r:Math.min(W*.4,H*.32,235),oc:H*.51,windows:[0,1,2].map(i=>({x:W/2+(i-1)*s*.49,y:H*.59}))}}
function reset(){phase=target=.24;drag=false;windows=[false,false,false];flowers=[];constellations=[];weather=0;visits=0;events=0;changed=0;story='TURN THE SUN · TOUCH THE LAND'}
document.getElementById('reset').onclick=()=>{unlock();reset();tone(330)};
function orbit(p){target=((Math.atan2(p.x-W/2,-(p.y-H*.51))/(Math.PI*2))%1+1)%1;changed++;}
function nightness(){return(1-Math.cos(phase*Math.PI*2))/2}
function interact(p){const night=nightness();weather=(weather+1)%3;if(p.y>H*.69){flowers.push({x:p.x/W,size:12+Math.random()*12,kind:weather});if(flowers.length>32)flowers.shift();story=night>.65?'MOON FLOWERS OPEN':'A GARDEN REMEMBERS';tone(220+flowers.length%7*55,.3,'triangle')}else{constellations.push({x:p.x/W,y:Math.max(.2,Math.min(.7,p.y/H)),kind:weather});if(constellations.length>24)constellations.shift();story=night>.65?'DRAW YOUR OWN CONSTELLATION':'SEND THE WIND THROUGH';tone(330+weather*110,.5)}events++;}
c.onpointerdown=e=>{unlock();c.setPointerCapture(e.pointerId);const p=point(e),q=geo();let hit=q.windows.findIndex(v=>Math.abs(p.x-v.x)<q.s*.2&&Math.abs(p.y-v.y)<q.s*.28);if(hit>=0){windows[hit]=!windows[hit];events++;tone([261,329,392][hit],.4,'triangle');story=['THE KITCHEN IS AWAKE','SOMEONE IS PLAYING','A LANTERN FOR TRAVELLERS'][hit];return;}let dist=Math.hypot(p.x-q.cx,p.y-q.oc);if(Math.abs(dist-q.r)<48){drag=true;orbit(p);events++;}else interact(p)};
c.onpointermove=e=>{if(drag)orbit(point(e))};c.onpointerup=()=>{if(drag){tone(180+target*400,.4);visits++;}drag=false};c.onpointercancel=()=>drag=false;
function mix(a,b,v){return`rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*v)).join(',')})`}
function draw(){let delta=((target-phase+.5+1)%1)-.5;phase=(phase+delta*.1+1)%1;const night=nightness(),q=geo(),{s,cx,cy,r,oc}=q,lit=windows.filter(Boolean).length;g.fillStyle=mix([239,219,173],[24,37,65],night);g.fillRect(0,0,W,H);document.body.style.color=night>.6?'#e7dbc1':'#3d4b48';
for(let i=0;i<29;i++){let x=((i*137.5)%100)/100*W,y=(.17+((i*37)%47)/100)*H;circle(x,y,(1+Math.sin(t+i)*.3)*night*1.6,mix([239,219,173],[245,227,182],night))}
for(let i=0;i<constellations.length;i++){let st=constellations[i],x=st.x*W,y=st.y*H;if(night>.5){circle(x,y,3+Math.sin(t*2+i),'#f8d17b');if(i){let a=constellations[i-1];line(a.x*W,a.y*H,x,y,'#f8d17b55',1)}}else{for(let j=0;j<3;j++)line(x-20+j*8+Math.sin(t+i)*15,y+j*9,x+12+j*8+Math.sin(t+i)*15,y+j*9,'#fff4d4',3)}}
g.strokeStyle=night>.5?'#5b6b82':'#d1bb8e';g.lineWidth=1;g.setLineDash([2,8]);g.beginPath();g.arc(cx,oc,r,0,Math.PI*2);g.stroke();g.setLineDash([]);const a=phase*Math.PI*2,sx=cx+Math.sin(a)*r,sy=oc-Math.cos(a)*r;circle(sx,sy,24,night>.5?'#e8e3ca':'#d77a47');if(night>.5)circle(sx+10,sy-8,20,mix([239,219,173],[24,37,65],night));
g.fillStyle=mix([182,190,143],[45,66,76],night);g.beginPath();g.moveTo(0,H*.79);g.quadraticCurveTo(W*.2,H*.69,W*.53,H*.79);g.quadraticCurveTo(W*.78,H*.86,W,H*.73);g.lineTo(W,H);g.lineTo(0,H);g.fill();
if(lit&&night>.5){g.fillStyle='#f8d17b14';g.beginPath();g.moveTo(cx,cy);g.lineTo(cx-s*1.5,H*.88);g.lineTo(cx+s*1.5,H*.88);g.fill()}
g.fillStyle=mix([249,236,204],[165,169,163],night);g.fillRect(cx-s*.86,cy-s*.35,s*1.72,s*1.06);g.fillStyle=mix([166,90,65],[85,69,82],night);g.beginPath();g.moveTo(cx-s*1.03,cy-s*.34);g.lineTo(cx,cy-s*1.14);g.lineTo(cx+s*1.03,cy-s*.34);g.closePath();g.fill();g.fillRect(cx+s*.5,cy-s*1.03,s*.2,s*.42);
for(let i=0;i<3;i++){let x=q.windows[i].x;g.fillStyle=windows[i]?'#f8d17b':mix([117,147,142],[53,66,84],night);g.fillRect(x-s*.14,cy-s*.14,s*.28,s*.4);if(windows[i]){circle(x+Math.sin(t*(i+1)) * s*.035,cy+s*.01,s*.047,'#735d59');g.fillStyle='#735d59';g.fillRect(x-s*.04,cy+s*.055,s*.08,s*.1)}line(x,cy-s*.14,x,cy+s*.26,'#e4d9bb',2)}
g.fillStyle='#657970';g.fillRect(cx-s*.13,cy+s*.39,s*.26,s*.32);circle(cx+s*.07,cy+s*.58,2,'#f8d17b');
for(let i=0;i<flowers.length;i++){let f=flowers[i],x=f.x*W,y=H*(.8+(i%3)*.025),bend=Math.sin(t*1.6+i)*(weather+1)*3,open=night>.6?1.35:.8;line(x,y,x+bend,y-f.size,'#557361',2);for(let j=0;j<5;j++){let a=j/5*Math.PI*2+t*.15;circle(x+bend+Math.cos(a)*f.size*.3*open,y-f.size+Math.sin(a)*f.size*.3*open,f.size*.23,['#ed9976','#f8d17b','#efe6cb'][f.kind])}circle(x+bend,y-f.size,3,'#83644f')}
if(windows[0])for(let i=0;i<3;i++){let k=(t*.3+i*.3)%1;circle(cx+s*.6+k*20,cy-s*1.1-k*50,6+k*8,night>.5?'#acbac044':'#fff7df99')}
if(windows[1])for(let i=0;i<4;i++){let k=(t*.3+i*.25)%1;circle(cx+Math.sin(k*5)*40,cy-k*100,3,'#d99b76');line(cx+Math.sin(k*5)*40+3,cy-k*100,cx+Math.sin(k*5)*40+3,cy-k*100-12,'#d99b76',1)}
if(windows[2]&&night>.5)for(let i=0;i<12;i++)circle(cx+Math.sin(t*.5+i*2)*s*1.6,cy+s*.8+Math.cos(t*.9+i)*s*.4,2+Math.sin(t*2+i),'#f8d17b');
if(lit===3){g.strokeStyle=night>.6?'#f8d17b':'#ec9476';g.lineWidth=2;g.beginPath();g.arc(cx,cy,s*1.3,Math.PI,Math.PI*2);g.stroke();story=night>.6?'ALL HOME · A FIREFLY CONCERT':'ALL HOME · THE HOUSE IS SINGING'}
g.fillStyle=night>.6?'#e7dbc1':'#3d4b48';g.font='9px Arial';g.textAlign='center';g.fillText(story,cx,Math.min(H*.89,H-100))}
window.__artTest={getState:()=>({events,phase,target,changed,windows:[...windows],flowers:flowers.length,constellations:constellations.length,weather,visits,story,muted,audio:audio?.state||'locked',geometry:geo()})};
loop();</script></body></html>
