<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>风蚀锦丘 · 第六组</title><style>:root{--bg:#0a1116;--ink:#ead2a5;--accent:#55c6bd;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>风蚀锦丘</h1><p>拖风梳出矿色细丝；画挡风脊让细砂沉成锦丘，再扬起局部重塑。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="风蚀锦丘，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="wind" id="wind">风梳刻沟</button><button data-action="wall" id="wall">挡风积脊</button><button data-action="settle" id="settle">落砂成丘</button><button data-action="raise" id="raise">局部再扬</button><button data-action="reverse" id="reverse">风向反转</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=7;window.artMeta={"number": 7, "slug": "07-wind-carved-dunes", "title": "风蚀锦丘", "group": "F", "mothers": ["samuel_yan_interactive_mobile_sands.html"], "innovation": "细砂成锦丘，风梳刻沟、挡风积脊与局部再扬沙", "description": "拖风梳出矿色细丝；画挡风脊让细砂沉成锦丘，再扬起局部重塑。", "ui": {"bg": "#0a1116", "ink": "#ead2a5", "accent": "#55c6bd"}, "controls": [{"id": "wind", "label": "风梳刻沟"}, {"id": "wall", "label": "挡风积脊"}, {"id": "settle", "label": "落砂成丘"}, {"id": "raise", "label": "局部再扬"}, {"id": "reverse", "label": "风向反转"}], "newMechanics": ["风沟向量保持14秒", "挡风脊使附近粒子减速沉积", "落砂与再扬局部可逆"], "artDirection": ["保留琥珀/矿蓝/青碧细丝深底", "密集等流线与多重沉积脊", "流动拖尾跨屏不连脏线"], "testPlan": [{"control": "wind", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "wall", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "settle", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "raise", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}], "stateFields": ["walls增长", "settledRidges随落砂改变", "windDirection反转"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){
const c=e.ctx,cl=e.clamp;let mode='wind',particles=[],walls=[],gusts=[],deposits=[],wind=1,pointer=null,last=null,age=0,ridges=0;const palette=['#e4aa58','#cf6d3b','#54c4b9','#288b94','#f1d095'];
function spawn(x=Math.random(),y=Math.random()){return{x,y,vx:(Math.random()-.5)*.008,vy:(Math.random()-.5)*.008,life:3+Math.random()*6,col:Math.floor(Math.random()*5),w:.45+Math.random()*.7};}
function reset(){particles=Array.from({length:4800},()=>spawn());walls=[];gusts=[];deposits=Array.from({length:80},(_,i)=>({x:Math.random(),y:Math.random(),m:.1+Math.random()*.2,col:i%5}));wind=1;mode='wind';pointer=last=null;age=0;ridges=0;}
function brush(p){let x=p.x/e.W,y=p.y/e.H,dx=last?(p.x-last.x)/e.W:.002,dy=last?(p.y-last.y)/e.H:0;
if(mode==='wind'){gusts.push({x,y,dx:dx*3,dy:dy*3,life:14});if(gusts.length>35)gusts.shift();}
if(mode==='wall'&&last){walls.push({a:[last.x/e.W,last.y/e.H],b:[x,y]});if(walls.length>70)walls.shift();}
if(mode==='settle'){for(let p of particles)if(Math.hypot((p.x-x)*e.W,(p.y-y)*e.H)<65){p.vx*=.55;p.vy*=.55;p.life-=.15;}deposits.push({x,y,m:.45,col:Math.floor(age)%5});if(deposits.length>160)deposits.shift();}
if(mode==='raise'){deposits=deposits.filter(d=>Math.hypot((d.x-x)*e.W,(d.y-y)*e.H)>45);for(let i=0;i<45;i++){let q=spawn(x+(Math.random()-.5)*.06,y+(Math.random()-.5)*.06);q.vx=(Math.random()-.5)*.08;q.vy=(Math.random()-.5)*.08;particles[(Math.floor(age*100)+i)%particles.length]=q;}}
last=p;}
return{reset,input(k,p){if(k==='down'){pointer=p;last=p;brush(p);}if(k==='move'&&pointer){pointer=p;brush(p);}if(k==='up'||k==='cancel'){pointer=last=null;}},action(id){if(id==='reverse'){wind*=-1;mode='wind';}else mode=id;},draw(dt,t){age+=dt;let W=e.W,H=e.H;c.fillStyle='rgba(7,12,16,.075)';c.fillRect(0,0,W,H);
// Long densely hatched aeolian folds, each ridge retains deposited mineral color.
for(let j=0;j<110;j++){let v=j/110;c.beginPath();for(let i=0;i<=92;i++){let u=i/92;let y=v+.018*Math.sin(u*12+v*18)+.045*Math.sin(u*5-v*8);let relief=0;for(let d of deposits.slice(-10)){let r=(u-d.x)**2*7+(v-d.y)**2*18;if(r<.12)relief+=d.m*Math.exp(-r*40)*.014*Math.sin(u*19+v*9);}y+=relief;i?c.lineTo(u*W,y*H):c.moveTo(u*W,y*H);}c.strokeStyle=j%7<3?'rgba(41,160,162,.1)':'rgba(224,155,77,.14)';c.lineWidth=j%5===0?.9:.5;c.stroke();}
c.lineCap='round';for(let q of particles){let ox=q.x,oy=q.y;let a=Math.sin(q.x*8+Math.sin(q.y*9))*3.2+Math.cos(q.y*5-q.x*7)*1.8;let fx=Math.cos(a)*.04*wind,fy=Math.sin(a)*.04*wind;for(let g of gusts){let d=(q.x-g.x)**2*2+(q.y-g.y)**2;if(d<.055){let f=Math.exp(-d*65);fx+=g.dx*f;fy+=g.dy*f;}}for(let w of walls){let ax=w.a[0],ay=w.a[1],bx=w.b[0],by=w.b[1],dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,k=cl(((q.x-ax)*dx+(q.y-ay)*dy)/(l+.00001),0,1),rx=q.x-(ax+dx*k),ry=q.y-(ay+dy*k),r=Math.hypot(rx,ry);if(r<.025){fx+=rx/(r+.001)*.1;fy+=ry/(r+.001)*.1;q.vx*=.7;q.vy*=.7;if(Math.random()<.012){deposits.push({x:q.x,y:q.y,m:.15,col:q.col});ridges++;if(deposits.length>160)deposits.shift();}}}q.vx=e.lerp(q.vx,fx,.09);q.vy=e.lerp(q.vy,fy,.09);q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<0||q.x<0||q.x>1||q.y<0||q.y>1){Object.assign(q,spawn());continue;}c.strokeStyle=palette[q.col];c.globalAlpha=.42+q.life/10*.4;c.lineWidth=q.w;c.beginPath();c.moveTo(ox*W,oy*H);c.lineTo(q.x*W,q.y*H);c.stroke();}c.globalAlpha=1;
for(let g of gusts)g.life-=dt;gusts=gusts.filter(g=>g.life>0);
for(let d of deposits){c.strokeStyle=palette[d.col];c.globalAlpha=d.m*.24;for(let k=0;k<9;k++){c.beginPath();c.ellipse(d.x*W,d.y*H,(8+k*3)*(W<500?.7:1),3+k*1.4,.25,0,Math.PI*1.6);c.stroke();}}c.globalAlpha=1;
for(let w of walls){c.strokeStyle='rgba(222,190,133,.68)';c.lineWidth=2;c.beginPath();c.moveTo(w.a[0]*W,w.a[1]*H);c.lineTo(w.b[0]*W,w.b[1]*H);c.stroke();}
if(pointer){c.strokeStyle='#e8c582';c.lineWidth=1;c.beginPath();c.arc(pointer.x,pointer.y,32,0,Math.PI*2);c.stroke();}},state(){const names={wind:'风梳：拖动刻出弯曲风沟',wall:'挡风：画挡沙脊，迎风面开始沉积',settle:'落砂：按住使细丝沉成矿色锦丘',raise:'再扬：扫过旧锦丘，沙粒重新飞起'};return{bounded:true,mode,walls:walls.length,settledRidges:deposits.length,windDirection:wind,activeGusts:gusts.length,status:names[mode]+' · 挡风脊 '+walls.length+' · 锦丘 '+deposits.length};}}
};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
