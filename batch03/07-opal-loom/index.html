<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Opal Loom</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c13;color:#eae6dc;font-family:system-ui,sans-serif}#art{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}header{position:fixed;top:26px;left:28px;pointer-events:none}h1{font-size:13px;font-weight:500;letter-spacing:.25em;margin:0 0 8px}header p{font-size:11px;color:#a9b2bd;letter-spacing:.06em;margin:0}#status{position:fixed;right:28px;top:28px;font-size:10px;letter-spacing:.1em;color:#8798a7;pointer-events:none}.controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:min(690px,calc(100% - 28px));padding:8px;border:1px solid #8eabb721;border-radius:18px;background:#0a111bd9;backdrop-filter:blur(12px)}button{font:12px system-ui;letter-spacing:.04em;min-height:44px;padding:0 13px;border:1px solid #9fc0d02b;border-radius:10px;color:#b8c9d2;background:#18222b99;cursor:pointer}button:focus-visible{outline:2px solid #ecc393;outline-offset:2px}button[aria-pressed=true]{border-color:#d4c1a1a0;color:#f5e0bf;background:#4f4b445a}button:hover{background:#2c3b48}#qa{display:none}@media(max-width:500px){header{left:21px;top:23px}#status{right:21px;top:24px;font-size:9px}.controls{bottom:max(12px,env(safe-area-inset-bottom));gap:4px;padding:6px;width:calc(100% - 24px)}button{padding:0 10px;flex:1 0 58px}header p{font-size:10px}}
</style><canvas id="art" aria-label="Draw luminous folded silk fibers"></canvas><header><h1>OPAL LOOM</h1><p>Trace slowly. Fold light into fabric.</p></header><div id="status">NACRE / 4 FOLDS</div><div class="controls" aria-label="Artwork controls"><button id="palette">Nacre</button><button id="sym">4 folds</button><button id="fold" aria-pressed="true">Reflect</button><button id="spiral" aria-pressed="false">Spiral</button><button id="age" aria-pressed="false">Age</button><button id="erase" aria-pressed="false">Erase</button><button id="undo">Undo</button><button id="reset">Reset</button><button id="mute" aria-pressed="true">Sound off</button></div><output id="qa"></output><script>
(()=>{'use strict';const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),ink=document.createElement('canvas'),g=ink.getContext('2d');let W=0,H=0,dpr=1,frames=0,fps=0,inputs=0,resets=0,muted=true,axis=4,reflect=true,spiral=false,age=false,erase=false,palette=0,strokes=[],active=null,pointer=null,lastT=performance.now(),paused=false,audio=null,drone=null,gain=null,master=null;const palettes=[{name:'Nacre',h:[181,219,31,331]},{name:'Ember',h:[16,36,328,290]},{name:'Lagoon',h:[157,184,214,265]}];const qa=document.querySelector('#qa'),$=x=>document.getElementById(x);let seed=0,voices=0;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function bg(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#080c13';ctx.fillRect(0,0,W,H);let v=ctx.createRadialGradient(W*.5,H*.43,10,W*.5,H*.44,Math.max(W,H)*.7);v.addColorStop(0,'#14202a');v.addColorStop(.62,'#0c141e');v.addColorStop(1,'#070a11');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function audioInit(){if(muted)return;try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=1;master.connect(audio.destination);gain=audio.createGain();gain.gain.value=.015;gain.connect(master);drone=audio.createOscillator();drone.type='sine';drone.frequency.value=110;drone.connect(gain);drone.start()}if(audio.state==='suspended')audio.resume()}catch(e){}}function chime(x,y){if(muted||!audio||voices>=6)return;voices++;const t=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.value=110*Math.pow(2,Math.round(x*9)/12);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.025,t+.04);v.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(v);v.connect(master);o.start(t);o.stop(t+.71);o.onended=()=>{voices--;o.disconnect();v.disconnect()}}
function point(x,y){return{x:x/W,y:y/H}}function transform(x,y,k,s){const cx=W*.5,cy=H*.44,r=Math.min(W,H)*.48;let dx=(x-.5)*r*2,dy=(y-.44)*r*2;if(s<0)dx=-dx;const a=k*Math.PI*2/axis;return{x:cx+dx*Math.cos(a)-dy*Math.sin(a),y:cy+dx*Math.sin(a)+dy*Math.cos(a)}}
function drawSeg(st,a,b,j){const ax=st.axis,rf=st.reflect,oldaxis=axis;axis=ax;const len=Math.hypot((b.x-a.x)*W,(b.y-a.y)*H);const n=32,scale=Math.min(W,H)/650;let tang=Math.atan2(b.y-a.y,b.x-a.x),time=j*.064;g.globalCompositeOperation=st.erase?'destination-out':'screen';for(let k=0;k<ax;k++)for(let s=0;s<(rf?2:1);s++){let sign=s===0?1:-1;for(let q=0;q<n;q++){const frac=q/(n-1),offset=(frac-.5)*(st.spiral?82:63)*scale;const wave=Math.sin(time*1.7+q*.23+st.phase)*15*scale;const wa=Math.sin((time-.064)*1.7+q*.23+st.phase)*15*scale;let aa={x:a.x+Math.cos(tang+Math.PI/2)*(offset+wa)/W,y:a.y+Math.sin(tang+Math.PI/2)*(offset+wa)/H},bb={x:b.x+Math.cos(tang+Math.PI/2)*(offset+wave)/W,y:b.y+Math.sin(tang+Math.PI/2)*(offset+wave)/H};if(st.spiral){const ang=j*.008+frac*.05;for(const p of[aa,bb]){const dx=p.x-.5,dy=p.y-.44;p.x=.5+dx*Math.cos(ang)-dy*Math.sin(ang);p.y=.44+dx*Math.sin(ang)+dy*Math.cos(ang)}}const p1=transform(aa.x,aa.y,k,sign),p2=transform(bb.x,bb.y,k,sign);const hue=palettes[st.palette].h[Math.floor(frac*3.99)],alpha=(.16+Math.pow(Math.abs(frac-.5)*2,2)*.23)*st.opacity;g.strokeStyle=st.erase?'rgba(0,0,0,.18)':`hsla(${hue},${55+frac*20}%,${57+frac*23}%,${alpha})`;g.lineWidth=st.erase?Math.max(4,18*scale):Math.max(.3,.48*scale);g.beginPath();g.moveTo(p1.x,p1.y);g.quadraticCurveTo((p1.x+p2.x)/2+Math.cos(tang+1.57)*Math.sin(time+frac)*len*.17,(p1.y+p2.y)/2+Math.sin(tang+1.57)*Math.sin(time+frac)*len*.17,p2.x,p2.y);g.stroke()}}axis=oldaxis;g.globalCompositeOperation='source-over'}
function newStroke(isErase=erase){return{points:[],axis,reflect,spiral,palette,phase:Math.random()*6,opacity:1,erase:isErase}}function append(st,p){const prev=st.points[st.points.length-1];if(prev){drawSeg(st,prev,p,st.points.length)}st.points.push(p);if(st.points.length>=260){active=newStroke(st.erase);active.points.push(p);strokes.push(active);if(strokes.length>42){strokes.shift();redraw()}}}
function redraw(){g.clearRect(0,0,W,H);for(const st of strokes)for(let j=1;j<st.points.length;j++)drawSeg(st,st.points[j-1],st.points[j],j)}
function starter(){strokes=[];seed=7881;for(let z=0;z<6;z++){let st=newStroke(false);st.axis=z<4?2:4;st.reflect=z<4;st.spiral=z===5;st.phase=z*.9;st.palette=z===3?2:0;st.opacity=.94;for(let i=0;i<225;i++){const t=i/224*Math.PI*2,r=.16+.08*Math.sin(t*2+z*.7);const p={x:.5+r*Math.cos(t)+.115*Math.sin(t*.5+z*.85),y:.44+r*1.17*Math.sin(t)+.055*Math.cos(t*2+z*.7)};st.points.push(p)}strokes.push(st)}redraw()}
function resize(){const ow=W,oh=H;W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=ink.width=Math.round(W*dpr);canvas.height=ink.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);g.setTransform(dpr,0,0,dpr,0,0);if(ow)redraw()}
canvas.addEventListener('pointerdown',e=>{inputs++;audioInit();canvas.setPointerCapture(e.pointerId);const rect=canvas.getBoundingClientRect();pointer={x:(e.clientX-rect.left)/W,y:(e.clientY-rect.top)/H,down:true};active=newStroke();active.points.push({x:pointer.x,y:pointer.y});strokes.push(active);if(strokes.length>42){strokes.shift();redraw()}chime(pointer.x,pointer.y)});function flush(x,y){if(!active)return;const a={...active.points.at(-1)},steps=Math.min(40,Math.max(1,Math.ceil(Math.hypot((x-a.x)*W,(y-a.y)*H)/3)));for(let i=1;i<=steps;i++)append(active,{x:a.x+(x-a.x)*i/steps,y:a.y+(y-a.y)*i/steps})}canvas.addEventListener('pointermove',e=>{if(pointer&&pointer.down){inputs++;pointer.x=e.clientX/W;pointer.y=e.clientY/H;flush(pointer.x,pointer.y)}});function release(e){if(pointer&&active&&e&&Number.isFinite(e.clientX))flush(e.clientX/W,e.clientY/H);if(pointer)pointer.down=false;active=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);let hold=0;
function frame(t){requestAnimationFrame(frame);if(paused){lastT=t;return}const dt=Math.min(35,t-lastT);lastT=t;frames++;if(pointer?.down&&active){const p=active.points.at(-1);let dx=pointer.x-p.x,dy=pointer.y-p.y;if(Math.hypot(dx,dy)>.0007){append(active,{x:p.x+dx*.28,y:p.y+dy*.28});hold=0}else{hold+=dt;if(hold>110){append(active,{x:pointer.x+Math.sin(t*.002)*.003,y:pointer.y+Math.cos(t*.0023)*.003});hold=0}}if(drone)drone.frequency.setTargetAtTime(80+pointer.x*90,audio.currentTime,.2)}if(age&&frames%120===0){for(const st of strokes)st.opacity*=.982;g.globalCompositeOperation='destination-out';g.fillStyle='rgba(0,0,0,.018)';g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over'}bg();ctx.drawImage(ink,0,0,W,H)}
function update(){ $('status').textContent=palettes[palette].name.toUpperCase()+' / '+axis+' FOLDS';$('palette').textContent=palettes[palette].name;$('sym').textContent=axis+' folds'}$('palette').onclick=()=>{palette=(palette+1)%3;update();inputs++};$('sym').onclick=()=>{axis=axis===2?4:axis===4?6:2;update();inputs++};for(const id of['fold','spiral','age','erase'])$(id).onclick=()=>{inputs++;if(id==='fold')reflect=!reflect;if(id==='spiral')spiral=!spiral;if(id==='age')age=!age;if(id==='erase')erase=!erase;$(id).setAttribute('aria-pressed',String(id==='fold'?reflect:id==='spiral'?spiral:id==='age'?age:erase))};$('undo').onclick=()=>{inputs++;strokes.pop();redraw()};let lastReset=0;$('reset').onclick=()=>{resets++;inputs++;release();if(performance.now()-lastReset<700)starter();else{strokes=[];redraw()}lastReset=performance.now()};$('reset').title='Clear canvas. Double tap for starter.';$('mute').onclick=()=>{inputs++;muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').setAttribute('aria-pressed',String(muted));if(muted&&master)master.gain.setTargetAtTime(0,audio.currentTime,.08);else{audioInit();if(master)master.gain.setTargetAtTime(1,audio.currentTime,.08)}};
let prevFrames=0;setInterval(()=>{fps=frames-prevFrames;prevFrames=frames;const data={frames,fps,entities:strokes.reduce((a,s)=>a+s.points.length,0),inputs,resets,muted,width:W,height:H,audio:audio?audio.state:'locked'};Object.entries(data).forEach(([k,v])=>qa.dataset[k]=v);qa.textContent=JSON.stringify(data)},1000);document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(audio){if(paused)audio.suspend();else if(!muted)audio.resume()}});addEventListener('resize',resize);resize();starter();requestAnimationFrame(frame);
})();
</script></html>
