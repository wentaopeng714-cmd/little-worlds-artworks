<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Resonant Pond — Little Worlds</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142d3a;color:#e5e8cf;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(26px,env(safe-area-inset-top));left:7%;right:7%;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.65}h1{font-size:clamp(27px,5vw,46px);font-weight:500;letter-spacing:-1.5px;margin:12px 0 0}.tools{position:absolute;right:0;top:0;display:flex;gap:8px;pointer-events:auto}button{border:1px solid currentColor;border-radius:30px;color:inherit;background:#142d3a;font:10px Arial;letter-spacing:1px;padding:10px 12px;cursor:pointer;min-height:38px}button:focus-visible{outline:3px solid currentColor;outline-offset:3px}footer{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:7%;right:7%;font-size:11px;letter-spacing:.6px;pointer-events:none;line-height:1.7}.num{float:right;opacity:.45}@media(max-width:480px){header{top:max(24px,env(safe-area-inset-top))}.tools{top:74px}}</style></head><body><canvas id="art" aria-label="Resonant Pond interactive canvas"></canvas><header><div class="eyebrow">Little Worlds / Touch the quiet</div><h1>Resonant Pond</h1><div class="tools"><button id="mute" aria-label="Toggle sound" aria-pressed="false">SOUND ON</button><button id="reset" aria-label="Reset artwork">RESET</button></div></header><footer>Hold water, release: echo spring. Tap spring: erase.<br>Drag stones into a chorus. Tap stone: tune.<span class="num">07</span></footer><script>const c=document.getElementById('art'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,D=1,muted=false,ac=null,interactions=0,resets=0;function unlock(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});}function tone(f,d=.18,v=.045,type='sine'){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(v,ac.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02);}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'SOUND OFF':'SOUND ON';document.getElementById('mute').setAttribute('aria-pressed',String(muted));};function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}size();

let waves=[],stones=[],sources=[],held=false,drag=-1,pointer={x:.5,y:.5},t=0,last=0,pulse=0,waveCount=0,started=0,moved=false,resonances=0,interferences=0,sourceEdits=0,layout='OPEN',beat=0;const pitches=[174.61,220,261.63,293.66,349.23,440];
function reset(){waves=[];sources=[];held=false;drag=-1;stones=[{x:.3,y:.43,r:.055,c:'#d9c96d',glow:0,note:0},{x:.69,y:.56,r:.075,c:'#e7775a',glow:0,note:2},{x:.43,y:.72,r:.043,c:'#a2bab1',glow:0,note:4}];waveCount=0;resonances=0;interferences=0;sourceEdits=0;}reset();
function wave(x,y,soft=false){waves.push({x,y,r:0,life:1,hit:[],c:soft?'#e7775a':'#e5e8b7'});if(waves.length>40)waves.shift();waveCount++;if(!soft)tone(pitches[Math.min(5,Math.floor(x*6))],.65,.035);}
c.onpointerdown=e=>{e.preventDefault();unlock();c.setPointerCapture(e.pointerId);pointer=pos(e);held=true;started=pulse=t;moved=false;interactions++;drag=stones.findIndex(s=>Math.hypot((s.x-pointer.x)*W,(s.y-pointer.y)*H)<s.r*Math.min(W,H)*1.6);wave(pointer.x,pointer.y);};
c.onpointermove=e=>{if(!held)return;const p=pos(e);if(Math.hypot((p.x-pointer.x)*W,(p.y-pointer.y)*H)>3)moved=true;pointer={x:Math.max(.06,Math.min(.94,p.x)),y:Math.max(.28,Math.min(.84,p.y))};if(drag>=0){stones[drag].x=pointer.x;stones[drag].y=pointer.y;}};
function end(){if(!held)return;if(drag>=0&&!moved){stones[drag].note=(stones[drag].note+1)%6;stones[drag].glow=1;tone(pitches[stones[drag].note]*2,.5);}else if(drag<0){let i=sources.findIndex(s=>Math.hypot((s.x-pointer.x)*W,(s.y-pointer.y)*H)<24);if(i>=0){sources.splice(i,1);sourceEdits++;}else if(t-started>.65){if(sources.length>=3)sources.shift();sources.push({x:pointer.x,y:pointer.y,phase:Math.random()*.4});sourceEdits++;}}held=false;drag=-1;}c.onpointerup=end;c.onpointercancel=()=>{held=false;drag=-1;};document.getElementById('reset').onclick=()=>{unlock();reset();resets++;};addEventListener('resize',size);
function draw(ms){let dt=Math.min((ms-last)/1000,.04)||.016;last=ms;t+=dt;const S=Math.min(W,H);let spread=0;for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)spread+=Math.hypot((stones[i].x-stones[j].x)*W,(stones[i].y-stones[j].y)*H)/S;layout=spread<.65?'CHORUS':spread>1.5?'CONSTELLATION':'ORBIT';ctx.fillStyle='#142d3a';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#254653';ctx.lineWidth=1;for(let i=0;i<8;i++){ctx.beginPath();for(let x=0;x<=W;x+=8){let y=H*(.3+i*.071)+Math.sin(x/W*7+t*.23+i)*7;ctx.lineTo(x,y);}ctx.stroke();}
ctx.strokeStyle=layout==='CHORUS'?'#d9c96d55':'#a2bab133';ctx.setLineDash([3,8]);ctx.beginPath();stones.forEach((s,i)=>i?ctx.lineTo(s.x*W,s.y*H):ctx.moveTo(s.x*W,s.y*H));ctx.closePath();ctx.stroke();ctx.setLineDash([]);
if(held&&t-pulse>.43){wave(pointer.x,pointer.y);pulse=t;}const tempo=layout==='CHORUS'?.62:layout==='CONSTELLATION'?1.25:.9;if(Math.floor(t/tempo)!==beat){beat=Math.floor(t/tempo);for(const s of sources)wave(s.x,s.y);}
for(const s of sources){ctx.strokeStyle='#e5e8b7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x*W,s.y*H,8+Math.sin(t*5)*2,0,7);ctx.stroke();ctx.fillStyle='#e5e8b7';ctx.fillRect(s.x*W-2,s.y*H-2,4,4);}
for(let i=waves.length-1;i>=0;i--){let p=waves[i];p.life-=dt*.25;p.r+=dt*S*.21;if(p.life<=0){waves.splice(i,1);continue;}stones.forEach((s,k)=>{const dist=Math.hypot((p.x-s.x)*W,(p.y-s.y)*H/.65);if(!p.hit.includes(k)&&Math.abs(dist-p.r)<S*.04){p.hit.push(k);s.glow=1;resonances++;tone(pitches[s.note]*(layout==='CHORUS'?2:1),.45,.025);}});ctx.globalAlpha=p.life*.7;ctx.strokeStyle=p.c;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(p.x*W,p.y*H,p.r,p.r*.65,0,0,7);ctx.stroke();ctx.globalAlpha=1;}
if(sources.length>1){const a=sources[0],b=sources[1];for(let j=0;j<21;j++){const f=j/20,x=(a.x*(1-f)+b.x*f)*W,y=(a.y*(1-f)+b.y*f)*H;const v=Math.pow(Math.cos(f*15-t*4),2);ctx.fillStyle='#e5e8b7';ctx.globalAlpha=v*.7;ctx.beginPath();ctx.ellipse(x,y,2+v*6,2+v*2,t,0,7);ctx.fill();}ctx.globalAlpha=1;interferences++;}
for(let i=0;i<stones.length;i++){let s=stones[i],r=s.r*S;s.glow=Math.max(0,s.glow-dt*.9);let y=s.y*H+Math.sin(t*2+i)*s.glow*6;ctx.fillStyle=s.c;ctx.beginPath();ctx.ellipse(s.x*W,y,r*(1+s.glow*.15),r*.8,i*.7,0,7);ctx.fill();ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.globalAlpha=s.glow;ctx.beginPath();ctx.arc(s.x*W,y,r+9+s.glow*12,0,7);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#142d3a';for(let n=0;n<=s.note;n++){ctx.beginPath();ctx.arc(s.x*W-r*.45+n*r*.17,y,2,0,7);ctx.fill();}}
ctx.fillStyle='#a2bab1';ctx.textAlign='center';ctx.font='10px Arial';ctx.fillText(layout+' / '+sources.length+' ECHO SPRINGS',W*.5,H*.88);requestAnimationFrame(draw);}requestAnimationFrame(draw);window.__artTest={getState:()=>({waves:waves.length,waveCount,held,drag,stones:stones.map(s=>({x:s.x,y:s.y,note:s.note})),sources:sources.map(s=>({x:s.x,y:s.y})),sourceEdits,resonances,interferences,mode:layout,interactions,resets,muted,audio:ac?ac.state:'locked',width:W,height:H,geometry:{water:[.5,.6],stones:stones.map(s=>[s.x,s.y])}})};
</script></body></html>
