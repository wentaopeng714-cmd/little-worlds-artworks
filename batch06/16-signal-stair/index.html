<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阶梯信号台 · 第六组</title><style>:root{--bg:#d4dfc9;--ink:#294d4b;--accent:#963e57;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>阶梯信号台</h1><p>把双轨折线织成信号路；放门、切断或织转向旁路，再发脉冲观察它停住和释放。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="阶梯信号台，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="trace" id="trace">织双轨线</button><button data-action="gate" id="gate">放门开合</button><button data-action="turn" id="turn">阶梯转向</button><button data-action="cut" id="cut">线路断接</button><button data-action="pulse" id="pulse">发四脉冲</button><button data-action="tempo" id="tempo">脉冲步频</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=16;window.artMeta={"number": 16, "slug": "16-signal-stair", "title": "阶梯信号台", "group": "G", "mothers": ["code_artifact (1).html"], "innovation": "双轨折线织出信号路，置门、断路、转向、脉冲编排", "description": "把双轨折线织成信号路；放门、切断或织转向旁路，再发脉冲观察它停住和释放。", "ui": {"bg": "#d4dfc9", "ink": "#294d4b", "accent": "#963e57"}, "controls": [{"id": "trace", "label": "织双轨线"}, {"id": "gate", "label": "放门开合"}, {"id": "turn", "label": "阶梯转向"}, {"id": "cut", "label": "线路断接"}, {"id": "pulse", "label": "发四脉冲"}, {"id": "tempo", "label": "脉冲步频"}], "newMechanics": ["门会拦住真实沿路径移动的脉冲", "点线路插入往返阶梯旁路", "可接回的断路", "三档脉冲步频与持续门控状态"], "artDirection": ["双平行正交线、密排跨接短线、笔头靶环，保留母本逐步拓扑语法", "矿绿坐标纸上靛青/铜墨线路与胭脂闸门；不是旧路径运输玩具"], "testPlan": [{"control": "trace", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "gate", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "turn", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "cut", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "pulse", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}], "stateFields": ["vertices<=2200", "gates<=12", "activePulses<=32", "reroutes增加", "openGates点门改变", "blockedArrivals及delivered随真实门控改变"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,clamp=env.clamp,TAU=Math.PI*2;let points,gates,pulses,mode,drag,head,target,delivered,stopped,turns,phase,tempo;const colors=['#8e3f5c','#235665','#ac6929'];
function add(x,y){x=clamp(x,.07,.93);y=clamp(y,.1,.9);if(points.length>=2200){points.splice(0,160);gates=gates.map(g=>({...g,i:g.i-160})).filter(g=>g.i>=0);pulses.forEach(p=>p.at=Math.max(0,p.at-160))}points.push({x,y,cut:false});head={x,y}}
function segment(x,y){let dx=x-head.x,dy=y-head.y;while(Math.abs(dx)>.002){let k=Math.sign(dx)*Math.min(Math.abs(dx),.012);add(head.x+k,head.y);dx=x-head.x}while(Math.abs(dy)>.002){let k=Math.sign(dy)*Math.min(Math.abs(dy),.013);add(head.x,head.y+k);dy=y-head.y}}
function reset(){points=[];gates=[];pulses=[];head={x:.08,y:.19};add(head.x,head.y);let rows=env.W<650?7:5;for(let r=0;r<rows;r++){let gap=.65/(rows-1),base=.18+r*gap,dir=r%2?-1:1;segment(dir>0?.1:.9,base);for(let j=0;j<20;j++){let x=dir>0?.1+j*.04:.9-j*.04;segment(x,base+(j%4<2?-.025:.035));segment(x+dir*.025,head.y)}if(r<rows-1)segment(head.x,base+gap)}gates=[{i:Math.floor(points.length*.26),open:true},{i:Math.floor(points.length*.63),open:false}];mode='trace';drag=null;target=null;delivered=stopped=turns=phase=0;tempo=1}
function nearest(p){let x=p.x/env.W,y=p.y/env.H,b=0,d=1e9;points.forEach((n,i)=>{let dd=Math.hypot((n.x-x)*env.W,(n.y-y)*env.H);if(dd<d){d=dd;b=i}});return b}
function touch(p){let i=nearest(p),n=points[i];if(mode==='gate'){let g=gates.find(g=>Math.abs(g.i-i)<18);if(g)g.open=!g.open;else if(gates.length<12)gates.push({i,open:false})}if(mode==='cut'){for(let j=Math.max(0,i-3);j<Math.min(points.length,i+4);j++){if(drag&&drag.seen.has(j))continue;points[j].cut=drag?drag.cutValue:!points[j].cut;if(drag)drag.seen.add(j)}}if(mode==='turn'){let dir=turns%2?1:-1,extra=[],x=n.x,y=n.y;for(let k=0;k<8;k++){x=clamp(x+.018,.08,.91);extra.push({x,y,cut:false});y=clamp(y+dir*.014,.1,.9);extra.push({x,y,cut:false})}extra.push({x:n.x,y,cut:false},{x:n.x,y:n.y,cut:false});points.splice(i,0,...extra);for(let g of gates)if(g.i>=i)g.i+=extra.length;points=points.slice(0,2200);turns++}}
function input(kind,p){if(kind==='down'){drag={x:p.x,y:p.y,cutValue:!points[nearest(p)].cut,seen:new Set()};if(mode==='trace')target={x:p.x/env.W,y:p.y/env.H};else touch(p)}if(kind==='move'&&drag){if(mode==='trace')target={x:p.x/env.W,y:p.y/env.H};if(mode==='cut'&&Math.hypot(p.x-drag.x,p.y-drag.y)>15){touch(p);drag.x=p.x;drag.y=p.y}}if(kind==='up'||kind==='cancel'){drag=null;target=null}}
function action(id){if(id==='pulse'){for(let i=0;i<4;i++)pulses.push({at:-i*22,col:(pulses.length+i)%3,blocked:false});pulses=pulses.slice(-32);return}if(id==='tempo'){tempo=tempo===1?2:tempo===2?.5:1;return}mode=id}
function draw(dt,time){phase+=dt;if(target){let dx=target.x-head.x,dy=target.y-head.y;for(let k=0;k<Math.ceil(dt*90);k++){if(Math.abs(dx)*env.W>Math.abs(dy)*env.H)add(head.x+Math.sign(dx)*Math.min(Math.abs(dx),.012),head.y);else add(head.x,head.y+Math.sign(dy)*Math.min(Math.abs(dy),.013));dx=target.x-head.x;dy=target.y-head.y;if(Math.abs(dx)+Math.abs(dy)<.005)break}}
c.fillStyle='#d4dfc9';c.fillRect(0,0,env.W,env.H);c.strokeStyle='#52766a19';for(let x=14;x<env.W;x+=18){c.beginPath();c.moveTo(x,0);c.lineTo(x,env.H);c.stroke()}for(let y=14;y<env.H;y+=18){c.beginPath();c.moveTo(0,y);c.lineTo(env.W,y);c.stroke()}c.fillStyle='#456456';c.font='11px monospace';c.fillText('SIGNAL LOOM / ORTHOGONAL 02',16,24);
for(let lane=0;lane<2;lane++){c.strokeStyle=lane?'#927147':'#275460';c.lineWidth=lane?1.3:2.2;c.beginPath();points.forEach((n,i)=>{if(i===0||n.cut||points[i-1].cut)c.moveTo(n.x*env.W,n.y*env.H+lane*5);else c.lineTo(n.x*env.W,n.y*env.H+lane*5)});c.stroke()}for(let i=0;i<points.length;i+=7){let n=points[i];c.strokeStyle='#467b6c80';c.beginPath();c.moveTo(n.x*env.W,n.y*env.H-1);c.lineTo(n.x*env.W,n.y*env.H+6);c.stroke()}
for(let g of gates){let n=points[Math.min(g.i,points.length-1)];c.save();c.translate(n.x*env.W,n.y*env.H);c.fillStyle=g.open?'#f4edce':'#b85851';c.strokeStyle='#3f5147';c.lineWidth=1.5;c.fillRect(-7,-13,14,30);c.strokeRect(-7,-13,14,30);c.fillStyle=g.open?'#477d66':'#f1dbb2';c.fillRect(-3,g.open?-10:-2,6,g.open?7:14);c.restore()}
for(let p of pulses){let next=p.at+dt*45*tempo;let block=gates.find(g=>!g.open&&g.i>=p.at&&g.i<next+1),cut=points.slice(Math.max(0,Math.floor(p.at)),Math.max(0,Math.min(points.length,Math.ceil(next)+1))).findIndex(n=>n.cut);p.blocked=!!block||cut>=0;if(p.blocked){if(!p.counted){stopped++;p.counted=true}next=block?block.i-.01:p.at}else p.counted=false;p.at=next;if(p.at>=points.length){delivered++;p.at=points.length+1;continue}if(p.at<0)continue;let n=points[Math.floor(p.at)];c.fillStyle=colors[p.col];c.beginPath();c.arc(n.x*env.W,n.y*env.H+2,5,0,TAU);c.fill();if(p.blocked){c.strokeStyle=colors[p.col]+'80';c.beginPath();c.arc(n.x*env.W,n.y*env.H+2,10+Math.sin(time*4)*3,0,TAU);c.stroke()}}pulses=pulses.filter(p=>p.at<=points.length);let h=points[points.length-1];c.strokeStyle='#994f42';c.beginPath();c.arc(h.x*env.W,h.y*env.H,9,0,TAU);c.moveTo(h.x*env.W-12,h.y*env.H);c.lineTo(h.x*env.W+12,h.y*env.H);c.stroke();c.fillStyle='#567562';c.font='12px monospace';c.fillText('↗ '+delivered+'  /  '+gates.filter(g=>g.open).length+' OPEN',18,env.H-20)}
return{reset,draw,input,action,state:()=>({bounded:true,status:({trace:'接线：拖动末端引出逐步双轨阶梯',gate:'置门：点线路放门或开合；关门会拦住真实脉冲',turn:'转向：点线路织出新的往返阶梯旁路',cut:'断接：在线路上点按切断，再点接回'})[mode]+' · 发脉冲后观察，再开门释放',mode,vertices:points.length,gates:gates.length,openGates:gates.filter(g=>g.open).length,reroutes:turns,cutVertices:points.filter(p=>p.cut).length,activePulses:pulses.length,delivered,blockedArrivals:stopped,tempo,gatesState:gates.map(g=>({x:points[Math.min(g.i,points.length-1)].x,y:points[Math.min(g.i,points.length-1)].y,open:g.open}))})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
