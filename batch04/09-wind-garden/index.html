(()=>{'use strict';const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),qa=document.querySelector('#qa'),note=document.querySelector('#note');let W=900,H=550,dpr=1,mode='plant',kind=0,season=0,plants=[],gusts=[],pointer=null,picked=null,frames=0,inputs=0,resets=0,last=0,t=0,lastPlant=0;const cap=100;const palettes=[{paper:'#f5efde',stem:'#527e61',leaf:'#87a783',poppy:'#e6846f',bell:'#608697',ink:'#344f44'},{paper:'#e7eade',stem:'#526b68',leaf:'#98b7a0',poppy:'#de927e',bell:'#7a8bad',ink:'#384c4a'},{paper:'#efdfcc',stem:'#7d7854',leaf:'#b1a272',poppy:'#c65c51',bell:'#717f9e',ink:'#504a35'}];let rng=1;const rand=()=>{rng=(rng*1664525+1013904223)>>>0;return rng/4294967296};function plant(x,y,k,scale=1){if(plants.length>=cap)plants.shift();let maxh=Math.max(34,Math.min(H*.5,y-45));plants.push({x,y,h:(maxh*(.45+rand()*.5))*scale,kind:k,lean:(rand()-.5)*.25,phase:rand()*6.28,flex:0,v:0,size:9+rand()*7,seed:rand()*1000,cut:0});update()}function setup(){rng=72341;plants=[];gusts=[];pointer=null;picked=null;for(let i=0;i<27;i++){let x=W*(.14+rand()*.74),y=H*(.68+rand()*.18);plant(x,y,i%4)}mode='plant';kind=0;season=0;sync();update()}function resize(){let r=canvas.getBoundingClientRect(),oldW=W,oldH=H;W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(plants.length){for(let p of plants){p.x=p.x/oldW*W;p.y=p.y/oldH*H;p.h=p.h/oldH*H}}}new ResizeObserver(resize).observe(canvas);resize();setup();function sync(){['plant','wind','move','prune','harvest'].forEach(k=>document.getElementById(k).classList.toggle('active',mode===k));['daisy','poppy','fern','bell'].forEach((k,i)=>document.getElementById(k).classList.toggle('active',kind===i));document.querySelector('#season').textContent=['晚夏','清晨','秋日'][season];note.textContent={plant:'选一种花，在纸上栽下它',wind:'拖出风向，让花枝相互回应',move:'拖住花朵，重新安排花的位置',prune:'点按花朵，轻轻剪短一段枝条',harvest:'点一朵花剪下它，插入右侧的陶 flex=0;p.cut++}}else if(mode==='prune'){let p=nearest(pointer);if(p){p.h=Math.max(28,p.h*.73);p.size=Math.max(6,p.size*.92);p.cut++;p.v+=.045}}else wind(pointer,10,0)};canvas.onpointermove=e=>{if(!pointer)return;let q=pos(e),dx=q.x-pointer.x,dy=q.y-pointer.y;if(mode==='wind')wind(q,dx,dy);else if(mode==='move'&&picked){picked.x=Math.max(18,Math.min(W-18,picked.x+dx));picked.y=Math.max(picked.h+35,Math.min(H-24,picked.y+dy));picked.v+=dx*.0003}else if(mode==='plant'&&performance.now()-lastPlant>170&&Math.hypot(dx,dy)>2){plant(q.x,Math.min(H-26,q.y+H*.21),kind,.85);lastPlant=performance.now()}pointer=q;input()};canvas.onpointerup=canvas.onpointercancel=()=>{pointer=null;picked=null};function leaf(x,y,sz,ang,col){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(sz*.45,-sz*.52,sz, -sz*.2,sz,0);ctx.bezierCurveTo(sz*.7,sz*.28,sz*.2,sz*.4,0,0);ctx.fill();ctx.restore()}function drawPlant(p){let pal=palettes[season],bend=(p.lean+p.flex)*p.h,tx=p.x+bend,ty=p.y-p.h;ctx.strokeStyle=pal.stem;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.bezierCurveTo(p.x-bend*.14,p.y-p.h*.35,tx-bend*.1,ty+p.h*.3,tx,ty);ctx.stroke();if(p.kind===2){for(let i=1;i<11;i++){let u=i/11,y=p.y-p.h*u,x=p.x+bend*u*u,sz=p.size*1.5*Math.sin(u*Math.PI);leaf(x,y,sz,-.7,pal.leaf);leaf(x,y,sz,Math.PI+.7,pal.stem)}leaf(tx,ty,p.size,-1.6,pal.leaf);return}for(let i=0;i<3;i++){let u=.25+i*.19;leaf(p.x+bend*u*u,p.y-p.h*u,p.size*(1.1-i*.13),i%2?-.7:Math.PI+.5,pal.leaf)}ctx.save();ctx.translate(tx,ty);ctx.rotate(p.flex*.55+Math.sin(p.phase)*.13);if(p.kind===0){for(let j=0;j<9;j++){ctx.save();ctx.rotate(j*Math.PI*2/9);ctx.fillStyle='#fff9e9';ctx.beginPath();ctx.ellipse(0,-p.size*.72,p.size*.33,p.size*.63,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.fillStyle='#c8a54d';ctx.beginPath();ctx.arc(0,0,p.size*.29,0,6.29);ctx.fill()}else if(p.kind===1){ctx.fillStyle=pal.poppy;for(let j=0;j<4;j++){ctx.save();ctx.rotate(j*Math.PI/2);ctx.beginPath();ctx.ellipse(0,-p.size*.5,p.size*.73,p.size*.82,.15,0,6.29);ctx.fill();ctx.restore()}ctx.fillStyle='#493f37';ctx.beginPath();ctx.arc(0,0,p.size*.28,0,6.29);ctx.fill();ctx.strokeStyle='#f3ad82';ctx.lineWidth=.8;for(let j=0;j<10;j++){let a=j*.628;ctx.beginPath();ctx.moveTo(Math.cos(a)*p.size*.29,Math.sin(a)*p.size*.29);ctx.lineTo(Math.cos(a)*p.size*.52,Math.sin(a)*p.size*.52);ctx.stroke()}}else{ctx.fillStyle=pal.bell;for(let j=0;j<4;j++){ctx.save();ctx.translate((j%2?1:-1)*p.size*.45,j*p.size*.61);ctx.rotate(j%2?.4:-.4);ctx.beginPath();ctx.moveTo(-p.size*.3,0);ctx.quadraticCurveTo(-p.size*.85,p.size*.8,0,p.size*.65);ctx.quadraticCurveTo(p.size*.8,p.size*.7,p.size*.3,0);ctx.fill();ctx.restore()}}ctx.restore()}function frame(ms){let dt=Math.min(2,(ms-last)/16.7||1);last=ms;t+=dt*.01;let pal=palettes[season];ctx.fillStyle=pal.paper;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#b6bda15c';ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(W*.5,H*.91,W*.36,H*.035,0,0,6.29);ctx.stroke();ctx.fillStyle='#d3d5b444';ctx.beginPath();ctx.ellipse(W*.5,H*.92,W*.36,H*.024,0,0,6.29);ctx.fill();for(let p of plants){p.v+=(-p.flex*.016-p.v*.04)*dt;p.flex+=p.v*dt;p.flex=Math.max(-.72,Math.min(.72,p.flex));let save=p.flex;p.flex+=Math.sin(t+p.phase)*.024;drawPlant(p);p.flex=save}ctx.save();ctx.translate(W*.67,H*.90);let vw=Math.min(52,W*.095),vh=H*.155;ctx.fillStyle='#b17c69';ctx.beginPath();ctx.moveTo(-vw*.32,-vh);ctx.lineTo(vw*.32,-vh);ctx.bezierCurveTo(vw*.25,-vh*.64,vw*.85,-vh*.49,vw*.70,0);ctx.quadraticCurveTo(0,vh*.17,-vw*.70,0);ctx.bezierCurveTo(-vw*.85,-vh*.49,-vw*.25,-vh*.64,-vw*.32,-vh);ctx.fill();ctx.strokeStyle='#f0c5a878';ctx.lineWidth=1;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*vw*.1,-vh*.89);ctx.quadraticCurveTo(i*vw*.2,-vh*.47,i*vw*.17,vh*.03);ctx.stroke()}ctx.fillStyle='#665844';ctx.beginPath();ctx.ellipse(0,-vh,vw*.32,2,0,0,6.29);ctx.fill();ctx.restore();for(let i=gusts.length-1;i>=0;i--){let g=gusts[i];g.life-=.015*dt;if(g.life<=0){gusts.splice(i,1);continue}g.x+=g.dx*.15;g.y+=g.dy*.15;ctx.strokeStyle=`rgba(114,142,118,${g.life*.25})`;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(g.x-g.dx*2,g.y-g.dy*2);ctx.quadraticCurveTo(g.x-g.dx,g.y-g.dy-6,g.x,g.y);ctx.stroke()}ctx.strokeStyle='#b0b79650';ctx.lineWidth=.5;for(let i=0;i<38;i++){let x=(i*73.17)%W,y=H*.94+(i%4)*3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+7,y-.5);ctx.stroke()}qa.dataset.frames=++frames;if(frames%30===0)update();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();

const source=config[0]==='noise'?ctx.createBufferSource():ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain(),pan=ctx.createStereoPanner(),duration=config[2]+energy*.14;const pitch=config[1]*Math.pow(2,((hash%7)-3)/12)*(1.1-y*.25);
