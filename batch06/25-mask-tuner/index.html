<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>面具调音师 · 第六组</title><style>:root{--bg:#704a5b;--ink:#fff0d1;--accent:#efb757;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>面具调音师</h1><p>拉眉折角、拉嘴三段开合、拉侧片露出底层；三种面具可换形，拓音章后共鸣。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="面具调音师，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="brow" id="brow">折眉</button><button data-action="mouth" id="mouth">调嘴</button><button data-action="fold" id="fold">揭侧片</button><button data-action="layer" id="layer">换面具</button><button data-action="imprint" id="imprint">拓音章</button><button data-action="resonate" id="resonate">共鸣</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=25;window.artMeta={"number": 25, "slug": "25-mask-tuner", "title": "面具调音师", "group": "T", "mothers": ["cartoon_rig_audio(1).html"], "innovation": "多片角面具可换层、拉折五官，三阶段嘴型与夸张面具变身", "description": "拉眉折角、拉嘴三段开合、拉侧片露出底层；三种面具可换形，拓音章后共鸣。", "ui": {"bg": "#704a5b", "ink": "#fff0d1", "accent": "#efb757"}, "controls": [{"id": "brow", "label": "折眉"}, {"id": "mouth", "label": "调嘴"}, {"id": "fold", "label": "揭侧片"}, {"id": "layer", "label": "换面具"}, {"id": "imprint", "label": "拓音章"}, {"id": "resonate", "label": "共鸣"}], "artDirection": ["角面具三种真实轮廓", "多层折片与粗块眉", "铜挂架与绸纹幕"], "newMechanics": ["折眉改变眉角与眼瞳", "调嘴抿口/嘟口/露齿", "揭侧片展开双侧角面", "换面具切鸮角/伶角/日芒轮廓", "拓音章最多6枚面具音色章", "共鸣让当前开合与嘴型影响回声形"], "testPlan": [{"control": "mouth", "from": [0.5, 0.48], "to": [0.6, 0.73], "hold": 250}, {"control": "fold", "from": [0.65, 0.5], "to": [0.84, 0.46], "hold": 250}, {"control": "layer", "from": [0.5, 0.35], "to": [0.6, 0.45], "hold": 150}, {"control": "imprint", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 100}, {"control": "resonate", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 100}], "stateFields": ["mask 0/1/2", "mouthZone 0/1/2", "fold 0–1", "seals<=6", "chords"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,cl=env.clamp;let s,g=null;
function reset(){s={mode:'brow',brow:.2,mouth:.15,fold:0,mask:0,seals:[],resonating:0,chords:0,tension:0};g=null;}

function L(a,st,w=2){c.strokeStyle=st;c.lineWidth=w;c.lineCap='round';c.beginPath();a.forEach((v,i)=>i?c.lineTo(...v):c.moveTo(...v));c.stroke();}

function text(t,x,y,z,f){c.fillStyle=f;c.textAlign='center';c.font=`700 ${z}px system-ui`;c.fillText(t,x,y);}
function outline(type,scale=1){const shapes=[[[-112,-155],[-64,-209],[0,-171],[64,-209],[112,-155],[151,-24],[110,106],[0,165],[-110,106],[-151,-24]],[[-140,-145],[-61,-188],[0,-232],[61,-188],[140,-145],[168,0],[95,135],[0,182],[-95,135],[-168,0]],[[-135,-146],[-95,-180],[-73,-218],[-29,-194],[0,-236],[29,-194],[73,-218],[95,-180],[135,-146],[164,-68],[147,72],[70,144],[0,178],[-70,144],[-147,72],[-164,-68]]];return shapes[type].map(v=>v.map(q=>q*scale));}
function draw(dt,t){s.resonating=Math.max(0,s.resonating-dt);const {x,y,k}=lay();c.fillStyle='#704a5b';c.fillRect(0,0,env.W,env.H);for(let i=0;i<50;i++){c.strokeStyle='rgba(232,183,171,.05)';c.beginPath();c.moveTo(i*env.W/50,0);c.lineTo(i*env.W/50+60,env.H);c.stroke();}c.save();c.translate(x,y);c.scale(k,k);
// Hanging silk and brass tuning frame, with stitch texture.
P([[-240,-268],[240,-268],[213,239],[-213,239]],'#452f43');P([[-239,-268],[-145,-268],[-198,244],[-220,208]],'#b97175');P([[239,-268],[145,-268],[198,244],[220,208]],'#a35a6d');for(let j=0;j<16;j++){L([[-234+j*5,-250],[-204+j*2,180]],'rgba(244,164,147,.22)',1);L([[234-j*5,-250],[204-j*2,180]],'rgba(244,164,147,.16)',1);}L([[-244,-266],[244,-266]],'#efb757',10);
for(let side of [-1,1]){L([[side*68,-266],[side*72,-189]],'#e9c186',3);E(side*68,-259,7,7,'#fbca68');}
// Echo silhouettes are retained material imprints, not saved joint poses.
for(let j=0;j<s.seals.length;j++){c.save();c.translate(-201+j*79,225);c.scale(.18,.18);P(outline(s.seals[j].mask),'#b97c78','#f6cc88',9);c.fillStyle='#fff0c1';c.fillRect(-38,-20,76,12);E(0,52,20,10+s.seals[j].zone*16,'#583849');c.restore();}
if(s.resonating>0){for(let j=3;j>=1;j--){c.save();c.scale(1+j*(.05+s.tension*.025),1+j*(.05+s.tension*.025));P(outline(s.mask),null,`rgba(238,195,104,${(.1+s.seals.length*.025)*s.resonating/4})`,2);c.restore();}}
const pal=[['#ed955a','#d77551','#29555b','#f6c15e'],['#d0cfab','#95afa0','#813f5c','#ec957c'],['#efb955','#d28845','#314756','#f3dfaa']][s.mask];let f=s.fold;
// Back mask is exposed by large articulated cheek leaves.
P(outline(s.mask),pal[2],'#e5b77b',2);c.save();c.translate(-92,15);c.rotate(-f*.92);P([[-48,-131],[3,-162],[46,-25],[27,95],[-10,129],[-48,64]],pal[1]);P([[-48,-131],[-29,-101],[-17,90],[-48,64]],'#c26455');for(let j=0;j<9;j++)L([[-30+j*6,-87],[-8+j*3,83]],'rgba(255,220,169,.17)',1);c.restore();c.save();c.translate(92,15);c.rotate(f*.92);P([[48,-131],[-3,-162],[-46,-25],[-27,95],[10,129],[48,64]],pal[0]);P([[48,-131],[29,-101],[17,90],[48,64]],'#f5c18a');c.restore();
P([[-96,-144],[0,-183],[96,-144],[96,-48],[67,88],[0,147],[-67,88],[-96,-48]],pal[0]);P([[0,-183],[96,-144],[96,-48],[67,88],[0,147],[0,2]],pal[1]);
// Different silhouettes have genuinely different crowns and nose sculptures.
if(s.mask===0){P([[-111,-158],[-73,-216],[-31,-174]],'#325b61');P([[111,-158],[73,-216],[31,-174]],'#325b61');P([[-17,-33],[0,-62],[24,2],[0,22]],'#713f48');}
if(s.mask===1){for(let side of [-1,1])P([[side*73,-151],[side*175,-228],[side*162,-127],[side*120,-105]],side<0?'#d99381':'#83a399');P([[-17,-33],[17,-33],[39,32],[0,19],[-39,32]],'#98485b');E(0,-231,12,12,'#f3b35c');}
if(s.mask===2){for(let j=0;j<7;j++){let a=(j/6)*Math.PI+Math.PI;P([[Math.cos(a)*115,Math.sin(a)*130-51],[Math.cos(a)*166,Math.sin(a)*175-51],[Math.cos(a+.2)*113,Math.sin(a+.2)*130-51]],j%2?'#efdcab':'#c37a50');}P([[-11,-48],[14,-48],[23,29],[-14,21]],'#a95844');}
for(let side of [-1,1]){let ex=side*53,dy=s.brow*38*side;P([[ex-34,-60],[ex+37,-65],[ex+31,-25],[ex-29,-21]],'#fff1d1');E(ex+s.brow*7,-41,12,12,'#213e49');E(ex+4+s.brow*7,-46,3,3,'#fff');P([[ex-47,-80+dy],[ex+42,-95-dy],[ex+35,-75-dy],[ex-39,-58+dy]],pal[2]);L([[ex-29,-13],[ex+25,-15]],'#b9715a',3);}
let m=s.mouth,z=m<.34?0:m<.68?1:2;if(z===0)L([[-53,62],[0,53+s.brow*13],[53,62]],'#63354a',7);if(z===1){E(0,59,30-(m-.34)*45,14+(m-.34)*65,'#623a4d');E(0,59,9,8,'#ed957c');}if(z===2){P([[-58,40],[58,40],[46,63+(m-.68)*160],[0,83+(m-.68)*170],[-46,63+(m-.68)*160]],'#452d42');P([[-49,40],[49,40],[44,56],[-44,56]],'#fff1d2');for(let j=0;j<6;j++)L([[-37+j*15,41],[-37+j*15,55]],'#d7b5a0',1);E(0,76+(m-.68)*100,25,9,'#d56e79');}
// Facet seams and gold registration ticks emphasize layered physical mask.
L([[-95,-143],[-44,-104],[-21,-119]],'rgba(255,230,177,.7)',2);L([[95,-143],[44,-104],[21,-119]],'#ce8a63',2);for(let side of [-1,1])for(let j=0;j<3;j++)L([[side*(103+j*7),-35+j*12],[side*(111+j*7),-27+j*12]],'#f6cf8e',2);
text(['鸮角 · 木管','伶角 · 人声','日芒 · 铜管'][s.mask],0,196,14,'#f6d6a5');text(`拓音章 ${s.seals.length}/6  · 共鸣 ${s.chords}`,0,274,12,'#efc5a6');c.restore();}
function input(kind,p){const l=lay(),a={x:(p.x-l.x)/l.k,y:(p.y-l.y)/l.k};if(kind==='down')g={...a,b:s.brow,m:s.mouth,f:s.fold};if(kind==='move'&&g){let dx=a.x-g.x,dy=a.y-g.y;if(s.mode==='brow')s.brow=cl(g.b+dy/95+dx/180,-1,1);if(s.mode==='mouth')s.mouth=cl(g.m+dy/100+dx/180,0,1);if(s.mode==='fold')s.fold=cl(g.f+Math.abs(dx)/110,0,1);}if(kind==='up'||kind==='cancel')g=null;}
function action(id){if(['brow','mouth','fold'].includes(id))s.mode=id;if(id==='layer'){s.mask=(s.mask+1)%3;s.fold=0;}if(id==='imprint'){s.seals.push({mask:s.mask,zone:s.mouth<.34?0:s.mouth<.68?1:2});if(s.seals.length>6)s.seals.shift();}if(id==='resonate'){s.resonating=4;s.chords++;s.tension=cl(s.fold+s.mouth,0,2);}}

</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});

function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
