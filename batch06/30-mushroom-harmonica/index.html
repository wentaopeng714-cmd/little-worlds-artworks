<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>蘑菇口琴队 · 第六组</title><style>:root{--bg:#54a569;--ink:#142a18;--accent:#f378a8;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}header h1{font-family:system-ui;font-weight:850}button{border-width:2px}button{box-shadow:2px 2px 0 var(--ink);background:#fff1d8;color:#142a18}button.active{background:var(--accent);color:#142a18}</style><body><header><div><h1>蘑菇口琴队</h1><p>拉嘴留下一拍，拖连两顶帽子成呼应链。展开菌褶、录八拍，让自己的蘑菇队循环合奏。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="蘑菇口琴队，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="tongue" id="tongue">拉舌留拍</button><button data-action="link" id="link">连队呼应</button><button data-action="hats" id="hats">展开帽褶</button><button data-action="loop" id="loop">八拍循环</button><button data-action="call" id="call">合唱接力</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=30;window.artMeta={"number": 30, "slug": "30-mushroom-harmonica", "title": "蘑菇口琴队", "group": "T", "mothers": ["singing_beans_vocal_choir.html"], "innovation": "Riso蘑菇嘴队，拉舌改音、连队成节奏链、帽褶展开与合唱呼应", "description": "拉嘴留下一拍，拖连两顶帽子成呼应链。展开菌褶、录八拍，让自己的蘑菇队循环合奏。", "ui": {"bg": "#54a569", "ink": "#142a18", "accent": "#f378a8"}, "controls": [{"id": "tongue", "label": "拉舌留拍"}, {"id": "link", "label": "连队呼应"}, {"id": "hats", "label": "展开帽褶"}, {"id": "loop", "label": "八拍循环"}, {"id": "call", "label": "合唱接力"}], "newMechanics": ["嘴型/音阶随拉舌大幅变形，释放记录当前拍", "定向拖连队形成持久呼应链，循环重放已留节奏", "展开帽褶与链路、循环可以组合"], "artDirection": ["草绿圆点Riso纸底，粉黄浅青菌帽与奶油粗茎", "黑色有机口腔真实开合，奶齿弧和外伸粉舌", "帽褶拉开展示密线菌褶，双色连线脉冲"], "testPlan": [{"control": "tongue", "from": [0.23, 0.28], "to": [0.32, 0.46], "hold": 500}, {"control": "link", "from": [0.23, 0.28], "to": [0.5, 0.24], "hold": 600}, {"control": "hats", "from": [0.5, 0.24], "to": [0.5, 0.36], "hold": 400}, {"control": "loop", "from": [0.68, 0.67], "to": [0.68, 0.74], "hold": 350}], "stateFields": {"links": "拖连不同成员后大于0", "recorded": "拉舌释放后增加", "unfolded": "展开帽褶后增加", "looping": "八拍循环切换true/false"}, "css": "header h1{font-family:system-ui;font-weight:850}button{border-width:2px}button{box-shadow:2px 2px 0 var(--ink);background:#fff1d8;color:#142a18}button.active{background:var(--accent);color:#142a18}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){
const c=env.ctx,TAU=Math.PI*2,cl=env.clamp;let beans,links,mode,drag,selected,loop,beat,lastBeat,notes,turns,call,t;
const pal=['#ef8ea4','#f7cf59','#c0df7c','#a4dcec','#d3acdf'];
function reset(){beans=[{x:.23,y:.28},{x:.5,y:.24},{x:.77,y:.3},{x:.34,y:.69},{x:.68,y:.67}].map((p,i)=>({...p,i,tx:0,ty:0,open:.25,hat:0,pitch:i,pattern:Array(8).fill(0),pulse:0}));links=[];mode='tongue';drag=null;selected=0;loop=false;beat=0;lastBeat=-1;notes=[];turns=0;call=0;}
function geom(b){let r=Math.min(env.W*.13,env.H*.16);if(env.W<600)r=Math.min(env.W*.145,env.H*.115);return {x:b.x*env.W,y:b.y*env.H,r};}
function hit(p){let best=0,d=Infinity;beans.forEach((b,i)=>{let g=geom(b),v=Math.hypot(p.x-g.x,p.y-g.y);if(v<d){d=v;best=i;}});return best;}
function sing(b,e=1){b.pulse=e;b.open=1;notes.push({x:b.x,y:b.y-.12,life:1,k:b.pitch});if(notes.length>32)notes.shift();window.artAudio?.fx(b.pitch,e);for(let [a,z] of links)if(a===b.i||z===b.i){let n=beans[a===b.i?z:a];n.pulse=.65;n.open=.8;}call++;}
function action(id){mode=id;if(id==='hats'){beans[selected].hat=1-beans[selected].hat;sing(beans[selected],.8);turns++;}if(id==='loop'){loop=!loop;if(loop&&!beans.some(b=>b.pattern.some(Boolean)))beans.forEach((b,i)=>b.pattern[(i*2)%8]=.7);}if(id==='call'){beans.forEach((b,i)=>{b.pulse=1-i*.1;b.pattern[(beat+i)%8]=1;});call++;}}
function input(k,p){let i=hit(p),b=beans[i];if(k==='down'){selected=i;let g=geom(b);drag={i,x:p.x,y:p.y,ox:b.tx,oy:b.ty};if(mode==='hats'){b.hat=1-b.hat;turns++;}sing(b);}if(k==='move'&&drag){b=beans[drag.i];let g=geom(b);if(mode==='tongue'||mode==='call'||mode==='loop'){b.tx=cl((p.x-drag.x)/g.r,-1.2,1.2);b.ty=cl((p.y-drag.y)/g.r,-.5,1.2);b.pitch=cl(Math.floor((b.ty+.5)*4),0,6);b.open=cl(.4+Math.hypot(b.tx,b.ty),.25,1.4);b.pulse=1;}else if(mode==='hats'){b.hat=cl(.3+(p.y-drag.y)/g.r,0,1);}}
if((k==='up'||k==='cancel')&&drag){b=beans[drag.i];if(mode==='link'){let j=hit(p);if(j!==drag.i&&!links.some(a=>a.includes(j)&&a.includes(drag.i))){links.push([drag.i,j]);if(links.length>7)links.shift();sing(b);}}else{b.pattern[beat]=cl(b.open,.3,1.4);turns++;}drag=null;}}
function path(fill,stroke='#15271b',w=3){c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=w;c.stroke();}}
function ell(x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);path(fill,null);}
function drawBean(b,time){const g=geom(b),r=g.r;let bounce=b.pulse*Math.sin(time*14+b.i)*r*.05;c.save();c.translate(g.x,g.y+bounce);c.rotate(Math.sin(time*1.3+b.i)*.035);const h=b.hat;
// Cream stem with two different ink layers and fluted cap.
c.beginPath();c.moveTo(-r*.48,-r*.05);c.bezierCurveTo(-r*.42,r*.4,-r*.66,r*.95,-r*.36,r*1.05);c.quadraticCurveTo(0,r*1.17,r*.38,r*1.04);c.bezierCurveTo(r*.54,r*.82,r*.33,r*.4,r*.48,-r*.05);path('#fff0d5');
for(let j=0;j<6;j++){c.strokeStyle='#d6ccac';c.lineWidth=1.5;c.beginPath();c.moveTo((j-2.5)*r*.12,r*.02);c.quadraticCurveTo((j-2.5)*r*.16,r*.8,(j-2.5)*r*.11,r*.99);c.stroke();}
c.beginPath();c.moveTo(-r*(1.05+h*.28),-r*.2);c.bezierCurveTo(-r*.92,-r*(1.22+h*.5),r*.82,-r*(1.3+h*.38),r*(1.05+h*.28),-r*.2);c.quadraticCurveTo(0,r*(.12+h*.2),-r*(1.05+h*.28),-r*.2);path(pal[b.i]);
c.save();c.beginPath();c.ellipse(0,-r*.18,r*(1.02+h*.28),r*.22,0,0,TAU);path('#fff0d5');c.clip();for(let j=-11;j<=11;j++){c.strokeStyle='#142a18';c.lineWidth=1.4;c.beginPath();c.moveTo(0,-r*.25);c.lineTo(j*r*.14,r*.25);c.stroke();}c.restore();
for(let j=0;j<13;j++){let a=j*2.399,x=Math.cos(a)*r*(.25+.045*j),y=-r*.65+Math.sin(a)*r*.28;ell(x,y,r*.05,r*.034,'#fff3de');}
const op=.18+b.open*.43,tx=b.tx*r*.55,ty=b.ty*r*.45;
c.beginPath();c.moveTo(-r*.36,r*.28);c.bezierCurveTo(-r*.45,r*(.22-op),r*.42,r*(.14-op),r*.38,r*.29);c.bezierCurveTo(r*.5,r*(.36+op),-r*.45,r*(.5+op),-r*.36,r*.28);path('#161616',null);c.save();c.clip();
c.beginPath();c.moveTo(-r*.5,r*(.31+op*.6));c.bezierCurveTo(-r*.2+tx,r*.2+ty,r*.1+tx,r*.56+ty,r*.5,r*(.3+op));c.lineTo(r*.5,r*1.1);c.lineTo(-r*.5,r*1.1);path('#f378a8',null);
c.beginPath();c.moveTo(-r*.45,r*(.28-op*.7));c.quadraticCurveTo(0,r*(.17-op*.7),r*.46,r*(.28-op*.7));c.lineTo(r*.44,r*(.37-op*.5));c.quadraticCurveTo(0,r*(.28-op*.5),-r*.44,r*(.37-op*.5));path('#fff5ea',null);c.restore();
// Elastic tongue extends outside mouth; actual cavity changes with saved vowel.
if(Math.abs(b.ty)+Math.abs(b.tx)>.08){c.lineCap='round';c.strokeStyle='#17281c';c.lineWidth=r*.22+4;c.beginPath();c.moveTo(0,r*.6);c.quadraticCurveTo(tx*.1,r*.9,tx,r*.65+ty);c.stroke();c.strokeStyle='#f378a8';c.lineWidth=r*.22;c.stroke();c.strokeStyle='#cc537b';c.lineWidth=2;c.beginPath();c.moveTo(tx*.5,r*.65+ty*.5);c.lineTo(tx,r*.65+ty);c.stroke();}
c.strokeStyle='#142a18';c.lineWidth=3;c.lineCap='round';for(let s of [-1,1]){c.beginPath();if(b.pulse>.3)c.arc(s*r*.18,-r*.38,r*.055,Math.PI,0);else{c.moveTo(s*r*.18,-r*.42);c.lineTo(s*r*.18,-r*.36);}c.stroke();}
if(selected===b.i){c.strokeStyle='#fff5ea';c.lineWidth=2;c.setLineDash([3,5]);c.beginPath();c.ellipse(0,r*1.19,r*.7,r*.14,0,0,TAU);c.stroke();c.setLineDash([]);}c.restore();}
function draw(dt,time){t=time;const W=env.W,H=env.H;c.fillStyle='#54a569';c.fillRect(0,0,W,H);c.fillStyle='#44935c';for(let y=7;y<H;y+=16)for(let x=8;x<W;x+=16){c.beginPath();c.arc(x,y,1.35,0,TAU);c.fill();}

let next=Math.floor(time/.46)%8;if(next!==lastBeat){beat=next;lastBeat=next;if(loop)beans.forEach(b=>{if(b.pattern[beat])sing(b,b.pattern[beat]);});}
for(let [a,b] of links){let A=geom(beans[a]),B=geom(beans[b]);c.strokeStyle='#193d27';c.lineWidth=7;c.beginPath();c.moveTo(A.x,A.y+A.r*.92);c.bezierCurveTo(A.x,A.y+A.r*1.45,B.x,B.y+B.r*1.45,B.x,B.y+B.r*.92);c.stroke();c.strokeStyle='#edcf59';c.lineWidth=3;c.stroke();for(let j=0;j<5;j++){let f=(j+time*.7)%5/5;ell(A.x+(B.x-A.x)*f,A.y+(B.y-A.y)*f+Math.sin(f*Math.PI)*Math.min(A.r,B.r)*.55,3,4,pal[a]);}}
beans.forEach(b=>{if(!drag||drag.i!==b.i){b.open+=(.24+b.pulse*.8-b.open)*Math.min(1,dt*8);b.tx*=Math.exp(-dt*4);b.ty*=Math.exp(-dt*4);}b.pulse=Math.max(0,b.pulse-dt*1.8);drawBean(b,time);});
notes=notes.filter(n=>n.life>0);notes.forEach(n=>{n.life-=dt*.8;n.y-=dt*.035;c.globalAlpha=Math.max(0,n.life);c.fillStyle=pal[n.k%5];c.font='bold 25px serif';c.fillText('♪',n.x*W,n.y*H);});c.globalAlpha=1;
const sw=Math.min(W*.67,530),sx=(W-sw)/2,sy=H*.945;c.font='bold 10px system-ui';c.textAlign='center';for(let i=0;i<8;i++){c.fillStyle=i===beat?'#f378a8':'#e9edbd';c.beginPath();c.roundRect(sx+i*sw/8,sy,sw/8-5,19,5);path(c.fillStyle);c.fillStyle='#142a18';c.fillText(i+1,sx+(i+.45)*sw/8,sy+13);}if(drag&&mode==='link'){let g=geom(beans[drag.i]);c.strokeStyle='#fff5ea';c.lineWidth=3;c.setLineDash([4,5]);c.beginPath();c.moveTo(g.x,g.y);for(const p of env.pointers.values())c.lineTo(p.x,p.y);c.stroke();c.setLineDash([]);}}
return{reset,draw,input,action,state:()=>({bounded:true,mode,links:links.length,recorded:beans.reduce((s,b)=>s+b.pattern.filter(Boolean).length,0),unfolded:beans.filter(b=>b.hat>.5).length,looping:loop,phrases:call,turns,status:`${{tongue:'拉舌留拍',link:'从一顶蘑菇拖到另一顶，接成呼应链',hats:'点帽展开菌褶，拖动控制幅度',loop:'八拍循环',call:'合唱呼应'}[mode]} · 连队 ${links.length} · 已记 ${beans.reduce((s,b)=>s+b.pattern.filter(Boolean).length,0)} 拍 · ${loop?'循环开':'循环关'}`})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
