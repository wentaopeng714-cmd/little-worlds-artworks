<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soft Stranger — a pocket personality</title><meta name="description" content="Pull cheeks, wink eyes, stretch a voice and wind a crown. An original touch-first character toy."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23eaff73'/%3E%3Ccircle cx='11' cy='15' r='3' fill='%232b2141'/%3E%3Ccircle cx='22' cy='15' r='3' fill='%232b2141'/%3E%3C/svg%3E"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#eaff73;color:#2b2141;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(23px,env(safe-area-inset-top));left:24px;right:24px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}.kicker{font-size:12px;letter-spacing:.13em}h1{font-size:clamp(28px,6vw,48px);font-weight:600;letter-spacing:-1.7px;margin:7px 0 0;line-height:1}.version{font-size:12px;border:1px solid #2b2141;border-radius:30px;padding:7px 10px}.controls{position:fixed;left:20px;right:20px;bottom:max(18px,env(safe-area-inset-bottom));max-width:560px;margin:auto}.row{display:flex;gap:8px;justify-content:center;align-items:center}button{font:12px Arial;letter-spacing:.03em;background:#eaff73;border:1px solid #2b2141;color:#2b2141;cursor:pointer;min-height:44px;border-radius:30px;padding:0 14px}button:active{transform:scale(.95)}button:focus-visible{outline:3px solid #ff653d;outline-offset:3px}#hint{font-size:14px;line-height:1.4;text-align:center;min-height:40px;margin:0 0 10px}#hint span{display:block;font-size:12px;opacity:.7;margin-top:3px}.parts{display:flex;gap:7px;justify-content:center;margin-bottom:10px}.parts button{background:#2b2141;color:#f9f5ea;border:0;min-width:63px}.tools{display:flex;gap:8px}#memory{display:flex;gap:6px;align-items:center;margin-right:6px}#memory i{width:9px;height:9px;border:1px solid;border-radius:50%}#memory i.found{background:#2b2141}.tiny{font-size:12px;opacity:.65;margin-right:5px}@media(min-width:800px){header{left:44px;right:44px;top:32px}.controls{bottom:25px}.parts{margin-bottom:12px}}@media(max-height:600px){header{top:12px}h1{font-size:26px}.kicker{font-size:10px}.controls{bottom:9px}.parts{display:none}#hint{min-height:20px;font-size:12px;margin-bottom:5px}#hint span{display:none}button{min-height:38px}.version{font-size:10px}}
</style></head><body><canvas id="art" aria-label="Soft Stranger. Touch eyes, cheeks, mouth or crown; combine gestures to discover new moods."></canvas><header><div><div class="kicker">LITTLE WORLDS / 01</div><h1>Soft Stranger</h1></div><span class="version">PLAY / 02</span></header><section class="controls"><p id="hint" aria-live="polite">Pull a cheek. Find its personality.<span>Eyes wink · mouth sings · crown winds up</span></p><div class="parts" aria-label="Try a gesture"><button data-part="eye">Wink</button><button data-part="mouth">Sing</button><button data-part="cheek">Squish</button><button data-part="crown">Wind up</button></div><div class="row"><span class="tiny">Discover</span><div id="memory" aria-label="No secret moods discovered"><i></i><i></i><i></i></div><div class="tools"><button id="mute" aria-pressed="false" aria-label="Mute sound">Sound on</button><button id="reset">Reset</button></div></div></section><script>
'use strict';
const c=document.getElementById('art'),g=c.getContext('2d'),hint=document.getElementById('hint');const TAU=Math.PI*2,ink='#2b2141',cream='#fff6e6';const palettes=[['#ff6848','#eaff73','#ae74e8'],['#b989f2','#ffb94b','#eaff73'],['#f693c0','#93e4d0','#ff6848']];let W,H,D,clock=0,last=performance.now(),audio=null,master=null,muted=false,events=0,resets=0,voiceCount=0;const pointers=new Map();let p,found,recent,mode,modeLeft,tones=[],bands=[],costume=0,crownAngle=0,spin=0,wind=0,mouthOpen=0,mouthCharge=0,eyeL=0,eyeR=0,eyeHold=0,nose=0,breathe=0,wobble=0,tx=0,ty=0,x=0,y=0,vx=0,vy=0,leftPull=0,rightPull=0,stretch=0,streak=0,lastGesture=0,lastTone=-1,comboFlash=0;
function geo(){return{cx:W*.5,cy:H*(H<600?.45:.46),s:Math.min(W*.365,H*(H<600?.20:.215),225)}}
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',()=>{pointers.clear();size()});size();
function unlock(){if(!audio){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=new A;master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination)}catch(e){return}}if(audio.state==='suspended')audio.resume().catch(()=>{})}
function tone(f=220,d=.2,kind='sine',vol=.075,bend=1){if(muted||!audio||!master)return;const o=audio.createOscillator(),v=audio.createGain(),now=audio.currentTime;o.type=kind;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*bend),now+d);v.gain.setValueAtTime(0,now);v.gain.linearRampToValueAtTime(vol,now+.015);v.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(v);v.connect(master);o.start();o.stop(now+d+.025);o.onended=()=>{o.disconnect();v.disconnect()};voiceCount++}
function chord(root){[1,1.25,1.5,2].forEach((n,i)=>tone(root*n,.5+i*.06,'sine',.025))}
function say(main,sub='Try another part. Combine what you find.'){hint.innerHTML=main+'<span>'+sub+'</span>'}
function updateMemory(){document.querySelectorAll('#memory i').forEach((e,i)=>e.classList.toggle('found',found.has(['duet','rubber','bloom'][i])));document.getElementById('memory').setAttribute('aria-label',[...found].join(', ')||'No secret moods discovered')}
function reset(){pointers.clear();p={eye:0,mouth:0,cheek:0,crown:0};found=new Set;recent={eye:-99,mouth:-99,cheek:-99,crown:-99,left:-99,right:-99};mode='curious';modeLeft=0;tones=[];bands=[];costume=0;crownAngle=spin=wind=mouthOpen=mouthCharge=eyeL=eyeR=eyeHold=nose=breathe=wobble=tx=ty=x=y=vx=vy=leftPull=rightPull=stretch=streak=comboFlash=0;events=voiceCount=0;lastTone=-1;lastGesture=clock;updateMemory();say('Pull a cheek. Find its personality.','Eyes wink · mouth sings · crown winds up')}
function enter(next){if(mode===next&&modeLeft>2)return;mode=next;modeLeft=7;comboFlash=1;found.add(next);updateMemory();chord(next==='duet'?220:next==='rubber'?146.83:261.63);if(next==='duet')say('A duet! One wink, one voice.','Tap the eyes while the mouth is singing.');if(next==='rubber')say('Rubber mode. Stretch both sides.','Try two fingers, or alternate the cheeks.');if(next==='bloom')say('Crown chorus. A whole new character.','Wind the crown, then open the mouth.');}
function record(part,side){p[part]=(p[part]||0)+1;events++;streak=clock-lastGesture<2?streak+1:1;lastGesture=clock;recent[part]=clock;if(side)recent[side]=clock;if(part==='eye'&&clock-recent.mouth<5||part==='mouth'&&clock-recent.eye<5)enter('duet');if(part==='cheek'&&clock-recent.left<4&&clock-recent.right<4)enter('rubber');if(part==='mouth'&&clock-recent.crown<6&&wind>.25)enter('bloom');}
function pos(e){const r=c.getBoundingClientRect(),q=geo();return{x:(e.clientX-r.left-q.cx-x)/q.s,y:(e.clientY-r.top-q.cy-y)/q.s}}
function hit(q){if(q.y<-.78&&Math.abs(q.x)<.9)return'crown';if(q.y>-.64&&q.y<.03&&Math.abs(q.x)<.64)return q.x<0?'eyeL':'eyeR';if(q.y>.24&&q.y<.77&&Math.abs(q.x)<.4)return'mouth';if(Math.abs(q.x)>.4&&q.y>-.12&&q.y<.78)return q.x<0?'left':'right';return'head'}
function begin(id,q){let part=hit(q);pointers.set(id,{part,start:q,q,held:0,travel:0,next:0});if(part.startsWith('eye')){record('eye');if(part==='eyeL')eyeL=1;else eyeR=1;tone(part==='eyeL'?660:880,.12,'sine',.05);say('Hold an eye. Make a sleepy wink.','Then stretch the mouth for a duet.')}else if(part==='mouth'){record('mouth');say('Pull down. Hold that note.','Let go to send your voice into the room.')}else if(part==='left'||part==='right'){record('cheek',part);tone(180,.18,'triangle',.065,.6);say('Soft on this side. What about the other?','Two fingers make a very wide stranger.')}else if(part==='crown'){record('crown');say('Wind it up. A new look is growing.','Then pull the mouth to wake the crown.')}else{record('cheek');say('Rock the whole character.','The eyes, mouth and crown have their own ideas.')}}
c.onpointerdown=e=>{e.preventDefault();unlock();c.setPointerCapture(e.pointerId);begin(e.pointerId,pos(e))};c.onpointermove=e=>{let v=pointers.get(e.pointerId);if(!v)return;const q=pos(e);v.travel+=Math.hypot(q.x-v.q.x,q.y-v.q.y);if(v.part==='crown'){spin+=(q.x-v.q.x)*.25;wind=Math.min(1,wind+Math.abs(q.x-v.q.x)*.4)}v.q=q};
function finish(id){const v=pointers.get(id);if(!v)return;pointers.delete(id);if(v.part==='mouth'){let charge=Math.min(1,mouthCharge);let f=196+Math.round(charge*4)*49;tone(f,.4,'triangle',.06,1.5);for(let i=0;i<3+Math.floor(charge*4);i++)tones.push({x:0,y:.5,r:.09+i*.025,vx:(i%2?1:-1)*(.12+i*.03),vy:-.6-i*.07,life:3+i*.13,color:i%3,shape:i%3});if(clock-recent.crown<6&&wind>.25)enter('bloom');mouthCharge=0;wobble=.65}else if(v.part==='left'||v.part==='right'||v.part==='head'){vx+=(v.q.x-v.start.x)*12;vy+=(v.q.y-v.start.y)*7;wobble=1;tone(140+Math.min(v.travel,2)*140,.35,'triangle',.07,1.7)}else if(v.part==='crown'){spin+=.2+v.travel*.08;if(wind>.35||v.held>.5){costume=(costume+1)%3;wind=Math.max(wind,.5);chord(164.81);say('A different look. The same strange friend.','Pull the mouth while the crown is awake.')}}else{eyeHold=0;tone(440,.13,'sine',.035)} }
c.onpointerup=e=>finish(e.pointerId);c.onpointercancel=e=>{pointers.delete(e.pointerId);mouthCharge=0};
const samples={eye:[{x:-.3,y:-.25},{x:-.3,y:-.25}],mouth:[{x:0,y:.4},{x:0,y:.85}],cheek:[{x:-.7,y:.2},{x:-1.15,y:.35}],crown:[{x:0,y:-1.05},{x:.8,y:-1.1}]};
function sample(part){unlock();const id='key-'+part;if(pointers.has(id))finish(id);let [a,b]=samples[part];if(part==='cheek'&&p.cheek%2)a={x:.7,y:.2},b={x:1.15,y:.35};begin(id,{...a});let v=pointers.get(id);v.q={...b};v.travel=.8;v.auto=.85;if(part==='crown'){wind=.8;spin=.35}}
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>sample(b.dataset.part));addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='BUTTON')return;let k={e:'eye',m:'mouth',c:'cheek',w:'crown'}[e.key.toLowerCase()];if(k)sample(k)});
document.getElementById('mute').onclick=()=>{unlock();muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:.8,audio.currentTime,.015);document.getElementById('mute').textContent=muted?'Sound off':'Sound on';document.getElementById('mute').setAttribute('aria-pressed',String(muted));document.getElementById('mute').setAttribute('aria-label',muted?'Enable sound':'Mute sound')};document.getElementById('reset').onclick=()=>{unlock();reset();resets++};
function disc(xx,yy,r,col){g.fillStyle=col;g.beginPath();g.arc(xx,yy,Math.max(.001,r),0,TAU);g.fill()}function line(a,b,xx,yy,col,width){g.strokeStyle=col;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(xx,yy);g.stroke()}function ellipse(xx,yy,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(xx,yy,Math.max(.001,rx),Math.max(.001,ry),0,0,TAU);g.fill()}
function tick(dt){clock+=dt;let lp=0,rp=0,mo=0,el=0,er=0,dx=0,dy=0;for(const [id,v]of pointers){v.held+=dt;if(v.auto&&v.held>v.auto){finish(id);continue}if(v.part==='left')lp=Math.max(.1,Math.min(.7,Math.abs(v.q.x)-.5));if(v.part==='right')rp=Math.max(.1,Math.min(.7,Math.abs(v.q.x)-.5));if(v.part==='head'){dx=Math.max(-1,Math.min(1,v.q.x-v.start.x));dy=Math.max(-.5,Math.min(.5,v.q.y-v.start.y))}if(v.part==='mouth'){mo=Math.max(.2,Math.min(.9,v.q.y-.12+v.held*.08));mouthCharge=Math.min(1,mouthCharge+dt*.4);if(clock-lastTone>.17){let f=[196,220,261.63,293.66,329.63,392][Math.min(5,Math.floor(mo*6))];tone(f,.24,'sine',.025);if(mode==='duet'||mode==='bloom')tone(f*1.5,.24,'sine',.018);lastTone=clock}}if(v.part==='eyeL')el=1;if(v.part==='eyeR')er=1;if(v.part==='crown'){wind=Math.min(1,wind+dt*.22);spin+=dt*.4}}leftPull+=(lp-leftPull)*Math.min(1,dt*12);rightPull+=(rp-rightPull)*Math.min(1,dt*12);mouthOpen+=(mo-mouthOpen)*Math.min(1,dt*13);eyeL+=(el-eyeL)*Math.min(1,dt*12);eyeR+=(er-eyeR)*Math.min(1,dt*12);tx=dx*geo().s*.5;ty=dy*geo().s*.4;vx+=(tx-x)*dt*40;vy+=(ty-y)*dt*40;vx*=Math.exp(-dt*8);vy*=Math.exp(-dt*8);x+=vx*dt;y+=vy*dt;spin*=Math.exp(-dt*1.4);crownAngle+=spin*dt*18;wind=Math.max(0,wind-dt*.018);wobble*=Math.exp(-dt*3);comboFlash=Math.max(0,comboFlash-dt);modeLeft=Math.max(0,modeLeft-dt);if(modeLeft===0&&mode!=='curious'){mode='curious';say('What else can this face do?','Combine a wink, a voice and a little wind.')}if(mode==='duet'&&Math.floor(clock*3)!==Math.floor((clock-dt)*3)){tone([220,277.18,329.63,440][Math.floor(clock*3)%4],.18,'sine',.025)}if(mode==='bloom'&&Math.floor(clock*2)!==Math.floor((clock-dt)*2))tone([261.63,329.63,392,523.25][Math.floor(clock*2)%4],.3,'triangle',.023);for(const v of tones){v.x+=v.vx*dt;v.y+=v.vy*dt;v.life-=dt;v.r+=dt*.045}tones=tones.filter(v=>v.life>0).slice(-35)}
function draw(){const q=geo(),s=q.s,colors=palettes[costume];g.fillStyle=mode==='duet'?'#bc98ed':mode==='bloom'?'#9cdecb':'#eaff73';g.fillRect(0,0,W,H);g.save();g.translate(q.cx,q.cy);if(mode==='bloom'){g.save();g.rotate(clock*.15);for(let i=0;i<12;i++){g.rotate(TAU/12);g.fillStyle=i%2?'#2b214115':'#fff6e64a';g.beginPath();g.moveTo(0,0);g.lineTo(-s*.22,-H);g.lineTo(s*.22,-H);g.fill()}g.restore()}else{g.strokeStyle=ink+'0d';g.lineWidth=1;for(let i=0;i<4;i++){g.beginPath();g.ellipse(0,s*.25,s*(1.05+i*.23),s*(1.03+i*.24),0,0,TAU);g.stroke()}}ellipse(0,s*1.48,s*(.67+Math.abs(x)/s*.08),s*.075,ink+'20');const dance=mode==='duet'||mode==='bloom';let beat=dance?Math.sin(clock*8)*.06:0;line(-s*.34,s*.66,-s*.43+Math.sin(clock*5)*s*beat,s*1.38,ink,s*.095);line(s*.34,s*.66,s*.43+Math.cos(clock*5)*s*beat,s*1.38,ink,s*.095);ellipse(-s*.5,s*1.4,s*.16,s*.065,ink);ellipse(s*.5,s*1.4,s*.16,s*.065,ink);line(-s*.74,s*.24,-s*(1.06+leftPull*.4),s*(dance?-.14+beat:.65),ink,s*.07);line(s*.74,s*.24,s*(1.06+rightPull*.4),s*(dance?-.14-beat:.54),ink,s*.07);disc(-s*(1.06+leftPull*.4),s*(dance?-.14+beat:.65),s*.09,cream);disc(s*(1.06+rightPull*.4),s*(dance?-.14-beat:.54),s*.09,cream);g.translate(x,y+Math.sin(clock*2)*s*.018);g.rotate(Math.sin(clock*15)*wobble*.06+x/s*.12+beat);let rubber=mode==='rubber'?Math.sin(clock*4)*.08:0;g.scale(1+rubber,1-rubber*.6);if(mode==='bloom'){for(let i=0;i<10;i++){let a=i*TAU/10+clock*.35;g.save();g.translate(Math.cos(a)*s*.92,Math.sin(a)*s*.96);g.rotate(a);ellipse(0,0,s*.37,s*.18,i%2?colors[2]:colors[1]);g.restore()}}g.save();g.translate(0,-s*.98);g.rotate(crownAngle);let petals=found.has('bloom')?7:5;for(let i=0;i<petals;i++){g.save();g.rotate(i*TAU/petals);ellipse(0,-s*(.22+wind*.09),s*.085,s*(.18+wind*.09),i%2?ink:colors[2]);g.restore()}disc(0,0,s*.13,cream);disc(0,0,s*.055,ink);g.restore();g.fillStyle=colors[0];g.beginPath();g.moveTo(0,-s*.97);g.bezierCurveTo(s*.8,-s*1.04,s*.72,-s*.35,s*(.89+rightPull),s*.22);g.bezierCurveTo(s*(1.17+rightPull),s*1.02,-s*(1.17+leftPull),s*1.02,-s*(.89+leftPull),s*.22);g.bezierCurveTo(-s*.72,-s*.35,-s*.8,-s*1.04,0,-s*.97);g.fill();for(const side of [-1,1]){let close=side<0?eyeL:eyeR,blink=Math.sin(clock*1.3)>.994?.94:0;close=Math.max(close,blink);let ex=side*s*.29,ey=-s*.22;ellipse(ex,ey,s*.225,s*.23*(1-close)+s*.018,cream);if(close<.7){g.save();g.beginPath();g.ellipse(ex,ey,s*.21,s*.22,0,0,TAU);g.clip();disc(ex+x*.06+Math.sin(clock*1.2)*s*.025,ey+y*.06,s*(mode==='duet'?.1:.09),ink);disc(ex-s*.025,ey-s*.032,s*.028,cream);g.restore()}else line(ex-s*.15,ey,ex+s*.15,ey,ink,s*.027);line(ex-s*.15,ey-s*.36,ex+s*.15,ey-s*(.36+(side<0?leftPull:rightPull)*.12),ink,s*.035);ellipse(side*s*(.58+(side<0?leftPull:rightPull)*.58),s*.18,s*.13,s*.07,colors[1]);for(let i=0;i<3;i++)disc(side*s*(.57+i*.057),s*(.06+(i%2)*.04),s*.012,ink+'70')}
disc(0,s*.03,s*.055,ink);if(mouthOpen>.04||mode==='duet'){let open=mouthOpen+(mode==='duet'?.13+Math.sin(clock*8)*.07:0);ellipse(0,s*.43,s*(.18+open*.12),s*(.06+open*.32),ink);ellipse(0,s*(.46+open*.12),s*.12,s*.035,colors[2]);if(open>.3){g.fillStyle=cream;g.fillRect(-s*.11,s*.34,s*.22,s*.05)}}else{g.strokeStyle=ink;g.lineWidth=s*.035;g.beginPath();g.moveTo(-s*.18,s*.33);g.quadraticCurveTo(0,s*.55,s*.18,s*.33);g.stroke()}if(mode==='duet'){for(const side of [-1,1]){g.strokeStyle=ink;g.lineWidth=s*.035;g.beginPath();g.arc(side*s*.29,-s*.22,s*.265,0,TAU);g.stroke()}line(-s*.025,-s*.25,s*.025,-s*.25,ink,s*.025)}if(found.has('rubber')){line(-s*.13,s*.86,0,s*.91,ink,s*.024);line(s*.13,s*.86,0,s*.91,ink,s*.024)}g.restore();g.save();g.translate(q.cx,q.cy);for(const v of tones){g.globalAlpha=Math.min(1,v.life);g.save();g.translate(v.x*s,v.y*s);g.rotate(clock*.8+v.color);g.strokeStyle=palettes[costume][v.color];g.lineWidth=4;if(v.shape===0){g.beginPath();g.arc(0,0,v.r*s,0,TAU);g.stroke()}else if(v.shape===1){g.strokeRect(-v.r*s/2,-v.r*s/2,v.r*s,v.r*s)}else{g.beginPath();g.moveTo(0,-v.r*s);g.lineTo(v.r*s,v.r*s*.6);g.lineTo(-v.r*s,v.r*s*.6);g.closePath();g.stroke()}g.restore()}g.restore();g.globalAlpha=1;}
window.__artTest={getState:()=>({version:2,events,resets,voiceCount,muted,audio:audio?.state||'locked',parts:{...p},mode,modeLeft,found:[...found],costume,wind,mouthOpen,eyeL,eyeR,leftPull,rightPull,activePointers:pointers.size,tones:tones.length,width:W,height:H}),geometry:()=>geo()};
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_stranger_mood',title:'Read stranger mood',description:'Read the character mood and discovered combinations without changing the artwork.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('Expected an empty object');return{mode,discovered:[...found],costume}}})).catch(()=>{})}catch(e){}}
reset();function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;tick(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
