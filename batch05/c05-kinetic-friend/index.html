<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>关节朋友 · 小小世界05</title><link rel="stylesheet" href="style.css"><style>:root{--bg:#f0e2ce;--stage:#eedfc7;--ink:#637c71}</style></head><body><main><header class="heading"><div><div class="kicker">C05 / KINETIC FRIEND</div><h1>关节朋友</h1><p class="description">拉手脚编一个动作，留下四个姿态，再让小木人把它们连成一段舞。</p></div><div class="right"><button id="mute">声音 · 开</button><button id="reset">重置</button></div></header><section class="stage"><canvas id="art" aria-label="关节朋友互动场景"></canvas></section><footer><nav class="toolbar"><button id="save" data-action="save">记住此姿态</button><button id="play" data-action="play">连续演出</button><button id="stage" data-action="stage">切换舞台</button><button id="mirror" data-action="mirror">镜像姿态</button><button id="costume" data-action="costume">变换服装</button><button id="pose" data-action="pose">一段新动作</button></nav><p id="status"></p><span class="small">首次点按启用原创合成音乐 · 鼠标与触控均可 · 本地打开可离线玩</span><details><summary>玩法与来源</summary>拖四个圆形手脚端点调整关节，拖躯干整体挪动，肢体长度有边界。<br>记住此姿态最多保留四格，再连续演出，把相邻姿态平滑连成舞。<br>可先用一段新动作取得不同姿态，再亲手修改并记录。<br>走索、吊架、圆环舞台配合镜像和服装形成新的节目；演出时拖手脚可打断并重编。<p>参考：<a href="https://www.vitra.com/en-us/product/wooden-dolls">Girard彩绘木玩具色块仅为审美参考。木偶外形、面孔、服装及动画全部本项目原创程序绘制。</a></p></details></footer></main><script src="audio.js"></script><script src="config.js"></script><script src="common.js"></script><script src="app.js"></script></body></html>
