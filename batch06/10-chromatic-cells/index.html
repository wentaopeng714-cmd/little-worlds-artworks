<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>彩胞裂变 · 第六组</title><style>:root{--bg:#151323;--ink:#e0c9eb;--accent:#7ce1cc;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>彩胞裂变</h1><p>彩胞有弯曲膜层；牵长后触碰融合，划膜松手裂变，加压与泄压改变体积。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="彩胞裂变，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="pull" id="pull">牵膜拉长</button><button data-action="join" id="join">触碰融合</button><button data-action="divide" id="divide">划膜裂变</button><button data-action="inflate" id="inflate">加压鼓膜</button><button data-action="drain" id="drain">泄压收缩</button><button data-action="prism" id="prism">色散轮值</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=10;window.artMeta={"number": 10, "slug": "10-chromatic-cells", "title": "彩胞裂变", "group": "F", "mothers": ["several_blobs_chromatic_fluid_shader_studio.html"], "innovation": "粒膜色团拉长、融合、分裂与压力泡，替换无轮廓圆斑累积", "description": "彩胞有弯曲膜层；牵长后触碰融合，划膜松手裂变，加压与泄压改变体积。", "ui": {"bg": "#151323", "ink": "#e0c9eb", "accent": "#7ce1cc"}, "controls": [{"id": "pull", "label": "牵膜拉长"}, {"id": "join", "label": "触碰融合"}, {"id": "divide", "label": "划膜裂变"}, {"id": "inflate", "label": "加压鼓膜"}, {"id": "drain", "label": "泄压收缩"}, {"id": "prism", "label": "色散轮值"}], "newMechanics": ["多叶轮廓有机膜", "真实合并面积与色层", "分裂减少母体半径并产生子胞", "拉膜长宽比变化", "压力影响内部弯曲脉纹"], "artDirection": ["保留母本RGB色散/颗粒软斑", "替换圆斑为闭合多叶膜", "膜内弯曲彩带及半透明边"], "testPlan": [{"control": "pull", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "join", "from": [0.385, 0.48], "to": [0.62, 0.48], "hold": 700}, {"control": "divide", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "inflate", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}, {"control": "drain", "from": [0.27, 0.32], "to": [0.7, 0.55], "hold": 650}], "stateFields": ["maximumStretch拖膜上升", "fusions和fissions改变cells", "cells始终不超过24"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,cl=e.clamp;let cells=[],mode='pull',selected=null,pointer=null,joins=0,splits=0,prism=0,last=null;const colors=['#f3bd46','#e95b96','#4fd0bc','#5e7fdf','#8b63bf','#d37d49'];
function cell(x,y,r,col){return{x,y,r,col,stretch:1,angle:0,phase:Math.random()*6.3,pressure:1,vx:0,vy:0,veins:Math.random()*15,seed:Math.random()*10};}
function reset(){cells=[];for(let i=0;i<12;i++){let row=Math.floor(i/4),col=i%4;cells.push(cell(.15+col*.235+Math.random()*.035,.2+row*.28+Math.random()*.04,.075+Math.random()*.025,i%6));}mode='pull';selected=pointer=last=null;joins=splits=prism=0;}
function nearest(p){let best=null,d=Infinity;for(let q of cells){let z=Math.hypot(p.x/e.W-q.x,p.y/e.H-q.y);if(z<q.r*1.8&&z<d){d=z;best=q;}}return best;}
function shape(q,t,scale=1){let r=q.r*Math.min(e.W,e.H),x=q.x*e.W,y=q.y*e.H;c.beginPath();for(let i=0;i<=80;i++){let a=i/80*Math.PI*2,rr=r*scale*(1+.11*Math.sin(a*3+q.seed)+.06*Math.sin(a*7+t*.3+q.phase));let px=rr*Math.cos(a)*q.stretch,py=rr*Math.sin(a)/Math.sqrt(q.stretch);let xx=x+px*Math.cos(q.angle)-py*Math.sin(q.angle),yy=y+px*Math.sin(q.angle)+py*Math.cos(q.angle);i?c.lineTo(xx,yy):c.moveTo(xx,yy);}c.closePath();}
function apply(p){let q=selected;if(!q)return;let dx=(p.x-last.x)/e.W,dy=(p.y-last.y)/e.H;if(mode==='pull'||mode==='join'){q.x=cl(q.x+dx,.07,.93);q.y=cl(q.y+dy,.08,.92);q.stretch=cl(1+Math.hypot(p.x-pointer.x,p.y-pointer.y)/75,1,3.4);q.angle=Math.atan2(dy*e.H,dx*e.W);}
if(mode==='inflate'){q.r=cl(q.r+.0018,.038,.2);q.pressure=cl(q.pressure+.08,.3,2.5);}if(mode==='drain'){q.r=cl(q.r-.0015,.04,.2);q.pressure=cl(q.pressure-.05,.3,2.5);}last=p;}
return{reset,input(k,p){if(k==='down'){pointer=p;last=p;selected=nearest(p);if(!selected&&cells.length<24){selected=cell(p.x/e.W,p.y/e.H,.06,cells.length%6);cells.push(selected);}apply(p);}if(k==='move'&&selected)apply(p);if(k==='up'||k==='cancel'){if(selected&&mode==='divide'&&cells.length<24){let q=selected,dx=(p.x-pointer.x)/e.W,dy=(p.y-pointer.y)/e.H,a=Math.atan2(dy,dx);let r=q.r*.68;q.r=r;q.x=cl(q.x+Math.cos(a)*r*.7,.07,.93);q.y=cl(q.y+Math.sin(a)*r*.7,.07,.93);let b=cell(cl(q.x-Math.cos(a)*r*1.5,.07,.93),cl(q.y-Math.sin(a)*r*1.5,.07,.93),r,(q.col+2)%6);b.stretch=1.8;b.angle=a;cells.push(b);q.stretch=1.8;q.angle=a;splits++;}if(selected&&mode==='join'){let a=selected,b=cells.find(q=>q!==a&&Math.hypot((q.x-a.x)*e.W,(q.y-a.y)*e.H)<(q.r+a.r)*Math.min(e.W,e.H)*1.2);if(b){a.r=cl(Math.sqrt(a.r*a.r+b.r*b.r),.04,.22);a.col=(a.col+b.col+1)%6;a.x=(a.x+b.x)/2;a.y=(a.y+b.y)/2;a.seed+=b.seed;a.stretch=2.2;cells.splice(cells.indexOf(b),1);joins++;}}selected=pointer=last=null;}},action(id){if(id==='prism'){prism=(prism+1)%3;mode='pull';}else mode=id;},draw(dt,t){c.fillStyle='#0b0d14';c.fillRect(0,0,e.W,e.H);let g=c.createRadialGradient(e.W*.5,e.H*.5,10,e.W*.5,e.H*.5,e.W*.7);g.addColorStop(0,'#21203a');g.addColorStop(1,'#06080d');c.fillStyle=g;c.fillRect(0,0,e.W,e.H);
for(let q of cells){if(q!==selected)q.stretch=e.lerp(q.stretch,1+.15*Math.sin(t+q.phase),dt*.7);q.phase+=dt*.3;let x=q.x*e.W,y=q.y*e.H,r=q.r*Math.min(e.W,e.H),tone=colors[(q.col+prism)%6];shape(q,t);c.shadowColor=tone;c.shadowBlur=14;c.fillStyle=tone;c.fill();c.shadowBlur=0;c.save();c.clip();let grad=c.createRadialGradient(x-r*.5,y-r*.5,2,x,y,r*2);grad.addColorStop(0,'#f9f0d9bb');grad.addColorStop(.34,tone+'88');grad.addColorStop(1,'#120b33dd');c.fillStyle=grad;c.fillRect(x-r*4,y-r*4,r*8,r*8);
// Membrane organelles are bent strata, not circles stacked into a blob.
for(let j=0;j<36;j++){let off=(j/36-.5)*r*3;c.beginPath();for(let k=0;k<=28;k++){let u=k/28,xx=x+(u-.5)*r*4,yy=y+off+Math.sin(u*9+q.seed+j*.13+t*.15)*r*.16*q.pressure;k?c.lineTo(xx,yy):c.moveTo(xx,yy);}c.strokeStyle=j%3===0?'#fff1bd66':colors[(q.col+2)%6]+'77';c.lineWidth=j%5===0?3:.8;c.stroke();}for(let j=0;j<110;j++){let a=Math.sin(j*41.2+q.seed)*r*2,b=Math.cos(j*17.1+q.seed)*r*2;c.fillStyle=j%3?'#fff6d322':'#080d2522';c.fillRect(x+a,y+b,1,1);}c.restore();
shape(q,t,.94);c.strokeStyle='#e8e7fb99';c.lineWidth=1;c.stroke();shape(q,t);c.strokeStyle=colors[(q.col+3+prism)%6];c.lineWidth=2;c.stroke();shape(q,t,1.035);c.strokeStyle=tone+'88';c.lineWidth=.8;c.stroke();if(q.pressure>1.3){shape(q,t,.65);c.strokeStyle='#fffdcc88';c.lineWidth=.8;c.stroke();}}
if(selected){shape(selected,t,1.1);c.setLineDash([3,5]);c.strokeStyle='#fbf3df';c.lineWidth=1;c.stroke();c.setLineDash([]);}c.globalAlpha=.16;c.fillStyle='#fff5d9';for(let i=0;i<340;i++)c.fillRect((Math.sin(i*127.2)*.5+.5)*e.W,(Math.sin(i*76.8)*.5+.5)*e.H,.7,.7);c.globalAlpha=1;},state(){let labels={pull:'牵膜：拖住彩胞，膜层拉成长舌',join:'融合：拖一枚彩胞触碰另一枚后松手',divide:'裂变：划过彩胞，松手分成两枚',inflate:'加压：按住并移动，膜层鼓起',drain:'泄压：扫过膜层，彩胞收缩'};return{bounded:true,mode,cells:cells.length,fusions:joins,fissions:splits,maximumStretch:+Math.max(...cells.map(q=>q.stretch)).toFixed(2),status:labels[mode]+' · 彩胞 '+cells.length+' · 融合 '+joins+' / 裂变 '+splits};}}
};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
