<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>慢城电车 · 小小世界05</title><link rel="stylesheet" href="style.css"><style>:root{--bg:#edf1de;--stage:#dfe9dc;--ink:#345c56}</style></head><body><main><header class="heading"><div><div class="kicker">C01 / POCKET TRAM</div><h1>慢城电车</h1><p class="description">改变岔道、拖动车站，装载小包裹，电车就在你重新编排的城市里走。</p></div><div class="right"><button id="mute">声音 · 开</button><button id="reset">重置</button></div></header><section class="stage"><canvas id="art" aria-label="慢城电车互动场景"></canvas></section><footer><nav class="toolbar"><button id="switch" data-action="switch">切换岔道</button><button id="run" data-action="run">行驶 / 停靠</button><button id="speed" data-action="speed">快慢三档</button><button id="cargo" data-action="cargo">装小包裹</button><button id="scene" data-action="scene">日光 / 暮色</button><button id="layout" data-action="layout">重排四站</button></nav><p id="status"></p><span class="small">首次点按启用原创合成音乐 · 鼠标与触控均可 · 本地打开可离线玩</span><details><summary>玩法与来源</summary>拖动彩色车站，轨道曲线会跟随重建。<br>点中央金色圆道岔，或按切换岔道，在外环和穿城内环之间变换。<br>快慢三档与停靠可以组合；装小包裹后电车在站点自动交换货物。<br>重排四站和日光/暮色可组合，不需要得分，不需要闯关。<p>参考：<a href="https://blog.railwaymuseum.org.uk/network-rail-team-provides-tlc-museum-icon/">铁路博物馆信号操纵系统，只参考改变道岔改变交通路径的机制，不复制铁路外观。</a></p></details></footer></main><script src="audio.js"></script><script src="config.js"></script><script src="common.js"></script><script src="app.js"></script></body></html>
