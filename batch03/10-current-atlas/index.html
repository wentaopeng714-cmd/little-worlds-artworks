<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Current Atlas</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e7e6da;color:#214b4e;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}header{position:absolute;left:25px;top:max(24px,env(safe-area-inset-top));pointer-events:none}h1{margin:0;font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.22em}header p{margin:9px 0;font-size:11px;letter-spacing:.04em;color:#69817d}.folio{position:absolute;right:25px;top:25px;font-size:9px;color:#71817a;letter-spacing:.2em;pointer-events:none}.tools{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;width:max-content;max-width:calc(100% - 24px);border-radius:18px;background:#f9faf0dd;backdrop-filter:blur(18px);border:1px solid #fff9;box-shadow:0 8px 40px #274a4920}button{border:0;min-height:44px;padding:0 13px;border-radius:11px;background:transparent;color:#57716b;font-size:12px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}button.active{background:#194e50;color:#ecf4e9}button:focus-visible{outline:2px solid #234e50;outline-offset:2px}.divider{width:1px;height:22px;background:#78918430;margin:0 3px}.swatch{width:42px;padding:0}.swatch::before{content:'';display:block;width:21px;height:21px;border-radius:50%;margin:auto;background:var(--c);box-shadow:inset 2px 2px 4px #fff8,inset -3px -3px 4px #0003}.swatch.active{background:#214e5012;outline:1px solid #214e5040}.hint{position:absolute;left:25px;top:77px;color:#798a80;font-size:10px;letter-spacing:.04em;pointer-events:none}.modeLabel{position:absolute;right:25px;bottom:105px;color:#789083;pointer-events:none;text-align:right;font-size:9px;letter-spacing:.18em;line-height:1.7}#qa{display:none}@media(max-width:600px){header{left:18px;top:24px}.folio{right:18px}.hint{left:18px;top:76px;max-width:310px;line-height:1.6}.tools{width:366px;padding:5px 7px;gap:1px;bottom:12px;border-radius:16px}button{padding:0 10px}.divider{display:none}.break{flex-basis:100%;height:0}.swatch{width:39px}.modeLabel{right:18px;bottom:123px}}
</style></head><body><canvas id="art" aria-label="Volumetric particle sculpture. Drag to steer, tap to add a vortex; choose Orbit to turn the view."></canvas><header><h1>Current Atlas</h1><p>A moving volume, held in light.</p></header><div class="folio">10 / FIELD STUDY</div><div class="hint" id="hint">Drag to bend the current · tap to plant a vortex</div><div class="modeLabel" id="caption">FLOWING VOLUME<br>0 VORTICES</div><div class="tools"><button class="active" data-gesture="steer">Steer</button><button data-gesture="orbit">Orbit</button><button id="freeze">Freeze</button><button id="form">Dust</button><button id="storm">Turbulence</button><span class="break"></span><button class="swatch active" style="--c:linear-gradient(135deg,#04b8bc,#975632)" data-palette="0" aria-label="Tide palette" title="Tide"></button><button class="swatch" style="--c:linear-gradient(135deg,#e57548,#b2964c)" data-palette="1" aria-label="Copper palette" title="Copper"></button><button class="swatch" style="--c:linear-gradient(135deg,#a3c778,#237f92)" data-palette="2" aria-label="Meadow palette" title="Meadow"></button><button id="clear">Clear gates</button><button id="reset">Reset</button><button id="mute">Sound off</button></div><div id="qa"></div><script>
(()=>{'use strict';const c=document.querySelector('#art'),ctx=c.getContext('2d',{alpha:false}),qa=document.querySelector('#qa');let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),N=0,parts=[],projected=[],gesture='steer',frozen=false,dust=false,storm=false,palette=0,time=0,yaw=-.24,pitch=.31,steerX=0,steerY=0,targetX=0,targetY=0,gates=[],active=null,frames=0,totalFrames=0,fps=0,inputs=0,resets=0,prev=performance.now(),qaTick=prev,muted=true,audio=null,voices=[],lastSound=0;const TAU=Math.PI*2,palettes=[['#004e5a','#087c83','#12acac','#63d7c8','#ae7752','#e7c582'],['#59352c','#a35d41','#d68958','#e9b06c','#186e72','#6caaaa'],['#1d555e','#3a8d8b','#8bc5a0','#d1df9e','#ae8352','#dec486']],rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);const newN=W<600?3000:5200;if(newN!==N){N=newN;parts=Array.from({length:N},(_,i)=>({u:Math.random(),a:Math.random()*TAU,r:Math.pow(Math.random(),.8),f:rand(.7,1.3),color:i%6,size:rand(.35,1.3)}));projected=Array.from({length:N},()=>({x:0,y:0,z:0,s:0,a:0,color:0}));}}function project(x,y,z){const cos=Math.cos(yaw),sin=Math.sin(yaw),rx=x*cos+z*sin,rz=z*cos-x*sin,ry=y*Math.cos(pitch)-rz*Math.sin(pitch),depth=rz*Math.cos(pitch)+y*Math.sin(pitch),scale=Math.min(W*(W<600?.235:.15),H*.245)*7/(7+depth);return{x:W*.5+rx*scale,y:H*.48-ry*scale,z:depth,s:scale};}function unlock(){if(muted)return;audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});}function sound(gate=false){if(muted||!audio||voices.length>=4||audio.currentTime-lastSound<.1)return;lastSound=audio.currentTime;const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=gate?'sine':'triangle';o.frequency.value=(gate?196:70)*(1+gates.length*.125);f.type='lowpass';f.frequency.value=gate?1800:340;o.connect(f).connect(g).connect(audio.destination);g.gain.setValueAtTime(0,audio.currentTime);g.gain.linearRampToValueAtTime(gate?.045:.018,audio.currentTime+.1);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.8);o.start();o.stop(audio.currentTime+.85);voices.push(o);o.onended=()=>{voices=voices.filter(v=>v!==o);o.disconnect();g.disconnect();f.disconnect();};}function updateCaption(){document.querySelector('#caption').innerHTML=(frozen?'FROZEN SCULPTURE':dust?'DISPERSED CURRENT':'FLOWING VOLUME')+'<br>'+gates.length+' VORTICES';}function addGate(x,y){if(gates.length>=6)gates.shift();const scale=Math.min(W*(W<600?.235:.15),H*.245);const wx=clamp((x-W*.5)/scale,-3.1,3.1),wy=clamp((H*.48-y)/scale,-1.2,2.3);gates.push({x:wx,y:wy,z:rand(-.5,.5),spin:gates.length%2?-1:1});sound(true);updateCaption();}function curve(u,t){return{x:(u-.5)*(W<600?3.3:6.3)+steerX*Math.sin(u*Math.PI),y:.45+(u-.5)*(W<600?3.7:0)+.77*Math.sin(u*TAU*1.2+t*.23)+.16*Math.sin(u*TAU*3.2-t*.28)+steerY*Math.sin(u*Math.PI),z:.78*Math.cos(u*TAU*.92-t*.18)+.17*Math.sin(u*TAU*2+t*.25)};}function positions(){const speed=dust?.067:.057;for(let i=0;i<N;i++){const p=parts[i],u=(p.u+time*speed)%1,base=curve(u,time),angle=p.a+u*19+time*(storm?1.9:.52)*p.f,radius=(dust?.59:.21)*(1+.6*Math.sin(u*TAU*2.5+time*.2))*(.2+p.r),r=radius*(storm?1.5:1);let x=base.x+Math.sin(angle*1.8+time)*r*.25,y=base.y+Math.cos(angle)*r,z=base.z+Math.sin(angle)*r*(dust?1.1:1.65);for(let j=0;j<gates.length;j++){const g=gates[j],dx=x-g.x,dy=y-g.y,dz=z-g.z,fall=Math.exp(-(dx*dx+dy*dy+dz*dz)*1.25),a=g.spin*(time*.8+angle),curl=fall*.62;x+=Math.cos(a)*curl;y+=Math.sin(a)*curl;z+=Math.cos(a+.8)*curl;}if(storm){x+=Math.sin(u*88+time*1.8+p.a)*.08;y+=Math.sin(u*55-time*1.2)*.17;z+=Math.cos(u*49+time*1.5)*.13;}const out=projected[i],q=project(x,y,z);out.x=q.x;out.y=q.y;out.z=q.z;out.s=clamp(q.s*.011*p.size,.35,2.2);out.a=clamp(Math.min(u*11,(1-u)*11),0,1)*(.45+.45*(1-p.r));out.color=p.color;out.wx=x;out.wz=z;}}function ground(){const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#d9e2d9');gradient.addColorStop(.5,'#e9e8db');gradient.addColorStop(1,'#f2eddd');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#78979013';ctx.lineWidth=.6;for(let z=-4;z<=4;z+=.7){ctx.beginPath();for(let x=-5;x<=5;x+=.15){const q=project(x,-1.3,z+Math.sin(x*.8)*.055);if(x===-5)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);}ctx.stroke();}for(let x=-5;x<=5;x+=.7){ctx.beginPath();for(let z=-4;z<=4;z+=.15){const q=project(x,-1.3,z);if(z===-4)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);}ctx.stroke();}/* The projected volume casts a soft shadow on y = -1.3. */ctx.fillStyle='#345f5b';ctx.globalAlpha=.013;ctx.beginPath();for(let i=0;i<N;i+=15){const p=projected[i],q=project(p.wx,-1.3,p.wz);ctx.moveTo(q.x+9,q.y);ctx.ellipse(q.x,q.y,9,3.8,yaw*.25,0,TAU);}ctx.fill();ctx.globalAlpha=.022;ctx.beginPath();for(let i=0;i<N;i+=16){const p=projected[i],q=project(p.wx,-1.3,p.wz);ctx.moveTo(q.x+4,q.y);ctx.ellipse(q.x,q.y,4,1.6,0,0,TAU);}ctx.fill();ctx.globalAlpha=1;}function drawVolume(){/* Depth slices preserve parallax and front-to-back occlusion without sorting allocations. */for(let bin=4;bin>=0;bin--)for(let col=0;col<6;col++){ctx.fillStyle=palettes[palette][col];ctx.beginPath();for(let i=0;i<N;i++){const p=projected[i];if(p.color!==col||clamp(Math.floor((p.z+2)*1.1),0,4)!==bin||p.a<.15)continue;const s=p.s*(dust?.78:1);ctx.moveTo(p.x+s,p.y);ctx.ellipse(p.x,p.y,s,s*(dust?1:1.75),-.45+yaw*.22,0,TAU);}ctx.globalAlpha=.64+(4-bin)*.065;ctx.fill();}ctx.globalAlpha=.34;ctx.fillStyle='#f9fff0';ctx.beginPath();for(let i=0;i<N;i+=23){const p=projected[i];if(p.a<.25)continue;ctx.moveTo(p.x+.55,p.y-.6);ctx.ellipse(p.x,p.y-.6,.5,.8,0,0,TAU);}ctx.fill();ctx.globalAlpha=1;}function drawGates(){for(let i=0;i<gates.length;i++){const g=gates[i],q=project(g.x,g.y,g.z),radius=q.s*.11;ctx.strokeStyle='#2e7c7866';ctx.lineWidth=.7;ctx.beginPath();ctx.ellipse(q.x,q.y,radius,radius*.36,yaw*.3,0,TAU);ctx.stroke();ctx.fillStyle='#2e7c78';ctx.beginPath();ctx.arc(q.x,q.y,2,0,TAU);ctx.fill();ctx.font='8px Arial';ctx.fillText(String(i+1),q.x+radius+4,q.y+3);}}function draw(now){requestAnimationFrame(draw);if(document.hidden){prev=now;return;}const dt=Math.min(.045,(now-prev)/1000);prev=now;if(!frozen)time+=dt;steerX+=(targetX-steerX)*.04;steerY+=(targetY-steerY)*.04;positions();ground();drawVolume();drawGates();totalFrames++;frames++;if(now-qaTick>=1000){fps=Math.round(frames*1000/(now-qaTick));qa.dataset.frames=totalFrames;qa.dataset.fps=fps;qa.dataset.entities=N;qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.muted=muted;qa.dataset.width=W;qa.dataset.height=H;qa.dataset.audio=audio?audio.state:'locked';qa.dataset.gates=gates.length;qa.dataset.frozen=frozen;qa.dataset.view=gesture;frames=0;qaTick=now;}}c.addEventListener('pointerdown',e=>{if(active)return;unlock();inputs++;active={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:0};c.setPointerCapture(e.pointerId);});c.addEventListener('pointermove',e=>{if(!active||active.id!==e.pointerId)return;const dx=e.clientX-active.lastX,dy=e.clientY-active.lastY;active.moved+=Math.hypot(dx,dy);active.lastX=e.clientX;active.lastY=e.clientY;inputs++;if(gesture==='orbit'){yaw+=dx*.009;pitch=clamp(pitch+dy*.005,-.1,1);}else{targetX=clamp(targetX+dx/W*4,-2,2);targetY=clamp(targetY-dy/H*4,-1.2,1.8);sound();}});function end(e){if(!active||active.id!==e.pointerId)return;if(active.moved<10&&gesture==='steer')addGate(e.clientX,e.clientY);active=null;}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',()=>active=null);document.querySelectorAll('[data-gesture]').forEach(b=>b.onclick=()=>{gesture=b.dataset.gesture;inputs++;document.querySelectorAll('[data-gesture]').forEach(v=>v.classList.toggle('active',v===b));document.querySelector('#hint').textContent=gesture==='orbit'?'Drag to turn the volume · vertical drag changes elevation':'Drag to bend the current · tap to plant a vortex';});document.querySelector('#freeze').onclick=e=>{frozen=!frozen;e.target.textContent=frozen?'Unfreeze':'Freeze';e.target.classList.toggle('active',frozen);inputs++;updateCaption();};document.querySelector('#form').onclick=e=>{dust=!dust;e.target.textContent=dust?'Ribbon':'Dust';e.target.classList.toggle('active',dust);inputs++;updateCaption();};document.querySelector('#storm').onclick=e=>{storm=!storm;e.target.classList.toggle('active',storm);inputs++;};document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{palette=+b.dataset.palette;document.querySelectorAll('[data-palette]').forEach(v=>v.classList.toggle('active',v===b));inputs++;});document.querySelector('#clear').onclick=()=>{gates=[];inputs++;updateCaption();};document.querySelector('#reset').onclick=()=>{time=0;targetX=steerX=targetY=steerY=0;yaw=-.24;pitch=.31;gates=[];dust=storm=frozen=false;document.querySelector('#freeze').textContent='Freeze';document.querySelector('#form').textContent='Dust';['freeze','form','storm'].forEach(v=>document.getElementById(v).classList.remove('active'));resets++;inputs++;updateCaption();};document.querySelector('#mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'Sound off':'Sound on';if(muted){voices.forEach(v=>{try{v.stop();}catch{}});voices=[];}else{unlock();sound(true);}inputs++;};document.addEventListener('visibilitychange',()=>{if(document.hidden&&audio)audio.suspend().catch(()=>{});else if(!muted&&audio)audio.resume().catch(()=>{});});addEventListener('resize',resize);resize();requestAnimationFrame(draw);})();
</script></body></html>
