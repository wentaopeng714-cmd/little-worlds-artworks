<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨光吐司拼贴</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>BREAKFAST • COLOR STUDY</small><h1>晨光吐司拼贴</h1></div><nav><button id="mute" aria-pressed="false">静音</button><button id="reset">重新开始</button></nav></header><p>把早餐当作一幅静物画：叠涂果酱、摆水果、压出焦香烤纹，再切开重组你的吐司拼贴。</p><div class="tools"><button id="jam0">草莓酱</button><button id="jam1">蓝莓酱</button><button id="jam2">开心果酱</button><button id="fruit0">摆草莓</button><button id="fruit1">摆奇异果</button><button id="fruit2">摆蓝莓</button><button id="grill">压烤纹</button><button id="cut">切开 / 拼回</button></div><canvas id="art" aria-label="晨光吐司拼贴交互画布"></canvas><div class="note"><p id="hint">选果酱后在吐司上拖涂；选水果后点击摆放；切开后拖动四片吐司重新拼图。</p><span class="status">B • 13 / ORIGINAL STUDY</span></div><details><summary>玩法 · 来源与许可</summary><p>选果酱后在吐司上拖涂；选水果后点击摆放；切开后拖动四片吐司重新拼图。 每件均为原创程序绘制和生成音乐。参考仅用于研究构图与物性，未复制图片、角色、录音或第三方美术。<a href="https://www.donnahay.com.au/recipes/breakfast" target="_blank" rel="noreferrer">参考来源</a>的内容仍归其权利人所有。原创部分未附公开许可，也不承诺独占版权。</p></details></main><script src="audio.js"></script><script src="art.js"></script></body></html>
