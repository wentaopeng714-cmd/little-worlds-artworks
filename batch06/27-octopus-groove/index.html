<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>章鱼踏拍 · 第六组</title><style>:root{--bg:#f1cf53;--ink:#2c2a35;--accent:#ee6b58;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>章鱼踏拍</h1><p>八触腕穿鞋踩拍。横拉放大步幅，竖拉速度；换踏步、溜步、盘腕及地板，开启20秒八脚接力。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="章鱼踏拍，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="stride" id="stride">拉步幅</button><button data-action="curl" id="curl">弯触腕</button><button data-action="gait" id="gait">换步型</button><button data-action="floor" id="floor">换地板</button><button data-action="relay" id="relay">八脚接力</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=27;window.artMeta={"number": 27, "slug": "27-octopus-groove", "title": "章鱼踏拍", "group": "T", "mothers": ["funky_walk_controller.html"], "innovation": "面条多腿踏拍，拖脚改变步型，换地板、吸盘卷缩与节拍接力", "description": "八触腕穿鞋踩拍。横拉放大步幅，竖拉速度；换踏步、溜步、盘腕及地板，开启20秒八脚接力。", "ui": {"bg": "#f1cf53", "ink": "#2c2a35", "accent": "#ee6b58"}, "controls": [{"id": "stride", "label": "拉步幅"}, {"id": "curl", "label": "弯触腕"}, {"id": "gait", "label": "换步型"}, {"id": "floor", "label": "换地板"}, {"id": "relay", "label": "八脚接力"}], "artDirection": ["黄纸底与面条曲线触腕", "贴地鞋底和吸盘纹理", "珊瑚章鱼与靛蓝舞帽、条纹背心"], "newMechanics": ["拉步幅横向扩大八条触腕移动跨度，竖向改变节拍速度", "弯触腕竖拉卷起膝部曲线", "换步型切踏步／溜步／盘腕三种实质步态", "换地板改变脚下木拍纹、唱片纹与潮水", "八脚接力20秒持续踩亮八块脚垫，可与步态组合"], "testPlan": [{"control": "stride", "from": [0.4, 0.64], "to": [0.65, 0.48], "hold": 200}, {"control": "curl", "from": [0.5, 0.64], "to": [0.6, 0.42], "hold": 200}, {"control": "gait", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 50}, {"control": "floor", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 50}, {"control": "relay", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 50}], "stateFields": ["gait:0/1/2", "stride/speed/curl", "pads:8 bounded entries", "relay/rounds/lit"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,cl=env.clamp;let s,g;function reset(){s={mode:'stride',stride:.55,speed:1.1,gait:0,floor:0,beat:0,relay:0,rounds:0,pads:Array(8).fill(0),curl:.15,phase:0};g=null;}function lay(){return{x:env.W*.5,y:env.H*.44,k:Math.min(env.W/(env.W<600?540:790),env.H/650)};}function E(x,y,rx,ry,f,st,w=5){c.beginPath();c.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,7);c.fillStyle=f;c.fill();if(st){c.strokeStyle=st;c.lineWidth=w;c.stroke();}}function P(a,f,st='#2d2830',w=5){c.beginPath();a.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.closePath();c.fillStyle=f;c.fill();if(st){c.strokeStyle=st;c.lineWidth=w;c.lineJoin='round';c.stroke();}}function L(a,col,w){c.beginPath();a.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.stroke();}function txt(t,x,y,z=14,col='#34313a'){c.fillStyle=col;c.textAlign='center';c.font=`900 ${z}px system-ui`;c.fillText(t,x,y);}function leg(j,t,front){const a=(j-3.5)*27,ph=t*s.speed*(s.floor===2?3.2:4)+j*.78,side=j<4?-1:1;let lift=(Math.sin(ph)+1)/2,reach=Math.cos(ph)*s.stride*(s.gait===1?91:60)*(s.floor===1?1.22:1),foot={x:a*1.25+reach,y:216-(s.gait===2?lift*58:lift*20)},knee={x:a+side*(45+s.curl*70)+reach*.35,y:135-s.curl*40+(s.gait===1?Math.sin(ph)*33:Math.sin(ph)*20)};if(s.gait===2)knee.x+=Math.cos(ph*2)*20;foot.x=cl(foot.x,-235,235);knee.x=cl(knee.x,-235,235);const root={x:a*.65,y:57};c.beginPath();c.moveTo(root.x,root.y);c.bezierCurveTo(a+side*30,93,knee.x,83,knee.x,knee.y);c.bezierCurveTo(knee.x,knee.y+32,foot.x-20*side,foot.y-8,foot.x,foot.y);c.strokeStyle='#282731';c.lineWidth=18;c.lineCap='round';c.stroke();c.strokeStyle=front?'#ee7559':'#bd514d';c.lineWidth=11;c.stroke();for(let q=0;q<4;q++){let z=q/4;E(knee.x*(1-z)+foot.x*z+side*5,knee.y*(1-z)+foot.y*z,3.8,4.2,'#ffd69f',null);}c.save();c.translate(foot.x,foot.y);c.rotate(Math.cos(ph)*.15);P([[-16,-10],[11,-10],[25,2],[28,13],[-25,13],[-24,6]],j%2?'#f1f2d4':'#4b83c1','#262530',4);L([[-18,7],[21,7]],'#ff5c50',5);L([[-6,-7],[-4,0],[3,-7],[7,0]],'#272631',2);c.restore();if(s.relay>0&&lift<.15){s.pads[j]=cl(s.pads[j]+.013,0,1);}return foot;}
function draw(dt,t){s.phase+=dt;s.beat+=dt*s.speed;if(s.relay>0){s.relay=Math.max(0,s.relay-dt);if(!s.relay)s.rounds++;}const {x,y,k}=lay();c.fillStyle='#f1cf53';c.fillRect(0,0,env.W,env.H);c.save();c.translate(x,y);c.scale(k,k);for(let j=0;j<11;j++)L([[-330,235+j*11],[330,235+j*11]],'#d2af43',1);if(s.floor===1){for(let j=0;j<15;j++)L([[-330+j*44,230],[-300+j*44,320]],'#da8d67',3);}if(s.floor===2){for(let j=0;j<15;j++)E(-310+j*44,251+Math.sin(j)*7,18,5,'#89b3b4');}txt('EIGHT FEET · ONE GROOVE',0,-247,18);E(0,229,245,17,'#ceab40');for(let j=0;j<8;j++){const px=(j-3.5)*60;P([[px-25,270],[px+25,270],[px+29,286],[px-29,286]],s.pads[j]>.1?'#f16b5c':'#f8e6a2','#9d8340',2);txt(j+1,px,282,10,s.pads[j]>.1?'#fff4ce':'#a28646');}
for(let j=0;j<4;j++)leg(j,t,false);
// Entire soft cap bobs and squashes with gait while feet independently plant.
let bob=Math.abs(Math.sin(t*s.speed*4))*10,squash=s.gait===2?.96+Math.sin(t*4)*.05:1;c.save();c.translate(0,-bob);c.scale(1/squash,squash);P([[-78,-26],[-88,48],[-58,78],[55,78],[85,48],[75,-26]],'#fff1c9');for(let j=0;j<6;j++)P([[-69+j*25,10],[-59+j*25,10],[-61+j*25,58],[-70+j*25,58]],'#397fa1',null);L([[-61,-14],[0,7],[61,-14]],'#ef6d56',4);E(0,-80,95,111,'#eb795d','#272630',7);P([[-75,-137],[-83,-202],[-60,-205],[-45,-180],[-12,-213],[13,-213],[42,-181],[61,-208],[81,-202],[72,-139]],'#477f98','#272630',5);E(0,-145,66,15,'#315a73');L([[-45,-160],[43,-160]],'#fbd78a',4);for(let side of [-1,1]){E(side*35,-88,25,32,'#fff8d6');E(side*35+Math.sin(t)*5,-82,11,16,'#272b36');E(side*35+4,-89,3,4,'#fff');P([[side*62,-134],[side*13,-137],[side*18,-124],[side*57,-120]],'#272732',null);E(side*56,-36,21,10,'#f8b069');}P([[-28,-29],[0,-10],[29,-29],[18,0],[-18,0]],'#322839');E(0,-5,12,5,'#f9a990');for(let j=0;j<6;j++)E(-77+j*30,-13+Math.sin(j)*6,3,3,'#a74745');c.restore();for(let j=4;j<8;j++)leg(j,t,true);if(g){E(g.x,g.y,18,18,'rgba(255,249,201,.5)','#f8f4c8',2);}txt(`${['踏步','溜步','盘腕'][s.gait]} · ${['木拍地板','唱片纹','潮水地板'][s.floor]}`,0,315,13);txt(s.relay>0?`接力剩 ${Math.ceil(s.relay)} 秒 · 点亮 ${s.pads.filter(x=>x>.1).length}/8 个脚垫`:'拖动拉大步幅；盘腕和地板可组合',0,339,12);c.restore();}
function input(kind,p){let l=lay(),a={x:(p.x-l.x)/l.k,y:(p.y-l.y)/l.k};if(kind==='down')g={...a,st:s.stride,sp:s.speed,cu:s.curl};if(kind==='move'&&g){let dx=a.x-g.x,dy=a.y-g.y;if(s.mode==='stride'){s.stride=cl(g.st+dx/160,.05,1.4);s.speed=cl(g.sp-dy/120,.35,2.3);}if(s.mode==='curl')s.curl=cl(g.cu-dy/150+Math.abs(dx)/170,0,1);}if(kind==='up'||kind==='cancel')g=null;}function action(id){if(id==='stride'||id==='curl')s.mode=id;if(id==='gait')s.gait=(s.gait+1)%3;if(id==='floor')s.floor=(s.floor+1)%3;if(id==='relay'){s.relay=20;s.pads=Array(8).fill(0);}}function state(){return{bounded:true,status:`${['踏步','溜步','盘腕'][s.gait]} · ${s.mode==='stride'?'横拉步幅，竖拉速度':'拖动触腕弯曲程度'} · ${s.relay>0?'八脚接力进行中':'可组合地板并开启接力'}`,mode:s.mode,stride:s.stride,speed:s.speed,gait:s.gait,floor:s.floor,curl:s.curl,relay:s.relay,rounds:s.rounds,pads:s.pads.map(x=>Math.round(x*100)),lit:s.pads.filter(x=>x>.1).length};}return{reset,draw,input,action,state};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
