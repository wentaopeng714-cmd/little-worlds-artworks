<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>彗尾驯场 · 第六组</title><style>:root{--bg:#11131e;--ink:#e8d7c4;--accent:#65cbd3;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>彗尾驯场</h1><p>拖彗核移动整束纤维；铜门折流，反牵改向，再凝尾叠出旧尾印。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="彗尾驯场，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="core" id="core">牵彗核</button><button data-action="gate" id="gate">设铜门</button><button data-action="repel" id="repel">反牵</button><button data-action="knot" id="knot">凝尾印</button><button data-action="release" id="release">释放旧尾</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=1;window.artMeta={"number": 1, "slug": "01-comet-corrals", "title": "彗尾驯场", "group": "F", "mothers": ["attraction_particles.html"], "description": "拖彗核移动整束纤维；铜门折流，反牵改向，再凝尾叠出旧尾印。", "ui": {"bg": "#11131e", "ink": "#e8d7c4", "accent": "#65cbd3"}, "controls": [{"id": "core", "label": "牵彗核"}, {"id": "gate", "label": "设铜门"}, {"id": "repel", "label": "反牵"}, {"id": "knot", "label": "凝尾印"}, {"id": "release", "label": "释放旧尾"}], "newMechanics": ["多彗核持续位置编辑", "铜门角度改变尾流折弯", "反牵改变方向与弯度", "最多三幅尾印叠加"], "artDirection": ["黑底染色纤维多层叠丝", "紧核与长尾强烈形态对比", "蓝青橙红紫金相互交织"], "testPlan": [{"control": "core", "from": [0.31, 0.38], "to": [0.44, 0.28], "hold": 650}, {"control": "gate", "from": [0.5, 0.55], "to": [0.65, 0.66], "hold": 700}, {"control": "repel", "from": [0.73, 0.56], "to": [0.65, 0.4], "hold": 600}, {"control": "knot", "from": [0.48, 0.4], "to": [0.48, 0.4], "hold": 100}], "stateFields": {"gates": "设门后增到1以上", "tailPrints": "凝尾后1以上，最大3", "knots": "凝尾结果累计", "direction": "反牵后反向"}};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,TAU=Math.PI*2,C=['#ff681f','#14cdf5','#f72da7','#ffd064'];let motes=[],trail=document.createElement('canvas'),tc=trail.getContext('2d'),cores=[],gates=[],prints=[],mode='core',drag=null,rev=1,knots=0,clock=0;const rnd=n=>{let v=Math.sin(n*127.13+17.7)*43758.54;return v-Math.floor(v)};function reset(){cores=[{x:.31,y:.38,a:.4,b:.2,col:0},{x:.73,y:.56,a:2.8,b:-.3,col:1},{x:.51,y:.77,a:-1.5,b:.35,col:2}];gates=[];prints=[];mode='core';rev=1;knots=0;clock=0;resetTrails()}function resetTrails(){trail.width=Math.max(1,e.W);trail.height=Math.max(1,e.H);motes=Array.from({length:1400},(_,k)=>({x:rnd(k),y:rnd(k+2000),vx:0,vy:0,col:k%3}));}function flow(dt){let W=e.W,H=e.H;tc.globalCompositeOperation='destination-out';tc.fillStyle='rgba(0,0,0,.016)';tc.fillRect(0,0,W,H);tc.globalCompositeOperation='source-over';for(let p of motes){let ax=0,ay=0;for(let b of cores){let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)+.012,f=.022/(d*d+.02);ax+=dx/d*f-dy/d*.07*rev/(d+.1);ay+=dy/d*f+dx/d*.07*rev/(d+.1)}for(let g of gates){let dx=p.x-g.x,dy=p.y-g.y,dist=Math.hypot(dx,dy);if(dist<.14){let q=(.14-dist)*2;ax+=Math.cos(g.a)*q*g.turn;ay+=Math.sin(g.a)*q*g.turn}}p.vx=(p.vx+ax*dt)*Math.pow(.95,dt*60);p.vy=(p.vy+ay*dt)*Math.pow(.95,dt*60);let x=p.x,y=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0||p.x>1||p.y<0||p.y>1){p.x=rnd(clock*100+p.col*13);p.y=rnd(clock*80+100);p.vx=p.vy=0;continue}tc.globalAlpha=.58;tc.strokeStyle=C[p.col];tc.lineWidth=.5+(Math.hypot(p.vx,p.vy)*7);tc.beginPath();tc.moveTo(x*W,y*H);tc.lineTo(p.x*W,p.y*H);tc.stroke()}tc.globalAlpha=1;}function paint(ctx,t){const W=e.W,H=e.H,S=Math.min(W,H);ctx.save();ctx.globalCompositeOperation='source-over';for(let j=0;j<cores.length;j++){let b=cores[j],nx=Math.cos(b.a),ny=Math.sin(b.a),px=-ny,py=nx;for(let k=0;k<430;k++){let offset=(rnd(k+j*1000)-.5)*S*.34,len=S*(.65+rnd(k+80)*.65),twist=b.b+rev*.45;ctx.strokeStyle=C[(k%17===0?(b.col+1):b.col)%4];ctx.globalAlpha=.13+rnd(k*5)*.23;ctx.lineWidth=.35+rnd(k+3)*.6;ctx.beginPath();for(let z=0;z<=24;z++){let u=z/24,fold=Math.sin(u*8.5+twist*4+t*.5)*S*.045*u,ox=offset*Math.pow(u,.65);for(let g of gates){const gx=g.x*W-b.x*W,gy=g.y*H-b.y*H,along=(gx*nx+gy*ny)/len;if(Math.abs(u-along)<.22)fold+=Math.sin((u-along)*Math.PI/.22)*S*.085*g.turn}let x=b.x*W+nx*len*u+px*(ox+fold),y=b.y*H+ny*len*u+py*(ox+fold);z?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}ctx.globalAlpha=.5;for(let k=0;k<75;k++){let a=k*2.399,r=S*.045*Math.sqrt(rnd(k+j*200)),x=b.x*W+Math.cos(a)*r,y=b.y*H+Math.sin(a)*r;ctx.fillStyle=k%7===0?'#fff1bd':C[b.col];ctx.fillRect(x,y,rnd(k+1)*2+.3,.6)}ctx.globalAlpha=.2;ctx.fillStyle=C[b.col];ctx.beginPath();for(let k=0;k<12;k++){let a=k*TAU/12,r=k%2?S*.012:S*.036;let x=b.x*W+Math.cos(a)*r,y=b.y*H+Math.sin(a)*r;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill()}ctx.restore()}
function draw(dt,t){clock+=dt;const W=e.W,H=e.H;if(trail.width!==Math.round(W)||trail.height!==Math.round(H))resetTrails();flow(dt);c.fillStyle='#080a12';c.fillRect(0,0,W,H);const g=c.createRadialGradient(W*.5,H*.45,1,W*.5,H*.45,W*.75);g.addColorStop(0,'#090b15');g.addColorStop(1,'#050608');c.fillStyle=g;c.fillRect(0,0,W,H);for(let k=0;k<210;k++){c.fillStyle=k%4?'#343647':'#65616c';c.globalAlpha=.25;c.fillRect(rnd(k)*W,rnd(k+1000)*H,.6,.6)}c.globalAlpha=1;for(let p of prints){c.globalAlpha=.4;c.drawImage(p,0,0,W,H)}c.globalAlpha=1;paint(c,t);c.globalCompositeOperation='source-over';c.drawImage(trail,0,0,W,H);c.globalCompositeOperation='source-over';for(let g of gates){c.save();c.translate(g.x*W,g.y*H);c.rotate(g.a);let r=Math.min(W,H)*.1;c.fillStyle='#0b1721';c.strokeStyle='#ac8261';c.lineWidth=2;c.beginPath();c.ellipse(0,0,r,r*.33,0,0,TAU);c.stroke();for(let k=-7;k<=7;k++){c.globalAlpha=.45;c.beginPath();c.moveTo(k*r/8,-r*.24);c.lineTo(k*r/8,r*.24);c.stroke()}c.globalAlpha=.9;c.fillStyle='#f0c27f';c.fillRect(-r-4,-5,8,10);c.fillRect(r-4,-5,8,10);c.restore()}c.fillStyle='#948c87';c.font='10px system-ui';c.fillText('彗核可拖移 · 铜门把尾流弯成不同的丝束',18,H-20)}
function input(kind,p){const x=p.x/e.W,y=p.y/e.H;if(kind==='down'){let closest=cores.reduce((a,b)=>Math.hypot(x-b.x,y-b.y)<Math.hypot(x-a.x,y-a.y)?b:a);if(mode==='core'){if(Math.hypot(x-closest.x,y-closest.y)>.18&&cores.length<4){closest={x,y,a:Math.atan2(.5-y,.5-x)+Math.PI,b:0,col:cores.length};cores.push(closest)}drag={b:closest,x,y}}else if(mode==='gate'){if(gates.length<6)gates.push({x,y,a:Math.PI/5,turn:1});drag={g:gates[gates.length-1],x,y}}else if(mode==='repel'){drag={b:closest,x,y};closest.b+=.7;rev*=-1}else if(mode==='knot'){stamp()} }else if(kind==='move'&&drag){if(drag.g){drag.g.a=Math.atan2(y-drag.y,x-drag.x);drag.g.turn=(x-drag.x)>=0?1:-1}else if(mode==='repel'){drag.b.a+= (x-drag.x)*5;drag.b.b+=(y-drag.y)*3;drag.x=x;drag.y=y}else{drag.b.x=e.clamp(x,.06,.94);drag.b.y=e.clamp(y,.06,.94)}}else if(kind==='up'||kind==='cancel')drag=null}
function stamp(){const a=document.createElement('canvas');a.width=e.W;a.height=e.H;paint(a.getContext('2d'),clock);a.getContext('2d').drawImage(trail,0,0);prints.push(a);if(prints.length>3)prints.shift();knots++;cores.forEach(b=>{b.a+=.5;b.b+=.2});artAudio.fx(3,.8)}function action(id){if(id==='release'){prints=[];gates.forEach(g=>g.turn*=-1);rev*=-1}else if(id==='knot'){mode=id;stamp()}else mode=id}function state(){return{bounded:true,status:({core:'拖住亮彗核：移动整束染色纤维',gate:'点放铜门，再拖转门的角度；尾流会绕门折弯',repel:'拖动反牵：改变最近彗尾方向与弯度',knot:'已凝成旧尾印；移动彗核叠上新的丝束',release:'释放尾印'})[mode]+' · 铜门 '+gates.length+' / 尾印 '+prints.length,mode,cores:cores.length,gates:gates.length,tailPrints:prints.length,knots,direction:rev,trajectoryParticles:motes.length}}return{reset,draw,input,action,state}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
