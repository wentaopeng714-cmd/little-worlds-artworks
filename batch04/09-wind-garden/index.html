*{box-sizing:border-box}body{margin:0;background:#e8e4d9;color:#314b43;font-family:Georgia,'Times New Roman',serif}button{font:inherit;cursor:pointer;min-height:44px;border:1px solid #b8c1b5;background:#f5f1e5;border-radius:24px;color:inherit;padding:9px 17px;transition:background .2s}button.active{background:#344f44;color:#faf2df;border-color:#344f44}button:focus-visible{outline:3px solid #df8c64;outline-offset:2px}main{max-width:1440px;margin:auto;padding:20px 30px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{letter-spacing:.18em;font-size:11px}h1{font-weight:400;font-size:clamp(28px,4vw,46px);margin:7px 0}.tag{font-size:12px;letter-spacing:.1em}.stage{position:relative;height:min(66vh,650px);min-height:330px;border:1px solid #c4c5b3;border-radius:100px 100px 12px 12px;overflow:hidden;margin:16px 0;background:#f5efde;box-shadow:0 16px 60px #62765b18}canvas{width:100%;height:100%;display:block;touch-action:none}.stamp{position:absolute;left:24px;top:22px;font-size:10px;letter-spacing:.22em;pointer-events:none}.note{position:absolute;bottom:18px;right:23px;font-size:12px;pointer-events:none;color:#637364}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.tools small{font-size:11px;letter-spacing:.1em;margin-right:5px}.flowers{display:flex;gap:7px;padding-left:12px;border-left:1px solid #b8c1b5}.flower{width:44px;padding:8px;font-size:21px;border-radius:50%}.help{font-family:system-ui,sans-serif;font-size:12px;color:#677967;line-height:1.7;margin:13px 0}.footer{display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.12em;margin-top:20px}.quiet{background:transparent;padding:9px 12px;font-family:system-ui,sans-serif;font-size:12px}#qa{display:none}@media(max-width:600px){main{padding:16px 15px}.stage{height:51vh;min-height:340px;border-radius:65px 65px 12px 12px;margin:12px 0}.tag{display:none}h1{font-size:30px}.tools{gap:6px}.tools button{padding:9px 13px}.flowers{border:0;padding:0}.tools small{display:none}.note{font-size:10px;right:15px}.footer{margin-top:12px}.help{margin:11px 0;font-size:11px}.stamp{left:19px;top:21px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body><main><header class="head"><div><div class="eyebrow">NO. 09 / A LIVING ARRANGEMENT</div><h1>风中花圃</h1></div><div class="tag">PLANT · PRUNE · COMPOSE</div></header><div class="stage"><canvas id="art" aria-label="可栽花修枝和吹风的花圃"></canvas><div class="stamp">HERBARIUM / 04</div><div class="note" id="note">选一种花，在纸上栽下它</div></div><nav class="tools" aria-label="花圃工具"><button id="plant" class="active">栽花</button><button id="wind">吹风</button><button id="move">移栽</button><button id="prune">修枝</button><button id="harvest">采入花瓶</button><div class="flowers"><button class="flower active" id="daisy" aria-label="白雏菊">✳</button><button class="flower" id="poppy" aria-label="珊瑚罂粟">✿</button><button class="flower" id="fern" aria-label="青绿羽叶">❧</button><button class="flower" id="bell" aria-label="蓝色铃花">♧</button></div><button id="season">晚夏</button><button id="gather">束成花束</button><button id="reset" class="quiet">重新栽种</button><span id="sound-status" class="sound-status">无声作品</span></nav><p class="help">栽花：点按添花，拖动形成一小片。吹风：沿画面梳出风向，花枝随后缓缓回弹。移栽：拖住花朵重新编排；修枝：点花削短枝条，再栽新花。采入花瓶：点花剪取，插到陶瓶里。试试束成花束后逐枝散开。</p><footer class="footer"><span>BOTANICAL PAPER STUDY</span><span id="count">27 STEMS</span></footer><div id="qa" data-frames="0" data-inputs="0" data-resets="0" data-audio="none"></div></main><script>

(()=>{'use strict';const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),qa=document.querySelector('#qa'),note=document.querySelector('#note');let W=900,H=550,dpr=1,mode='plant',kind=0,season=0,plants=[],gusts=[],pointer=null,picked=null,frames=0,inputs=0,resets=0,last=0,t=0,lastPlant=0;const cap=100;const palettes=[{paper:'#f5efde',stem:'#527e61',leaf:'#87a783',poppy:'#e6846f',bell:'#608697',ink:'#344f44'},{paper:'#e7eade',stem:'#526b68',leaf:'#98b7a0',poppy:'#de927e',bell:'#7a8bad',ink:'#384c4a'},{paper:'#efdfcc',stem:'#7d7854',leaf:'#b1a272',poppy:'#c65c51',bell:'#717f9e',ink:'#504a35'}];let rng=1;const rand=()=>{rng=(rng*1664525+1013904223)>>>0;return rng/4294967296};function plant(x,y,k,scale=1){if(plants.length>=cap)plants.shift();let maxh=Math.max(34,Math.min(H*.5,y-45));plants.push({x,y,h:(maxh*(.45+rand()*.5))*scale,kind:k,lean:(rand()-.5)*.25,phase:rand()*6.28,flex:0,v:0,size:9+rand()*7,seed:rand()*1000,cut:0});update()}function setup(){rng=72341;plants=[];gusts=[];pointer=null;picked=null;for(let i=0;i<27;i++){let x=W*(.14+rand()*.74),y=H*(.68+rand()*.18);plant(x,y,i%4)}mode='plant';kind=0;season=0;sync();update()}function resize(){let r=canvas.getBoundingClientRect(),oldW=W,oldH=H;W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(plants.length){for(let p of plants){p.x=p.x/oldW*W;p.y=p.y/oldH*H;p.h=p.h/oldH*H}}}new ResizeObserver(resize).observe(canvas);resize();setup();function sync(){['plant','wind','move','prune','harvest'].forEach(k=>document.getElementById(k).classList.toggle('active',mode===k));['daisy','poppy','fern','bell'].forEach((k,i)=>document.getElementById(k).classList.toggle('active',kind===i));document.querySelector('#season').textContent=['晚夏','清晨','秋日'][season];note.textContent={plant:'选一种花，在纸上栽下它',wind:'拖出风向，让花枝相互回应',move:'拖住花朵，重新安排花的位置',prune:'点按花朵，轻轻剪短一段枝条',harvest:'点一朵花剪下它，插入右侧的陶瓶'}[mode]}function update(){qa.dataset.bounded=String(plants.length<=cap&&gusts.length<=80);qa.dataset.objects=plants.length;qa.dataset.cap=cap;qa.dataset.gusts=gusts.length;document.querySelector('#count').textContent=plants.length+' STEMS'}function input(){inputs++;qa.dataset.inputs=inputs}for(let id of ['plant','wind','move','prune','harvest'])document.getElementById(id).onclick=()=>{mode=id;sync();input()};['daisy','poppy','fern','bell'].forEach((id,i)=>document.getElementById(id).onclick=()=>{kind=i;mode='plant';sync();input()});document.getElementById('season').onclick=()=>{season=(season+1)%3;sync();input()};document.getElementById('gather').onclick=()=>{plants.forEach((p,i)=>{p.x=W*.67+Math.sin(i*2.4)*W*.018;p.y=H*.88+Math.cos(i*2.4)*H*.015;p.lean=(i/plants.length-.5)*1.1;p.h=H*(.26+.16*(i%7)/7);p.flex=0});mode='move';sync();note.textContent='一束花已收拢；拖住花朵再把它散开';input()};document.querySelector('#reset').onclick=()=>{resets++;qa.dataset.resets=resets;setup();input()};function pos(e){let r=canvas.getBoundingClientRect();return{x:Math.max(10,Math.min(W-10,e.clientX-r.left)),y:Math.max(65,Math.min(H-24,e.clientY-r.top))}}function tip(p){let bend=(p.lean+p.flex)*p.h;return{x:p.x+bend,y:p.y-p.h}}function nearest(q){let best=null,d=62;for(let p of plants){let a=tip(p),dd=Math.hypot(a.x-q.x,a.y-q.y);if(dd<d){best=p;d=dd}}return best}function wind(q,dx,dy){gusts.push({x:q.x,y:q.y,dx,dy,life:1});if(gusts.length>80)gusts.shift();for(let p of plants){let a=tip(p),dist=Math.hypot(a.x-q.x,a.y-q.y);if(dist<H*.5)p.v+=Math.max(-.035,Math.min(.035,dx*.002))*Math.max(0,1-dist/(H*.5))}update()}canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer=pos(e);input();if(mode==='plant'){plant(pointer.x,Math.min(H-26,pointer.y+H*.21),kind);lastPlant=performance.now()}else if(mode==='move')picked=nearest(pointer);else if(mode==='harvest'){let p=nearest(pointer);if(p){p.x=W*.67+(rand()-.5)*W*.027;p.y=H*.89;p.h=H*(.23+rand()*.19);p.lean=(rand()-.5)*.95;p.flex=0;p.cut++}}else if(mode==='prune'){let p=nearest(pointer);if(p){p.h=Math.max(28,p.h*.73);p.size=Math.max(6,p.size*.92);p.cut++;p.v+=.045}}else wind(pointer,10,0)};canvas.onpointermove=e=>{if(!pointer)return;let q=pos(e),dx=q.x-pointer.x,dy=q.y-pointer.y;if(mode==='wind')wind(q,dx,dy);else if(mode==='move'&&picked){picked.x=Math.max(18,Math.min(W-18,picked.x+dx));picked.y=Math.max(picked.h+35,Math.min(H-24,picked.y+dy));picked.v+=dx*.0003}else if(mode==='plant'&&performance.now()-lastPlant>170&&Math.hypot(dx,dy)>2){plant(q.x,Math.min(H-26,q.y+H*.21),kind,.85);lastPlant=performance.now()}pointer=q;input()};canvas.onpointerup=canvas.onpointercancel=()=>{pointer=null;picked=null};function leaf(x,y,sz,ang,col){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(sz*.45,-sz*.52,sz, -sz*.2,sz,0);ctx.bezierCurveTo(sz*.7,sz*.28,sz*.2,sz*.4,0,0);ctx.fill();ctx.restore()}function drawPlant(p){let pal=palettes[season],bend=(p.lean+p.flex)*p.h,tx=p.x+bend,ty=p.y-p.h;ctx.strokeStyle=pal.stem;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.bezierCurveTo(p.x-bend*.14,p.y-p.h*.35,tx-bend*.1,ty+p.h*.3,tx,ty);ctx.stroke();if(p.kind===2){for(let i=1;i<11;i++){let u=i/11,y=p.y-p.h*u,x=p.x+bend*u*u,sz=p.size*1.5*Math.sin(u*Math.PI);leaf(x,y,sz,-.7,pal.leaf);leaf(x,y,sz,Math.PI+.7,pal.stem)}leaf(tx,ty,p.size,-1.6,pal.leaf);return}for(let i=0;i<3;i++){let u=.25+i*.19;leaf(p.x+bend*u*u,p.y-p.h*u,p.size*(1.1-i*.13),i%2?-.7:Math.PI+.5,pal.leaf)}ctx.save();ctx.translate(tx,ty);ctx.rotate(p.flex*.55+Math.sin(p.phase)*.13);if(p.kind===0){for(let j=0;j<9;j++){ctx.save();ctx.rotate(j*Math.PI*2/9);ctx.fillStyle='#fff9e9';ctx.beginPath();ctx.ellipse(0,-p.size*.72,p.size*.33,p.size*.63,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.fillStyle='#c8a54d';ctx.beginPath();ctx.arc(0,0,p.size*.29,0,6.29);ctx.fill()}else if(p.kind===1){ctx.fillStyle=pal.poppy;for(let j=0;j<4;j++){ctx.save();ctx.rotate(j*Math.PI/2);ctx.beginPath();ctx.ellipse(0,-p.size*.5,p.size*.73,p.size*.82,.15,0,6.29);ctx.fill();ctx.restore()}ctx.fillStyle='#493f37';ctx.beginPath();ctx.arc(0,0,p.size*.28,0,6.29);ctx.fill();ctx.strokeStyle='#f3ad82';ctx.lineWidth=.8;for(let j=0;j<10;j++){let a=j*.628;ctx.beginPath();ctx.moveTo(Math.cos(a)*p.size*.29,Math.sin(a)*p.size*.29);ctx.lineTo(Math.cos(a)*p.size*.52,Math.sin(a)*p.size*.52);ctx.stroke()}}else{ctx.fillStyle=pal.bell;for(let j=0;j<4;j++){ctx.save();ctx.translate((j%2?1:-1)*p.size*.45,j*p.size*.61);ctx.rotate(j%2?.4:-.4);ctx.beginPath();ctx.moveTo(-p.size*.3,0);ctx.quadraticCurveTo(-p.size*.85,p.size*.8,0,p.size*.65);ctx.quadraticCurveTo(p.size*.8,p.size*.7,p.size*.3,0);ctx.fill();ctx.restore()}}ctx.restore()}function frame(ms){let dt=Math.min(2,(ms-last)/16.7||1);last=ms;t+=dt*.01;let pal=palettes[season];ctx.fillStyle=pal.paper;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#b6bda15c';ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(W*.5,H*.91,W*.36,H*.035,0,0,6.29);ctx.stroke();ctx.fillStyle='#d3d5b444';ctx.beginPath();ctx.ellipse(W*.5,H*.92,W*.36,H*.024,0,0,6.29);ctx.fill();for(let p of plants){p.v+=(-p.flex*.016-p.v*.04)*dt;p.flex+=p.v*dt;p.flex=Math.max(-.72,Math.min(.72,p.flex));let save=p.flex;p.flex+=Math.sin(t+p.phase)*.024;drawPlant(p);p.flex=save}ctx.save();ctx.translate(W*.67,H*.90);let vw=Math.min(52,W*.095),vh=H*.155;ctx.fillStyle='#b17c69';ctx.beginPath();ctx.moveTo(-vw*.32,-vh);ctx.lineTo(vw*.32,-vh);ctx.bezierCurveTo(vw*.25,-vh*.64,vw*.85,-vh*.49,vw*.70,0);ctx.quadraticCurveTo(0,vh*.17,-vw*.70,0);ctx.bezierCurveTo(-vw*.85,-vh*.49,-vw*.25,-vh*.64,-vw*.32,-vh);ctx.fill();ctx.strokeStyle='#f0c5a878';ctx.lineWidth=1;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*vw*.1,-vh*.89);ctx.quadraticCurveTo(i*vw*.2,-vh*.47,i*vw*.17,vh*.03);ctx.stroke()}ctx.fillStyle='#665844';ctx.beginPath();ctx.ellipse(0,-vh,vw*.32,2,0,0,6.29);ctx.fill();ctx.restore();for(let i=gusts.length-1;i>=0;i--){let g=gusts[i];g.life-=.015*dt;if(g.life<=0){gusts.splice(i,1);continue}g.x+=g.dx*.15;g.y+=g.dy*.15;ctx.strokeStyle=`rgba(114,142,118,${g.life*.25})`;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(g.x-g.dx*2,g.y-g.dy*2);ctx.quadraticCurveTo(g.x-g.dx,g.y-g.dy-6,g.x,g.y);ctx.stroke()}ctx.strokeStyle='#b0b79650';ctx.lineWidth=.5;for(let i=0;i<38;i++){let x=(i*73.17)%W,y=H*.94+(i%4)*3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+7,y-.5);ctx.stroke()}qa.dataset.frames=++frames;if(frames%30===0)update();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
