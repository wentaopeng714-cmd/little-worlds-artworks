</style></head><body><canvas id="art" aria-label="Paint canvas. Drag to paint, scrape or lift pigment."></canvas><header><h1>Pigment Tide</h1><p>Lay colour. Feel the surface.</p></header><div class="mark">09 / MATERIAL STUDY</div><div id="hint">Slow strokes carry more paint · cross a colour to mix</div><div class="tools" aria-label="Paint tools"><div class="colors"><button class="color active" style="--color:#00cbd1" data-color="0" aria-label="Turquoise pigment" title="Turquoise"></button><button class="color" style="--color:#ff5536" data-color="1" aria-label="Vermilion pigment" title="Vermilion"></button><button class="color" style="--color:#d4ee59" data-color="2" aria-label="Chartreuse pigment" title="Chartreuse"></button><button class="color" style="--color:#f7efda" data-color="3" aria-label="Ivory pigment" title="Ivory"></button></div><button data-tool="brush" class="active">Bristles</button><button data-tool="knife">Knife</button><button data-tool="lift">Lift</button><span class="break"></span><label class="wet">Wet<input id="wet" type="range" min="0" max="100" value="70" aria-label="Paint wetness"></label><button id="dry" title="Set wetness to dry">Dry</button><button id="paper">Ivory</button><button id="undo" title="Undo last stroke">Undo</button><button id="reset">Reset</button><button id="mute">Sound off</button></div><div id="qa"></div><script>
(()=>{'use strict';const c=document.querySelector('#art'),ctx=c.getContext('2d',{alpha:false}),paint=document.createElement('canvas'),pc=paint.getContext('2d',{willReadFrequently:true}),grain=document.createElement('canvas'),gc=grain.getContext('2d'),qa=document.querySelector('#qa');let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),tool='brush',colorIndex=0,wet=.7,ivory=false,down=false,last=null,undo=[],droplets=[],frames=0,inputs=0,resets=0,fps=0,prev=performance.now(),tick=prev,muted=true,audio=null,voice=null,initialized=false;const palette=[[0,203,209],[255,85,54],[212,238,89],[247,239,218]];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function unlock(){if(!muted){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});}}function sound(speed){if(muted||!audio)return;if(!voice){const o=audio.createOscillator(),f=audio.createBiquadFilter(),g=audio.createGain();o.type='triangle';f.type='lowpass';f.frequency.value=500;o.connect(f).connect(g).connect(audio.destination);g.gain.value=0;o.start();voice={o,g};}voice.o.frequency.setTargetAtTime(60+colorIndex*27+Math.min(130,speed*3),audio.currentTime,.08);voice.g.gain.setTargetAtTime(tool==='lift'?.006:.014,audio.currentTime,.03);}function quiet(){if(audio&&voice)voice.g.gain.setTargetAtTime(0,audio.currentTime,.08);}function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(initialized)old.getContext('2d').drawImage(paint,0,0);W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);for(const v of[c,paint,grain]){v.width=Math.round(W*D);v.height=Math.round(H*D);}ctx.setTransform(D,0,0,D,0,0);pc.setTransform(D,0,0,D,0,0);gc.setTransform(D,0,0,D,0,0);if(initialized)pc.drawImage(old,0,0,old.width,old.height,0,0,W,H);makeGrain();undo=[];droplets=[];if(!initialized){initialized=true;seed();}}function makeGrain(){gc.clearRect(0,0,W,H);for(let i=0,n=Math.min(70000,W*H/16);i<n;i++){gc.fillStyle=Math.random()<.5?'#ffffff0d':'#00000018';const x=Math.random()*W,y=Math.random()*H;gc.fillRect(x,y,.4+Math.random(),.3+Math.random());}}function pick(x,y){const px=pc.getImageData(clamp(Math.floor(x*D),0,paint.width-1),clamp(Math.floor(y*D),0,paint.height-1),1,1).data;return px[3]>30?[px[0],px[1],px[2],px[3]/255]:null;}function css(col,a=1){return `rgba(${col.map(v=>Math.round(clamp(v,0,255))).join(',')},${a})`;}function blend(a,b,t){return a.map((v,i)=>v*(1-t)+b[i]*t);}function save(){if(undo.length>=5)undo.shift();const u=document.createElement('canvas');u.width=paint.width;u.height=paint.height;u.getContext('2d').drawImage(paint,0,0);undo.push(u);}function segment(a,b,pressure=.65,seeded=false){const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),speed=dist/Math.max(1,(b.t-a.t)/16),ang=Math.atan2(dy,dx),nx=-Math.sin(ang),ny=Math.cos(ang),base=palette[colorIndex];let mixed=base.slice(),old=pick(b.x,b.y);if(old&&wet>.01)mixed=blend(base,old,wet*.62);const size=(W<600?29:42)*(pressure*.5+.7)*(1-clamp(speed/150,0,.48));if(tool==='lift'){pc.save();pc.globalCompositeOperation='destination-out';pc.strokeStyle=`rgba(0,0,0,${.13+wet*.2})`;pc.lineWidth=size*1.4;pc.lineCap='round';pc.beginPath();pc.moveTo(a.x,a.y);pc.lineTo(b.x,b.y);pc.stroke();for(let k=0;k<7;k++){pc.lineWidth=.6;pc.strokeStyle='#00000038';const offset=(k/6-.5)*size*1.5;pc.beginPath();pc.moveTo(a.x+nx*offset,a.y+ny*offset);pc.lineTo(b.x+nx*offset,b.y+ny*offset);pc.stroke();}pc.restore();return;}if(tool==='knife'){const thick=size*(.6+wet*.3),edge=rand(-4,4);pc.save();pc.beginPath();pc.moveTo(a.x+nx*thick*.7,a.y+ny*thick*.7);pc.lineTo(b.x+nx*(thick+edge),b.y+ny*(thick+edge));pc.lineTo(b.x-nx*thick*.8,b.y-ny*thick*.8);pc.lineTo(a.x-nx*thick*.5,a.y-ny*thick*.5);pc.closePath();const gradient=pc.createLinearGradient(b.x-nx*thick,b.y-ny*thick,b.x+nx*thick,b.y+ny*thick);gradient.addColorStop(0,css(blend(mixed,[8,18,22],.3),.95));gradient.addColorStop(.15,css(mixed,.92));gradient.addColorStop(.5,css(blend(mixed,[255,255,235],.11),.93));gradient.addColorStop(.92,css(mixed,.92));gradient.addColorStop(1,css(blend(mixed,[255,255,240],.45),.96));pc.fillStyle=gradient;pc.fill();for(let j=0;j<6;j++){const offset=rand(-thick,thick);pc.lineWidth=rand(.3,1);pc.strokeStyle=css(j%2?blend(mixed,[255,255,230],.4):blend(mixed,[2,12,20],.38),rand(.2,.65));pc.beginPath();pc.moveTo(a.x+nx*offset,a.y+ny*offset);pc.lineTo(b.x+nx*offset+rand(-1,1),b.y+ny*offset);pc.stroke();}pc.restore();return;}pc.lineCap='round';const count=W<600?42:58;for(let j=0;j<count;j++){const offset=(j/(count-1)-.5)*size*2,jitter=Math.sin(j*19.34)*.75,variation=Math.sin(j*3.71)*.13,col=blend(mixed,variation>0?[255,255,233]:[0,25,31],Math.abs(variation));pc.strokeStyle=css(col,seeded?.94:.8+wet*.16);pc.lineWidth=size/count*(.55+wet*.65);pc.beginPath();pc.moveTo(a.x+nx*(offset+jitter),a.y+ny*(offset+jitter));pc.lineTo(b.x+nx*(offset+jitter),b.y+ny*(offset+jitter));pc.stroke();if(j%3===0){pc.strokeStyle=css(blend(col,[255,255,235],.48),.28+wet*.26);pc.lineWidth=.4;pc.beginPath();pc.moveTo(a.x+nx*(offset-.6)+.6,a.y+ny*(offset-.6)-.6);pc.lineTo(b.x+nx*(offset-.6)+.6,b.y+ny*(offset-.6)-.6);pc.stroke();}}if(!seeded&&wet>.8&&Math.random()<.07&&droplets.length<70)droplets.push({x:b.x+rand(-size,size),y:b.y,r:rand(.8,2),life:rand(15,50),col:mixed});}function seed(){pc.clearRect(0,0,W,H);const original={tool,colorIndex,wet};wet=.8;tool='brush';const cx=W*.5,cy=H*.47,scale=Math.min(W*.77,H*.56);for(let layer=0;layer<7;layer++){colorIndex=[0,0,1,1,2,0,3][layer];let a=null;for(let i=0;i<95;i++){let t=i/94;const x=cx+Math.sin(t*5.4+layer*.38)*scale*.4+Math.cos(t*3.1)*scale*.12,y=cy+(t-.5)*scale*.94+Math.cos(t*6.3+layer*.24)*scale*.13+(layer-3)*scale*.019;const b={x,y,t:i*20};if(a)segment(a,b,.48+Math.sin(t*Math.PI)*.55,true);a=b;}}tool=original.tool;colorIndex=original.colorIndex;wet=original.wet;}function point(e){return{x:e.clientX,y:e.clientY,t:performance.now(),pressure:e.pressure>0?e.pressure:.65};}c.addEventListener('pointerdown',e=>{if(down)return;unlock();down=true;inputs++;save();last=point(e);c.setPointerCapture(e.pointerId);const b={...last,x:last.x+.5,y:last.y+.5,t:last.t+16};segment(last,b,last.pressure);sound(0);});c.addEventListener('pointermove',e=>{if(!down)return;inputs++;const list=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of list){const b=point(ev);const dist=Math.hypot(b.x-last.x,b.y-last.y),steps=Math.max(1,Math.ceil(dist/7));for(let k=1;k<=steps;k++)segment({x:last.x+(b.x-last.x)*(k-1)/steps,y:last.y+(b.y-last.y)*(k-1)/steps,t:last.t+(b.t-last.t)*(k-1)/steps},{x:last.x+(b.x-last.x)*k/steps,y:last.y+(b.y-last.y)*k/steps,t:last.t+(b.t-last.t)*k/steps},b.pressure);sound(dist);last=b;}});function end(){down=false;last=null;quiet();}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;inputs++;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));document.querySelector('#hint').textContent={brush:'Slow strokes carry more paint · cross a colour to mix',knife:'Press and sweep · broad edges fold colours together',lift:'Drag to lift pigment · leave fine scraped channels'}[tool];});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{colorIndex=+b.dataset.color;inputs++;document.querySelectorAll('[data-color]').forEach(v=>v.classList.toggle('active',v===b));});document.querySelector('#wet').oninput=e=>{wet=+e.target.value/100;inputs++;};document.querySelector('#dry').onclick=()=>{wet=0;document.querySelector('#wet').value=0;droplets=[];inputs++;};document.querySelector('#paper').onclick=e=>{ivory=!ivory;e.target.textContent=ivory?'Midnight':'Ivory';document.body.style.color=ivory?'#172c34':'#fff';inputs++;};document.querySelector('#undo').onclick=()=>{const u=undo.pop();if(u){pc.clearRect(0,0,W,H);pc.drawImage(u,0,0,u.width,u.height,0,0,W,H);droplets=[];}inputs++;};document.querySelector('#reset').onclick=()=>{seed();undo=[];droplets=[];resets++;inputs++;};document.querySelector('#mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'Sound off':'Sound on';if(muted)quiet();else unlock();inputs++;};function draw(now){requestAnimationFrame(draw);if(document.hidden){prev=now;return;}frames++;ctx.fillStyle=ivory?'#eee7d4':'#0a1921';ctx.fillRect(0,0,W,H);if(!ivory){const g=ctx.createRadialGradient(W*.47,H*.43,0,W*.47,H*.43,Math.max(W,H)*.7);g.addColorStop(0,'#12313c');g.addColorStop(1,'#071117');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}for(let i=droplets.length-1;i>=0;i--){const p=droplets[i];p.y+=.08+wet*.35;pc.fillStyle=css(p.col,.11);pc.beginPath();pc.ellipse(p.x,p.y,p.r,p.r*1.6,0,0,Math.PI*2);pc.fill();if(--p.life<=0)droplets.splice(i,1);}ctx.drawImage(paint,0,0,paint.width,paint.height,0,0,W,H);ctx.globalAlpha=.55;ctx.drawImage(grain,0,0,grain.width,grain.height,0,0,W,H);ctx.globalAlpha=1;if(now-tick>1000){fps=Math.round(frames*1000/(now-tick));qa.dataset.frames=String((+qa.dataset.frames||0)+frames);qa.dataset.fps=fps;qa.dataset.entities=droplets.length;qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.muted=muted;qa.dataset.width=W;qa.dataset.height=H;qa.dataset.audio=audio?audio.state:'locked';frames=0;tick=now;}prev=now;}addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)quiet();});resize();requestAnimationFrame(draw);})();
