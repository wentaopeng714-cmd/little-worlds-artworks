<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131f"><title>Tidal Lens — Little Worlds</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131f;color:#eff8fa;font-family:Inter,Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(23px,env(safe-area-inset-top));left:28px;pointer-events:none;z-index:2}h1{margin:0;font-size:14px;letter-spacing:.22em;font-weight:500;text-transform:uppercase}header p{margin:9px 0 0;font-size:12px;letter-spacing:.12em;opacity:.65}.panel{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;width:max-content;max-width:calc(100% - 24px);padding:9px 12px;border:1px solid #ffffff23;border-radius:22px;background:#06131fc7;backdrop-filter:blur(18px);box-shadow:0 12px 40px #0003}.bar{display:flex;gap:6px;align-items:center;justify-content:center}button,select,.range{height:44px;min-width:48px;color:#eaf9fa;background:#ffffff09;border:1px solid #ffffff16;border-radius:12px;font:12px Arial,sans-serif;padding:0 12px;cursor:pointer;white-space:nowrap}button:hover,select:hover{background:#ffffff20}button[aria-pressed=true]{background:#d9faff25;border-color:#c9fcf978;box-shadow:inset 0 0 18px #a7fffa10}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #a4f5f1;outline-offset:3px}.range{display:flex;align-items:center;gap:6px;padding:0 9px;font-size:12px}.range input{width:72px;accent-color:#b6efef;cursor:pointer}.hint{margin:8px 0 0;text-align:center;color:#dceef1a3;font-size:12px;letter-spacing:.055em;pointer-events:none}#qa{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){header{left:22px;top:25px}h1{font-size:12px}.panel{width:calc(100% - 24px);padding:8px;border-radius:18px;bottom:max(12px,env(safe-area-inset-bottom))}.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}button,select,.range{width:100%;min-width:0;padding:0 3px;font-size:12px}.range{gap:3px}.range input{width:38px;min-width:25px}.hint{margin-top:7px;font-size:12px}}</style></head><body><canvas id="art" aria-label="Tidal Lens interactive artwork"></canvas><header><h1>Tidal Lens</h1><p>02 / ELASTIC CHROMATICS</p></header><div class="panel"><div class="bar"><button id="palette">Palette</button><button id="storm" aria-pressed="false">Storm</button><button id="freeze" aria-pressed="false">Freeze</button><label class="range">Tide<input id="tide" aria-label="Tide speed" type="range" min="0" max="1" value="0.48" step="0.01"></label><label class="range">Drag<input id="drag" aria-label="Water viscosity" type="range" min="0" max="1" value="0.55" step="0.01"></label><button id="reset" aria-label="Reset artwork">Reset</button><button id="mute" aria-pressed="false" aria-label="Toggle synthesized sound">Sound off</button></div><p class="hint">Press & drag the lens · combine tide, storm & freeze</p></div><output id="qa" aria-live="off"></output><script>const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false}),qa=document.getElementById('qa');let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),frames=0,inputs=0,resets=0,muted=true,ac=null,voices=0,lastSound=0,lastFrame=0,clock=0,fps=0,countFrames=0,fpsAt=0,hidden=false;const pointers=new Map();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;const rnd=(a=0,b=1)=>a+Math.random()*(b-a);const hs=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;function size(){W=innerWidth;H=innerHeight;D=Math.min(W>=800?1.5:2,devicePixelRatio||1);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);if(typeof onResize==='function')onResize()}function usable(){return H-(W<600?148:100)}function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(ac.state==='suspended')ac.resume().catch(()=>{})}function tone(freq=220,length=.3,vol=.055){if(muted||!ac||ac.state!=='running'||voices>=6||performance.now()-lastSound<65)return;lastSound=performance.now();voices++;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.5,ac.currentTime+length);g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(vol,ac.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+length);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+length+.03);o.onended=()=>{voices--;o.disconnect();g.disconnect()}}function setPressed(id,v){document.getElementById(id).setAttribute('aria-pressed',v)}function bind(id,fn){document.getElementById(id).addEventListener('click',()=>{unlock();inputs++;fn();tone(330,.22,.03)})}bind('mute',()=>{muted=!muted;document.getElementById('mute').textContent=muted?'Sound off':'Sound on';setPressed('mute',!muted)});bind('reset',()=>{resets++;reset();pointers.clear()});function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,px:e.clientX,py:e.clientY,id:e.pointerId}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();unlock();inputs++;const p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);down(p)});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();inputs++;const p=point(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);move(p,old)});function end(e){if(!pointers.has(e.pointerId))return;up(pointers.get(e.pointerId));pointers.delete(e.pointerId)}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{hidden=document.hidden;lastFrame=0;if(hidden&&ac&&ac.state==='running')ac.suspend().catch(()=>{});else if(ac&&!muted)ac.resume().catch(()=>{})});setInterval(()=>{qa.dataset.frames=frames;qa.dataset.fps=fps.toFixed(1);qa.dataset.entities=entities();qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.muted=muted;qa.dataset.width=W;qa.dataset.height=H;qa.dataset.audio=ac?ac.state:'locked';qa.dataset.dpr=D;qa.dataset.rendering='cached-background-adaptive-desktop';qa.textContent=`${frames} frames; ${fps.toFixed(1)} FPS; ${entities()} entities; ${inputs} inputs`},1000);function loop(now){requestAnimationFrame(loop);if(hidden)return;const dt=lastFrame?Math.min(.04,(now-lastFrame)/1000):.016;lastFrame=now;clock+=dt;frames++;countFrames++;if(now-fpsAt>1000){fps=countFrames*1000/(now-fpsAt);countFrames=0;fpsAt=now}update(dt);ctx.setTransform(D,0,0,D,0,0);draw()};
let layers=[],sparks=[],impulses=[],palette=0,storm=false,frozen=false,tide=.48,viscosity=.55,phase=0;let staticKey='',backdrop=null,layerGradients=[],coreGradient=null,shineLayer=null,sampleAt=0,slowSamples=0;const N=100,cosines=Float32Array.from({length:100},(_,i)=>Math.cos(i/100*Math.PI*2)),sines=Float32Array.from({length:100},(_,i)=>Math.sin(i/100*Math.PI*2)),palettes=[[190,209,236,266,309,168],[342,19,35,48,161,187],[148,171,182,204,268,43]];function geometry(){const a=usable();return{cx:W*.5,cy:Math.max(190,a*.53),r:Math.min(W*.435,a*.455,370)}}function reset(){layers=Array.from({length:6},(_,l)=>({u:new Float32Array(N),v:new Float32Array(N),base:1-l*.122}));sparks=Array.from({length:65},()=>({a:rnd(TAU),r:rnd(.18,.94),z:rnd(1),s:rnd(.006,.018)}));impulses=[];phase=0;frozen=false;storm=false;setPressed('freeze',false);setPressed('storm',false);document.getElementById('freeze').textContent='Freeze'}function act(p,force){const g=geometry(),dx=p.px-g.cx,dy=p.py-g.cy,a=Math.atan2(dy,dx),rr=Math.hypot(dx,dy)/g.r,index=Math.round(((a+TAU)%TAU)/TAU*N)%N;for(let l=0;l<6;l++){const lay=layers[l],near=Math.exp(-Math.pow((rr-lay.base)/.32,2));for(let k=-9;k<=9;k++){const i=(index+k+N)%N;lay.v[i]+=force*near*Math.exp(-k*k/24);if(frozen)lay.u[i]=clamp(lay.u[i]+force*.0006*near*Math.exp(-k*k/24),-.22,.22)}}impulses.push({x:p.x,y:p.y,age:0});if(impulses.length>16)impulses.shift();tone(100+rr*460,.5,.05)}function down(p){act(p,1.7)}function move(p,old){const dist=Math.hypot(p.px-old.px,p.py-old.py),n=Math.max(1,Math.ceil(dist/18));for(let i=1;i<=n;i++){const f=i/n;act({x:mix(old.x,p.x,f),y:mix(old.y,p.y,f),px:mix(old.px,p.px,f),py:mix(old.py,p.py,f)},clamp(dist/n/15,.15,1.5))}}function up(){}bind('palette',()=>{palette=(palette+1)%3});bind('storm',()=>{storm=!storm;setPressed('storm',storm)});bind('freeze',()=>{frozen=!frozen;setPressed('freeze',frozen);document.getElementById('freeze').textContent=frozen?'Thaw':'Freeze'});for(const id of ['tide','drag'])document.getElementById(id).addEventListener('input',e=>{unlock();inputs++;if(id==='tide')tide=+e.target.value;else viscosity=+e.target.value});function onResize(){staticKey='';sampleAt=performance.now()+2500;slowSamples=0}function adaptResolution(){const now=performance.now();if(W<800||now<sampleAt||fps<=0)return;sampleAt=now+2000;slowSamples=fps<32?slowSamples+1:0;if(slowSamples>=2&&D>1){D=Math.max(1,D-.25);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);staticKey='';slowSamples=0}}function entities(){return N*layers.length+sparks.length+impulses.length}function update(dt){adaptResolution();phase+=dt*(.22+tide*.65);if(!frozen){for(let l=0;l<6;l++){const lay=layers[l];for(let i=0;i<N;i++){const left=lay.u[(i-1+N)%N],right=lay.u[(i+1)%N];let ambient=Math.sin(phase*1.2+i*TAU/N*3+l*.55)*(.008+tide*.018);let accel=(left+right-2*lay.u[i])*26+(ambient-lay.u[i])*3.5;if(storm)accel+=Math.sin(phase*4+i*.7+l*.7)*.65;lay.v[i]=(lay.v[i]+accel*dt)*Math.exp(-dt*(.8+viscosity*5));}for(let i=0;i<N;i++)lay.u[i]=clamp(lay.u[i]+lay.v[i]*dt,-.25,.25)}}for(const s of sparks)s.a+=dt*s.s*(frozen?.1:1+tide);impulses=impulses.filter(p=>(p.age+=dt)<1.2)}function path(lay,r,cx,cy,offset=0){ctx.beginPath();for(let i=0;i<=N;i++){const j=i%N,rr=r*(lay.base+lay.u[j]+offset);let x=cx+cosines[j]*rr,y=cy+sines[j]*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}function buildCache(g,p){const key=[W,H,D,palette].join(':');if(key===staticKey)return;staticKey=key;backdrop=document.createElement('canvas');backdrop.width=canvas.width;backdrop.height=canvas.height;const bc=backdrop.getContext('2d',{alpha:false});bc.setTransform(D,0,0,D,0,0);const bg=bc.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#071623');bg.addColorStop(.55,hs(p[0],35,12));bg.addColorStop(1,'#09131e');bc.fillStyle=bg;bc.fillRect(0,0,W,H);const halo=bc.createRadialGradient(g.cx,g.cy,g.r*.3,g.cx,g.cy,g.r*1.35);halo.addColorStop(0,hs(p[0],70,35,.12));halo.addColorStop(.8,hs(p[2],60,25,.08));halo.addColorStop(1,'#00000000');bc.fillStyle=halo;bc.fillRect(0,0,W,H);bc.strokeStyle='#b2d6dc14';bc.lineWidth=1;bc.beginPath();bc.arc(g.cx,g.cy,g.r+15,0,TAU);bc.stroke();for(let k=0;k<60;k++){const a=k/60*TAU;bc.strokeStyle=k%5===0?'#bcdbdd49':'#bcdbdd19';bc.beginPath();bc.moveTo(g.cx+Math.cos(a)*(g.r+22),g.cy+Math.sin(a)*(g.r+22));bc.lineTo(g.cx+Math.cos(a)*(g.r+(k%5===0?28:25)),g.cy+Math.sin(a)*(g.r+(k%5===0?28:25)));bc.stroke()}layerGradients=p.map(c=>{const grad=ctx.createLinearGradient(g.cx-g.r,g.cy-g.r,g.cx+g.r,g.cy+g.r);grad.addColorStop(0,hs(c+15,70,74));grad.addColorStop(.25,hs(c,65,53));grad.addColorStop(.6,hs(c+10,68,35));grad.addColorStop(.9,hs(c-20,65,55));grad.addColorStop(1,hs(c,65,29));return grad});coreGradient=ctx.createRadialGradient(g.cx-g.r*.1,g.cy-g.r*.13,0,g.cx,g.cy,g.r*.45);coreGradient.addColorStop(0,'#e9faedc9');coreGradient.addColorStop(.18,hs(p[5],65,76,.6));coreGradient.addColorStop(1,hs(p[5],55,50,0));shineLayer=document.createElement('canvas');shineLayer.width=Math.ceil(g.r*3.2*D);shineLayer.height=shineLayer.width;const sc=shineLayer.getContext('2d');sc.setTransform(D,0,0,D,shineLayer.width/2,shineLayer.height/2);sc.translate(-g.r*.18,-g.r*.28);sc.rotate(-.55);const shine=sc.createLinearGradient(-g.r*.8,0,g.r*.8,0);shine.addColorStop(0,'#ffffff00');shine.addColorStop(.4,'#ffffff09');shine.addColorStop(.5,'#ffffff38');shine.addColorStop(.57,'#ffffff09');shine.addColorStop(1,'#ffffff00');sc.fillStyle=shine;sc.fillRect(-g.r,-g.r,g.r*2,g.r*2)}function draw(){const g=geometry(),p=palettes[palette];buildCache(g,p);ctx.drawImage(backdrop,0,0,W,H);for(let l=0;l<6;l++){const lay=layers[l],c=p[l];const grad=layerGradients[l];path(lay,g.r,g.cx,g.cy);ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle=hs(c+10,80,87,.7);ctx.lineWidth=l===0?1.8:1.3;ctx.stroke();for(let k=1;k<=3;k++){path(lay,g.r,g.cx,g.cy,k*.016);ctx.strokeStyle=hs(c+20,65,80,.13/k);ctx.lineWidth=.6;ctx.stroke()}path(lay,g.r,g.cx,g.cy,-.02);ctx.strokeStyle=hs(c,85,10,.35);ctx.lineWidth=2;ctx.stroke()}const core=coreGradient;ctx.fillStyle=core;ctx.beginPath();ctx.arc(g.cx,g.cy,g.r*.46,0,TAU);ctx.fill();ctx.save();path(layers[0],g.r,g.cx,g.cy);ctx.clip();ctx.globalCompositeOperation='screen';for(const s of sparks){const x=g.cx+Math.cos(s.a)*g.r*s.r,y=g.cy+Math.sin(s.a)*g.r*s.r;ctx.fillStyle=`rgba(226,255,248,${.18+s.z*.5})`;ctx.beginPath();ctx.arc(x,y,.6+s.z*1.25,0,TAU);ctx.fill()}ctx.drawImage(shineLayer,g.cx-g.r*1.6,g.cy-g.r*1.6,g.r*3.2,g.r*3.2);ctx.restore();for(const q of impulses){ctx.strokeStyle=`rgba(235,255,255,${(1-q.age/1.2)*.5})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(q.x*W,q.y*H,4+q.age*30,0,TAU);ctx.stroke()}ctx.fillStyle='#d4eeee64';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(frozen?'SUSPENDED IN TIME':storm?'A WEATHER SYSTEM IN GLASS':'SIX TIDES · ONE LENS',W*.5,H-(W<600?158:107))}
size();reset();requestAnimationFrame(loop);</script></body></html>
