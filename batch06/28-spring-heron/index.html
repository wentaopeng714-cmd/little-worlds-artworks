<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>弹簧鹭舞 · 第六组</title><style>:root{--bg:#f5d56e;--ink:#2b3b47;--accent:#cf795e;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>弹簧鹭舞</h1><p>拖膝盖蓄力，松手弹跳；横拉蹼掌，竖拉气囊。切倒踏和石障，把弹簧膝、浮力与跳步组合。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="弹簧鹭舞，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="knee" id="knee">拉弹簧膝</button><button data-action="web" id="web">撑蹼掌</button><button data-action="gas" id="gas">调气囊</button><button data-action="reverse" id="reverse">倒踏</button><button data-action="hurdles" id="hurdles">加石障</button><button data-action="leap" id="leap">弹跳</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=28;window.artMeta={"number": 28, "slug": "28-spring-heron", "title": "弹簧鹭舞", "group": "T", "mothers": ["funky_walk_controller.html"], "innovation": "长腿鸟连续步态，拖膝蓄力、脚蹼跨物、帽气球与逆步", "description": "拖膝盖蓄力，松手弹跳；横拉蹼掌，竖拉气囊。切倒踏和石障，把弹簧膝、浮力与跳步组合。", "ui": {"bg": "#f5d56e", "ink": "#2b3b47", "accent": "#cf795e"}, "controls": [{"id": "knee", "label": "拉弹簧膝"}, {"id": "web", "label": "撑蹼掌"}, {"id": "gas", "label": "调气囊"}, {"id": "reverse", "label": "倒踏"}, {"id": "hurdles", "label": "加石障"}, {"id": "leap", "label": "弹跳"}], "artDirection": ["黄纸舞台与长面条鹭腿", "金属弹簧膝、珊瑚蹼掌", "奶油羽片与织纹信包、半透明气囊"], "newMechanics": ["拉弹簧膝改变膝曲并蓄力，松手弹跳", "撑蹼掌横拉改变脚掌真实外形", "调气囊竖拉浮力，改变跳高和滞空时间", "倒踏切换行走方向并反转腿相位", "加石障保留1–3块石障，组合弹跳累计越障", "弹跳即刻触发，可与气囊及膝盖组合"], "testPlan": [{"control": "hurdles", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 50}, {"control": "gas", "from": [0.4, 0.35], "to": [0.4, 0.18], "hold": 200}, {"control": "web", "from": [0.42, 0.71], "to": [0.7, 0.71], "hold": 200}, {"control": "knee", "from": [0.5, 0.65], "to": [0.64, 0.42], "hold": 300}, {"control": "reverse", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 50}], "stateFields": ["bend/web/gas:0–1", "reverse:+1/-1", "hurdles:0–3", "leaps/cleared"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}

function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}

window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});

})();
</script><script>window.createScene=function(env){const c=env.ctx,cl=env.clamp;let s,g;function reset(){s={mode:'knee',bend:.3,web:.3,gas:.25,reverse:1,hurdles:0,leaps:0,charge:0,jump:0,phase:0,cleared:0};g=null;}function lay(){return{x:env.W*.5,y:env.H*.50,k:Math.min(env.W/(env.W<600?500:700),env.H/730)};}function E(x,y,rx,ry,f,st,w=4){c.beginPath();c.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,7);c.fillStyle=f;c.fill();if(st){c.strokeStyle=st;c.lineWidth=w;c.stroke();}}function P(a,f,st='#233642',w=5){c.beginPath();a.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.closePath();c.fillStyle=f;c.fill();if(st){c.strokeStyle=st;c.lineWidth=w;c.lineJoin='round';c.stroke();}}function L(a,col,w){c.beginPath();a.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.stroke();}function txt(t,x,y,z=14){c.fillStyle='#263744';c.font=`800 ${z}px system-ui`;c.textAlign='center';c.fillText(t,x,y);}function leap(){s.jump=1;s.leaps++;s.charge=0;if(s.hurdles>0&&(s.gas*.6+s.bend*.4)>.25+s.hurdles*.1)s.cleared++;window.artAudio?.fx(2,s.gas+.3);}function draw(dt,t){s.phase+=dt*(1+s.gas*.65)*s.reverse;if(s.jump>0)s.jump=Math.max(0,s.jump-dt*(.65-s.gas*.2));const {x,y,k}=lay();c.fillStyle='#f5d56e';c.fillRect(0,0,env.W,env.H);c.save();c.translate(x,y);c.scale(k,k);for(let j=0;j<19;j++)L([[-340,237+j*5],[340,237+j*5]],j%3?'#ecd188':'#d0b775',1);E(0,229,190,16,'#d0b160');for(let j=0;j<3;j++){let xx=-145+j*145;E(xx,253,52,9,'#a7bdad');L([[xx-28,253],[xx+19,253]],'#edf0c6',2);}if(s.hurdles){for(let j=0;j<s.hurdles;j++){let xx=-186+j*90;P([[xx-13,233],[xx,204-(j%2)*12],[xx+15,233]],'#c97961','#8e634f',2);}}let jh=Math.min(Math.sin(s.jump*Math.PI)*105*(.6+s.gas),Math.max(25,y/k-270)),bob=Math.abs(Math.sin(s.phase*3))*(10-s.web*6);
// Two physical planted feet, curled spring knees and a balloon load.
for(let side of [-1,1]){let a=s.phase*3+(side===1?Math.PI:0),lift=Math.max(0,Math.sin(a))*45,fx=side*41+Math.cos(a)*65,ky=133-s.bend*65-jh*.5,kx=side*(40+s.bend*77);c.beginPath();c.moveTo(side*24,51-jh);c.bezierCurveTo(side*27,92-jh,kx,ky-23,kx,ky);c.bezierCurveTo(kx,ky+32,fx,185-lift-jh*.2,fx,218-lift-jh*.2);c.strokeStyle='#233b4c';c.lineWidth=14;c.lineCap='round';c.stroke();c.strokeStyle=side<0?'#648bac':'#83a3b3';c.lineWidth=7;c.stroke();for(let r=0;r<5;r++){c.beginPath();c.ellipse(kx,ky-16+r*7,10,4,0,0,7);c.strokeStyle='#f0d47c';c.lineWidth=2;c.stroke();}P([[fx-7,210-lift-jh*.2],[fx+8,212-lift-jh*.2],[fx+27+s.web*27,231-lift-jh*.2],[fx-33-s.web*23,231-lift-jh*.2]],'#d97256','#253943',4);for(let q=-1;q<=1;q++)L([[fx,215-lift-jh*.2],[fx+q*(23+s.web*15),228-lift-jh*.2]],'#994a41',2);}
c.save();c.translate(0,-jh-bob);c.rotate(Math.sin(s.phase*3)*.06);E(-1,1,61,83,'#e9ecd3','#263b48',5);P([[-36,-40],[-78,-33],[-117,-65],[-97,-10],[-49,46]],'#637b93');for(let r=0;r<8;r++)L([[-84+r*5,-34+r*4],[-46+r*4,31]],'#afc0b8',2);P([[19,-68],[24,-153],[6,-192],[20,-216],[47,-207],[55,-169],[47,-63]],'#f5f0d6');P([[44,-176],[107,-184],[120,-172],[57,-151]],'#dc8954');L([[61,-172],[109,-175]],'#303c43',2);E(29,-195,7,9,'#253943');E(31,-197,2,2,'#fff');P([[17,-213],[-18,-237],[-3,-197]],'#426079');L([[9,-221],[-23,-242]],'#426079',7);P([[-44,8],[18,-15],[71,27],[43,66],[-6,63]],'#c87d61');P([[-44,8],[18,-15],[15,8],[-43,26]],'#dbab70');L([[-4,8],[-3,56]],'#f4d597',3);E(-3,35,10,10,'#f4d597','#885443',2);P([[1,-34],[59,-12],[79,18],[46,25],[9,5]],'#f5efce');L([[17,-28],[49,-8],[62,13]],'#a7b7af',2);
let br=27+s.gas*28,bx=-87+Math.sin(t*1.3)*9,by=-172-s.gas*26;L([[-37,-4],[bx,by+br]],'#926e58',2);E(bx,by,br*.85,br,'#eeb480','#8d6f5b',3);E(bx-8,by-10,br*.2,br*.35,'#f8db9b');P([[bx-4,by+br-2],[bx+4,by+br-2],[bx,by+br+8]],'#d98761',null);for(let r=0;r<4;r++)L([[bx-br*.6,by-15+r*11],[bx+br*.6,by-15+r*11]],'rgba(154,93,70,.2)',1);c.restore();if(g&&s.mode==='knee'){E(g.x,g.y,14+s.charge*10,14+s.charge*10,'rgba(255,250,207,.3)','#b98451',2);}txt(`弹跳 ${s.leaps} · 越障 ${s.cleared} · 气囊 ${Math.round(s.gas*100)}%`,0,282,13);txt(s.charge>.2?'松手，释放弹簧膝盖！':'拉膝盖蓄力，蹼掌和气囊会改变跳幅',0,304,12);c.restore();}
function input(kind,p){const l=lay(),a={x:(p.x-l.x)/l.k,y:(p.y-l.y)/l.k};if(kind==='down')g={...a,sx:a.x,sy:a.y,b:s.bend,w:s.web,gas:s.gas};if(kind==='move'&&g){let dx=a.x-g.sx,dy=a.y-g.sy;if(s.mode==='knee'){s.bend=cl(g.b-dy/140+Math.abs(dx)/200,0,1);s.charge=cl(Math.hypot(dx,dy)/130,0,1);}if(s.mode==='web')s.web=cl(g.w+dx/150,0,1);if(s.mode==='gas')s.gas=cl(g.gas-dy/160,0,1);g.x=a.x;g.y=a.y;}if(kind==='up'&&g){if(s.mode==='knee'&&s.charge>.25)leap();g=null;}if(kind==='cancel')g=null;}function action(id){if(['knee','web','gas'].includes(id))s.mode=id;if(id==='reverse')s.reverse*=-1;if(id==='hurdles')s.hurdles=(s.hurdles+1)%4;if(id==='leap')leap();}function state(){return{bounded:true,status:`${s.reverse>0?'前行':'倒踏'} · ${s.mode==='knee'?'拉膝蓄力，松手跳跃':s.mode==='web'?'横拉撑开蹼掌':'竖拉改变气囊浮力'} · 越障 ${s.cleared}`,mode:s.mode,bend:s.bend,web:s.web,gas:s.gas,reverse:s.reverse,hurdles:s.hurdles,leaps:s.leaps,cleared:s.cleared,charge:s.charge,jump:s.jump};}return{reset,draw,input,action,state};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});

function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
