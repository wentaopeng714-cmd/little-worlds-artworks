dy><header><div><h1>纤维雪晶</h1><p>嫁接六向纤维晶种，拨弯软枝，融尖再长；凝晶把相邻枝织成细格。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="纤维雪晶，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="seed" id="seed">嫁晶种</button><button data-action="wind" id="wind">拨纤风</button><button data-action="melt" id="melt">融尖</button><button data-action="freeze" id="freeze">局部凝晶</button><button data-action="thaw" id="thaw">全幅解冻</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=20;window.artMeta={"number": 20, "slug": "20-fiber-snowcrystals", "title": "纤维雪晶", "group": "G", "mothers": ["samuel_yan_plant_growing_interactive.html"], "innovation": "亚麻纸上生长雪枝，嫁接晶种、拨风、融尖与冻结几何层", "description": "嫁接六向纤维晶种，拨弯软枝，融尖再长；凝晶把相邻枝织成细格。", "ui": {"bg": "#f1dcd5", "ink": "#65585c", "accent": "#759f91"}, "controls": [{"id": "seed", "label": "嫁晶种"}, {"id": "wind", "label": "拨纤风"}, {"id": "melt", "label": "融尖"}, {"id": "freeze", "label": "局部凝晶"}, {"id": "thaw", "label": "全幅解冻"}], "newMechanics": ["晶种六向蔓延形成纤维尖", "嫁接近邻连成互传凝晶的网络", "拨风永久弯折软枝但不改变已凝枝", "融尖后重长，凝晶生成三角层"], "artDirection": ["母本浅粉亚麻颗粒、弧形细枝和晶格", "繁密奶白纤枝与薄荷/珊瑚/金/淡紫晶片，偏移阴影和半透明分面", "六向晶蕨互连，凝结生成有色细三角层"], "testPlan": [{"control": "seed", "from": [0.35, 0.43], "to": [0.36, 0.43], "hold": 650}, {"control": "wind", "from": [0.5, 0.46], "to": [0.56, 0.38], "hold": 650}, {"control": "melt", "from": [0.68, 0.17], "to": [0.74, 0.21], "hold": 650}, {"control": "freeze", "from": [0.5, 0.46], "to": [0.73, 0.71], "hold": 650}, {"control": "thaw", "from": [0.5, 0.46], "to": [0.5, 0.46], "hold": 650}], "stateFields": ["bounded", "mode", "status", "processed", "persistentResult", "crystalSeeds", "grafts", "frozen", "melted", "bend"], "css": "header h1{letter-spacing:.08em}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];

function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}

})();
</script><script>window.createScene=function(e){const c=e.ctx,cl=e.clamp;let seeds=[],links=[],mode='seed',last=null,seedAnchor=null,processed=0,serial=0;const pal=['#76af9b','#d9878e','#c9a45f','#a997c4','#8aaebb'];const labels={seed:'嫁晶种：点出六向晶簇，近邻自动结纤',wind:'拨纤风：拖弯未凝的枝与晶尖',melt:'融尖：局部消融，再嫁晶重生',freeze:'局部凝晶：锁定枝势，生出细三角格',thaw:'全幅解冻：晶枝恢复可弯'};function add(x,y){let a={x,y,g:.12,target:1,bx:0,by:0,rot:serial*.82,frozen:false,frost:0,id:serial++};seeds.push(a);if(seeds.length>22){let dead=seeds.shift();links=links.filter(l=>l.a!==dead.id&&l.b!==dead.id)}let near=seeds.filter(s=>s!==a).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(near&&Math.hypot(near.x-x,near.y-y)<.44)links.push({a:a.id,b:near.id});return a}function reset(){seeds=[];links=[];serial=0;processed=0;last=null;mode='seed';for(let p of [[.23,.24],[.68,.17],[.5,.46],[.19,.66],[.73,.71],[.47,.84]]){let a=add(...p);a.g=.8}}function apply(p,down){let q={x:cl(p.x/e.W,.045,.955),y:cl(p.y/e.H,.04,.96)};if(mode==='seed'&&(down||!seedAnchor||Math.hypot(q.x-seedAnchor.x,q.y-seedAnchor.y)>.13)){add(q.x,q.y);seedAnchor=q;}else if(mode==='wind'){for(let s of seeds){let d=Math.hypot(q.x-s.x,q.y-s.y),f=Math.exp(-d*d/.07);if(!s.frozen&&last){s.bx=cl(s.bx+(q.x-last.x)*f*2,-.26,.26);s.by=cl(s.by+(q.y-last.y)*f*2,-.26,.26);s.rot+=(q.x-last.x)*f}}}else if(mode==='melt'){for(let s of seeds)if(Math.hypot(q.x-s.x,q.y-s.y)<.19){s.target=cl(s.target-.03,.14,1);s.frozen=false;s.frost=0}}else if(mode==='freeze'){for(let s of seeds)if(Math.hypot(q.x-s.x,q.y-s.y)<.22)s.frozen=true}last=q;processed++}function sheet(W,H,pad){c.fillStyle='#ead2cb';c.fillRect(0,0,W,H);c.fillStyle='#f2ded7';c.fillRect(pad,pad,W-pad*2,H-pad*2);for(let i=0;i<5500;i++){let x=(Math.sin(i*81.31)*4375.18%1+1)%1*W,y=(Math.sin(i*19.97)*8731.37%1+1)%1*H;c.fillStyle=i%3?'#9f887919':'#fffaf254';c.fillRect(x,y,i%5===0?5:1,1)}c.lineWidth=.35;for(let x=pad;x<W-pad;x+=4){c.strokeStyle='#c8aa991c';c.beginPath();c.moveTo(x,pad);c.lineTo(x+.9,H-pad);c.stroke()}for(let y=pad;y<H-pad;y+=3.8){c.strokeStyle='#fff6ea48';c.beginPath();c.moveTo(pad,y);c.lineTo(W-pad,y+.5);c.stroke()}for(let i=0;i<24;i++){c.strokeStyle=pal[i%5]+'28';c.lineWidth=.7+(i%3)*.35;c.beginPath();for(let j=0;j<70;j++){let x=j*W/69,y=H*(i/24+.035*Math.sin(j*.14+i*.47));j?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}}
function blade(x,y,len,angle,col,frozen,id){c.save();c.translate(x,y);c.rotate(angle);let breadth=len*(.2+(id%3)*.025);c.fillStyle='#a4907820';c.beginPath();c.moveTo(2,3);c.lineTo(len*.42+2,-breadth+3);c.lineTo(len+2,3);c.lineTo(len*.51+2,breadth+3);c.closePath();c.fill();let grad=c.createLinearGradient(0,-breadth,0,breadth);grad.addColorStop(0,'#fffaf2');grad.addColorStop(.44,col+'db');grad.addColorStop(1,col+'60');c.fillStyle=grad;c.strokeStyle=col;c.lineWidth=.6;c.beginPath();c.moveTo(0,0);c.lineTo(len*.42,-breadth);c.lineTo(len,0);c.lineTo(len*.51,breadth);c.closePath();c.fill();c.stroke();c.fillStyle='#fffaf278';c.beginPath();c.moveTo(0,0);c.lineTo(len*.42,-breadth);c.lineTo(len*.59,-breadth*.1);c.lineTo(len,0);c.closePath();c.fill();c.strokeStyle='#fffcf2bd';c.lineWidth=.7;c.beginPath();c.moveTo(0,0);c.lineTo(len,0);c.stroke();c.strokeStyle=col+'b0';c.lineWidth=.4;for(let k=1;k<6;k++){let f=k/6;c.beginPath();c.moveTo(len*f,0);c.lineTo(len*(f-.1),-breadth*Math.sin(f*Math.PI)*.75);c.moveTo(len*f,0);c.lineTo(len*(f-.07),breadth*Math.sin(f*Math.PI)*.75);c.stroke()}if(frozen){c.strokeStyle='#fffdf0';c.lineWidth=.6;c.beginPath();c.moveTo(len*.2,0);c.lineTo(len*.45,-breadth);c.lineTo(len*.7,0);c.lineTo(len*.5,breadth);c.closePath();c.stroke()}c.restore()}
function draw(dt,t){let W=e.W,H=e.H,m=Math.min(W,H),pad=m*.025;for(let l of links){let a=seeds.find(s=>s.id===l.a),b=seeds.find(s=>s.id===l.b);if(a&&b){if(a.frozen&&!b.frozen){b.frost+=dt*.35;if(b.frost>=1)b.frozen=true}if(b.frozen&&!a.frozen){a.frost+=dt*.35;if(a.frost>=1)a.frozen=true}}}sheet(W,H,pad);c.save();c.beginPath();c.rect(pad,pad,W-pad*2,H-pad*2);c.clip();for(let l of links){let a=seeds.find(s=>s.id===l.a),b=seeds.find(s=>s.id===l.b);if(!a||!b)continue;for(let i=0;i<4;i++){let off=(i-1.5)*2.5;c.strokeStyle=i%2?'#fff8ead0':pal[(l.a+i)%5]+'a0';c.lineWidth=i===0?1.7:.6;c.beginPath();c.moveTo(a.x*W,a.y*H+off);c.bezierCurveTo((a.x+.08)*W,(a.y+b.y)*H*.5+off,(b.x-.08)*W,(a.y+b.y)*H*.5-off,b.x*W,b.y*H);c.stroke()}for(let k=1;k<13;k++){let f=k/13,x=(a.x+(b.x-a.x)*f)*W,y=(a.y+(b.y-a.y)*f)*H+Math.sin(f*Math.PI)*m*.023;let angle=Math.atan2((b.y-a.y)*H,(b.x-a.x)*W);blade(x,y,m*.024,angle+(k%2?1:-1),pal[(k+l.a)%5],a.frozen&&b.frozen,k)}if(a.frozen&&b.frozen){c.strokeStyle='#9b87905a';c.lineWidth=.45;for(let k=1;k<9;k++){let f=k/9,x=(a.x+(b.x-a.x)*f)*W,y=(a.y+(b.y-a.y)*f)*H;c.fillStyle=pal[k%5]+'27';c.beginPath();c.moveTo(x,y);c.lineTo(x+m*.035,y+m*.045);c.lineTo(x-m*.026,y+m*.021);c.closePath();c.fill();c.stroke()}}}
for(let s of seeds){s.g+=(s.target-s.g)*Math.min(1,dt*.7);let x=s.x*W,y=s.y*H,r=m*(.235+(s.id%3)*.02)*s.g;c.save();c.translate(x,y);c.rotate(s.rot);for(let arm=0;arm<6;arm++){c.save();c.rotate(arm*Math.PI/3);let bend=(s.bx*Math.cos(arm)+s.by*Math.sin(arm))*m+Math.sin(s.id+arm*.6)*r*.24;let col=pal[(s.id+arm)%5];c.strokeStyle='#857c6c30';c.lineWidth=3.7;c.beginPath();c.moveTo(1,2);c.bezierCurveTo(r*.35,bend*.2+2,r*.65,bend*.7+2,r,bend+2);c.stroke();c.strokeStyle='#fffbed';c.lineWidth=s.frozen?2.8:2.2;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(r*.35,bend*.2,r*.65,bend*.7,r,bend);c.stroke();c.strokeStyle=col;c.lineWidth=.8;c.beginPath();c.moveTo(0,1);c.bezierCurveTo(r*.35,bend*.2+2,r*.65,bend*.7-2,r,bend+1);c.stroke();for(let k=1;k<15;k++){let f=k/15,b=bend*f*f,rr=r*f,len=r*(.24*(1-f)+.045);for(let sign of [-1,1]){let side=sign*(.82+.19*Math.sin(k*.7+s.id)),endX=rr+len*.43,endY=b+sign*len;c.strokeStyle=pal[(s.id+arm+k)%5]+'d0';c.lineWidth=.8;c.beginPath();c.moveTo(rr,b);c.quadraticCurveTo(rr+len*.5,b+sign*len*.25,endX,endY);c.stroke();for(let twig=1;twig<4;twig++){let z=twig/4,tx=rr+len*.43*z,ty=b+sign*len*z,small=len*(.4-z*.22);c.strokeStyle='#6c807470';c.lineWidth=.45;c.beginPath();c.moveTo(tx,ty);c.quadraticCurveTo(tx+small*.5,ty-sign*small*.1,tx+small*.8,ty+sign*small*.38);c.stroke();if(twig===2&&k%2===0)blade(tx,ty,small*1.9,side*.7,pal[(s.id+arm+k+twig)%5],s.frozen,k)}if(k%3===1)blade(endX,endY,len*.9,side*.6,pal[(s.id+arm+k)%5],s.frozen,k);c.fillStyle='#fff9e2d0';c.beginPath();c.arc(endX,endY,.9,0,7);c.fill()}}blade(r,bend,r*.13,.1,pal[(s.id+arm+1)%5],s.frozen,arm);if(s.frozen){c.strokeStyle='#80788f75';c.lineWidth=.55;for(let k=1;k<6;k++){let f=k/6;c.fillStyle=pal[(s.id+k+arm)%5]+'30';c.beginPath();c.moveTo(r*f,bend*f*f);c.lineTo(r*f*.55,-r*f*.7+bend*f*.3);c.lineTo(r*f*.55,r*f*.7+bend*f*.3);c.closePath();c.fill();c.stroke();c.strokeStyle='#fffbedc0'}}c.restore()}for(let z=0;z<3;z++){let rad=r*(.065-z*.015);c.fillStyle=z===0?pal[s.id%5]+'c0':z===1?'#fff8e2':'#c </script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}

function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
