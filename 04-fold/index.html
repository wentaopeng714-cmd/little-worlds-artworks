<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Fold / unfold</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8e3d8;color:#252e35;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(26px,env(safe-area-inset-top));left:26px;pointer-events:none}small{font-size:10px;letter-spacing:3px}h1{font-size:clamp(30px,6vw,52px);font-weight:400;letter-spacing:-2px;margin:8px 0}header p{font-size:12px;line-height:1.65;opacity:.65;margin:0;max-width:250px}.tools button{padding:0 10px;font-size:10px}.tools{position:absolute;bottom:max(23px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;align-items:center;gap:9px}button{font:11px Arial;letter-spacing:1px;color:inherit;background:transparent;border:1px solid currentColor;border-radius:30px;min-height:42px;padding:0 17px;cursor:pointer}button:focus-visible{outline:3px solid #ff8748;outline-offset:3px}#hint{margin-left:auto;font-size:10px;letter-spacing:1px;opacity:.6;text-align:right;max-width:78px}#badge{position:absolute;right:24px;top:30px;border-top:1px solid currentColor;padding-top:8px;font-size:10px;letter-spacing:2px;opacity:.55}@media(max-width:430px){#hint{display:none}.tools{gap:8px;justify-content:space-between}#badge{font-size:8px;top:27px;right:18px}header{left:20px}header small{font-size:8px;letter-spacing:2px}}@media(max-height:620px){header{top:18px}h1{font-size:30px;margin:5px 0}header p{font-size:10px}.tools{bottom:15px}}</style></head><body><canvas id="art" aria-label="Interactive paper creature: drag one of the four colored corners"></canvas><header><small>LITTLE WORLDS / 04</small><h1>Fold / unfold</h1><p>Pull white corners. Tap the face to flip.<br>Fold again: bird → pinwheel → mask.</p></header><span id="badge">PAPER STUDY</span><div class="tools"><button id="mute" aria-pressed="true">SOUND ON</button><button id="reset">RESET</button><button id="shape">FOLD</button><button id="unfold">OPEN</button><span id="hint">PULL · FLIP · FOLD</span></div><script>'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,D=1,muted=false,ac=null,interactions=0,resets=0,frame=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}function tone(f=220,d=.15,type='sine',vol=.08){if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(vol,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.01)}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'SOUND OFF':'SOUND ON';document.getElementById('mute').setAttribute('aria-pressed',String(!muted));tone(440)};function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function line(x,y,a,b,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}function disc(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}let corners=[],targets=[],drag=-1,folds=0,mode=0,flips=0,creases=[],side=0,turn=0,pulse=0,gesture=null,combo=0,opened=false;
const presets=[[[-1,-1],[1,-1],[1,1],[-1,1]],[[-1.45,-.35],[.15,-1.25],[1.5,-.3],[0,.65]],[[-.35,-1.4],[1.4,-.35],[.35,1.4],[-1.4,.35]],[[-.85,-1.1],[.85,-1.1],[1.2,.75],[-1.2,.75]]],names=['PAPER','BIRD','PINWHEEL','MASK'];
function reset(){corners=presets[0].map(([x,y])=>({x,y}));targets=corners.map(p=>({...p}));drag=-1;folds=0;mode=0;flips=0;creases=[];side=0;turn=0;pulse=0;combo=0;opened=false;gesture=null;document.getElementById('hint').textContent='PULL · FLIP · FOLD'}
function geom(){return{cx:W*.5,cy:H*.55,s:Math.min(W*.29,H*.20)}}function xy(p){let g=geom();return{x:g.cx+p.x*g.s,y:g.cy+p.y*g.s}}
function remember(i){creases.push({i,x:corners[i].x,y:corners[i].y,side});if(creases.length>24)creases.shift()}
function change(){unlock();mode=(mode+1)%4;targets=presets[mode].map(([x,y])=>({x,y}));folds++;interactions++;opened=false;pulse=1;tone([196,294,392,247][mode],.35,'triangle');document.getElementById('hint').textContent=names[mode]+' · PULL A WING'}
document.getElementById('shape').onclick=change;document.getElementById('unfold').onclick=()=>{unlock();targets=presets[0].map(([x,y])=>({x,y}));opened=true;interactions++;pulse=1;tone(147,.5,'triangle');document.getElementById('hint').textContent='CREASES REMEMBER'};
canvas.onpointerdown=e=>{unlock();canvas.setPointerCapture(e.pointerId);let p=pos(e),g=geom();gesture={x:p.x,y:p.y,moved:false};let best=Infinity;drag=-1;corners.forEach((q,i)=>{let z=xy(q),d=Math.hypot(z.x-p.x,z.y-p.y);if(d<best){best=d;drag=i}});if(best>g.s*.6)drag=-1;interactions++};
canvas.onpointermove=e=>{if(drag<0||!gesture)return;let p=pos(e),g=geom();if(Math.hypot(p.x-gesture.x,p.y-gesture.y)>8)gesture.moved=true;corners[drag]={x:clamp((p.x-g.cx)/g.s,-1.65,1.65),y:clamp((p.y-g.cy)/g.s,-1.65,1.65)};targets[drag]={...corners[drag]};pulse=.4};
canvas.onpointerup=e=>{if(!gesture)return;if(drag>=0&&gesture.moved){remember(drag);folds++;tone(180+drag*70+side*40,.25,'triangle');if(creases.length>=2&&creases.at(-1).i!==creases.at(-2).i){combo++;pulse=1;turn+=mode===2?Math.PI/2:.08;document.getElementById('hint').textContent=mode===2?'WIND IN THE FOLDS':'NEW CREASE / NEW POSE'}}else{side=1-side;flips++;pulse=1;tone(side?523:262,.2,'triangle');document.getElementById('hint').textContent='REVERSE / '+names[mode]}drag=-1;gesture=null};canvas.onpointercancel=()=>{drag=-1;gesture=null};
function state(){return{folds,mode:names[mode],flips,side,creaseCount:creases.length,combinations:combo,opened,dragging:drag>=0,geometry:{...geom(),corners:corners.map(xy)}}}
function draw(dt,t){ctx.fillStyle=side?'#d7dfd8':'#e8e3d8';ctx.fillRect(0,0,W,H);let g=geom();pulse*=Math.pow(.96,dt);corners.forEach((p,i)=>{if(i!==drag){p.x+=(targets[i].x-p.x)*.12*dt;p.y+=(targets[i].y-p.y)*.12*dt}});ctx.fillStyle='#c5c8bc';ctx.beginPath();ctx.ellipse(g.cx,g.cy+g.s*1.65,g.s*.9,10,0,0,7);ctx.fill();
ctx.save();ctx.translate(g.cx,g.cy);ctx.rotate(Math.sin(t*.001)*.015);ctx.translate(-g.cx,-g.cy);let colors=side?['#38596c','#789885','#efaa65','#e85438']:['#e85438','#efaa65','#38596c','#789885'];let b=Math.sin(t*.003)*2;
for(let i=0;i<4;i++){let a=xy(corners[i]),z=xy(corners[(i+1)%4]);ctx.beginPath();ctx.moveTo(g.cx,g.cy+b);ctx.lineTo(a.x,a.y);ctx.lineTo(z.x,z.y);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();line(g.cx,g.cy+b,a.x,a.y,'#e8e3d8',1.5);ctx.save();ctx.clip();for(let j=0;j<5;j++){let f=(j+1)/6;disc(g.cx+(a.x-g.cx)*f,g.cy+(a.y-g.cy)*f,2+j*.7,'#ffffff50')}ctx.restore()}
creases.forEach((p,i)=>{let a=xy(p);ctx.globalAlpha=.18+(i/24)*.28;line(g.cx,g.cy,a.x,a.y,side?'#fff':'#25343b',1);ctx.globalAlpha=1});
if(mode===2&&combo>0){ctx.save();ctx.translate(g.cx,g.cy);ctx.rotate(t*.0015*(side?-1:1));for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.fillStyle=colors[k];ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-g.s*.62);ctx.lineTo(g.s*.35,-g.s*.22);ctx.closePath();ctx.fill()}ctx.restore()}if(mode===1){ctx.fillStyle='#efaa65';ctx.beginPath();ctx.moveTo(g.cx-7,g.cy);ctx.lineTo(g.cx+7,g.cy);ctx.lineTo(g.cx,g.cy+24+pulse*14);ctx.fill();}else if(mode===3){ctx.fillStyle='#e8e3d8';ctx.fillRect(g.cx-43,g.cy-20,86,22)}
disc(g.cx-20,g.cy-10,side?7:4,'#182c39');disc(g.cx+20,g.cy-10,side?7:4,'#182c39');if(mode!==1){ctx.strokeStyle='#182c39';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(g.cx,g.cy+16,9+pulse*9,3+pulse*12,0,0,Math.PI);ctx.stroke()}
corners.forEach((p,i)=>{let a=xy(p);disc(a.x,a.y,drag===i?13:9,'#e8e3d8');disc(a.x,a.y,3,'#283c44')});ctx.restore();ctx.fillStyle='#657167';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText((opened?'OPEN / ':names[mode]+' / ')+(side?'REVERSE':'FRONT')+' / '+creases.length+' CREASES',g.cx,g.cy+g.s*1.65+32);}


document.getElementById('reset').onclick=()=>{unlock();reset();interactions=0;resets++;tone(130,.2)};window.__artTest={getState:()=>({title:document.title,interactions,resets,muted,audioState:ac?.state||'locked',width:W,height:H,...state()})};let prev=performance.now();function loop(t){const dt=Math.min((t-prev)/16.667,2);prev=t;frame++;draw(dt,t);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);</script></body></html>
