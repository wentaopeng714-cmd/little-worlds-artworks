<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>字雨 · Letter Weather</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5edda;color:#292923;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}#art{position:fixed;inset:0;width:100%;height:100%;touch-action:none}button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}.mast{position:absolute;z-index:2;left:6vw;top:max(28px,env(safe-area-inset-top));pointer-events:none}.mast .eyebrow{font-size:10px;letter-spacing:.22em;font-weight:700}.mast h1{font-family:ui-serif,"Songti SC",serif;font-weight:400;font-size:clamp(55px,7vw,100px);letter-spacing:.05em;line-height:1;margin:20px 0 13px}.mast p{font-size:12px;line-height:1.7;width:235px;opacity:.8}.folio{position:absolute;right:6vw;top:30px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.13em}.weather-note{position:absolute;right:6vw;top:85px;writing-mode:vertical-rl;font-size:11px;letter-spacing:.17em;pointer-events:none}.controls{position:absolute;z-index:3;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 28px));display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}.tools{display:flex;gap:1px;background:#292923;border:1px solid #292923;border-radius:6px;overflow:hidden}.tools button{border:0;background:#f4e8be;min-width:87px;height:46px;padding:0 14px;font-size:12px;font-weight:600}.tools button:hover{background:#edcc58}.tools button:active{background:#d4ae38}.extra{display:flex;gap:5px}.extra button{min-width:44px;height:44px;padding:0 12px;border:1px solid #29292330;border-radius:6px;background:#faf5e6e8;font-size:11px}#weather{background:#e75937;color:#fff8e8;border-color:#e75937}#sound-status{cursor:default;opacity:.65}.hint{width:100%;text-align:center;font-size:10px;min-height:16px;line-height:1.5;letter-spacing:.02em}button:focus-visible{outline:2px solid #e75937;outline-offset:3px}@media(max-width:700px){.mast{left:25px;top:28px}.mast h1{font-size:62px}.mast p{font-size:11px;max-width:180px}.folio{right:24px}.weather-note{top:90px;right:26px}.controls{bottom:max(16px,env(safe-area-inset-bottom));gap:7px}.tools{width:100%;justify-content:center}.tools button{flex:1}.extra{width:100%;justify-content:center;gap:4px}.extra button{padding:0 9px;font-size:10px}.hint{max-width:340px}.mast h1{margin-top:18px}}
.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body><canvas id="art" aria-label="字雨、可移动旋转挡板与可拖动固定的文字"></canvas><header class="mast"><div class="eyebrow">LITTLE WORLDS / 02</div><h1>字雨</h1><p>有些字落下，有些字停留。<br>接住它们，摆成你自己的天气。</p></header><div class="folio">LETTER WEATHER</div><div class="weather-note" id="weather-note">微 雨 · 轻 风</div><nav class="controls" aria-label="字雨操作"><div class="tools"><button id="add-board">＋ 挡板</button><button id="add-umbrella">＋ 雨伞</button><button id="add-bowl">＋ 接字槽</button></div><div class="extra"><button id="rotate">转 15°</button><button id="weather">微雨</button><button id="letters">换字</button><button id="release">放飞</button><button id="reset">重置</button><span id="sound-status" class="sound-status">无声作品</span></div><div class="hint" id="hint" aria-live="polite">拖动物件；拖圆点旋转。拖住一个字，松手后它会留下。</div></nav><div id="qa" hidden data-frames="0" data-inputs="0" data-resets="0" data-audio="none" data-bounded="true"></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false}),qa=document.getElementById('qa');let W=innerWidth,H=innerHeight,dpr=1,letters=[],boards=[],selected=null,pointer=null,frames=0,inputs=0,resets=0,last=0,time=0,spawnTime=0,weather=0,wordIndex=0;const words=['雨RAIN','PLAY','想象','SLOW'];const MAX=180,MAXBOARDS=8,TAU=Math.PI*2;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rnd=(a,b)=>a+Math.random()*(b-a);let grain=document.createElement('canvas');grain.width=grain.height=160;const gc=grain.getContext('2d');for(let i=0;i<4500;i++){gc.globalAlpha=rnd(.025,.065);gc.fillStyle='#675c40';gc.fillRect(rnd(0,160),rnd(0,160),1,1)}const texture=ctx.createPattern(grain,'repeat');
function resize(){const ow=W,oh=H;W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(ow&&oh){for(const a of letters){a.x*=W/ow;a.y*=H/oh}for(const a of boards){a.x*=W/ow;a.y*=H/oh;a.size*=Math.min(W/ow,H/oh)}}}resize();
function glyph(x,y,i){let text=[...words[wordIndex]][i%[...words[wordIndex]].length],s=rnd(W<650?15:20,W<650?25:34);return{x,y,vx:rnd(-10,10),vy:rnd(20,65),s,r:s*.39,a:rnd(-.15,.15),spin:rnd(-.6,.6),text,color:i%8===0?'#d95131':'#292923',pinned:false,age:0,rest:0}}
function addBoard(type,x,y){const s=type==='umbrella'?Math.min(W*.28,160):type==='bowl'?Math.min(W*.3,175):Math.min(W*.34,200);let b={type,x,y,size:s,a:type==='bar'?rnd(-.25,.25):0,color:type==='bar'?'#d94d30':type==='bowl'?'#355971':'#ddba45'};boards.push(b);if(boards.length>MAXBOARDS)boards.shift();selected=b;return b}
function reset(){letters=[];boards=[];pointer=null;weather=0;wordIndex=0;spawnTime=0;document.getElementById('weather').textContent='微雨';document.getElementById('weather-note').textContent='微 雨 · 轻 风';addBoard('umbrella',W*.65,H*.39);addBoard('bar',W*.4,H*.61).a=-.16;addBoard('bowl',W*.69,H*.77);selected=boards[0];for(let i=0;i<(W<650?38:70);i++)letters.push(glyph(rnd(W<650?W*.53:W*.32,W*.88),rnd(-H*.1,H*.74),i));resets++;qa.dataset.resets=resets;updateQA()}
function updateQA(){qa.dataset.frames=frames;qa.dataset.inputs=inputs;qa.dataset.objects=letters.length+boards.length;qa.dataset.cap=MAX+MAXBOARDS;qa.dataset.letters=letters.length;qa.dataset.boards=boards.length;qa.dataset.pinned=letters.filter(x=>x.pinned).length;qa.dataset.bounded=String(letters.length<=MAX&&boards.length<=MAXBOARDS)}
for(const [id,type] of [['add-board','bar'],['add-umbrella','umbrella'],['add-bowl','bowl']])document.getElementById(id).onclick=()=>{addBoard(type,rnd(W*.26,W*.79),rnd(H*.34,H*.7));inputs++;document.getElementById('hint').textContent='新物件已放好。拖动它；拖圆点可旋转，最多八个物件。';updateQA()};document.getElementById('rotate').onclick=()=>{if(selected)selected.a+=Math.PI/12;inputs++};document.getElementById('weather').onclick=()=>{weather=(weather+1)%3;document.getElementById('weather').textContent=['微雨','阵雨','逆风'][weather];document.getElementById('weather-note').textContent=['微 雨 · 轻 风','阵 雨 · 连 绵','逆 风 · 向 上'][weather];inputs++};document.getElementById('letters').onclick=()=>{wordIndex=(wordIndex+1)%words.length;for(let i=0;i<15;i++)pushLetter(glyph(rnd(W<650?W*.54:W*.32,W*.9),rnd(-70,0),i));inputs++;document.getElementById('hint').textContent='现在落下：'+words[wordIndex]+'。拖字到空处，它会固定在纸上。'};document.getElementById('release').onclick=()=>{for(const l of letters){l.pinned=false;l.rest=0;l.vy=rnd(-60,-25);l.vx=rnd(-35,35);l.age=0}inputs++;document.getElementById('hint').textContent='把留下的字放回风里。继续摆放挡板，接住新的排版。'};document.getElementById('reset').onclick=()=>{reset();inputs++};
function local(b,x,y){let dx=x-b.x,dy=y-b.y;return{x:dx*Math.cos(b.a)+dy*Math.sin(b.a),y:-dx*Math.sin(b.a)+dy*Math.cos(b.a)}}function world(b,x,y){return{x:b.x+x*Math.cos(b.a)-y*Math.sin(b.a),y:b.y+x*Math.sin(b.a)+y*Math.cos(b.a)}}function handle(b){return world(b,b.size*.6,0)}
function segments(b){let s=b.size;if(b.type==='bar')return[[-s/2,0,s/2,0]];if(b.type==='bowl')return[[-s/2,-s*.17,-s*.38,s*.15],[-s*.38,s*.15,s*.38,s*.15],[s*.38,s*.15,s/2,-s*.17]];let out=[];for(let i=0;i<10;i++){let a=Math.PI+i*Math.PI/10,c=Math.PI+(i+1)*Math.PI/10;out.push([Math.cos(a)*s*.5,Math.sin(a)*s*.31,Math.cos(c)*s*.5,Math.sin(c)*s*.31])}return out}
function boardHit(b,p){let q=local(b,p.x,p.y),s=b.size;return Math.abs(q.x)<s*.56&&q.y>(b.type==='umbrella'?-s*.35:-s*.22)&&q.y<s*.25}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);let p={x:e.clientX,y:e.clientY};inputs++;if(selected){let h=handle(selected);if(Math.hypot(p.x-h.x,p.y-h.y)<22){pointer={id:e.pointerId,type:'rotate',item:selected,startAngle:Math.atan2(p.y-selected.y,p.x-selected.x),a:selected.a};return}}let l=letters.slice().reverse().find(l=>Math.hypot(p.x-l.x,p.y-l.y)<l.s*.72);let b=boards.slice().reverse().find(b=>boardHit(b,p));if(l&&(!b||l.pinned)){l.pinned=true;l.vx=l.vy=0;pointer={id:e.pointerId,type:'letter',item:l,dx:p.x-l.x,dy:p.y-l.y};document.getElementById('hint').textContent='这个字留下了。再拖几枚，组成你自己的短句。'}else if(b){selected=b;pointer={id:e.pointerId,type:'board',item:b,dx:p.x-b.x,dy:p.y-b.y}}else{let n=glyph(p.x,p.y,Math.floor(rnd(0,words[wordIndex].length)));n.pinned=true;pushLetter(n);pointer={id:e.pointerId,type:'letter',item:n,dx:0,dy:0}}updateQA()});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;let p={x:e.clientX,y:e.clientY},o=pointer.item;inputs++;if(pointer.type==='rotate')o.a=pointer.a+Math.atan2(p.y-o.y,p.x-o.x)-pointer.startAngle;else{o.x=clamp(p.x-pointer.dx,16,W-16);o.y=clamp(p.y-pointer.dy,12,H-130);if(pointer.type==='letter')o.a=0}updateQA()});function end(e){if(pointer&&pointer.id===e.pointerId){pointer=null;updateQA()}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);window.addEventListener('resize',resize);
function pushLetter(l){if(letters.length>=MAX){let i=letters.findIndex(x=>!x.pinned);if(i>=0)letters.splice(i,1);else return}letters.push(l)}
function collide(l,b){let q=local(b,l.x,l.y),cs=Math.cos(b.a),sn=Math.sin(b.a);for(const [x1,y1,x2,y2] of segments(b)){let dx=x2-x1,dy=y2-y1,t=clamp(((q.x-x1)*dx+(q.y-y1)*dy)/(dx*dx+dy*dy),0,1),cx=x1+t*dx,cy=y1+t*dy,nx=q.x-cx,ny=q.y-cy,d=Math.hypot(nx,ny),limit=l.r+3;if(d<limit){if(d<.001){nx=0;ny=-1;d=1}else{nx/=d;ny/=d}let wx=nx*cs-ny*sn,wy=nx*sn+ny*cs;l.x+=wx*(limit-d);l.y+=wy*(limit-d);let dot=l.vx*wx+l.vy*wy;if(dot<0){l.vx-=dot*1.25*wx;l.vy-=dot*1.25*wy;l.vx*=.84;l.vy*=.84;l.spin*=.86;l.rest+=.016;}q=local(b,l.x,l.y)}}}
function letterContacts(){const cell=40;for(let pass=0;pass<2;pass++){const grid=new Map();for(const l of letters){const gx=Math.floor(l.x/cell),gy=Math.floor(l.y/cell);for(let yy=gy-1;yy<=gy+1;yy++)for(let xx=gx-1;xx<=gx+1;xx++){const near=grid.get(xx+','+yy);if(!near)continue;for(const o of near){if(l.pinned&&o.pinned)continue;let dx=l.x-o.x,dy=l.y-o.y,d=Math.hypot(dx,dy),min=l.r+o.r;if(d>=min)continue;if(d<.01){dx=.01;dy=0;d=.01}const nx=dx/d,ny=dy/d,overlap=min-d,wl=l.pinned?0:o.pinned?1:.5,wo=o.pinned?0:l.pinned?1:.5;l.x+=nx*overlap*wl;l.y+=ny*overlap*wl;o.x-=nx*overlap*wo;o.y-=ny*overlap*wo;const dot=(l.vx-o.vx)*nx+(l.vy-o.vy)*ny;if(dot<0){l.vx-=dot*nx*wl*1.12;l.vy-=dot*ny*wl*1.12;o.vx+=dot*nx*wo*1.12;o.vy+=dot*ny*wo*1.12;l.spin*=.985;o.spin*=.985}}}const key=gx+','+gy;if(!grid.has(key))grid.set(key,[]);grid.get(key).push(l)}}}
function update(dt){time+=dt;spawnTime+=dt;let interval=weather===1?.085:weather===2?.2:.24;while(spawnTime>interval){spawnTime-=interval;let l=glyph(rnd(W<650?W*.54:W*.32,W*.91),weather===2?H*.84:-35,Math.floor(time/interval));if(weather===2)l.vy=-65;pushLetter(l)}for(let i=letters.length-1;i>=0;i--){let l=letters[i];l.age+=dt;if(l.pinned)continue;let wind=weather===2?-43:weather===1?22:5;wind+=Math.sin(time*.9+l.y*.008)*12;l.vx+=(wind-l.vx)*dt*.6;l.vy+=dt*(weather===2?-27:80);l.vx=clamp(l.vx,-90,90);l.vy=clamp(l.vy,-100,150);l.x+=l.vx*dt;l.y+=l.vy*dt;l.a+=l.spin*dt;if(l.x<l.r){l.x=l.r;l.vx=Math.abs(l.vx)*.7}if(l.x>W-l.r){l.x=W-l.r;l.vx=-Math.abs(l.vx)*.7}for(const b of boards)collide(l,b);if(l.y>H+40||l.y<-90||l.age>50){letters.splice(i,1)}}letterContacts();for(const l of letters)if(!l.pinned)for(const b of boards)collide(l,b);}
function drawBoard(b){let s=b.size;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);ctx.lineCap='round';ctx.lineJoin='round';if(b.type==='umbrella'){ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(-s*.5,0);ctx.bezierCurveTo(-s*.47,-s*.42,s*.47,-s*.42,s*.5,0);ctx.bezierCurveTo(s*.33,-s*.035,s*.25,-s*.035,s*.17,0);ctx.bezierCurveTo(s*.08,-s*.035,-s*.08,-s*.035,-s*.17,0);ctx.bezierCurveTo(-s*.25,-s*.035,-s*.33,-s*.035,-s*.5,0);ctx.fill();ctx.strokeStyle='#272924';ctx.lineWidth=1.8;ctx.stroke();ctx.beginPath();ctx.moveTo(0,-s*.28);ctx.lineTo(0,s*.31);ctx.bezierCurveTo(0,s*.43,s*.14,s*.43,s*.14,s*.31);ctx.stroke();ctx.lineWidth=.8;ctx.globalAlpha=.3;ctx.beginPath();ctx.moveTo(0,-s*.31);ctx.quadraticCurveTo(-s*.19,-s*.23,-s*.17,0);ctx.moveTo(0,-s*.31);ctx.quadraticCurveTo(s*.19,-s*.23,s*.17,0);ctx.stroke();ctx.globalAlpha=1}else if(b.type==='bar'){ctx.strokeStyle='#292923';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-s/2,2);ctx.lineTo(s/2,2);ctx.stroke();ctx.strokeStyle=b.color;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-s/2,0);ctx.lineTo(s/2,0);ctx.stroke();ctx.strokeStyle='#ffe5a180';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-s/2+3,-1.5);ctx.lineTo(s/2-3,-1.5);ctx.stroke()}else{ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(-s/2,-s*.17);ctx.lineTo(-s*.38,s*.15);ctx.lineTo(s*.38,s*.15);ctx.lineTo(s/2,-s*.17);ctx.lineTo(s*.47,-s*.17);ctx.lineTo(s*.35,s*.11);ctx.lineTo(-s*.35,s*.11);ctx.lineTo(-s*.47,-s*.17);ctx.closePath();ctx.fill();ctx.strokeStyle='#292923';ctx.lineWidth=1.4;ctx.stroke();ctx.strokeStyle='#f3e6bc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-s*.35,s*.13);ctx.lineTo(s*.35,s*.13);ctx.stroke()}if(selected===b){ctx.strokeStyle='#d5503270';ctx.lineWidth=.8;ctx.setLineDash([3,5]);ctx.strokeRect(-s*.6,-s*.37,s*1.2,s*.85);ctx.setLineDash([]);ctx.strokeStyle='#d55032';ctx.beginPath();ctx.moveTo(s*.51,0);ctx.lineTo(s*.6,0);ctx.stroke();ctx.fillStyle='#f7eed8';ctx.beginPath();ctx.arc(s*.6,0,6,0,TAU);ctx.fill();ctx.stroke();}ctx.restore()}
function draw(){ctx.fillStyle='#f5edda';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#9b8e6723';ctx.lineWidth=1;for(let x=W*.29;x<W*.95;x+=W*.15){ctx.beginPath();ctx.moveTo(x,25);ctx.lineTo(x,H-155);ctx.stroke()}ctx.save();ctx.fillStyle='#dbb947';ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(W*.8,H*.21,Math.min(W,H)*.067,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#d65435';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(W*.8,H*.21,Math.min(W,H)*.084,.8,4.95);ctx.stroke();ctx.restore();ctx.save();ctx.translate(W*.09,H*.65);ctx.rotate(-Math.PI/2);ctx.fillStyle='#807357';ctx.font='10px ui-monospace,monospace';ctx.fillText('TYPE / GRAVITY / WIND',0,0);ctx.restore();for(const b of boards)drawBoard(b);for(const l of letters){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.a);ctx.font=(l.color==='#d95131'?'650 ':'450 ')+l.s+'px ui-sans-serif,system-ui,"PingFang SC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=l.color;if(l.pinned){ctx.strokeStyle='#d7bc64';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-l.s*.48,l.s*.6);ctx.lineTo(l.s*.48,l.s*.6);ctx.stroke()}ctx.fillText(l.text,0,0);ctx.restore()}ctx.fillStyle=texture;ctx.fillRect(0,0,W,H)}
function tick(now){let dt=Math.min((now-last)/1000||.016,.035);last=now;update(dt);draw();frames++;if(frames%15===0)updateQA();requestAnimationFrame(tick)}reset();resets=0;qa.dataset.resets='0';requestAnimationFrame(tick);
})();
</script></body></html>
