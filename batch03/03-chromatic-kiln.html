<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131f"><title>Chromatic Kiln — Little Worlds</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131f;color:#eff8fa;font-family:Inter,Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(23px,env(safe-area-inset-top));left:28px;pointer-events:none;z-index:2}h1{margin:0;font-size:14px;letter-spacing:.22em;font-weight:500;text-transform:uppercase}header p{margin:9px 0 0;font-size:12px;letter-spacing:.12em;opacity:.65}.panel{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;width:max-content;max-width:calc(100% - 24px);padding:9px 12px;border:1px solid #ffffff23;border-radius:22px;background:#06131fc7;backdrop-filter:blur(18px);box-shadow:0 12px 40px #0003}.bar{display:flex;gap:6px;align-items:center;justify-content:center}button,select,.range{height:44px;min-width:48px;color:#eaf9fa;background:#ffffff09;border:1px solid #ffffff16;border-radius:12px;font:12px Arial,sans-serif;padding:0 12px;cursor:pointer;white-space:nowrap}button:hover,select:hover{background:#ffffff20}button[aria-pressed=true]{background:#d9faff25;border-color:#c9fcf978;box-shadow:inset 0 0 18px #a7fffa10}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #a4f5f1;outline-offset:3px}.range{display:flex;align-items:center;gap:6px;padding:0 9px;font-size:12px}.range input{width:72px;accent-color:#b6efef;cursor:pointer}.hint{margin:8px 0 0;text-align:center;color:#dceef1a3;font-size:12px;letter-spacing:.055em;pointer-events:none}#qa{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){header{left:22px;top:25px}h1{font-size:12px}.panel{width:calc(100% - 24px);padding:8px;border-radius:18px;bottom:max(12px,env(safe-area-inset-bottom))}.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}button,select,.range{width:100%;min-width:0;padding:0 3px;font-size:12px}.range{gap:3px}.range input{width:38px;min-width:25px}.hint{margin-top:7px;font-size:12px}}</style></head><body><canvas id="art" aria-label="Chromatic Kiln interactive artwork"></canvas><header><h1>Chromatic Kiln</h1><p>03 / A STUDY IN GLAZE</p></header><div class="panel"><div class="bar"><button id="mode" aria-pressed="false">Dye</button><button id="cool">Cool</button><button id="shape">Facets</button><button id="palette">Palette</button><button id="flow" aria-pressed="true">Flow</button><button id="reset" aria-label="Reset artwork">Reset</button><button id="mute" aria-pressed="false" aria-label="Toggle synthesized sound">Sound off</button></div><p class="hint">Drag dye · switch to Fire · hold, spread & cool</p></div><output id="qa" aria-live="off"></output><script>const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false}),qa=document.getElementById('qa');let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),frames=0,inputs=0,resets=0,muted=true,ac=null,voices=0,lastSound=0,lastFrame=0,clock=0,fps=0,countFrames=0,fpsAt=0,hidden=false;const pointers=new Map();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;const rnd=(a=0,b=1)=>a+Math.random()*(b-a);const hs=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;function size(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);if(typeof onResize==='function')onResize()}function usable(){return H-(W<600?148:100)}function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(ac.state==='suspended')ac.resume().catch(()=>{})}function tone(freq=220,length=.3,vol=.055){if(muted||!ac||ac.state!=='running'||voices>=6||performance.now()-lastSound<65)return;lastSound=performance.now();voices++;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.5,ac.currentTime+length);g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(vol,ac.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+length);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+length+.03);o.onended=()=>{voices--;o.disconnect();g.disconnect()}}function setPressed(id,v){document.getElementById(id).setAttribute('aria-pressed',v)}function bind(id,fn){document.getElementById(id).addEventListener('click',()=>{unlock();inputs++;fn();tone(330,.22,.03)})}bind('mute',()=>{muted=!muted;document.getElementById('mute').textContent=muted?'Sound off':'Sound on';setPressed('mute',!muted)});bind('reset',()=>{resets++;reset();pointers.clear()});function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,px:e.clientX,py:e.clientY,id:e.pointerId}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();unlock();inputs++;const p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);down(p)});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();inputs++;const p=point(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);move(p,old)});function end(e){if(!pointers.has(e.pointerId))return;up(pointers.get(e.pointerId));pointers.delete(e.pointerId)}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{hidden=document.hidden;lastFrame=0;if(hidden&&ac&&ac.state==='running')ac.suspend().catch(()=>{});else if(ac&&!muted)ac.resume().catch(()=>{})});setInterval(()=>{qa.dataset.frames=frames;qa.dataset.fps=fps.toFixed(1);qa.dataset.entities=entities();qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.muted=muted;qa.dataset.width=W;qa.dataset.height=H;qa.dataset.audio=ac?ac.state:'locked';qa.textContent=`${frames} frames; ${fps.toFixed(1)} FPS; ${entities()} entities; ${inputs} inputs`},1000);function loop(now){requestAnimationFrame(loop);if(hidden)return;const dt=lastFrame?Math.min(.04,(now-lastFrame)/1000):.016;lastFrame=now;clock+=dt;frames++;countFrames++;if(now-fpsAt>1000){fps=countFrames*1000/(now-fpsAt);countFrames=0;fpsAt=now}update(dt);ctx.setTransform(D,0,0,D,0,0);draw()};
let tiles=[],mode='dye',flow=true,shape=0,palette=0,kiln=0;const C=10,R=12,schemes=[[178,201,226,264,315,21],[14,35,49,163,185,232],[262,285,337,25,45,177]];function reset(){tiles=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){let col=schemes[palette][Math.floor((x/C*.55+y/R*.45)*6)%6];tiles.push({x,y,h:col+rnd(-13,13),s:rnd(40,65),l:rnd(30,55),heat:0,baked:0,dye:0,vein:rnd(),seed:rnd(100)})}kiln=0;mode='dye';flow=true;setPressed('flow',true);setPressed('mode',false);document.getElementById('mode').textContent='Dye'}function geom(){const width=Math.min(W-32,1100),height=Math.max(250,usable()-110);return{x:(W-width)/2,y:93,w:width,h:height,tw:width/C,th:height/R}}function paint(p){const g=geom(),tx=(p.px-g.x)/g.tw,ty=(p.py-g.y)/g.th;let affected=false;for(const t of tiles){const d=Math.hypot((t.x+.5-tx),(t.y+.5-ty)*.85);if(d>1.75)continue;const weight=Math.pow(1-d/1.75,1.4);if(mode==='dye'){const hue=(schemes[palette][Math.floor(clamp(p.x,0,.999)*6)]+p.y*75+clock*11)%360;let delta=((hue-t.h+540)%360)-180;t.h=(t.h+delta*weight*.5+360)%360;t.s=mix(t.s,80,weight*.3);t.l=mix(t.l,58,weight*.2);t.dye=Math.min(1,t.dye+weight*.65);t.baked=Math.max(0,t.baked-weight*.1)}else t.heat=Math.min(1,t.heat+weight*.75);affected=true}if(affected)tone(mode==='dye'?170+p.x*430:90+p.y*200,.35,.035)}function down(p){paint(p)}function move(p,old){const g=geom(),n=Math.max(1,Math.ceil(Math.hypot(p.px-old.px,p.py-old.py)/(Math.min(g.tw,g.th)*.45)));for(let i=1;i<=n;i++){const f=i/n;paint({x:mix(old.x,p.x,f),y:mix(old.y,p.y,f),px:mix(old.px,p.px,f),py:mix(old.py,p.py,f)})}}function up(){}bind('mode',()=>{mode=mode==='dye'?'fire':'dye';setPressed('mode',mode==='fire');document.getElementById('mode').textContent=mode==='fire'?'Fire':'Dye'});bind('cool',()=>{for(const t of tiles){t.baked=clamp(t.baked+t.heat*.4,0,1);t.heat*=.1}kiln=0;tone(760,.8,.04)});bind('shape',()=>{shape=(shape+1)%3;document.getElementById('shape').textContent=['Facets','Pebbles','Diamonds'][shape]});bind('palette',()=>{palette=(palette+1)%3;for(const t of tiles){const next=schemes[palette][Math.floor((t.x/C*.55+t.y/R*.45)*6)%6];t.h=(t.h+((next-t.h+540)%360-180)*.65+360)%360;t.dye=.35}});bind('flow',()=>{flow=!flow;setPressed('flow',flow)});function onResize(){}function entities(){return tiles.length}function update(dt){if(pointers.size){for(const p of pointers.values())paintQuiet(p,dt)}kiln=0;const heat=tiles.map(t=>t.heat);for(let i=0;i<tiles.length;i++){let t=tiles[i],neighbors=[];if(t.x>0)neighbors.push(i-1);if(t.x<C-1)neighbors.push(i+1);if(t.y>0)neighbors.push(i-C);if(t.y<R-1)neighbors.push(i+C);let average=neighbors.reduce((a,n)=>a+heat[n],0)/neighbors.length;t.heat=clamp(t.heat+(average-t.heat)*dt*1.5-dt*.018,0,1);if(t.heat>.12){t.baked=clamp(t.baked+dt*t.heat*.045,0,1);t.h=(t.h+dt*t.heat*5)%360}if(flow&&t.dye>.015){let neighbor=tiles[neighbors[Math.floor((clock*.7+t.seed)%neighbors.length)]];let delta=((neighbor.h-t.h+540)%360)-180;neighbor.h=(neighbor.h-delta*dt*t.dye*.06+360)%360;neighbor.dye=Math.min(.85,neighbor.dye+dt*t.dye*.045);t.h=(t.h+dt*Math.sin(t.seed+clock*.3)*2*t.dye+360)%360}t.dye*=Math.exp(-dt*.014);kiln+=t.heat}}function paintQuiet(p,dt){const g=geom(),x=(p.px-g.x)/g.tw,y=(p.py-g.y)/g.th;for(const t of tiles){const d=Math.hypot(t.x+.5-x,t.y+.5-y);if(d<1.3){const q=(1-d/1.3)*dt;if(mode==='fire')t.heat=clamp(t.heat+q*1.5,0,1);else{t.dye=Math.min(1,t.dye+q);t.h=(t.h+q*10)%360}}}}function tilePath(x,y,w,h,s,inset=0){const gap=Math.min(w,h)*.08+inset;let l=x+gap,r=x+w-gap,t=y+gap,b=y+h-gap,cx=(l+r)/2,cy=(t+b)/2;ctx.beginPath();if(s===1){const rx=(r-l)/2,ry=(b-t)/2;ctx.moveTo(cx,t);ctx.bezierCurveTo(r,t,r,b,cx,b);ctx.bezierCurveTo(l,b,l,t,cx,t)}else if(s===2){ctx.moveTo(cx,t);ctx.lineTo(r,cy);ctx.lineTo(cx,b);ctx.lineTo(l,cy)}else{const c=Math.min(w,h)*.14;ctx.moveTo(l+c,t);ctx.lineTo(r-c,t);ctx.lineTo(r,t+c);ctx.lineTo(r,b-c);ctx.lineTo(r-c,b);ctx.lineTo(l+c,b);ctx.lineTo(l,b-c);ctx.lineTo(l,t+c)}ctx.closePath()}function draw(){ctx.fillStyle='#101d22';ctx.fillRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,H*.65);bg.addColorStop(0,'#374043');bg.addColorStop(1,'#101d22');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const g=geom();ctx.fillStyle='#00000055';ctx.fillRect(g.x-7,g.y-7,g.w+14,g.h+14);for(const tile of tiles){const x=g.x+tile.x*g.tw,y=g.y+tile.y*g.th,w=g.tw,h=g.th,heat=tile.heat;const hue=tile.h;let col=ctx.createLinearGradient(x,y,x+w,y+h);col.addColorStop(0,hs(hue-8,Math.min(90,tile.s+heat*10),Math.min(85,tile.l+20+heat*20)));col.addColorStop(.18,hs(hue,tile.s,tile.l+9));col.addColorStop(.52,hs(hue+7,tile.s,tile.l));col.addColorStop(.83,hs(hue+10,tile.s,Math.max(12,tile.l-8)));col.addColorStop(1,hs(hue,tile.s,tile.l+8));tilePath(x,y,w,h,shape);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=hs(hue-10,35,87,.65);ctx.lineWidth=.7;ctx.stroke();tilePath(x,y,w,h,shape,Math.min(w,h)*.065);ctx.strokeStyle=hs(hue+15,65,10,.24);ctx.lineWidth=1.5;ctx.stroke();ctx.save();tilePath(x,y,w,h,shape);ctx.clip();ctx.strokeStyle=hs(hue-40,60,87,.16+tile.baked*.19);ctx.lineWidth=.7;ctx.beginPath();const q=tile.vein;ctx.moveTo(x-w*.1,y+h*(.1+q*.5));ctx.bezierCurveTo(x+w*.4,y+h*(.3+q*.4),x+w*.55,y+h*(.1+q*.6),x+w*1.2,y+h*.7);ctx.stroke();ctx.beginPath();ctx.moveTo(x+w*.7,y);ctx.bezierCurveTo(x+w*.55,y+h*.2,x+w*.75,y+h*.8,x+w*.35,y+h);ctx.stroke();if(tile.baked>.08){ctx.strokeStyle=hs(hue+70,35,12,tile.baked*.42);ctx.lineWidth=.6;for(let n=0;n<3;n++){let a=(tile.seed+n*1.7)%1,px=x+w*a;ctx.beginPath();ctx.moveTo(px,y+h*.12);ctx.lineTo(px+w*.1,y+h*.4);ctx.lineTo(px-w*.08,y+h*.6);ctx.lineTo(px+w*.12,y+h*.9);ctx.stroke()}}const sheen=ctx.createLinearGradient(x,y,x+w,y+h);sheen.addColorStop(0,'#ffffff00');sheen.addColorStop(.2+tile.baked*.15,'#ffffff00');sheen.addColorStop(.3+tile.baked*.15,`rgba(255,255,240,${.13+tile.baked*.18})`);sheen.addColorStop(.4+tile.baked*.15,'#ffffff00');sheen.addColorStop(1,'#ffffff00');ctx.fillStyle=sheen;ctx.fillRect(x,y,w,h);if(heat>.02){ctx.globalCompositeOperation='screen';let hot=ctx.createRadialGradient(x+w*.5,y+h*.5,0,x+w*.5,y+h*.5,Math.max(w,h)*.65);hot.addColorStop(0,`rgba(255,133,32,${heat*.72})`);hot.addColorStop(.6,`rgba(255,66,30,${heat*.25})`);hot.addColorStop(1,'#ff350000');ctx.fillStyle=hot;ctx.fillRect(x,y,w,h)}ctx.restore()}for(const p of pointers.values()){ctx.strokeStyle=mode==='dye'?'#e2fbffab':'#ffd69dcc';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.px,p.py,Math.min(g.tw,g.th)*1.3,0,TAU);ctx.stroke()}ctx.fillStyle='#e4ecdc69';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(mode==='fire'?'FIRE THE CLAY · COOL TO REVEAL THE GLAZE':'PAINT THE CLAY · LET PIGMENT TRAVEL',W*.5,H-(W<600?156:105));ctx.fillStyle=hs(25,90,75,.55);ctx.textAlign='right';ctx.fillText(Math.round(kiln/tiles.length*100)+'°',g.x+g.w,g.y-12)}
size();reset();requestAnimationFrame(loop);</script></body></html>
