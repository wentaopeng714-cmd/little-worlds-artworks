<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>海葵嘻哈团 · 第六组</title><style>:root{--bg:#498f69;--ink:#142a18;--accent:#ff9ab5;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}header h1{font-family:system-ui;font-weight:850}button{border-width:2px}button{box-shadow:2px 2px 0 var(--ink);background:#fff1d8;color:#142a18}button.active{background:var(--accent);color:#142a18}</style><body><header><div><h1>海葵嘻哈团</h1><p>捏海葵黑嘴改变元音形，拨长彩色触须。四团合体成低音，再拆回左右轮流接拍。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="海葵嘻哈团，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="mouth" id="mouth">捏口元音</button><button data-action="tentacle" id="tentacle">拨触须</button><button data-action="fuse" id="fuse">合体低音</button><button data-action="split" id="split">拆回双组</button><button data-action="echo" id="echo">轮流接拍</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=31;window.artMeta={"number": 31, "slug": "31-anemone-beatbox", "title": "海葵嘻哈团", "group": "T", "mothers": ["singing_beans_vocal_choir.html"], "innovation": "Riso花边海葵口技，捏口变元音、合体低音、分组对唱与触须律动", "description": "捏海葵黑嘴改变元音形，拨长彩色触须。四团合体成低音，再拆回左右轮流接拍。", "ui": {"bg": "#498f69", "ink": "#142a18", "accent": "#ff9ab5"}, "controls": [{"id": "mouth", "label": "捏口元音"}, {"id": "tentacle", "label": "拨触须"}, {"id": "fuse", "label": "合体低音"}, {"id": "split", "label": "拆回双组"}, {"id": "echo", "label": "轮流接拍"}], "newMechanics": ["横捏口宽竖拉胖瘦，口形参与音效选调", "选触须拉长，触须长度/口形在接拍里累积", "四團合体/拆回与轮流应答相互影响"], "artDirection": ["草绿Riso网点，粉黄青紫十六瓣有机触须", "四团双组构图与印刷海藻边框", "奶齿、粉舌黑腔保留母本表情，口宽与胖瘦真变形"], "testPlan": [{"control": "mouth", "from": [0.28, 0.31], "to": [0.39, 0.4], "hold": 400}, {"control": "tentacle", "from": [0.72, 0.29], "to": [0.87, 0.39], "hold": 400}, {"control": "fuse", "from": [0.5, 0.53], "to": [0.62, 0.58], "hold": 300}, {"control": "echo", "from": [0.28, 0.73], "to": [0.38, 0.75], "hold": 300}], "stateFields": {"merged": "合体后true，拆回后false", "pinches": "捏口后数组值改变", "patterns": "每团操作后接拍序号改变", "echo": "轮流接拍可开关"}, "css": "header h1{font-family:system-ui;font-weight:850}button{border-width:2px}button{box-shadow:2px 2px 0 var(--ink);background:#fff1d8;color:#142a18}button.active{background:var(--accent);color:#142a18}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,TAU=Math.PI*2,cl=env.clamp;let members,mode,selected,drag,merged,echo,beat,lastBeat,bubbles,turns,t;
const cols=['#ff9ab5','#e3d36c','#9ed6d7','#ccafe0'];
function reset(){members=[{x:.28,y:.31},{x:.72,y:.29},{x:.28,y:.73},{x:.73,y:.71}].map((p,i)=>({...p,i,pinch:.5,stretch:0,tentacle:2,pluck:0,pulse:0,pattern:0}));mode='mouth';selected=0;drag=null;merged=false;echo=false;beat=0;lastBeat=-1;bubbles=[];turns=0;}
function g(b){let r=Math.min(env.W*(env.W<600?.165:.12),env.H*.18);return{x:(merged?.5+(b.i%2?1:-1)*.14:b.x)*env.W,y:(merged?.53+(b.i>1?1:-1)*.16:b.y)*env.H,r};}
function hit(p){let b=members[0],d=1e9;for(let n of members){let q=g(n),v=Math.hypot(q.x-p.x,q.y-p.y);if(v<d){b=n;d=v;}}return b;}
function pop(b,power=1){b.pulse=power;b.pattern=(b.pattern+1)%4;turns++;window.artAudio?.fx(merged?0:b.i+Math.round(b.pinch*3),merged?.2:power);for(let i=0;i<4;i++){bubbles.push({x:b.x,y:b.y,s:4+i*2,life:1,k:b.i});}if(bubbles.length>48)bubbles.splice(0,bubbles.length-48);}
function action(id){mode=id;if(id==='fuse'){merged=!merged;members.forEach(b=>pop(b,.8));}if(id==='split'){merged=false;members.forEach(b=>{b.stretch=.6;b.pulse=1;});}if(id==='echo'){echo=!echo;members[selected].pattern=(members[selected].pattern+1)%4;}}
function input(k,p){let b=hit(p),q=g(b);if(k==='down'){selected=b.i;drag={i:b.i,x:p.x,y:p.y};if(mode==='split'){merged=false;}pop(b);}if(k==='move'&&drag){b=members[drag.i];q=g(b);if(mode==='tentacle'){b.tentacle=Math.round((Math.atan2(p.y-q.y,p.x-q.x)/TAU+1)*16)%16;b.pluck=cl(Math.hypot(p.x-q.x,p.y-q.y)/q.r-1,0,1.4);b.stretch=cl((p.x-drag.x)/q.r,-.7,.7);}else{b.pinch=cl(.5+(p.x-drag.x)/q.r*.4,.05,1.25);b.stretch=cl((p.y-drag.y)/q.r,-.65,.9);b.pulse=1;}}if((k==='up'||k==='cancel')&&drag){pop(members[drag.i]);drag=null;}}
function fill(col,stroke='#182e22',width=3){c.fillStyle=col;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke();}}
function ell(x,y,rx,ry,col){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);fill(col,null);}
function crown(b,time){const q=g(b),r=q.r;c.save();c.translate(q.x,q.y);c.rotate(Math.sin(time*1.5+b.i)*.06);if(merged)c.scale(.78,.78);
// Sixteen flat, fluted organic tentacles, their lengths contain the stored beat.
for(let j=0;j<16;j++){let a=j*TAU/16,bend=Math.sin(time*2+j+b.i)*(.12+b.pulse*.18),len=r*(1.09+(j%3)*.11+(j===b.tentacle?b.pluck*.9:0));c.save();c.rotate(a);c.beginPath();c.moveTo(-r*.14,-r*.38);c.bezierCurveTo(-r*.22,-len*.7,-r*.2+bend*r,-len,0+bend*r,-len);c.bezierCurveTo(r*.25+bend*r,-len,r*.14,-len*.65,r*.14,-r*.38);fill(cols[b.i]);c.strokeStyle='#fff1cf';c.lineWidth=2;c.beginPath();c.moveTo(0,-r*.5);c.quadraticCurveTo(-r*.03,-len*.8,bend*r,-len*.93);c.stroke();c.restore();}
// Ink grain follows the floral disk, whose contour stretches into a cheek/beat.
c.beginPath();for(let j=0;j<=80;j++){let a=j/80*TAU,rr=r*(.78+.05*Math.sin(a*9+b.i));let x=Math.cos(a)*rr*(1+b.stretch*.17),y=Math.sin(a)*rr*(1-b.stretch*.1);j?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();fill(cols[b.i]);c.save();c.clip();c.fillStyle='#20382228';for(let j=0;j<85;j++){let a=j*2.399,v=r*Math.sqrt((j+.5)/85)*.82;ell(Math.cos(a)*v,Math.sin(a)*v,1.3,1.3,'#20382228');}c.restore();
let mw=r*(.3+b.pinch*.26),mh=r*(.12+b.pulse*.28+Math.abs(b.stretch)*.22);c.beginPath();c.moveTo(-mw,-mh*.7);c.bezierCurveTo(-mw*1.12,-mh*1.6,mw*.87,-mh*1.3,mw,-mh*.6);c.bezierCurveTo(mw*1.16,mh*1.13,-mw*.94,mh*1.4,-mw,-mh*.7);fill('#151a15',null);c.save();c.clip();c.beginPath();c.moveTo(-mw*.95,-mh*.75);c.quadraticCurveTo(0,-mh*1.33,mw,-mh*.65);c.lineTo(mw,-mh*.18);c.quadraticCurveTo(0,-mh*.7,-mw,-mh*.12);fill('#fff5ea',null);c.beginPath();c.moveTo(-mw,mh*.37);c.bezierCurveTo(-mw*.4,mh*.13,mw*.45,mh*.87,mw,mh*.1);c.lineTo(mw,mh*1.4);c.lineTo(-mw,mh*1.4);fill('#ee6c9a',null);c.strokeStyle='#c44a77';c.lineWidth=3;c.beginPath();c.moveTo(0,mh*.55);c.lineTo(r*b.stretch*.2,mh*1.05);c.stroke();c.restore();
for(let s of [-1,1]){c.strokeStyle='#142a18';c.lineWidth=4;c.lineCap='round';c.beginPath();if(b.pulse>.2)c.arc(s*r*.21,-r*.35,r*.07,Math.PI,0);else{c.moveTo(s*r*.21,-r*.41);c.lineTo(s*r*.21,-r*.31);}c.stroke();}
if(selected===b.i){c.strokeStyle='#fff5ea';c.lineWidth=2;c.setLineDash([4,6]);c.beginPath();c.arc(0,0,r*1.52,0,TAU);c.stroke();c.setLineDash([]);}c.restore();}
function draw(dt,time){t=time;let W=env.W,H=env.H;c.fillStyle='#498f69';c.fillRect(0,0,W,H);for(let y=8;y<H;y+=15)for(let x=8;x<W;x+=15)ell(x,y,1,1,'#2f795657');
// Kelp screen-print borders and a stippled submerged shelf.
for(let k=0;k<6;k++){let x=(k/5)*W;c.strokeStyle=k%2?'#1b654d':'#c4dd80';c.lineWidth=8;c.beginPath();c.moveTo(x,H);c.bezierCurveTo(x-35,H*.88,x+30,H*.83,x-6,H*.76);c.stroke();for(let j=0;j<3;j++){c.save();c.translate(x,H*(.88-j*.045));c.rotate(j%2?.6:-.7);ell(0,0,13,6,k%2?'#1b654d':'#c4dd80');c.restore();}}
let nb=Math.floor(time/.4)%8;if(nb!==lastBeat){lastBeat=nb;beat=nb;if(echo){members.forEach(b=>{if(nb%4===b.pattern){b.pulse=1;window.artAudio?.fx(merged?0:b.i,merged?.2:.7);}});}}
if(echo){c.strokeStyle='#e9e9b5';c.lineWidth=2;c.setLineDash([4,8]);for(let side=0;side<2;side++){let a=g(members[side]),b=g(members[side+2]);c.beginPath();c.moveTo(a.x,a.y);c.bezierCurveTo(a.x+(side?40:-40),H*.5,b.x+(side?40:-40),H*.5,b.x,b.y);c.stroke();}c.setLineDash([]);}
if(merged){let r=g(members[0]).r;c.fillStyle='#142a18';c.font=`900 ${W<600?15:23}px system-ui`;c.textAlign='center';c.fillText('共振低音 · 四层触须',W*.5,H*.16);for(let j=0;j<3;j++){c.strokeStyle=cols[j];c.lineWidth=4;c.beginPath();c.ellipse(W*.5,H*.52,r*(1.8+j*.3),r*(1.55+j*.2),0,0,TAU);c.stroke();}}
members.forEach(b=>{b.pulse=Math.max(0,b.pulse-dt*1.5);if(!drag||drag.i!==b.i){b.pluck*=Math.exp(-dt*1.8);}crown(b,time);});
bubbles=bubbles.filter(b=>b.life>0);bubbles.forEach(b=>{b.life-=dt*.5;b.y-=dt*.07;c.globalAlpha=Math.max(0,b.life);c.strokeStyle=cols[b.k];c.lineWidth=2;c.beginPath();c.arc(b.x*W+Math.sin(time+b.k)*15,b.y*H,b.s,0,TAU);c.stroke();});c.globalAlpha=1;
c.font='900 12px system-ui';c.textAlign='center';for(let i=0;i<8;i++){ell(W*.3+i*W*.055,H*.96,4,4,i===beat?'#f378a8':'#fff5ea');}c.fillStyle='#fff5ea';c.fillText(echo?'左右轮流接拍':'拖口腔捏元音 · 拨触须拉长节拍',W*.5,H*.045);}
return{reset,draw,input,action,state:()=>({bounded:true,mode,merged,echo,turns,pinches:members.map(b=>+b.pinch.toFixed(2)),patterns:members.map(b=>b.pattern),tentacleStretch:members.map(b=>+b.pluck.toFixed(2)),status:`${{mouth:'横捏口形，竖拖胖瘦',tentacle:'往花边外拖，拉出长触须',fuse:'四团合为低音口，仍能捏口',split:'拆回双组对唱',echo:'轮流应答，口形改变接拍'}[mode]} · ${merged?'合体低音':'四团分唱'} · ${echo?'接拍开':'接拍关'}`})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
