<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>荧浆梯田 · 第六组</title><style>:root{--bg:#0d1020;--ink:#d7d3ef;--accent:#78d4e7;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>荧浆梯田</h1><p>紫白冰蓝细丝沿阶田落下；筑坝真实蓄池，放闸流向下阶，结晶与融化可组合。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="荧浆梯田，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="source" id="source">注浆蓄池</button><button data-action="dam" id="dam">筑坝收流</button><button data-action="gate" id="gate">放闸倾落</button><button data-action="backflow" id="backflow">阶流逆向</button><button data-action="crystal" id="crystal">局部结晶</button><button data-action="thaw" id="thaw">融晶续流</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=12;window.artMeta={"number": 12, "slug": "12-luminous-terraces", "title": "荧浆梯田", "group": "F", "mothers": ["neon_staircase_waterway.html"], "innovation": "阶渠筑坝、放闸、彩浆混流、反流与结晶蓄池", "description": "紫白冰蓝细丝沿阶田落下；筑坝真实蓄池，放闸流向下阶，结晶与融化可组合。", "ui": {"bg": "#0d1020", "ink": "#d7d3ef", "accent": "#78d4e7"}, "controls": [{"id": "source", "label": "注浆蓄池"}, {"id": "dam", "label": "筑坝收流"}, {"id": "gate", "label": "放闸倾落"}, {"id": "backflow", "label": "阶流逆向"}, {"id": "crystal", "label": "局部结晶"}, {"id": "thaw", "label": "融晶续流"}], "newMechanics": ["六阶池独立水量", "关闸累积/开闸向邻阶转移", "冻结局部阶池暂停细丝", "反向跨阶流动", "结晶保留密线纹再融续流"], "artDirection": ["继承紫白冰蓝阶瀑细丝", "5600根阶流丝＋2800根跨阶落丝，层叠弯曲池纹", "实际蓄池深度改变与闸门"], "testPlan": [{"control": "source", "from": [0.36, 0.42], "to": [0.5, 0.46], "hold": 1100}, {"control": "dam", "from": [0.36, 0.42], "to": [0.5, 0.46], "hold": 1100}, {"control": "gate", "from": [0.36, 0.42], "to": [0.5, 0.46], "hold": 1100}, {"control": "crystal", "from": [0.36, 0.42], "to": [0.5, 0.46], "hold": 1100}, {"control": "thaw", "from": [0.36, 0.42], "to": [0.5, 0.46], "hold": 1100}], "stateFields": ["waterLevels蓄/放改变", "closedGates筑/放改变", "frozenPools结/融改变", "releases开闸增长", "flowingStrands关闸/结晶后减少"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,cl=e.clamp;let mode='source',pools=[],particles=[],cascades=[],pointer=null,color=0,reverse=false,releases=0,crystals=0,time=0;const colors=['#b4a2ff','#71d9e8','#ebc8fa','#619bf0'];
const rowY=i=>.12+i*.145;const ledge=(i,x)=>rowY(i)+.018*Math.sin(x*10+i*1.7)+.009*Math.sin(x*23-i);
function particle(row=Math.floor(Math.random()*6),x=Math.random()*.76+.12){return{x,y:rowY(row)+Math.random()*.07,row,fall:false,target:0,speed:.1+Math.random()*.19,col:Math.floor(Math.random()*4),life:3+Math.random()*8};}
function reset(){pools=Array.from({length:6},(_,i)=>({water:.48+i*.055,closed:i===2||i===4,frozen:false,col:i%4}));particles=Array.from({length:5600},()=>particle());cascades=Array.from({length:2800},()=>({row:Math.floor(Math.random()*5),u:Math.random(),strand:Math.floor(Math.random()*11),offset:(Math.random()-.5)*.026,speed:.28+Math.random()*.65,col:Math.floor(Math.random()*4)}));mode='source';pointer=null;color=0;reverse=false;releases=crystals=time=0;}
function targetRow(p){return cl(Math.round((p.y/e.H-.15)/.145),0,5);}
function act(p){let i=targetRow(p),pool=pools[i];if(mode==='source'){pool.water=cl(pool.water+.017,0,1);pool.col=color;for(let j=0;j<20;j++){let q=particle(i,p.x/e.W);q.col=color;particles[(Math.floor(time*150)+j)%particles.length]=q;}}
if(mode==='dam')pool.closed=true;if(mode==='gate'){if(pool.closed){pool.closed=false;releases++;let amount=pool.water*.4;pool.water-=amount;let next=i+(reverse?-1:1);if(next>=0&&next<6)pools[next].water=cl(pools[next].water+amount,0,1);}}
if(mode==='crystal'&&!pool.frozen){pool.frozen=true;crystals++;}if(mode==='thaw')pool.frozen=false;}
return{reset,input(k,p){if(k==='down'){pointer=p;act(p);}if(k==='move'&&pointer){pointer=p;act(p);}if(k==='up'||k==='cancel')pointer=null;},action(id){if(id==='backflow'){reverse=!reverse;mode='source';}else if(id==='color'){color=(color+1)%4;mode='source';}else mode=id;},draw(dt,t){time+=dt;let W=e.W,H=e.H;c.fillStyle='rgba(5,5,14,.25)';c.fillRect(0,0,W,H);if(pointer&&mode==='source')act(pointer);
for(let i=0;i<6;i++){let p=pools[i],y=rowY(i)*H,depth=(.018+p.water*.055)*H,x=(.085+(i%2)*.045)*W,w=.78*W;
if(!p.frozen&&p.closed)p.water=cl(p.water+dt*.025,0,1);if(!p.frozen&&!p.closed){let z=Math.min(p.water,dt*.07);p.water-=z;let next=i+(reverse?-1:1);if(next>=0&&next<6)pools[next].water=cl(pools[next].water+z*.85,0,1);}
let g=c.createLinearGradient(0,y-H*.02,0,y+depth+H*.04);g.addColorStop(0,colors[p.col]+'10');g.addColorStop(.35,colors[p.col]+'08');g.addColorStop(1,'#17133114');c.fillStyle=g;c.beginPath();for(let k=0;k<=90;k++){let u=k/90,xx=x+u*w,yy=ledge(i,xx/W)*H;k?c.lineTo(xx,yy):c.moveTo(xx,yy);}for(let k=90;k>=0;k--){let u=k/90,xx=x+u*w;c.lineTo(xx,ledge(i,xx/W)*H+depth+Math.sin(u*3.14)*H*.014);}c.closePath();c.fill();
for(let j=0;j<27;j++){c.beginPath();for(let k=0;k<=90;k++){let u=k/90,xx=x+u*w,yy=ledge(i,xx/W)*H+depth*j/27+Math.sin(u*25+t*(p.frozen?0:.8)+j*.27)*H*.0025;k?c.lineTo(xx,yy):c.moveTo(xx,yy);}c.strokeStyle=colors[(p.col+Math.floor(j/9))%4]+(j%5===0?'40':'16');c.lineWidth=j%5===0?.85:.45;c.stroke();}
let exitX=(i%2===0?x+w:x);if(reverse)exitX=(i%2===0?x:x+w);c.strokeStyle=p.closed?'#dfcdf8':'#7ccddd55';c.lineWidth=p.closed?4:1;c.beginPath();c.moveTo(exitX,y-5);c.lineTo(exitX,y+depth+7);c.stroke();if(p.frozen){c.strokeStyle='#fff3ff99';c.lineWidth=.6;for(let j=0;j<23;j++){let xx=x+w*j/23;c.beginPath();c.moveTo(xx,y);c.lineTo(xx+18,y+depth);c.moveTo(xx+12,y);c.lineTo(xx-8,y+depth);c.stroke();}}}
c.lineCap='round';for(let q of particles){let oldx=q.x,oldy=q.y,p=pools[q.row],left=.085+(q.row%2)*.045,right=left+.78,dir=q.row%2===0?1:-1;if(reverse)dir*=-1;let exit=dir>0?right:left;
if(p.frozen){q.life-=dt*.08;}else if(q.fall){q.y+=dt*.5*(reverse?-1:1);q.x+=Math.sin(q.y*20+q.col)*dt*.005;if(reverse?q.y<=q.target:q.y>=q.target){q.fall=false;q.row=(q.row+(reverse?-1:1)+6)%6;q.y=rowY(q.row)+Math.random()*.055;q.life-=.6;}}else{q.x+=dir*q.speed*dt*(.4+p.water);q.y=ledge(q.row,q.x)+.013+.043*(.5+.5*Math.sin(q.x*15+q.col*.7))+Math.sin(time+q.x*7)*.002;if(dir*(q.x-exit)>0){if(p.closed){q.x=exit-dir*Math.random()*.09;q.life-=dt; }else{q.fall=true;let row=(q.row+(reverse?-1:1)+6)%6;q.target=rowY(row);}}}q.life-=dt*.07;if(q.life<0||q.x<.01||q.x>.99||q.y>1||q.y<0){Object.assign(q,particle());continue;}
if(Math.hypot((q.x-oldx)*W,(q.y-oldy)*H)<100){c.strokeStyle=colors[q.col];c.globalAlpha=p.frozen?.23:.24;c.lineWidth=q.col===2?1:.6;c.beginPath();c.moveTo(oldx*W,oldy*H);c.lineTo(q.x*W,q.y*H);c.stroke();}}
c.globalAlpha=1;for(let q of cascades){let p=pools[q.row],dir=reverse?-1:1;if(!p.closed&&!p.frozen)q.u+=dt*q.speed*(.5+p.water)*dir;if(q.u>1){q.u=0;}if(q.u<0){q.u=1;}let x=.15+q.strand*.063+Math.sin(q.row*1.8+q.strand)*.045+q.offset,phase=q.u,top=ledge(q.row,x)+.04,bottom=ledge(q.row+1,x)+.011,y=top+(bottom-top)*phase;let bend=.003*Math.sin(phase*8+q.strand)+.001*Math.sin(phase*17+q.row);c.globalAlpha=p.frozen?.19:p.closed?.09:.58;c.strokeStyle=colors[(q.col+p.col)%4];c.lineWidth=q.col===2?.8:.45;c.beginPath();c.moveTo((x+bend)*W,y*H);let v=Math.min(1,phase+.075);c.lineTo((x+.003*Math.sin(v*8+q.strand)+.001*Math.sin(v*17+q.row))*W,(top+(bottom-top)*v)*H);c.stroke();}c.globalAlpha=1;for(let i=0;i<6;i++){let p=pools[i],x=(i%2===0?.89:.065)*W,y=rowY(i)*H;c.font='10px system-ui';c.fillStyle=p.frozen?'#fbe5fa':'#b2b3d5';c.textAlign=i%2===0?'right':'left';c.fillText(p.frozen?'结晶':p.closed?'蓄池':'放闸',x,y-12);c.fillText(Math.round(p.water*100)+'%',x,y+10);}},state(){let names={source:'注浆：按住阶池蓄满，开放闸按流向传给邻阶',dam:'筑坝：点一道阶边，细丝在池内积蓄',gate:'放闸：点封闭蓄池，把彩浆传给相邻一阶',crystal:'结晶：点池封住细丝与晶纹',thaw:'融晶：扫过结晶池，恢复蓄流'};return{bounded:true,mode,waterLevels:pools.map(p=>Math.round(p.water*100)),closedGates:pools.filter(p=>p.closed).length,frozenPools:pools.filter(p=>p.frozen).length,releases,reverse,flowingStrands:cascades.filter(q=>!pools[q.row].closed&&!pools[q.row].frozen).length,status:names[mode]+' · 闸 '+pools.filter(p=>p.closed).length+' · 结晶池 '+pools.filter(p=>p.frozen).length+(reverse?' · 反流':'')};}}
};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
