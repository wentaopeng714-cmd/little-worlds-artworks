>点饮用连喝触发脑冻；下拉墨镜松手弹射果汁雷。切口味补杯，揉徽章解冻，泡沫会鼓起脸颊。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="果汁雷客，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="flavor" id="flavor">换口味</button><button data-action="sip" id="sip">饮用</button><button data-action="warm" id="warm">暖徽章</button><button data-action="foam" id="foam">打泡沫</button><button data-action="shake" id="shake">重新调杯</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=26;window.artMeta={"number": 26, "slug": "26-juice-thunder", "title": "果汁雷客", "group": "T", "mothers": ["chill_slurp_overdrive.html"], "innovation": "粗黑漫画饮者，多味配饮、拉镜弹射、吸冷/化冻与泡沫变身", "description": "点饮用连喝触发脑冻；下拉墨镜松手弹射果汁雷。切口味补杯，揉徽章解冻，泡沫会鼓起脸颊。", "ui": {"bg": "#ffd752", "ink": "#292331", "accent": "#ff734f"}, "controls": [{"id": "flavor", "label": "换口味"}, {"id": "sip", "label": "饮用"}, {"id": "warm", "label": "暖徽章"}, {"id": "foam", "label": "打泡沫"}, {"id": "shake", "label": "重新调杯"}], "artDirection": ["黄底粗黑漫画线", "分瓣橘皮头与形变脸颊", "闪电圆墨镜与分层果汁杯"], "newMechanics": ["换口味补满杯并改变弹射果雷颜色", "饮用消耗杯中汁液，连喝进入抖动脑冻状态", "暖徽章后在画面来回揉动降温", "打泡沫鼓起脸颊、改变杯顶泡层", "下拉墨镜蓄力松手发射果雷累积天气变化", "重新调杯清掉果雷天气并补杯"], "testPlan": [{"control": "sip", "from": [0.5, 0.48], "to": [0.5, 0.48], "hold": 100}, {"control": "foam", "from": [0.5, 0.45], "to": [0.5, 0.45], "hold": 100}, {"control": "warm", "from": [0.4, 0.68], "to": [0.7, 0.68], "hold": 300}, {"control": "flavor", "from": [0.5, 0.33], "to": [0.5, 0.47], "hold": 300}], "stateFields": ["sips / cold / juice", "shots / storm", "thaw / foam", "particles<=30"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;

</script><script>window.createScene=function(env){const c=env.ctx,cl=env.clamp;let s,g;const flavors=['#f07943','#a1cd69','#af87d8'];function reset(){s={flavor:0,juice:1,cold:0,sips:0,foam:0,shots:0,storm:0,thaw:0,mode:'sip',bolts:[],pull:0};g=null;}function lay(){return{x:env.W*.5,y:env.H*.49,k:Math.min(env.W/(env.W<600?530:760),env.H/660)};}function P(a,f,st='#22202a',w=7){c.beginPath();a.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.closePath();c.fillStyle=f;c.fill();if(st){c.strokeStyle=st;c.lineWidth=w;c.lineJoin='round';c.stroke();}}function E(x,y,rx,ry,f,st,w=7){c.beginPath();c.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,7);c.fillStyle=f;c.fill();if(st){c.strokeStyle=st;c.lineWidth=w;c.stroke();}}function L(a,col,w){c.beginPath();a.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke();}function txt(t,x,y,z=15,col='#272332'){c.fillStyle=col;c.font=`900 ${z}px system-ui`;c.textAlign='center';c.fillText(t,x,y);}function sip(){if(s.juice>.02&&s.cold<.98){s.juice=cl(s.juice-.14,0,1);s.cold=cl(s.cold+.22,0,1);s.sips++;s.foam=cl(s.foam+.19,0,1);window.artAudio?.fx(1,.8);}}function draw(dt,t){s.cold=cl(s.cold-dt*.017,0,1);s.pull=g&&g.glass?s.pull:Math.max(0,s.pull-dt*3);for(const b of s.bolts){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=170*dt;b.life-=dt;}s.bolts=s.bolts.filter(b=>b.life>0&&Math.abs(b.x)<500);const {x,y,k}=lay();let bg=c.createLinearGradient(0,0,0,env.H);bg.addColorStop(0,'#ffd752');bg.addColorStop(1,'#ffbf45');c.fillStyle=bg;c.fillRect(0,0,env.W,env.H);c.save();c.translate(x,y);c.scale(k,k);for(let j=0;j<20;j++){let a=j*Math.PI/10;L([[Math.cos(a)*220,Math.sin(a)*240],[Math.cos(a)*340,Math.sin(a)*350]],'#f5aa39',2);}txt('JUICE THUNDER',0,-290,23);let fr=s.cold>.65;let wob=fr?Math.sin(t*28)*3:Math.sin(t*2)*1.5;E(0,239,217,20,'#dc902d');

function input(kind,p){let l=lay(),a={x:(p.x-l.x)/l.k,y:(p.y-l.y)/l.k};if(kind==='down'){g={...a,glass:a.y<-50&&Math.abs(a.x)<125,last:a};if(!g.glass&&s.mode==='sip')sip();}if(kind==='move'&&g){if(g.glass)s.pull=cl((a.y-g.y)/110,0,1);else if(s.mode==='warm'){s.cold=cl(s.cold-Math.hypot(a.x-g.last.x,a.y-g.last.y)/900,0,1);s.thaw++;}g.last=a;}if(kind==='up'&&g){if(g.glass&&s.pull>.12){s.shots++;s.storm=cl(s.storm+1,0,9);for(let i=0;i<5;i++)s.bolts.push({x:0,y:-80,vx:(i-2)*120,vy:-150-s.pull*250,life:2,f:s.flavor});s.bolts=s.bolts.slice(-30);s.foam=cl(s.foam+.1,0,1);window.artAudio?.fx(3,s.pull);}g=null;}if(kind==='cancel')g=null;}function action(id){if(id==='flavor'){s.flavor=(s.flavor+1)%3;s.juice=1;}if(id==='sip'){s.mode='sip';sip();}if(id==='warm'){s.mode='warm';s.cold=cl(s.cold-.13,0,1);}if(id==='foam'){s.foam=cl(s.foam+.25,0,1);s.cold=cl(s.cold+.1,0,1);}if(id==='shake'){s.foam=0;s.juice=1;s.storm=0;} }function state(){return{bounded:true,status:`${['橙汽','青柚','莓紫'][s.flavor]} · ${s.cold>.65?'脑冻，选暖徽章并来回揉':'杯中果汁可补充；直接下拉墨镜弹射'} · ${s.mode==='warm'?'揉动升温':'点画面继续喝'}`,flavor:s.flavor,juice:s.juice,cold:s.cold,sips:s.sips,foam:s.foam,shots:s.shots,storm:s.storm,thaw:s.thaw,particles:s.bolts.length,mode:s.mode};}return{reset,draw,input,action,state};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}

for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
