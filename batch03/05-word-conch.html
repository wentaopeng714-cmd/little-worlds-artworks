<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Word Conch</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f2eadb;color:#3c2b25;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(26px,env(safe-area-inset-top));left:28px;pointer-events:none}h1{margin:0 0 6px;font:400 21px Georgia,serif;letter-spacing:.03em}header p{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}.ui{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;padding:5px;border:1px solid #92765b33;background:#f6efe1dc;border-radius:13px;display:flex;justify-content:center;flex-wrap:wrap;backdrop-filter:blur(15px)}button{border:0;border-radius:8px;min-height:44px;min-width:51px;padding:8px 12px;background:none;color:#554439;font-size:12px;cursor:pointer}button:hover,button:focus-visible{outline:1px solid #a85a41}button[aria-pressed=true]{background:#b6503422}.hint{position:fixed;bottom:85px;left:0;width:100%;text-align:center;font-size:12px;letter-spacing:.15em;opacity:.5;pointer-events:none}.editor{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));padding:12px;background:#f2eadbf2;border:1px solid #a8917277;border-radius:12px;display:none;align-items:center;gap:5px}.editor.open{display:flex}.editor input{min-width:0;width:100%;background:none;border:0;border-bottom:1px solid #9f837b;color:#4c362d;font:15px Georgia,serif;padding:12px 4px;outline:none}.editor button{min-width:50px}#qa{display:none}@media(max-width:600px){header{left:22px;top:26px}h1{font-size:19px}.ui{width:calc(100% - 28px);bottom:max(16px,env(safe-area-inset-bottom))}button{padding:6px 9px;min-width:48px}.hint{bottom:122px;letter-spacing:.09em}.editor{bottom:130px}}
</style></head><body><canvas id="art" aria-label="Interactive poetic typography spirals"></canvas><header><h1>Word Conch</h1><p>the sea remembers every syllable</p></header><div class="hint">DRAG TO SPIN • HOLD TO UNFURL • FLICK TO SCATTER</div><form class="editor" id="editor"><input id="phrase" maxlength="160" aria-label="Your phrase" placeholder="Leave a sentence in the shell…"><button type="submit">Weave</button><button type="button" id="close" aria-label="Close text editor">×</button></form><nav class="ui" aria-label="Artwork controls"><button id="form">Shell</button><button id="split" aria-pressed="false">Split</button><button id="palette">Pearl</button><button id="words">Words</button><button id="reset">Reset</button><button id="mute" aria-pressed="true">Sound off</button></nav><div id="qa" aria-hidden="true"></div><script>
'use strict';const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),qa=document.querySelector('#qa');let w=innerWidth,h=innerHeight,dpr=1,frames=0,fps=0,inputs=0,resets=0,last=performance.now(),stamp=last,count=0,t=0,kind=0,palette=0,split=false,muted=true,ac=null,lastSound=0,voices=0,pointer=null,phrase='the sea remembers every syllable · a small silence opens in the palm · what we release returns as light · ',groups=[],particles=[],paper=document.createElement('canvas');const palettes=[['#f1e9d9','#382e2a','#b5452f','#bca47a'],['#172831','#eddfca','#f48762','#668c91'],['#c75338','#2f2523','#f2e5c9','#e4a883']];
function sound(freq=240){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();if(ac.state!=='running'||voices>3||performance.now()-lastSound<150)return;lastSound=performance.now();voices++;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.025,ac.currentTime+.035);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.55);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.6);o.onended=()=>voices--}catch{}}
function position(i){if(!split)return{x:w*.5,y:h*.48,r:Math.min(w*.43,h*.33)};const portrait=h>w;return portrait?[{x:w*.43,y:h*.29,r:Math.min(w*.31,h*.17)},{x:w*.67,y:h*.49,r:Math.min(w*.27,h*.15)},{x:w*.35,y:h*.68,r:Math.min(w*.28,h*.15)}][i]:[{x:w*.29,y:h*.49,r:Math.min(w*.23,h*.31)},{x:w*.55,y:h*.47,r:Math.min(w*.18,h*.26)},{x:w*.76,y:h*.5,r:Math.min(w*.2,h*.28)}][i]}
function makeTexture(){paper.width=Math.ceil(w);paper.height=Math.ceil(h);let p=paper.getContext('2d');p.clearRect(0,0,w,h);for(let i=0;i<11000;i++){p.fillStyle=Math.random()>.5?'#fff3':'#6148230b';p.fillRect(Math.random()*w,Math.random()*h,Math.random()*1.5,.6)}}
function weave(){const previous=groups;groups=[];for(let i=0;i<(split?3:1);i++){let p=position(i),r=p.r,c=document.createElement('canvas'),cd=Math.min(dpr,1.5),size=r*2.6;c.width=c.height=Math.ceil(size*cd);const x=c.getContext('2d');x.setTransform(cd,0,0,cd,0,0);x.translate(size/2,size/2);const pal=palettes[palette],chars=Array.from(phrase.trim()+' · ');let n=0,angle=0,radius=6;while(radius<r&&n<1500){let fs=Math.max(5,r*.025)+radius*.035,step=fs*.57+.8;if(kind===2){let ring=Math.floor(radius/14);angle=n*(step/(Math.max(radius,7)));radius=9+ring*14}x.save();let a=angle+(kind===1?Math.sin(angle*.48)*.15:0),rx=radius,ry=radius*(kind===1?.55:1);x.translate(Math.cos(a)*rx,Math.sin(a)*ry);x.rotate(a+Math.PI/2);x.font=`${n%13===0?'italic ':''}${fs}px Georgia,serif`;x.fillStyle=n%23===0?pal[2]:pal[1];x.globalAlpha=.45+radius/r*.55;x.fillText(chars[(n+i*17)%chars.length],-fs*.25,0);x.restore();angle+=step/Math.max(radius,7);radius+=step/Math.max(radius,7)*(kind===1?4.7:2.35);n++;if(kind===2){radius=6+Math.floor(n/55)*14;angle=(n%55)/55*Math.PI*2}}groups.push({cache:c,rad:r,size,angle:previous[i]?.angle||i*.9,v:previous[i]?.v||.015*(i%2?1:-1),expand:1,chars:n,...p})}}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);makeTexture();weave()}resize();
function nearest(x,y){let index=0,min=Infinity;groups.forEach((g,i)=>{let d=Math.hypot(g.x-x,g.y-y);if(d<min){min=d;index=i}});return index}
function scatter(g,v){const chars=Array.from(phrase);for(let i=0;i<12;i++){if(particles.length>=90)particles.shift();let a=Math.random()*Math.PI*2,r=g.r*(.45+Math.random()*.4);particles.push({x:(g.x+Math.cos(a)*r)/w,y:(g.y+Math.sin(a)*r)/h,vx:Math.cos(a+Math.PI/2)*v*.004,vy:Math.sin(a+Math.PI/2)*v*.004,angle:a,life:1,size:9+Math.random()*9,ch:chars[Math.floor(Math.random()*chars.length)]})}sound(260+Math.abs(v)*20)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);inputs++;let i=nearest(e.clientX,e.clientY),g=groups[i];pointer={id:e.pointerId,index:i,angle:Math.atan2(e.clientY-g.y,e.clientX-g.x),x:e.clientX,y:e.clientY,down:performance.now(),moved:0,last:performance.now(),v:0};g.v=0;sound(210+i*45)});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;inputs++;let g=groups[pointer.index],a=Math.atan2(e.clientY-g.y,e.clientX-g.x),delta=a-pointer.angle;if(delta>Math.PI)delta-=Math.PI*2;if(delta<-Math.PI)delta+=Math.PI*2;let elapsed=Math.max(.016,(performance.now()-pointer.last)/1000);pointer.v=delta/elapsed;g.angle+=delta;pointer.moved+=Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y);pointer.x=e.clientX;pointer.y=e.clientY;pointer.angle=a;pointer.last=performance.now();if(Math.abs(delta)>.03)sound(160+Math.abs(pointer.v)*25)});
function release(e){if(!pointer||pointer.id!==e.pointerId)return;let g=groups[pointer.index];g.v=Math.max(-8,Math.min(8,pointer.v));if(Math.abs(g.v)>.8)scatter(g,g.v);pointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',e=>{if(pointer?.id===e.pointerId)pointer=null});
document.querySelector('#form').onclick=e=>{kind=(kind+1)%3;e.currentTarget.textContent=['Shell','Ribbon','Orbit'][kind];inputs++;weave();sound(190+kind*80)};document.querySelector('#split').onclick=e=>{split=!split;e.currentTarget.setAttribute('aria-pressed',String(split));inputs++;weave()};document.querySelector('#palette').onclick=e=>{palette=(palette+1)%3;e.currentTarget.textContent=['Pearl','Deep ink','Vermilion'][palette];inputs++;weave()};document.querySelector('#words').onclick=()=>{document.querySelector('#editor').classList.add('open');document.querySelector('#phrase').focus();inputs++};document.querySelector('#close').onclick=()=>document.querySelector('#editor').classList.remove('open');document.querySelector('#editor').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#phrase').value.trim();if(q)phrase=q;document.querySelector('#editor').classList.remove('open');inputs++;weave();sound(350)};
document.querySelector('#reset').onclick=()=>{resets++;inputs++;particles=[];pointer=null;groups.forEach(g=>{g.angle=0;g.v=.015;g.expand=1});document.querySelector('#editor').classList.remove('open')};document.querySelector('#mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'Sound off':'Sound on';e.currentTarget.setAttribute('aria-pressed',String(muted));inputs++;if(muted)ac?.suspend();else sound(240)};addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)ac?.suspend();else if(!muted)ac?.resume()});
function render(now){requestAnimationFrame(render);if(document.hidden)return;let dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;frames++;count++;if(now-stamp>1000){fps=count*1000/(now-stamp);stamp=now;count=0;Object.assign(qa.dataset,{frames:String(frames),fps:fps.toFixed(1),entities:String(groups.reduce((n,g)=>n+g.chars,0)+particles.length),inputs:String(inputs),resets:String(resets),muted:String(muted),width:String(w),height:String(h),audio:ac?.state||'uninitialized'})}const pal=palettes[palette];ctx.fillStyle=pal[0];ctx.fillRect(0,0,w,h);ctx.globalAlpha=palette===0?1:.4;ctx.drawImage(paper,0,0);ctx.globalAlpha=1;ctx.strokeStyle=pal[3]+'33';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(w*.085,h*.135);ctx.lineTo(w*.915,h*.135);ctx.moveTo(w*.085,h*.805);ctx.lineTo(w*.915,h*.805);ctx.stroke();groups.forEach((g,i)=>{let held=pointer?.index===i&&now-pointer.down>400&&pointer.moved<20,target=held?1.55:1;g.expand+=(target-g.expand)*dt*3;g.angle+=g.v*dt;if(pointer?.index!==i)g.v*=Math.pow(.94,dt*60);ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.angle);ctx.scale(g.expand,g.expand);ctx.drawImage(g.cache,-g.size/2,-g.size/2,g.size,g.size);ctx.restore();ctx.fillStyle=pal[2];ctx.beginPath();ctx.arc(g.x,g.y,2.4,0,Math.PI*2);ctx.fill();if(held&&Math.random()<dt*8){g.angle+=dt*.1;sound(230+g.expand*70)}});particles.forEach(p=>{p.life-=dt*.3;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=dt*.001;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x*w,p.y*h);ctx.rotate(p.angle+t*.08);ctx.fillStyle=pal[2];ctx.font=`italic ${p.size}px Georgia`;ctx.fillText(p.ch,0,0);ctx.restore()});particles=particles.filter(p=>p.life>0);ctx.fillStyle=pal[3];ctx.globalAlpha=.6;ctx.font='9px Georgia';ctx.textAlign='center';ctx.fillText('I  /  WORDS WASH ASHORE',w*.5,h*.839);ctx.textAlign='start';ctx.globalAlpha=1}requestAnimationFrame(render);
</script></body></html>
