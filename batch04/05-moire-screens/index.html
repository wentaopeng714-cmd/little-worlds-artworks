<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>纱间 · 织屏摩尔纹</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eedf;color:#253d42;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}#art{display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab}.head{position:absolute;left:28px;top:24px;pointer-events:none}h1{font-size:30px;font-weight:500;letter-spacing:.22em;margin:0 0 8px}.sub{font-size:11px;letter-spacing:.13em;color:#536568}.number{position:absolute;right:28px;top:28px;font-size:11px;letter-spacing:.12em}.panel{position:absolute;left:50%;bottom:23px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:12px;background:rgba(249,247,237,.93);border:1px solid #d6ddd1;border-radius:20px;box-shadow:0 10px 35px #243e4410;backdrop-filter:blur(10px)}.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.row+.row{margin-top:6px}button{font:inherit;font-size:12px;color:#34565b;background:transparent;border:1px solid transparent;border-radius:11px;min-width:46px;min-height:44px;padding:8px 10px;cursor:pointer}button[aria-pressed=true]{background:#284f58;color:#faf7e9}button.layer{border-color:#bccfc6}button:hover{border-color:#284f58}#hint{margin:9px 6px 1px;font-size:11px;text-align:center;min-height:16px;color:#5b6c69}.tag{position:absolute;bottom:210px;right:28px;writing-mode:vertical-rl;font-size:11px;letter-spacing:.25em;color:#667c77;pointer-events:none}@media(max-width:560px){.head{left:20px;top:23px}h1{font-size:25px}.number{right:18px}.panel{bottom:15px;width:calc(100% - 24px);padding:8px}.row{gap:2px}button{padding:8px 8px}.tag{right:17px;bottom:230px}}
.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:auto;white-space:nowrap;border:1px solid currentColor;background:none;cursor:pointer;}</style></head><body><canvas id="art" aria-label="三层纱网，可用手指拖动、旋转、梳理并掀起"></canvas><div class="head"><h1>纱间</h1><div class="sub">THREE SCREENS, ONE CHANGING FIELD</div></div><div class="number">05 / MATERIAL STUDIES</div><div class="tag">疏密之间，颜色会呼吸</div><div class="panel"><div class="row"><button class="layer" id="layer0" aria-pressed="true">青纱</button><button class="layer" id="layer1" aria-pressed="false">桃纱</button><button class="layer" id="layer2" aria-pressed="false">金纱</button></div><div class="row"><button id="move" aria-pressed="true">挪纱</button><button id="turn" aria-pressed="false">转纱</button><button id="density" aria-pressed="false">疏密</button><button id="stretch" aria-pressed="false">拉幅</button><button id="comb" aria-pressed="false">揉褶</button><button id="lift" aria-pressed="false">掀纱</button></div><div class="row"><button id="palette">换染色</button><button id="undo">退一步</button><button id="pause" aria-pressed="false">停驻</button><button id="reset">重置</button><button id="mute" class="sound-status" type="button" aria-pressed="false">声音 · 点按启用</button></div><div id="hint">选一层纱，在画面里挪动；试试叠出更宽的波带。</div></div><div id="qa" hidden data-frames="0" data-inputs="0" data-resets="0" data-bounded="true" data-audio="none" data-cap="3 layers; pitch .55..3.2; stretch .58..1.6; 12 folds/layer; 8 windows/layer; 24 undo"></div><script>
(()=>{'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),qa=document.getElementById('qa'),hint=document.getElementById('hint');
const MODES=['move','turn','density','stretch','comb','lift'];
let W,H,D,selected=0,mode='move',paused=false,frames=0,inputs=0,resets=0,palette=0,layers=[],history=[],drag=null,clock=0,soundAt=0;
const T=1000,sets=[['#357a88','#d36866','#ae953c'],['#4b5783','#b16190','#58a699'],['#356c5e','#ce8553','#706daf']];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function fresh(){return [{x:-.11,y:-.04,a:-.1,pitch:1,cross:1,sx:1,sy:1,warp:[],holes:[]},{x:.08,y:.06,a:.052,pitch:1,cross:1,sx:1,sy:1,warp:[],holes:[]},{x:.19,y:-.035,a:.19,pitch:1,cross:1,sx:1,sy:1,warp:[],holes:[]}]}
function sound(kind,energy,p={x:W/2,y:H/2},force=false){const now=performance.now();if(!force&&now-soundAt<60)return;soundAt=now;window.dispatchEvent(new CustomEvent('art-sound',{detail:{kind,energy:clamp(energy,0,1),x:clamp(p.x/W,0,1),y:clamp(p.y/H,0,1)}}))}
function sync(){qa.dataset.frames=frames;qa.dataset.inputs=inputs;qa.dataset.resets=resets;qa.dataset.bounded=String(layers.every(l=>l.warp.length<=12&&l.holes.length<=8&&l.pitch>=.55&&l.pitch<=3.2&&l.sx>=.58&&l.sx<=1.6&&l.sy>=.58&&l.sy<=1.6)&&history.length<=24);const l=layers[selected];if(l){qa.dataset.pitch=l.pitch.toFixed(2);qa.dataset.stretch=[l.sx.toFixed(2),l.sy.toFixed(2)].join(',');qa.dataset.rotation=l.a.toFixed(2);qa.dataset.warps=l.warp.length;qa.dataset.holes=l.holes.length}qa.dataset.objects=layers.reduce((n,l)=>n+l.warp.length+l.holes.length,3)}
function touch(){inputs++;sync()}
function save(){history.push(layers.map(({tex,...l})=>JSON.parse(JSON.stringify(l))));if(history.length>24)history.shift()}
function makeTexture(l,i){
 const c=document.createElement('canvas');c.width=T;c.height=T;const g=c.getContext('2d'),col=sets[palette][i];g.fillStyle=col+'10';g.fillRect(0,0,T,T);
 const gap=(i===0?5.5:i===1?5.7:7.2)*l.pitch;
 function warp(x,y){let u=x+18*Math.sin(y/190+i*.8)+8*Math.cos(y/98+x/195),v=y;for(const w of l.warp){const dx=x-w.x,dy=y-w.y,r2=dx*dx+dy*dy,fall=Math.exp(-r2/(2*w.r*w.r));u+=w.amount*fall+dy*w.twist*fall;v+=w.lift*fall-dx*w.twist*fall}return [u,v]}
 g.strokeStyle=col;g.lineWidth=clamp(gap*.2,1.05,2.4);g.globalAlpha=.8;
 for(let x=-400;x<T+400;x+=gap){g.beginPath();for(let y=-200;y<=T+200;y+=12){const [u,v]=warp(x,y);if(y===-200)g.moveTo(u,v);else g.lineTo(u,v)}g.stroke()}
 g.globalAlpha=.3;g.lineWidth=clamp(gap*.12,.65,1.3);
 const crossGap=11*l.cross;
 for(let y=-200;y<T+200;y+=crossGap){g.beginPath();for(let x=-300;x<=T+300;x+=16){const [u,v]=warp(x,y+6*Math.sin(y/67));if(x===-300)g.moveTo(u,v);else g.lineTo(u,v)}g.stroke()}
 // Soft creases retain the material's translucency rather than becoming opaque paint.
 for(const w of l.warp){if(Math.abs(w.amount)+Math.abs(w.lift)<20)continue;g.save();g.translate(w.x,w.y);g.rotate(Math.atan2(w.lift,w.amount)+Math.PI/2);const grad=g.createLinearGradient(-130,0,130,0);grad.addColorStop(0,col+'00');grad.addColorStop(.4,col+'04');grad.addColorStop(.5,col+'2b');grad.addColorStop(.6,'#fffdf01d');grad.addColorStop(1,col+'00');g.fillStyle=grad;g.fillRect(-130,-w.r,260,w.r*2);g.restore()}
 g.globalAlpha=.35;g.strokeStyle=col;g.lineWidth=1;g.strokeRect(.5,.5,T-1,T-1);l.tex=c;
}
function reset(){layers=fresh();history=[];palette=0;selected=0;mode='move';paused=false;drag=null;layers.forEach(makeTexture);setMode('move');select(0);document.getElementById('pause').setAttribute('aria-pressed','false');document.getElementById('pause').textContent='停驻';sync()}
function select(i){selected=i;for(let j=0;j<3;j++)document.getElementById('layer'+j).setAttribute('aria-pressed',String(j===i));sync()}
const help={move:'拖动选中的纱；挪开一层，露出不同的叠色。',turn:'从画面中心外侧绕着拖动；三层交叉，生成宽窄不同的波带。',density:'左右拖改变网孔大小，上下拖改变横向纱距；从细纱拉到疏网。',stretch:'横拖拉宽或收窄，竖拖拉长或压扁；选层的轮廓也会变化。',comb:'长距离拖动，揉出大范围弯曲和涡褶；不同方向可叠加。',lift:'按住掀开圆窗，拖动扩大并移动；大片露出下层纱。'};
function setMode(m){mode=m;MODES.forEach(k=>document.getElementById(k).setAttribute('aria-pressed',String(k===m)));hint.textContent=help[m];canvas.style.cursor=m==='move'?'grab':'crosshair'}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);drag=null}
function geom(l){const sz=Math.min(W*.9,H*.68,650);return {sz,cx:W*.5+l.x*sz,cy:H*(W<560?.405:.46)+l.y*sz}}
function local(p,l){const {sz,cx,cy}=geom(l),a=-l.a,dx=p.x-cx,dy=p.y-cy;return {x:(dx*Math.cos(a)-dy*Math.sin(a))/(sz*l.sx)*T+T/2,y:(dx*Math.sin(a)+dy*Math.cos(a))/(sz*l.sy)*T+T/2}}
function point(e){return {x:e.clientX,y:e.clientY}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);touch();save();const p=point(e),l=layers[selected],g=geom(l),q=local(p,l);drag={id:e.pointerId,start:p,last:p,ox:l.x,oy:l.y,oa:l.a,op:l.pitch,oc:l.cross,osx:l.sx,osy:l.sy,angle:Math.atan2(p.y-g.cy,p.x-g.cx),idx:-1};if(mode==='lift'){if(l.holes.length===8)l.holes.shift();l.holes.push({x:clamp(q.x,120,880),y:clamp(q.y,120,880),r:105});drag.idx=l.holes.length-1}if(mode==='comb'){if(l.warp.length===12)l.warp.shift();l.warp.push({x:clamp(q.x,180,820),y:clamp(q.y,180,820),r:290,amount:0,lift:0,twist:0});drag.idx=l.warp.length-1}sound('weave-grab',.25,p,true)});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();touch();const p=point(e),l=layers[selected],g=geom(l),dx=(p.x-drag.start.x)/g.sz,dy=(p.y-drag.start.y)/g.sz;
 if(mode==='move'){l.x=clamp(drag.ox+dx,-.65,.65);l.y=clamp(drag.oy+dy,-.4,.45)}
 else if(mode==='turn'){l.a=drag.oa+Math.atan2(p.y-g.cy,p.x-g.cx)-drag.angle}
 else if(mode==='density'){l.pitch=clamp(drag.op*Math.exp(dx*3.1),.55,3.2);l.cross=clamp(drag.oc*Math.exp(dy*2.7),.6,2.8);makeTexture(l,selected)}
 else if(mode==='stretch'){l.sx=clamp(drag.osx+dx*1.9,.58,1.6);l.sy=clamp(drag.osy+dy*1.9,.58,1.6)}
 else if(mode==='comb'){const w=l.warp[drag.idx];w.amount=clamp(dx*T*1.4,-460,460);w.lift=clamp(dy*T*1.1,-320,320);w.twist=clamp((dx-dy)*1.5,-.95,.95);w.r=clamp(240+Math.hypot(dx,dy)*180,240,390);makeTexture(l,selected)}
 else if(mode==='lift'){const q=local(p,l),hole=l.holes[drag.idx];hole.x=clamp(q.x,120,880);hole.y=clamp(q.y,120,880);hole.r=clamp(105+Math.hypot(dx,dy)*T*.7,105,350)}
 const speed=Math.hypot(p.x-drag.last.x,p.y-drag.last.y)/40;sound('weave-'+mode,clamp(.2+speed,.2,1),p);drag.last=p;sync();
});
function release(e){if(drag&&e.pointerId===drag.id){sound('weave-release',.3,drag.last,true);drag=null;sync()}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
for(let i=0;i<3;i++)document.getElementById('layer'+i).onclick=()=>{touch();drag=null;select(i);sound('weave-layer',.15,undefined,true)};
MODES.forEach(m=>document.getElementById(m).onclick=()=>{touch();drag=null;setMode(m)});
document.getElementById('palette').onclick=()=>{touch();palette=(palette+1)%sets.length;layers.forEach(makeTexture);hint.textContent='换染色，保留拉幅、密度、涡褶和圆窗。';sound('weave-dye',.3,undefined,true)};
document.getElementById('undo').onclick=()=>{touch();if(history.length){layers=history.pop();layers.forEach(makeTexture)}hint.textContent='退回上一次画布操作。';sync();sound('weave-settle',.15,undefined,true)};
document.getElementById('pause').onclick=e=>{touch();paused=!paused;e.currentTarget.setAttribute('aria-pressed',String(paused));e.currentTarget.textContent=paused?'继续漂移':'停驻'};
document.getElementById('reset').onclick=()=>{touch();resets++;reset();sound('weave-settle',.2,undefined,true)};
function draw(){frames++;if(!paused)clock+=.002;ctx.clearRect(0,0,W,H);ctx.fillStyle='#f1eedf';ctx.fillRect(0,0,W,H);const sz=Math.min(W*.9,H*.68,650),cy=H*(W<560?.405:.46);ctx.fillStyle='#d9e6dd';ctx.beginPath();ctx.ellipse(W*.48,cy,sz*.61,sz*.47,-.12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4d6c6';ctx.fillRect(W*.5-sz*.43,cy-sz*.43,sz*.89,sz*.87);
 for(let i=0;i<3;i++){const l=layers[i],g=geom(l);ctx.save();ctx.translate(g.cx+Math.sin(clock+i)*2,g.cy+Math.cos(clock*.7+i)*1.6);ctx.rotate(l.a);ctx.scale(g.sz*l.sx/T,g.sz*l.sy/T);ctx.translate(-T/2,-T/2);ctx.beginPath();ctx.rect(0,0,T,T);for(const h of l.holes){ctx.moveTo(h.x+h.r,h.y);ctx.arc(h.x,h.y,h.r,0,Math.PI*2,true)}ctx.clip('evenodd');ctx.globalCompositeOperation='multiply';ctx.drawImage(l.tex,0,0);ctx.restore();
  // The lifted edge is drawn on top as a quiet stitched rim, making the removed material readable.
  if(l.holes.length){ctx.save();ctx.translate(g.cx+Math.sin(clock+i)*2,g.cy+Math.cos(clock*.7+i)*1.6);ctx.rotate(l.a);ctx.scale(g.sz*l.sx/T,g.sz*l.sy/T);ctx.translate(-T/2,-T/2);ctx.beginPath();ctx.rect(0,0,T,T);ctx.clip();ctx.strokeStyle=sets[palette][i]+'77';ctx.lineWidth=2;ctx.setLineDash([3,5]);for(const h of l.holes){ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.stroke()}ctx.restore()}
 }
 ctx.strokeStyle='#486e682c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W*.5-sz*.56,cy+sz*.53);ctx.lineTo(W*.5+sz*.56,cy+sz*.53);ctx.stroke();if(frames%20===0)sync();requestAnimationFrame(draw)
}
window.addEventListener('resize',resize);resize();reset();draw();
})();
</script><script id="material-audio">/* Original procedural material sounds. No recordings or external resources. */
(()=>{'use strict';
const profile=4, C=window.AudioContext||window.webkitAudioContext;
const configurations=[
 ['sine',260,.18,'水滴 / 水流'],['triangle',520,.12,'字滴 / 风轨'],
 ['noise',1100,.22,'纸响 / 折页'],['sine',880,.3,'玻璃 / 拼接'],
 ['noise',620,.2,'纱摩擦 / 拉幅'],['noise',370,.23,'折纸 / 压痕'],
 ['triangle',190,.16,'刻版 / 隆起'],['sine',340,.25,'菌纹 / 生长'],
 ['triangle',640,.24,'枝叶 / 风'],['noise',1700,.25,'曝光 / 水洗']
];
const config=configurations[profile],button=document.querySelector('#mute'),qa=document.querySelector('#qa');
let ctx,master,analyser,noise,muted=false,unlocked=false,paused=false,drag=null,timer=null,last=0,voices=[],peakVoices=0,created=0,ended=0,events=0,errors=0,gestureCount=0,pointerHeld=false;
function ui(){if(button){button.textContent=muted?'开声音':'静音';button.setAttribute('aria-pressed',String(muted));button.setAttribute('aria-label',muted?'开启声音':'关闭声音');}if(qa){qa.dataset.audio='procedural-web-audio';qa.dataset.audioVoices=String(voices.length);qa.dataset.audioPeak=String(peakVoices);qa.dataset.audioMuted=String(muted);}}
function init(){if(ctx||!C)return;ctx=new C();master=ctx.createGain();master.gain.value=muted?0:.16;analyser=ctx.createAnalyser();analyser.fftSize=2048;master.connect(analyser);analyser.connect(ctx.destination);noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const data=noise.getChannelData(0);let seed=1234567+profile*71;for(let i=0;i<data.length;i++){seed=(Math.imul(seed,1664525)+1013904223)|0;data[i]=((seed>>>0)/4294967296*2-1);}created+=2;}
function clean(v){if(v.done)return;v.done=true;for(const n of v.nodes){try{n.disconnect();}catch{}}voices=voices.filter(x=>x!==v);ended+=v.nodes.length;ui();}
function stop(){for(const v of [...voices]){try{v.source.stop();}catch{}clean(v);}if(timer){clearInterval(timer);timer=null;}drag=null;ui();}
async function unlock(e){if(!e.isTrusted||!C)return;try{init();paused=false;await ctx.resume();unlocked=true;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(muted?0:.16,ctx.currentTime);ui();}catch{errors++;}}
function note(detail={}){if(!ctx||!unlocked||muted||paused||ctx.state!=='running')return;const now=performance.now();if(now-last<65)return;last=now;if(voices.length>=6){const oldest=voices[0];try{oldest.source.stop();}catch{}clean(oldest);}const t=ctx.currentTime,energy=Math.max(.08,Math.min(1,Number(detail.energy)||.4)),x=Math.max(0,Math.min(1,Number(detail.x)||.5)),y=Math.max(0,Math.min(1,Number(detail.y)||.5));let hash=0;for(const c of String(detail.kind||'touch'))hash=(hash*31+c.charCodeAt(0))>>>0;
const source=config[0]==='noise'?ctx.createBufferSource():ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain(),pan=ctx.createStereoPanner(),duration=config[2]+energy*.14;const pitch=config[1]*Math.pow(2,((hash%7)-3)/12)*(1.1-y*.25);
if(config[0]==='noise'){source.buffer=noise;source.playbackRate.value=.6+energy*.8;filter.type='bandpass';filter.Q.value=profile===4?2:1;filter.frequency.setValueAtTime(pitch*(1+energy),t);filter.frequency.exponentialRampToValueAtTime(Math.max(90,pitch*.55),t+duration);}else{source.type=config[0];source.frequency.setValueAtTime(pitch,t);source.frequency.exponentialRampToValueAtTime(pitch*(profile===0?.6:profile===3?1:.86),t+duration);filter.type='lowpass';filter.frequency.value=2400;}
gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.12+energy*.2,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);pan.pan.value=(x-.5)*1.25;source.connect(filter);filter.connect(gain);gain.connect(pan);pan.connect(master);const v={source,nodes:[source,filter,gain,pan],done:false};voices.push(v);created+=4;peakVoices=Math.max(peakVoices,voices.length);source.onended=()=>clean(v);source.start(t);source.stop(t+duration+.02);events++;ui();}
function position(e){const r=document.querySelector('#art').getBoundingClientRect();return{x:(e.clientX-r.x)/r.width,y:(e.clientY-r.y)/r.height};}
document.addEventListener('pointerdown',e=>{if(!e.isTrusted)return;pointerHeld=true;gestureCount++;const target=e.target,canvas=target.closest?.('#art'),control=target.closest?.('button,input');unlock(e).then(()=>{if(paused||document.hidden)return;if(canvas){const p=position(e);note({...p,energy:.45,kind:'canvas-'+(document.querySelector('button.active,button[aria-pressed="true"]')?.id||'draw')});if(pointerHeld){drag={...p,energy:.18};if(timer)clearInterval(timer);timer=setInterval(()=>{if(drag)note({...drag,kind:'material-drag'});},130);}}else if(control&&control.id!=='mute'&&control.id!=='reset')note({kind:control.id||'control',energy:.3});});},true);
document.addEventListener('keydown',e=>{if(e.isTrusted&&['Enter',' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))unlock(e).then(()=>{if(!['mute','reset'].includes(e.target.id))note({kind:e.target.id||'key',energy:.25});});},true);
window.addEventListener('pointermove',e=>{if(!e.isTrusted||!drag)return;const p=position(e),speed=Math.hypot(p.x-drag.x,p.y-drag.y);drag={...p,energy:Math.min(1,.15+speed*18)};});
for(const type of ['pointerup','pointercancel'])window.addEventListener(type,()=>{pointerHeld=false;if(timer)clearInterval(timer);timer=null;drag=null;});
window.addEventListener('art-sound',e=>note(e.detail));
button?.addEventListener('click',()=>{muted=!muted;stop();if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(muted?0:.16,ctx.currentTime);if(!muted)ctx.resume().then(()=>note({kind:'sound-enable',energy:.4})).catch(()=>errors++);}ui();});
document.querySelector('#reset')?.addEventListener('click',()=>{stop();ui();});
function pause(){paused=true;stop();if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(0,ctx.currentTime);ctx.suspend().catch(()=>errors++);}ui();}
window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('pagehide',pause);
window.artAudio=Object.freeze({snapshot(){let rms=null,peak=null;if(analyser){const wave=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(wave);let sum=0;peak=0;for(const n of wave){sum+=n*n;peak=Math.max(peak,Math.abs(n));}rms=Math.sqrt(sum/wave.length);}return{profile:config[3],state:ctx?.state||'not-created',unlocked,muted,paused,rms,peak,voices:voices.length,peakVoices,nodeCount:ctx?2+voices.length*4:0,nodeCap:26,createdNodes:created,releasedNodes:ended,events,gestureCount,errors};}});ui();
})();
</script></body></html>
