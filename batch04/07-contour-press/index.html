<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浮洲刻版 · Contour Press</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e8e4d9;color:#183742;font-family:Georgia,'Songti SC',serif}body{display:flex;flex-direction:column;padding:18px 24px 14px;gap:12px}header{display:flex;justify-content:space-between;align-items:center}h1{font-weight:normal;letter-spacing:.09em;font-size:26px;margin:0}.eyebrow{font:10px sans-serif;letter-spacing:.25em;color:#67766c;margin-bottom:5px}.edition{font:11px sans-serif;letter-spacing:.12em;text-align:right;color:#67766c}.stage{position:relative;flex:1;min-height:150px;max-width:1100px;width:100%;margin:auto;background:#f8f0db;box-shadow:0 5px 25px #233b4022;border:1px solid #cbc4af;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}.legend{pointer-events:none;position:absolute;bottom:14px;left:22px;font:10px sans-serif;letter-spacing:.15em;color:#faf1d9;background:#123b4ecc;padding:7px 10px}.toolbar{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}button{border:1px solid #9aa597;border-radius:3px;min-height:44px;background:#f3efdf;color:#254246;padding:8px 15px;font-size:13px;cursor:pointer}button.active{background:#244d58;color:#fff8e4;border-color:#244d58}button:focus-visible{outline:3px solid #d85e36;outline-offset:2px}#sound-status{opacity:.7;cursor:default}.help{margin:0;text-align:center;font:12px/1.6 sans-serif;color:#657167}.small{font-size:11px;color:#697568}#qa{display:none}@media(max-width:600px){body{padding:13px 11px 10px;gap:9px}h1{font-size:23px}.edition{font-size:9px}button{padding:8px 10px;flex:1 0 auto}.toolbar{gap:6px}.help{font-size:11px}.legend{left:12px;bottom:12px;font-size:9px}.stage{max-height:none}}.sound-status{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px;padding:0 8px;font:11px/1.5 system-ui,sans-serif;color:inherit;opacity:.65;cursor:default;pointer-events:none;white-space:nowrap;border:0;background:none;}</style></head><body><header><div><div class="eyebrow">ISLANDS / RELIEF STUDIO 07</div><h1>浮洲刻版</h1></div><div class="edition">CONTOUR PRESS<br><span id="status">第一张地形版</span></div></header><div class="stage"><canvas id="art" aria-label="拖动雕刻或堆积地形"></canvas><div class="legend">BLUE = WATER · OCHRE = HEIGHT</div></div><div class="toolbar" aria-label="刻版工具"><button id="carve" class="active">① 雕刻</button><button id="raise">② 堆积</button><button id="smooth">③ 揉平</button><button id="tide">涨潮</button><button id="register">错版</button><button id="print">压印</button><button id="reset">重新开版</button><span id="sound-status" class="sound-status">无声作品</span></div><p class="help">按住画面慢慢走刀；堆出群岛，再雕刻海峡。涨潮会露出不同层线，错版后压印留下彩色套印。</p><div id="qa" data-frames="0" data-inputs="0" data-resets="0" data-bounded="true" data-audio="none"></div><script>
(()=>{'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),qa=document.getElementById('qa'),status=document.getElementById('status');const W=192,H=152,N=W*H,field=new Float32Array(N),initial=new Float32Array(N);const off=document.createElement('canvas');off.width=W;off.height=H;const ox=off.getContext('2d'),pix=ox.createImageData(W,H);let cw=800,ch=650,dpr=1,tool='carve',tideIndex=0,mis=false,pressed=false,dirty=true,pointer=null,frames=0,inputs=0,resets=0,last=0,phase=0;const tides=[.13,.25,.37,.06],pal=['#14465a','#286777','#6d9991','#ced0a0','#e5cb85','#d7a951','#c97b40','#ac5138','#7e3e35'];const rgba=pal.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);const grain=[];let seed=7427;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<3400;i++)grain.push([rand(),rand(),rand()]);function build(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let u=x/W,v=y/H;let z=-.02;const peaks=[[.32,.39,.76,.17,.24],[.66,.57,.77,.21,.18],[.69,.21,.38,.10,.12],[.16,.77,.32,.09,.1]];for(const [a,b,k,s,t]of peaks)z+=k*Math.exp(-((u-a)**2/(s*s)+(v-b)**2/(t*t)));z+=.055*Math.sin(u*25+Math.sin(v*17))*Math.sin(v*28+u*4);field[y*W+x]=Math.max(-.15,Math.min(1.2,z))}initial.set(field);dirty=true}
function resize(){const r=canvas.getBoundingClientRect();cw=r.width;ch=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);dirty=true}new ResizeObserver(resize).observe(canvas);
function location(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}function stroke(p,power=1){const radius=tool==='smooth'?8:6,rr=radius*radius;const x0=Math.max(1,Math.floor(p.x-radius)),x1=Math.min(W-2,Math.ceil(p.x+radius)),y0=Math.max(1,Math.floor(p.y-radius)),y1=Math.min(H-2,Math.ceil(p.y+radius));for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){let d=((x-p.x)**2+(y-p.y)**2)/rr;if(d>1)continue;const i=y*W+x,a=(1-d)**2*power;if(tool==='smooth')field[i]+=(.25*(field[i-1]+field[i+1]+field[i-W]+field[i+W])-field[i])*.32*a;else field[i]=Math.max(-.15,Math.min(1.2,field[i]+(tool==='raise'?1:-1)*.029*a))}if(pressed){pressed=false;document.getElementById('print').classList.remove('active')}dirty=true}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer={...location(e),id:e.pointerId};stroke(pointer,2);inputs++;qa.dataset.inputs=inputs});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=location(e),dx=p.x-pointer.x,dy=p.y-pointer.y,steps=Math.min(32,Math.max(1,Math.ceil(Math.hypot(dx,dy)/2)));for(let j=1;j<=steps;j++)stroke({x:pointer.x+dx*j/steps,y:pointer.y+dy*j/steps},.65);pointer={...p,id:e.pointerId};inputs++;qa.dataset.inputs=inputs});function release(e){if(pointer&&pointer.id===e.pointerId)pointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',()=>pointer=null);
function select(t){tool=t;['carve','raise','smooth'].forEach(id=>document.getElementById(id).classList.toggle('active',id===t));status.textContent=t==='carve'?'走刀 · 拓出海峡':t==='raise'?'堆积 · 抬升群岛':'揉平 · 柔化断层';inputs++;qa.dataset.inputs=inputs}['carve','raise','smooth'].forEach(id=>document.getElementById(id).onclick=()=>select(id));document.getElementById('tide').onclick=()=>{tideIndex=(tideIndex+1)%tides.length;status.textContent='潮位 '+(tideIndex+1)+' / 4';dirty=true;inputs++;qa.dataset.inputs=inputs};document.getElementById('register').onclick=()=>{mis=!mis;document.getElementById('register').classList.toggle('active',mis);dirty=true;inputs++;qa.dataset.inputs=inputs};document.getElementById('print').onclick=()=>{pressed=!pressed;document.getElementById('print').classList.toggle('active',pressed);status.textContent=pressed?'套印完成 · 继续刻画可返版':'重新进入刻版';dirty=true;inputs++;qa.dataset.inputs=inputs};document.getElementById('reset').onclick=()=>{field.set(initial);tideIndex=0;mis=false;pressed=false;pointer=null;['print','register'].forEach(id=>document.getElementById(id).classList.remove('active'));status.textContent='第一张地形版';inputs++;qa.dataset.inputs=inputs;resets++;qa.dataset.resets=resets;dirty=true};document.addEventListener('keydown',e=>{if(e.key==='1')select('carve');if(e.key==='2')select('raise');if(e.key==='3')select('smooth')});
function drawContours(level,color,shift=0){ctx.strokeStyle=color;ctx.lineWidth=pressed?1.1:.8;ctx.beginPath();const sx=cw/W,sy=ch/H;for(let y=0;y<H-2;y+=2)for(let x=0;x<W-2;x+=2){const i=y*W+x,a=field[i],b=field[i+2],c=field[i+2+W*2],d=field[i+W*2],points=[];function cross(v1,v2,ax,ay,bx,by){if((v1<level)!==(v2<level)){let t=(level-v1)/(v2-v1);points.push([(ax+(bx-ax)*t)*sx+shift,(ay+(by-ay)*t)*sy])}}cross(a,b,x,y,x+2,y);cross(b,c,x+2,y,x+2,y+2);cross(c,d,x+2,y+2,x,y+2);cross(d,a,x,y+2,x,y);for(let k=0;k+1<points.length;k+=2){ctx.moveTo(points[k][0],points[k][1]);ctx.lineTo(points[k+1][0],points[k+1][1])}}ctx.stroke()}
function draw(){const tide=tides[tideIndex];for(let i=0;i<N;i++){const z=field[i]-tide;let band=z<0?Math.max(0,1+Math.floor(z/.14)):Math.min(8,2+Math.floor(z/.11));let c=rgba[band];const p=i*4,v=((i*17)%23-11)*.17;pix.data[p]=c[0]+v;pix.data[p+1]=c[1]+v;pix.data[p+2]=c[2]+v;pix.data[p+3]=255}ox.putImageData(pix,0,0);ctx.fillStyle='#f7eed6';ctx.fillRect(0,0,cw,ch);ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,cw,ch);for(let l=tide;l<=1.18;l+=.055){if(mis)drawContours(l,'#dd452a99',pressed?4:2.5);drawContours(l,l===tide?'#f8eac1':'#183b4680',0)}ctx.globalAlpha=pressed?.3:.16;for(const [x,y,k]of grain){ctx.fillStyle=k>.52?'#fff6dc':'#193c43';ctx.fillRect(x*cw,y*ch,k>.7?1.7:1,1)}ctx.globalAlpha=1;ctx.strokeStyle='#f5e8ba85';ctx.lineWidth=1;ctx.strokeRect(12,12,cw-24,ch-24);ctx.fillStyle='#f8e6b9';ctx.font='italic 12px Georgia';ctx.fillText('Archipelago / '+['low water','rising sea','high tide','ebb'][tideIndex],26,34);ctx.font='9px sans-serif';ctx.fillText('PLATE 07   —   HAND CARVED TOPOGRAPHY',26,51);ctx.restore();dirty=false}
function loop(t){requestAnimationFrame(loop);if(document.hidden){last=t;return}if(t-last<33)return;last=t;frames++;qa.dataset.frames=frames;qa.dataset.cells=N;qa.dataset.bounded='true';if(pointer)stroke(pointer,.4);if(dirty)draw();if(pointer){ctx.save();ctx.strokeStyle=tool==='carve'?'#fff2c6aa':'#ea6338aa';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(pointer.x/W*cw,pointer.y/H*ch,6/W*cw,6/H*ch,0,0,Math.PI*2);ctx.stroke();ctx.restore();dirty=true}phase++}build();resize();requestAnimationFrame(loop);
})();
