<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨窗夜刊</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>AFTER RAIN • CITY LETTER</small><h1>雨窗夜刊</h1></div><nav><button id="mute" aria-pressed="false">静音</button><button id="reset">重新开始</button></nav></header><p>窗外是原创霓虹小城。擦开水雾，移动窗格与推开窗扇，让城市的光穿过雨滴，留下自己的夜景构图。</p><div class="tools"><button id="wipe">擦去水雾</button><button id="frame">移动窗格</button><button id="open">推开 / 合窗</button><button id="neon">霓虹轮值</button><button id="hour">午夜 / 蓝调</button></div><canvas id="art" aria-label="雨窗夜刊交互画布"></canvas><div class="note"><p id="hint">擦雾模式拖动玻璃留下透明轨迹；窗格模式横向拖动分格；开窗、霓虹与时段可以任意组合。</p><span class="status">B • 15 / ORIGINAL STUDY</span></div><details><summary>玩法 · 来源与许可</summary><p>擦雾模式拖动玻璃留下透明轨迹；窗格模式横向拖动分格；开窗、霓虹与时段可以任意组合。 每件均为原创程序绘制和生成音乐。参考仅用于研究构图与物性，未复制图片、角色、录音或第三方美术。<a href="https://www.saulleiterfoundation.org/color" target="_blank" rel="noreferrer">参考来源</a>的内容仍归其权利人所有。原创部分未附公开许可，也不承诺独占版权。</p></details></main><script src="audio.js"></script><script src="art.js"></script></body></html>
