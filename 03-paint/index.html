<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Liquid Choir — Little Worlds</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5efe3;color:#303847;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(26px,env(safe-area-inset-top));left:7%;right:7%;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.65}h1{font-size:clamp(27px,5vw,46px);font-weight:500;letter-spacing:-1.5px;margin:12px 0 0}.tools{position:absolute;right:0;top:0;display:flex;gap:8px;pointer-events:auto}button{border:1px solid currentColor;border-radius:30px;color:inherit;background:#f5efe3;font:10px Arial;letter-spacing:1px;padding:10px 12px;cursor:pointer;min-height:38px}button:focus-visible{outline:3px solid currentColor;outline-offset:3px}footer{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:7%;right:7%;font-size:11px;letter-spacing:.6px;pointer-events:none;line-height:1.7}.num{float:right;opacity:.45}@media(max-width:480px){header{top:max(24px,env(safe-area-inset-top))}.tools{top:74px}}</style></head><body><canvas id="art" aria-label="Liquid Choir interactive canvas"></canvas><header><div class="eyebrow">Little Worlds / Paint in motion</div><h1>Liquid Choir</h1><div class="tools"><button id="mute" aria-label="Toggle sound" aria-pressed="false">SOUND ON</button><button id="reset" aria-label="Reset artwork">RESET</button></div></header><footer>Ink / whirl / comb. Close a loop to mix pigments.<span class="num">03</span></footer><script>const c=document.getElementById('art'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,D=1,muted=false,ac=null,interactions=0,resets=0;function unlock(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});}function tone(f,d=.18,v=.045,type='sine'){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(v,ac.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02);}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'SOUND OFF':'SOUND ON';document.getElementById('mute').setAttribute('aria-pressed',String(muted));};function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}size();

const palette=['#e86649','#5165ba','#e3b636','#378c86'];let dots=[],down=false,pointer={x:.5,y:.5},color=0,t=0,last=0,strokes=0,mode='ink',path=[],whirls=0,combs=0,mixes=0,toolChanges=0,hold=0,emission=0,gestureMoved=0,message='Draw. Stir. Comb. Draw again.';
const toolbar=document.createElement('div');toolbar.style.cssText='position:absolute;left:7%;top:158px;display:flex;gap:8px';for(const m of ['ink','whirl','comb']){let b=document.createElement('button');b.id='tool-'+m;b.textContent=m.toUpperCase();b.onclick=()=>{unlock();mode=m;toolChanges++;sync();};toolbar.appendChild(b);}document.body.appendChild(toolbar);function sync(){for(const b of toolbar.children){let on=b.id==='tool-'+mode;b.style.background=on?'#303847':'#f5efe3';b.style.color=on?'#f5efe3':'#303847';b.setAttribute('aria-pressed',String(on));}}sync();
function add(x,y,n=1){for(let i=0;i<n;i++)dots.push({x:x+(Math.random()-.5)*.024,y:y+(Math.random()-.5)*.012,r:.009+Math.random()*.016,col:palette[color],a:Math.random()*6.28,stretch:1,mixed:false});if(dots.length>900)dots.splice(0,dots.length-900);}
function init(){dots=[];down=false;strokes=whirls=combs=mixes=toolChanges=0;color=0;mode='ink';sync();for(let i=0;i<3;i++){color=i;for(let j=0;j<55;j++){let a=j*.16;add(.35+i*.15+Math.cos(a)*.05,.53+Math.sin(a)*.08);}}color=0;message='Draw. Stir. Comb. Draw again.';}init();
function affect(q,dt,dx=0,dy=0){let count=0;for(const d of dots){let x=d.x-q.x,y=(d.y-q.y)*H/W,r=Math.hypot(x,y);if(r>.27)continue;let f=Math.pow(1-r/.27,2);if(mode==='whirl'){let a=f*dt*5,co=Math.cos(a),si=Math.sin(a);d.x=q.x+x*co-y*si;d.y=q.y+(x*si+y*co)*W/H;d.a+=a;d.stretch=Math.min(2.5,d.stretch+dt*f); }else if(mode==='comb'){d.x+=dx*f*.8;d.y+=dy*f*.8;d.a=Math.atan2(dy*H,dx*W);d.stretch=Math.min(4,d.stretch+Math.hypot(dx,dy)*25*f);}d.x=Math.max(.025,Math.min(.975,d.x));d.y=Math.max(.26,Math.min(.88,d.y));count++;}return count;}
function inside(p,poly){let hit=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))hit=!hit;}return hit;}
function mixLoop(){if(path.length<10||gestureMoved<.35||Math.hypot(path[0].x-pointer.x,path[0].y-pointer.y)>.075)return;let chosen=dots.filter(d=>inside(d,path));if(chosen.length<3)return;let cols=[...new Set(chosen.map(d=>d.col))];if(cols.length<2)return;let rgb=[1,3,5].map(i=>Math.round(cols.reduce((sum,v)=>sum+parseInt(v.slice(i,i+2),16),0)/cols.length));let col='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');chosen.forEach((d,i)=>{d.col=i%3===0?palette[color]:col;d.mixed=true;d.stretch=1.8;d.a+=Math.PI/4;});mixes++;message='A closed loop makes a new pigment';tone(660,.5,.035,'triangle');}
c.onpointerdown=e=>{if(down)return;e.preventDefault();unlock();let q=pos(e);if(q.y<.25||q.y>.88)return;c.setPointerCapture(e.pointerId);down=e.pointerId;pointer=q;path=[q];hold=0;emission=0;gestureMoved=0;strokes++;interactions++;if(mode==='ink'){add(q.x,q.y,5);message='Close a loop around two colors to mix';}if(mode==='whirl'){whirls++;message='Hold to twist · drag to move the current';}if(mode==='comb'){combs++;message='Pull pigment into layered ribbons';}tone([196,247,294,370][color],.3,.035,'triangle');};
c.onpointermove=e=>{if(down!==e.pointerId)return;let q=pos(e);q.y=Math.max(.26,Math.min(.88,q.y));let dx=q.x-pointer.x,dy=q.y-pointer.y,d=Math.hypot(dx*W,dy*H),n=Math.min(45,Math.ceil(d/5));gestureMoved+=Math.hypot(dx,dy);if(mode==='ink'){for(let i=0;i<n;i++)add(pointer.x+dx*i/Math.max(1,n),pointer.y+dy*i/Math.max(1,n));}else affect(q,.03,dx,dy);pointer=q;if(path.length<1500)path.push(q);};
function stop(e){if(down!==e.pointerId)return;if(mode==='ink'){mixLoop();color=(color+1)%4;}down=false;path=[];}c.onpointerup=stop;c.onpointercancel=stop;
document.getElementById('reset').onclick=()=>{unlock();init();resets++;};addEventListener('resize',size);
function draw(ms){let dt=Math.min((ms-last)/1000,.04)||.016;last=ms;t+=dt;if(down!==false){hold+=dt;emission+=dt;if(mode==='ink'&&emission>.07){add(pointer.x,pointer.y,2);emission=0;}if(mode==='whirl')affect(pointer,dt);if(Math.floor(hold*3)!==Math.floor((hold-dt)*3))tone([196,247,294,370][color]*(mode==='whirl'?1.5:1),.2,.015);}
ctx.fillStyle='#f5efe3';ctx.fillRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,H*.25,W,H*.63);ctx.clip();for(const d of dots){ctx.save();ctx.translate(d.x*W,d.y*H);ctx.rotate(d.a+Math.sin(t*.4+d.y*9)*.035);ctx.fillStyle=d.col;ctx.beginPath();ctx.ellipse(0,0,d.r*W*d.stretch,d.r*W/Math.sqrt(d.stretch),0,0,7);ctx.fill();if(d.mixed){ctx.strokeStyle='#f5efe3';ctx.globalAlpha=.3;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-d.r*W*d.stretch,0);ctx.lineTo(d.r*W*d.stretch,0);ctx.stroke();}ctx.restore();}ctx.restore();
if(down!==false){ctx.strokeStyle=palette[color];ctx.lineWidth=1.5;ctx.setLineDash([3,5]);ctx.beginPath();if(mode==='ink'){path.forEach((p,i)=>i?ctx.lineTo(p.x*W,p.y*H):ctx.moveTo(p.x*W,p.y*H));}else ctx.arc(pointer.x*W,pointer.y*H,mode==='whirl'?W*.14:26,0,7);ctx.stroke();ctx.setLineDash([]);if(mode==='comb'){for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(pointer.x*W-20,pointer.y*H+i*7);ctx.lineTo(pointer.x*W+20,pointer.y*H+i*7);ctx.stroke();}}}ctx.fillStyle=palette[color];ctx.beginPath();ctx.arc(W*.08,H*.915,5,0,7);ctx.fill();ctx.fillStyle='#676b70';ctx.font='10px Arial';ctx.fillText(message,W*.08+14,H*.915+3);requestAnimationFrame(draw);}requestAnimationFrame(draw);
window.__artTest={getState:()=>({particles:dots.length,strokes,painting:down!==false,color,mode,whirls,combs,mixes,toolChanges,mixedDots:dots.filter(d=>d.mixed).length,stretched:dots.filter(d=>d.stretch>1.5).length,interactions,resets,muted,audio:ac?ac.state:'locked',width:W,height:H}),geometry:()=>({pool:{x:W*.5,y:H*.53},tools:['tool-ink','tool-whirl','tool-comb']}),actions:'INK draw/hold; release switches pigment. Close loop around two colors to mix. WHIRL hold/drag existing pigment; COMB drag pigment to stretch layered ribbons; combine all tools on same persistent painting.'};

</script></body></html>
