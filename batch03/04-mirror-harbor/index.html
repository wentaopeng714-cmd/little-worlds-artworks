<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mirror Harbor</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060b20;color:#f7ecd7;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(24px,env(safe-area-inset-top));left:26px;pointer-events:none}h1{font:400 20px Georgia,serif;letter-spacing:.06em;margin:0 0 7px}header p{font-size:12px;letter-spacing:.14em;opacity:.6;margin:0;text-transform:uppercase}.ui{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);padding:7px;background:#0b1128cf;border:1px solid #becce322;border-radius:14px;display:flex;gap:3px;flex-wrap:wrap;justify-content:center;backdrop-filter:blur(18px)}button{min-width:52px;min-height:44px;border:0;border-radius:9px;background:transparent;color:#c0c8d6;font-size:12px;padding:8px 12px;cursor:pointer}button:hover,button:focus-visible{outline:1px solid #eec98e;color:#fff}button[aria-pressed=true]{background:#e5b77822;color:#f3d7a5}.hint{position:fixed;bottom:88px;left:0;width:100%;text-align:center;pointer-events:none;font-size:12px;letter-spacing:.12em;color:#c3cce677}#qa{display:none}@media(max-width:600px){header{left:22px;top:25px}h1{font-size:18px}.ui{bottom:max(16px,env(safe-area-inset-bottom));padding:5px;gap:0;width:calc(100% - 28px)}button{padding:5px 9px;min-width:46px}.hint{bottom:120px;font-size:12px;letter-spacing:.07em}}
</style></head><body><canvas id="art" aria-label="Luminous architectural islands reflected in an interactive indigo sea"></canvas><header><h1>Mirror Harbor</h1><p>an architecture of tides</p></header><div class="hint" id="hint">DRAW ABOVE • STIR BELOW • HOLD TO RAISE</div><nav class="ui" aria-label="Artwork controls"><button id="build" aria-pressed="true">Build</button><button id="erase" aria-pressed="false">Erase</button><button id="wind">Wind · I</button><button id="level">Water · Mid</button><button id="tide">Blue hour</button><button id="reset">Reset</button><button id="mute" aria-pressed="true">Sound off</button></nav><div id="qa" aria-hidden="true"></div><script>
'use strict';
const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),scene=document.createElement('canvas'),s=scene.getContext('2d'),qa=document.querySelector('#qa');
let w=innerWidth,h=innerHeight,dpr=1,frames=0,fps=0,inputs=0,resets=0,last=performance.now(),count=0,stamp=last,t=0,mode='build',wind=0,level=1,tide=0,muted=true,ac=null,lastSound=0,voices=0,pointer=null,hold=0,lastAdd=0;
let islands=[],ripples=[];const levels=[.51,.59,.67],colors=[['#080c22','#142b46','#f5c784','#ff7854','#69cbd0'],['#231229','#4c344b','#ffcf91','#fc8466','#d7a4b8'],['#041b24','#12414a','#e8d9ae','#f89658','#71ead1']];
function sound(f=180){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();if(ac.state!=='running'||voices>=4||performance.now()-lastSound<130)return;lastSound=performance.now();voices++;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,ac.currentTime+.5);g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.035,ac.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.7);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.75);o.onended=()=>voices--}catch{}}
function add(x,y,strength=1){if(islands.length>=48)islands.shift();let ny=Math.min(levels[level]-.055,Math.max(.16,y/h));islands.push({x:x/w,y:ny,size:(.025+Math.random()*.018)*strength,seed:Math.random()*100,height:.045+Math.random()*.07,blocks:3+Math.floor(Math.random()*5),accent:Math.random()>.5,age:0});sound(140+ny*340)}
function seed(){islands=[];const pts=[[.12,.44,.75],[.25,.38,1.05],[.42,.33,1.3],[.63,.39,1.05],[.81,.45,.9],[.54,.46,.65],[.31,.48,.7]];pts.forEach(([x,y,z])=>add(x*w,y*h,z));ripples=[]}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);scene.width=canvas.width;scene.height=canvas.height;ctx.setTransform(dpr,0,0,dpr,0,0);s.setTransform(dpr,0,0,dpr,0,0)}resize();seed();
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function disturb(x,y,v=1){ripples.push({x:x/w,y:y/h,age:0,power:Math.min(3,v)});if(ripples.length>24)ripples.shift();sound(80+Math.random()*100)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);inputs++;let p=point(e);pointer={...p,px:p.x,py:p.y,at:performance.now(),id:e.pointerId};hold=0;lastAdd=0;if(p.y>h*levels[level])disturb(p.x,p.y,2);else if(mode==='build')add(p.x,p.y);else erase(p.x,p.y)});
function erase(x,y){islands=islands.filter(a=>Math.hypot((a.x*w-x),(a.y*h-y))>Math.max(55,w*.08))}
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;inputs++;let p=point(e),speed=Math.hypot(p.x-pointer.x,p.y-pointer.y);pointer.px=pointer.x;pointer.py=pointer.y;pointer.x=p.x;pointer.y=p.y;if(p.y>h*levels[level])disturb(p.x,p.y,speed/12+.5);else if(mode==='erase')erase(p.x,p.y);else if(performance.now()-lastAdd>170&&speed>3){add(p.x,p.y,.75);lastAdd=performance.now()}});
function release(e){if(!pointer||e.pointerId!==pointer.id)return;pointer=null;hold=0}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
document.querySelector('#build').onclick=()=>{mode='build';document.querySelector('#build').setAttribute('aria-pressed','true');document.querySelector('#erase').setAttribute('aria-pressed','false');inputs++};document.querySelector('#erase').onclick=()=>{mode='erase';document.querySelector('#erase').setAttribute('aria-pressed','true');document.querySelector('#build').setAttribute('aria-pressed','false');inputs++};
document.querySelector('#wind').onclick=e=>{wind=(wind+1)%3;e.currentTarget.textContent=['Wind · I','Wind · II','Wind · III'][wind];inputs++;sound(220+wind*70)};document.querySelector('#level').onclick=e=>{level=(level+1)%3;e.currentTarget.textContent=['Water · Low','Water · Mid','Water · High'][level];inputs++;islands.forEach(a=>a.y=Math.min(a.y,levels[level]-.065));disturb(w/2,h*levels[level]+40,3)};document.querySelector('#tide').onclick=e=>{tide=(tide+1)%3;e.currentTarget.textContent=['Blue hour','Rose dusk','Jade night'][tide];inputs++;sound(260+tide*60)};
document.querySelector('#reset').onclick=()=>{resets++;inputs++;seed()};document.querySelector('#mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'Sound off':'Sound on';e.currentTarget.setAttribute('aria-pressed',String(muted));inputs++;if(muted)ac?.suspend();else sound(240)};addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)ac?.suspend();else if(!muted)ac?.resume()});
function architecture(a,dt){a.age+=dt;const base=Math.min(w,h)*a.size*2.2,x=a.x*w,y=a.y*h+Math.sin(t*.4+a.seed)*2,height=a.height*h;const [,,gold,red,green]=colors[tide];s.save();s.translate(x,y);s.shadowBlur=27;s.shadowColor=green+'88';s.fillStyle='#0a1828';s.beginPath();s.moveTo(-base*1.4,3);s.lineTo(base*1.45,3);s.lineTo(base,12);s.lineTo(-base*.9,12);s.closePath();s.fill();s.shadowBlur=0;s.strokeStyle=gold+'cc';s.lineWidth=.6;s.beginPath();s.moveTo(-base*1.4,3);s.lineTo(base*1.45,3);s.stroke();for(let j=0;j<a.blocks;j++){let bw=base*(.5+((Math.sin(a.seed+j*3)+1)*.33)),bx=Math.sin(j*2+a.seed)*base*.57,by=-j*height/a.blocks,bh=height/a.blocks*.78;s.fillStyle=j%3===0?'#3d6671':'#2a415b';s.fillRect(bx-bw/2,by-bh,bw,bh);s.fillStyle=(j%3===0?red:gold)+'ee';s.fillRect(bx-bw/2,by-bh,bw,1.3);s.fillStyle=green+'aa';s.fillRect(bx+bw/2-1.2,by-bh,1.2,bh);s.fillStyle=gold+'ee';for(let k=0;k<Math.ceil(bw/7);k++){if(Math.sin(a.seed+j*3+k)>-.3)s.fillRect(bx-bw*.4+k*6,by-bh*.55,2,3.5)}}s.strokeStyle=gold+'aa';s.beginPath();s.moveTo(0,-height*.94);s.lineTo(0,-height*1.16);s.stroke();s.fillStyle=red;s.beginPath();s.arc(0,-height*1.16,1.7,0,Math.PI*2);s.fill();s.restore()}
function render(now){requestAnimationFrame(render);if(document.hidden)return;const dt=Math.min((now-last)/1000,.04);last=now;t+=dt;frames++;count++;if(now-stamp>1000){fps=count*1000/(now-stamp);stamp=now;count=0;Object.assign(qa.dataset,{frames:String(frames),fps:fps.toFixed(1),entities:String(islands.length+ripples.length),inputs:String(inputs),resets:String(resets),muted:String(muted),width:String(w),height:String(h),audio:ac?.state||'uninitialized'})}let horizon=h*levels[level],p=colors[tide];let bg=s.createLinearGradient(0,0,0,horizon);bg.addColorStop(0,p[0]);bg.addColorStop(1,p[1]);s.fillStyle=bg;s.fillRect(0,0,w,h);let glow=s.createRadialGradient(w*.55,horizon*.64,1,w*.55,horizon*.64,w*.55);glow.addColorStop(0,p[4]+'14');glow.addColorStop(1,'transparent');s.fillStyle=glow;s.fillRect(0,0,w,horizon);s.strokeStyle=p[2]+'18';s.lineWidth=.7;for(let i=0;i<5;i++){s.beginPath();s.ellipse(w*.53,horizon*.67,w*(.22+i*.065),h*(.033+i*.016),-.1,Math.PI,Math.PI*1.94);s.stroke()}islands.forEach(a=>architecture(a,dt));ctx.drawImage(scene,0,0,w,h);ctx.save();ctx.beginPath();ctx.rect(0,horizon,w,h-horizon);ctx.clip();ctx.fillStyle=p[0];ctx.fillRect(0,horizon,w,h-horizon);for(let y=horizon;y<h;y+=4){let source=horizon-(y-horizon)*.8;let dist=(y-horizon)/(h-horizon),offset=Math.sin(y*.052-t*(.7+wind*.55))*((7+wind*7)*(dist+.25));ripples.forEach(r=>{let dy=(y/h-r.y)*h,rr=r.age*100;offset+=Math.sin((Math.abs(dy)-rr)*.09)*Math.exp(-Math.abs(Math.abs(dy)-rr)/75)*r.power*7*Math.exp(-r.age*.8)});ctx.globalAlpha=.88*(1-dist*.6);ctx.drawImage(scene,0,Math.max(0,source)*dpr,w*dpr,4*dpr,offset,y,w,5)}ctx.globalAlpha=1;let shade=ctx.createLinearGradient(0,horizon,0,h);shade.addColorStop(0,p[0]+'10');shade.addColorStop(1,p[0]+'b0');ctx.fillStyle=shade;ctx.fillRect(0,horizon,w,h-horizon);for(let i=0;i<44;i++){let y=horizon+(h-horizon)*i/44,phase=Math.sin(t*.7+i)*9;ctx.strokeStyle=p[i%5===0?2:4]+(i%5===0?'45':'16');ctx.lineWidth=.6;ctx.beginPath();for(let x=0;x<w;x+=14){let yy=y+Math.sin(x*.015+i+t*(.4+wind*.3))*(1+i*.1);x===0?ctx.moveTo(x+phase,yy):ctx.lineTo(x+phase,yy)}ctx.stroke()}ripples.forEach(r=>{r.age+=dt;ctx.strokeStyle=p[4]+Math.floor(80*Math.max(0,1-r.age/3)).toString(16).padStart(2,'0');ctx.beginPath();ctx.ellipse(r.x*w,r.y*h,r.age*90+10,r.age*18+3,0,0,Math.PI*2);ctx.stroke()});ripples=ripples.filter(r=>r.age<3);ctx.restore();ctx.strokeStyle=p[2]+'44';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(w,horizon);ctx.stroke();if(pointer&&mode==='build'&&pointer.y<horizon){hold+=dt;if(hold>.45){let a=islands[islands.length-1];if(a){a.height=Math.min(.24,a.height+dt*.02);a.blocks=Math.min(11,Math.floor(a.height/.016));}ctx.strokeStyle=p[2]+'55';ctx.beginPath();ctx.arc(pointer.x,pointer.y,13+Math.sin(t*3)*3,0,Math.PI*2);ctx.stroke()}}}requestAnimationFrame(render);
</script></body></html>
