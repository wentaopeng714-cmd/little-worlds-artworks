<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Thread garden</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#242433;color:#f4e9d3;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(26px,env(safe-area-inset-top));left:26px;pointer-events:none}small{font-size:10px;letter-spacing:3px}h1{font-size:clamp(30px,6vw,52px);font-weight:400;letter-spacing:-2px;margin:8px 0}header p{font-size:12px;line-height:1.65;opacity:.65;margin:0;max-width:250px}.tools{position:absolute;bottom:max(23px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;align-items:center;gap:9px}button{font:11px Arial;letter-spacing:1px;color:inherit;background:transparent;border:1px solid currentColor;border-radius:30px;min-height:42px;padding:0 17px;cursor:pointer}button:focus-visible{outline:3px solid #ff8748;outline-offset:3px}#hint{margin-left:auto;font-size:10px;letter-spacing:1px;opacity:.6;text-align:right;max-width:130px}#badge{position:absolute;right:24px;top:30px;border-top:1px solid currentColor;padding-top:8px;font-size:10px;letter-spacing:2px;opacity:.55}@media(max-width:600px){.tools{flex-wrap:wrap;gap:7px;left:16px;right:16px}button{padding:0 10px;font-size:9px}#hint{max-width:none;width:100%;font-size:9px;text-align:left}header{left:20px}#badge{display:none}}@media(max-height:500px){header{top:12px}h1{font-size:23px}header p{display:none}.tools{bottom:10px}#hint{display:none}}</style></head><body><canvas id="art" aria-label="Draw across circular pins to create a colorful woven string artwork"></canvas><header><small>LITTLE WORLDS / 10</small><h1>Thread garden</h1><p>Connect pins. Change the stitch.<br>Hold a pin to reshape. Brush to pluck.</p></header><span id="badge">STRING STUDY</span><div class="tools"><button id="stitch">STRAIGHT</button><button id="cut">SCISSORS</button><button id="mute" aria-pressed="true">SOUND ON</button><button id="reset">RESET</button><span id="hint">HOLD PIN TO MOVE · BRUSH TO PLUCK</span></div><script>'use strict';const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,D=1,muted=false,ac=null,interactions=0,resets=0,frame=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}function tone(f=220,d=.15,type='sine',vol=.08){if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(vol,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.01)}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'SOUND OFF':'SOUND ON';document.getElementById('mute').setAttribute('aria-pressed',String(!muted));tone(440)};function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function line(x,y,a,b,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}function disc(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}let threads=[],active=-1,down=false,pointer=null,sequence=0,pulses=[],stitch=0,cut=false,offsets=Array.from({length:24},()=>({x:0,y:0})),movedPins=0,cuts=0,plucks=0,holdTimer=null,editPin=-1;
const colors=['#f5b961','#e88892','#86cbb3','#969be5'],names=['STRAIGHT','ARC','LOOP'];
function reset(){threads=[];active=-1;down=false;pointer=null;sequence=0;pulses=[];offsets=Array.from({length:24},()=>({x:0,y:0}));movedPins=cuts=plucks=0;stitch=0;cut=false;editPin=-1;clearTimeout(holdTimer);document.getElementById('stitch').textContent='STRAIGHT';document.getElementById('cut').textContent='SCISSORS'}
function geo(){return{x:W*.5,y:H*.55,r:Math.min(W*.35,H*.25),pins:Array.from({length:24},(_,i)=>pin(i))}}
function pin(i){let r=Math.min(W*.35,H*.25),a=i/24*Math.PI*2-Math.PI/2;return{x:W*.5+Math.cos(a)*r+offsets[i].x*r,y:H*.55+Math.sin(a)*r+offsets[i].y*r}}
function nearest(p){let n=0,d=Infinity;for(let i=0;i<24;i++){let q=pin(i),dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<d){d=dd;n=i}}return{n,d}}
function connect(a,b){if(a===b)return;threads.push({a,b,c:colors[Math.floor(sequence/4)%4],mode:stitch,vib:1,seed:sequence});if(threads.length>180)threads.shift();sequence++;interactions++;pulses.push({n:b,r:0});tone([196,220,261.6,293.6,329.6,392,440,523.2][b%8],.3,'triangle',.035)}
function sample(s,u){let a=pin(s.a),b=pin(s.b),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,bend=s.mode===0?0:s.mode===1?Math.sin(u*Math.PI)*len*.24:Math.sin(u*Math.PI*2)*len*.22;let vib=Math.sin(u*Math.PI*5+frame*.3)*s.vib*8*Math.sin(u*Math.PI);return{x:a.x+dx*u-dy/len*(bend+vib),y:a.y+dy*u+dx/len*(bend+vib)}}
function touchThreads(p,erase){let hit=[];threads.forEach((s,i)=>{for(let k=1;k<30;k++){let q=sample(s,k/30);if(Math.hypot(p.x-q.x,p.y-q.y)<17){hit.push(i);break}}});if(erase){cuts+=hit.length;threads=threads.filter((s,i)=>!hit.includes(i));if(hit.length)tone(90,.1,'sawtooth',.025)}else{hit.forEach(i=>threads[i].vib=1.7);if(hit.length){plucks++;tone(160+hit.length*33,.25,'triangle',.04)}}if(hit.length)interactions++}
canvas.onpointerdown=e=>{unlock();canvas.setPointerCapture(e.pointerId);down=true;pointer=pos(e);pointer.start={...pointer};pointer.moved=false;let q=nearest(pointer);if(cut){touchThreads(pointer,true);active=-1;return}if(q.d<30){active=q.n;holdTimer=setTimeout(()=>{if(down&&pointer&&!pointer.moved){editPin=active;tone(110,.2);document.getElementById('hint').textContent='MOVE THIS PIN'}},420)}else{active=-1;touchThreads(pointer,false)}};
canvas.onpointermove=e=>{if(!down)return;let p=pos(e),q=nearest(p);if(Math.hypot(p.x-pointer.start.x,p.y-pointer.start.y)>5){pointer.moved=true;clearTimeout(holdTimer)}pointer.x=p.x;pointer.y=p.y;if(editPin>=0){let r=Math.min(W*.35,H*.25),a=editPin/24*Math.PI*2-Math.PI/2;offsets[editPin]={x:clamp((p.x-W*.5)/r-Math.cos(a),-1.4,1.4),y:clamp((p.y-H*.55)/r-Math.sin(a),-1.4,1.4)};movedPins++;threads.filter(s=>s.a===editPin||s.b===editPin).forEach(s=>s.vib=.7);return}if(cut){touchThreads(p,true);return}if(active<0){touchThreads(p,false);return}if(q.d<27&&q.n!==active){connect(active,q.n);active=q.n;pointer.moved=true}};
canvas.onpointerup=canvas.onpointercancel=()=>{clearTimeout(holdTimer);if(editPin>=0){tone(180,.3);editPin=-1}down=false;pointer=null;document.getElementById('hint').textContent='HOLD PIN TO MOVE · BRUSH TO PLUCK'};
function draw(dt,t){ctx.fillStyle='#242433';ctx.fillRect(0,0,W,H);let g=geo();ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let r=.25;r<=1;r+=.25){ctx.beginPath();ctx.arc(g.x,g.y,g.r*r,0,7);ctx.stroke()}threads.forEach(s=>{s.vib*=.965;ctx.strokeStyle=s.c+'ba';ctx.lineWidth=s.mode===2?1.6:1;ctx.beginPath();for(let k=0;k<=40;k++){let p=sample(s,k/40);if(k===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke()});if(down&&pointer&&active>=0&&editPin<0){let a=pin(active);line(a.x,a.y,pointer.x,pointer.y,'#f4e9d3',1.2)}for(let i=0;i<24;i++){let p=pin(i);disc(p.x,p.y,editPin===i?10:active===i?6:3,editPin===i?'#e88892':active===i?'#f5b961':'#f4e9d3');if(i%3===0){let x=g.x+(p.x-g.x)*1.13,y=g.y+(p.y-g.y)*1.13;ctx.fillStyle='#b7b2b0';ctx.font='9px Arial';ctx.textAlign='center';ctx.fillText(String(i+1).padStart(2,'0'),x,y+3)}}pulses.forEach(s=>{let p=pin(s.n);s.r+=dt*.8;ctx.strokeStyle='#f4e9d3'+Math.max(0,Math.floor((1-s.r/22)*150)).toString(16).padStart(2,'0');ctx.beginPath();ctx.arc(p.x,p.y,s.r+5,0,7);ctx.stroke()});pulses=pulses.filter(s=>s.r<22);if(!threads.length){ctx.fillStyle='#b7b2b0';ctx.font='italic 17px Georgia';ctx.textAlign='center';ctx.fillText('Trace from pin to pin.',g.x,g.y)}ctx.fillStyle='#b7b2b0';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(cut?'BRUSH A THREAD TO CUT':editPin>=0?'RESHAPE THE WHOLE WEAVE':names[stitch]+' STITCH · '+threads.length+' STRANDS',g.x,g.y+g.r+42);}
document.getElementById('stitch').onclick=()=>{unlock();stitch=(stitch+1)%3;document.getElementById('stitch').textContent=names[stitch];tone(220+stitch*110,.25)};document.getElementById('cut').onclick=()=>{unlock();cut=!cut;document.getElementById('cut').textContent=cut?'CUTTING':'SCISSORS';active=-1;tone(140,.1)};
function state(){return{threads:threads.length,activePin:active,weaves:sequence,stitch:names[stitch],cut,cuts,plucks,movedPins,modes:[...new Set(threads.map(s=>names[s.mode]))],geometry:geo()}}
document.getElementById('reset').onclick=()=>{unlock();reset();interactions=0;resets++;tone(130,.2)};window.__artTest={getState:()=>({title:document.title,interactions,resets,muted,audioState:ac?.state||'locked',width:W,height:H,...state()})};let prev=performance.now();function loop(t){const dt=Math.min((t-prev)/16.667,2);prev=t;frame++;draw(dt,t);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);</script></body></html>
