<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Velvet Nebula</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b2c;color:#efe8e2;font-family:system-ui,sans-serif}#art{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}header{position:fixed;top:26px;left:28px;pointer-events:none}h1{font-size:13px;font-weight:500;letter-spacing:.23em;margin:0 0 8px}header p{font-size:11px;color:#a7accd;letter-spacing:.05em;margin:0}#status{position:fixed;right:28px;top:28px;font-size:10px;letter-spacing:.12em;color:#abb1d4;pointer-events:none}.controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:min(650px,calc(100% - 28px));padding:8px;border:1px solid #8e99b729;border-radius:18px;background:#0b102ad9;backdrop-filter:blur(12px)}button{font:12px system-ui;letter-spacing:.04em;min-height:44px;padding:0 14px;border:1px solid #b3b5ef2b;border-radius:10px;color:#c7cae5;background:#23274899;cursor:pointer}button:focus-visible{outline:2px solid #fbc3ad;outline-offset:2px}button[aria-pressed=true]{border-color:#f1b09d99;color:#ffe4d5;background:#643f554d}button:hover{background:#343453}#qa{display:none}@media(max-width:500px){header{left:21px;top:23px}#status{right:21px;top:24px;font-size:9px}.controls{bottom:max(12px,env(safe-area-inset-bottom));gap:4px;padding:6px;width:calc(100% - 24px)}button{padding:0 10px;flex:1 0 58px}header p{font-size:10px}}
</style><canvas id="art" aria-label="Paint and sculpt a glowing fine-grained nebula"></canvas><header><h1>VELVET NEBULA</h1><p>Hold to breathe. Drag to shape the cloud.</p></header><div id="status">INJECT / CORAL</div><div class="controls" aria-label="Artwork controls"><button id="inject" aria-pressed="true">Inject</button><button id="sculpt" aria-pressed="false">Sculpt</button><button id="whirl" aria-pressed="false">Whirl</button><button id="palette">Coral</button><button id="exposure">Light 1</button><button id="seal" aria-pressed="false">Seal</button><button id="reset">Reset</button><button id="mute" aria-pressed="true">Sound off</button></div><output id="qa"></output><script>
(()=>{'use strict';const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),ink=document.createElement('canvas'),g=ink.getContext('2d'),back=document.createElement('canvas'),backCtx=back.getContext('2d'),glow=document.createElement('canvas'),glowCtx=glow.getContext('2d');const $=x=>document.getElementById(x),qa=$('qa');const colors=[{name:'Coral',h:[339,12,33]},{name:'Iris',h:[267,299,195]},{name:'Aurora',h:[160,189,42]}];let W=0,H=0,D=1,frames=0,fps=0,inputs=0,resets=0,muted=true,mode='inject',palette=0,exposure=0,sealed=false,particles=[],pointer=null,paused=false,lastT=performance.now(),audio=null,noiseNode=null,soundGain=null,filter=null,seed=888;const CAP=3200;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function gauss(){return Math.sqrt(-2*Math.log(Math.max(.000001,rand())))*Math.cos(6.283*rand())}function audioInit(){if(muted)return;try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();const b=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=b.getChannelData(0);let prev=0;for(let i=0;i<data.length;i++){prev=(prev+(Math.random()*2-1)*.018)/1.02;data[i]=prev*3}noiseNode=audio.createBufferSource();noiseNode.buffer=b;noiseNode.loop=true;filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=600;soundGain=audio.createGain();soundGain.gain.value=.018;noiseNode.connect(filter);filter.connect(soundGain);soundGain.connect(audio.destination);noiseNode.start()}if(audio.state==='suspended')audio.resume()}catch(e){}}
function cacheBackground(){back.width=Math.round(W*D);back.height=Math.round(H*D);backCtx.setTransform(D,0,0,D,0,0);backCtx.fillStyle='#060b29';backCtx.fillRect(0,0,W,H);const v=backCtx.createRadialGradient(W*.51,H*.43,0,W*.5,H*.5,Math.max(W,H)*.75);v.addColorStop(0,'#121a50');v.addColorStop(.55,'#0b113b');v.addColorStop(1,'#040822');backCtx.fillStyle=v;backCtx.fillRect(0,0,W,H);glow.width=Math.max(1,Math.ceil(W/7));glow.height=Math.max(1,Math.ceil(H/7));refreshGlow()}function refreshGlow(){glowCtx.clearRect(0,0,glow.width,glow.height);glowCtx.drawImage(ink,0,0,glow.width,glow.height)}function background(){ctx.globalCompositeOperation='source-over';ctx.drawImage(back,0,0,W,H)}
function particle(x,y,burst=1){const angle=rand()*Math.PI*2,r=rand()*.018;return{x:x+Math.cos(angle)*r,y:y+Math.sin(angle)*r,vx:Math.cos(angle)*.00045*burst,vy:Math.sin(angle)*.00045*burst,life:90+rand()*160,age:0,h:colors[palette].h[Math.floor(rand()*3)]+(rand()-.5)*12,phase:rand()*6.283,weight:.25+rand()*.65}}
function emit(){if(!pointer||sealed)return;const n=mode==='inject'?26:mode==='whirl'?17:0;for(let i=0;i<n&&particles.length<CAP;i++)particles.push(particle(pointer.x,pointer.y,mode==='whirl'?1.7:1));if(mode==='sculpt'){g.globalCompositeOperation='destination-out';const x=pointer.x*W,y=pointer.y*H,r=Math.min(W,H)*.062,grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,'rgba(0,0,0,.042)');grad.addColorStop(.6,'rgba(0,0,0,.025)');grad.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grad;g.fillRect(x-r,y-r,r*2,r*2)}}
function advance(step){g.globalCompositeOperation='screen';const time=frames*.002,scale=Math.min(W,H)/600,groups=new Map();for(let i=particles.length-1;i>=0;i--){const p=particles[i],px=p.x,py=p.y;const f1=Math.sin(p.x*15+Math.cos(p.y*13-time*2)+time+p.phase*.12),f2=Math.cos(p.y*14+Math.sin(p.x*12+time)+p.phase*.1);p.vx=p.vx*.97+f1*.000018*step;p.vy=p.vy*.97+f2*.000018*step;if(pointer&&!sealed){const dx=p.x-pointer.x,dy=p.y-pointer.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<.23){const force=(1-dist/.23)*.00008*step;if(mode==='whirl'){p.vx-=dy/(dist+.01)*force*2.3;p.vy+=dx/(dist+.01)*force*2.3}else if(mode==='sculpt'){p.vx+=dx/(dist+.01)*force*1.6+pointer.dx*.028;p.vy+=dy/(dist+.01)*force*1.6+pointer.dy*.028}}}p.x+=p.vx*step;p.y+=p.vy*step;p.age+=step;if(p.age>p.life||p.x<-.1||p.x>1.1||p.y<-.1||p.y>1.1){particles.splice(i,1);continue}const fade=Math.sin(Math.PI*p.age/p.life),hb=Math.round(p.h/12),fb=Math.min(2,Math.floor(fade*3)),wb=p.weight>.6?1:0,key=hb+'|'+fb+'|'+wb;let group=groups.get(key);if(!group){group={path:new Path2D(),h:hb*12,a:(.085+fb*.07)*(wb?1:.68),w:Math.max(.38,(wb?.85:.5)*scale)};groups.set(key,group)}group.path.moveTo(px*W,py*H);group.path.lineTo(p.x*W,p.y*H)}for(const group of groups.values()){g.strokeStyle=`hsla(${group.h},94%,70%,${group.a})`;g.lineWidth=group.w;g.stroke(group.path)}g.globalCompositeOperation='source-over'}
function starter(){seed=488381;particles=[];g.clearRect(0,0,W,H);const scale=Math.min(W,H)/600;g.globalCompositeOperation='screen';for(let i=0;i<25000;i++){const t=rand()*Math.PI*2,arm=i%4,r=.13+.065*Math.sin(t*2.1+arm*.55)+rand()*.065;let x=.5+Math.cos(t)*r+.085*Math.sin(t*1.7+arm*.19),y=.43+Math.sin(t)*r*.87+.055*Math.cos(t*1.5+arm*.3);const density=.25+.75*Math.pow(Math.sin(t*1.4+arm*.45),2);x+=gauss()*.012*density;y+=gauss()*.020*density;const hue=arm===0?14+rand()*20:arm===1?328+rand()*22:arm===2?268+rand()*24:190+rand()*24;const length=.013+rand()*.036,ang=t+1.57+.45*Math.sin(t*2.2+arm*.6),bend=Math.sin(t*3+arm)*.012;g.strokeStyle=`hsla(${hue},94%,${56+rand()*23}%,${.13+rand()*.22})`;g.lineWidth=Math.max(.4,(.6+rand()*.55)*scale);g.beginPath();g.moveTo(x*W,y*H);g.bezierCurveTo((x+Math.cos(ang)*length*.33)*W,(y+Math.sin(ang)*length*.33+bend)*H,(x+Math.cos(ang)*length*.7+bend)*W,(y+Math.sin(ang)*length*.7)*H,(x+Math.cos(ang)*length)*W,(y+Math.sin(ang)*length)*H);g.stroke()}g.globalCompositeOperation='source-over';for(let i=0;i<650;i++){const t=rand()*6.283,r=.15+rand()*.06;particles.push(particle(.5+Math.cos(t)*r+.07*Math.sin(t*1.7),.43+Math.sin(t)*r*.85,.5))}}
function resize(){let old=null;if(W){old=document.createElement('canvas');old.width=ink.width;old.height=ink.height;old.getContext('2d').drawImage(ink,0,0)}W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=ink.width=Math.round(W*D);canvas.height=ink.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);g.setTransform(D,0,0,D,0,0);if(old)g.drawImage(old,0,0,W,H);cacheBackground()}
canvas.addEventListener('pointerdown',e=>{inputs++;audioInit();canvas.setPointerCapture(e.pointerId);pointer={x:e.clientX/W,y:e.clientY/H,dx:0,dy:0};if(sealed){sealed=false;$('seal').setAttribute('aria-pressed','false');$('seal').textContent='Seal'}emit();advance(1)});canvas.addEventListener('pointermove',e=>{if(pointer){inputs++;const x=e.clientX/W,y=e.clientY/H,ox=pointer.x,oy=pointer.y,n=Math.min(16,Math.max(1,Math.ceil(Math.hypot((x-ox)*W,(y-oy)*H)/8)));pointer.dx=x-ox;pointer.dy=y-oy;for(let i=1;i<=n;i++){pointer.x=ox+(x-ox)*i/n;pointer.y=oy+(y-oy)*i/n;emit()}advance(1)}});function release(){pointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function frame(t){requestAnimationFrame(frame);if(paused){lastT=t;return}const step=Math.min(2,(t-lastT)/16.667);lastT=t;frames++;if(!sealed){emit();advance(step)}if(pointer){pointer.dx*=.75;pointer.dy*=.75;if(filter)filter.frequency.setTargetAtTime(250+pointer.y*1100,audio.currentTime,.12);if(soundGain&&!muted)soundGain.gain.setTargetAtTime(mode==='whirl'?.042:.028,audio.currentTime,.2)}else if(soundGain&&!muted)soundGain.gain.setTargetAtTime(.012,audio.currentTime,.4);background();ctx.globalCompositeOperation='screen';ctx.globalAlpha=[.9,1,.65][exposure];if(frames%6===0)refreshGlow();ctx.drawImage(glow,0,0,W,H);ctx.globalAlpha=[.88,1,.68][exposure];ctx.drawImage(ink,0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function update(){$('status').textContent=mode.toUpperCase()+' / '+colors[palette].name.toUpperCase();$('palette').textContent=colors[palette].name}for(const m of['inject','sculpt','whirl'])$(m).onclick=()=>{inputs++;mode=m;for(const n of['inject','sculpt','whirl'])$(n).setAttribute('aria-pressed',String(n===m));update()};$('palette').onclick=()=>{inputs++;palette=(palette+1)%3;update()};$('exposure').onclick=()=>{inputs++;exposure=(exposure+1)%3;$('exposure').textContent='Light '+(exposure+1)};$('seal').onclick=()=>{inputs++;sealed=!sealed;$('seal').setAttribute('aria-pressed',String(sealed));$('seal').textContent=sealed?'Unseal':'Seal'};let lastReset=0;$('reset').title='Clear canvas. Double tap for starter.';$('reset').onclick=()=>{inputs++;resets++;release();sealed=false;$('seal').setAttribute('aria-pressed','false');$('seal').textContent='Seal';if(performance.now()-lastReset<700)starter();else{particles=[];g.clearRect(0,0,W,H)}lastReset=performance.now()};$('mute').onclick=()=>{inputs++;muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').setAttribute('aria-pressed',String(muted));if(muted&&soundGain)soundGain.gain.setTargetAtTime(0,audio.currentTime,.08);else{audioInit();if(soundGain)soundGain.gain.setTargetAtTime(.018,audio.currentTime,.08)}};let prevFrames=0;setInterval(()=>{fps=frames-prevFrames;prevFrames=frames;const data={frames,fps,entities:particles.length,inputs,resets,muted,width:W,height:H,audio:audio?audio.state:'locked'};for(const[k,v]of Object.entries(data))qa.dataset[k]=v;qa.textContent=JSON.stringify(data)},1000);addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(audio){if(paused)audio.suspend();else if(!muted)audio.resume()}});resize();starter();refreshGlow();requestAnimationFrame(frame);
})();
