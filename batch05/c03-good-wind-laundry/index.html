<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>好风晾衣场 · 小小世界05</title><link rel="stylesheet" href="style.css"><style>:root{--bg:#edf0dc;--stage:#d8e8df;--ink:#42695d}</style></head><body><main><header class="heading"><div><div class="kicker">C03 / GOOD WIND</div><h1>好风晾衣场</h1><p class="description">拉滑轮升降，取下衣物再挂到新位置，让纹样、轻风与大风在小院里相遇。</p></div><div class="right"><button id="mute">声音 · 开</button><button id="reset">重置</button></div></header><section class="stage"><canvas id="art" aria-label="好风晾衣场互动场景"></canvas></section><footer><nav class="toolbar"><button id="wind" data-action="wind">改变风向</button><button id="haul" data-action="haul">滑轮升降</button><button id="drop" data-action="drop">松一枚衣夹</button><button id="hang" data-action="hang">重新晾好</button><button id="pattern" data-action="pattern">换衣物纹样</button><button id="day" data-action="day">午后 / 黄昏</button></nav><p id="status"></p><span class="small">首次点按启用原创合成音乐 · 鼠标与触控均可 · 本地打开可离线玩</span><details><summary>玩法与来源</summary>拖衣物可以取下；拖回绳索附近松手就重新夹住，可沿绳变换位置。<br>拖右侧金色拉手，改变绳索的斜率和所有衣物高度。<br>改变风向轮换微风、大风、反向风，衣物会分别摆动。<br>放落篮子，再重新晾好；换纹样与午后/黄昏组合成为不同的小院。<p>参考：<a href="https://www.vitra.com/en-us/product/wooden-dolls">Girard彩绘木偶的协调色块与装饰纹样，仅参考色彩组织，不复制木偶轮廓或图案。</a></p></details></footer></main><script src="audio.js"></script><script src="config.js"></script><script src="common.js"></script><script src="app.js"></script></body></html>
