<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>金箔万花扇 · 第六组</title><style>:root{--bg:#f3e9d3;--ink:#493c36;--accent:#bd714b;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>金箔万花扇</h1><p>横拖展开纹理纸扇，绕轴转扇；揭箔、拼轴与压印会留下新的组合。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="金箔万花扇，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="open" id="open">展开纸扇</button><button data-action="rotate" id="rotate">转动扇轴</button><button data-action="foil" id="foil">揭开金箔</button><button data-action="join" id="join">拼扇金线</button><button data-action="press" id="press">叠扇压印</button><button data-action="bloom" id="bloom">整阵开合</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=13;window.artMeta={"number": 13, "slug": "13-gilded-fans", "title": "金箔万花扇", "group": "G", "mothers": ["code_artifact (1)_副本.html"], "innovation": "纹理纸扇分层展开、转轴、揭箔与拼扇压印", "description": "横拖展开纹理纸扇，绕轴转扇；揭箔、拼轴与压印会留下新的组合。", "ui": {"bg": "#f3e9d3", "ink": "#493c36", "accent": "#bd714b"}, "controls": [{"id": "open", "label": "展开纸扇"}, {"id": "rotate", "label": "转动扇轴"}, {"id": "foil", "label": "揭开金箔"}, {"id": "join", "label": "拼扇金线"}, {"id": "press", "label": "叠扇压印"}, {"id": "bloom", "label": "整阵开合"}], "newMechanics": ["逐扇保存展开角与朝向", "揭箔显露矿色纸纹", "金线拼扇后移动构图", "压印保留当前轮廓再叠印"], "artDirection": ["保留用户母本厚纸裁切纹路、细颗粒纸纤维、乳白薄边与大幅投影", "矿色大理石纹在每张纸内独立裁切，随实体折面改变轮廓"], "testPlan": [{"control": "open", "from": [0.5, 0.5], "to": [0.67, 0.37], "hold": 450}, {"control": "rotate", "from": [0.5, 0.5], "to": [0.38, 0.64], "hold": 450}, {"control": "foil", "from": [0.5, 0.5], "to": [0.67, 0.37], "hold": 450}, {"control": "join", "from": [0.5, 0.5], "to": [0.38, 0.64], "hold": 450}, {"control": "press", "from": [0.5, 0.5], "to": [0.67, 0.37], "hold": 450}], "stateFields": ["openings拖动明显改变且松手保留", "foilRemaining揭箔下降", "joinedPairs点拼扇增加不超过8", "imprints压印增加不超过14"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){
const c=env.ctx,TAU=Math.PI*2,palette=['#1c4b68','#ef785e','#dbc56c','#478a83','#796bae','#edb0b2','#295169'];let fans,prints,links,mode,selected,drag,clock,presses;const clamp=env.clamp;
function tex(seed){const t=document.createElement('canvas');t.width=t.height=256;const q=t.getContext('2d');q.fillStyle=palette[seed%7];q.fillRect(0,0,256,256);for(let k=0;k<18;k++){q.strokeStyle=palette[(seed+k*3)%7];q.globalAlpha=.28;q.lineWidth=7+k%5*5;q.beginPath();q.ellipse(60+Math.sin(k*1.73+seed)*130,100+Math.cos(k*.79)*140,60+k*5,35+k*4,k*.36,0,TAU);q.stroke()}q.globalAlpha=1;for(let k=0;k<1300;k++){let x=(Math.sin(k*73.13+seed)*43758.54)%1,y=(Math.sin(k*37.31+seed)*19654.67)%1;x=Math.abs(x)*256;y=Math.abs(y)*256;q.fillStyle=k%2?'#fff5de30':'#1c2e3b28';q.fillRect(x,y,1.1,1.1)}return t}
let textures=Array.from({length:7},(_,i)=>tex(i));
function reset(){const mobile=env.W<650,cols=mobile?3:6;fans=Array.from({length:18},(_,i)=>({x:mobile?.14+(i%cols)*.34:.08+(i%cols)*.16,y:mobile?.14+Math.floor(i/cols)*.145:.23+Math.floor(i/cols)*.31,r:mobile?.16+(i%3)*.015:.14+(i%3)*.017,open:.45+(i%3)*.19,target:.45+(i%3)*.19,angle:-.6+(i%3)*.5,foil:.6,pressed:0,seed:i%7}));prints=[];links=[];mode='open';selected=4;drag=null;clock=0;presses=0}
function metric(){return Math.min(env.W*.78,env.H*1.02)}
function shape(f,r,open){let p=new Path2D(),span=.18+open*4.7,steps=14;p.moveTo(0,0);for(let k=0;k<=steps;k++){let a=-span/2+k/steps*span-Math.PI/2;let rr=r*(k%2?1:.91);p.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}p.closePath();return p}
function fan(f,ghost=false){let r=f.r*metric(),open=f.open; c.save();c.translate(f.x*env.W,f.y*env.H);c.rotate(f.angle);let p=shape(f,r,open);c.shadowColor='#25201850';c.shadowBlur=ghost?0:14;c.shadowOffsetX=3;c.shadowOffsetY=8+open*5;c.fillStyle=ghost?'#af955e25':'#ccc2aa';c.translate(0,3);c.fill(p);c.translate(0,-3);c.shadowBlur=0;c.shadowOffsetX=c.shadowOffsetY=0;c.fillStyle=ghost?'#986f4430':palette[f.seed];c.fill(p);if(!ghost){c.save();c.clip(p);c.drawImage(textures[f.seed],-r,-r,r*2,r*2);let span=.18+open*4.7;for(let k=0;k<=14;k++){let a=-span/2+k/14*span-Math.PI/2;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.strokeStyle=k%2?'#fff3d857':'#20364660';c.lineWidth=k%2?1:3;c.stroke();if(f.foil>0 && k%3===0){c.strokeStyle=`rgba(249,213,113,${f.foil})`;c.lineWidth=2;c.stroke()}}c.globalAlpha=.8*f.foil;for(let k=0;k<45;k++){let a=-span/2+(k%15)/14*span-Math.PI/2,rr=r*(.38+Math.floor(k/15)*.19);c.fillStyle='#f7dda0';c.save();c.translate(Math.cos(a)*rr,Math.sin(a)*rr);c.rotate(a);c.fillRect(-3,-1,6,2);c.restore()}c.restore();c.lineWidth=1.4;c.strokeStyle='#fff6debd';c.stroke(p);c.beginPath();c.arc(0,0,r*.06,0,TAU);c.fillStyle='#e4b44b';c.fill();c.strokeStyle='#78532d';c.stroke();if(selected===fans.indexOf(f)){c.setLineDash([3,4]);c.strokeStyle='#ba653f';c.beginPath();c.arc(0,0,r*.12,0,TAU);c.stroke();c.setLineDash([])}}c.restore()}
function nearest(p){let best=-1,d=Infinity;fans.forEach((f,i)=>{let n=Math.hypot(p.x-f.x*env.W,p.y-f.y*env.H);if(n<d){d=n;best=i}});return d<metric()*.21?best:-1}
function input(kind,p){if(kind==='down'){let i=nearest(p);if(i<0)return;selected=i;let f=fans[i];drag={i,x:p.x,y:p.y,startAngle:Math.atan2(p.y-f.y*env.H,p.x-f.x*env.W),angle:f.angle,open:f.target};if(mode==='foil')f.foil=Math.max(0,f.foil-.22);if(mode==='join'){let other=fans.map((n,j)=>({j,d:j===i?Infinity:Math.hypot(n.x-f.x,n.y-f.y)})).sort((a,b)=>a.d-b.d)[0].j;if(!links.some(l=>l.includes(i)&&l.includes(other)))links.push([i,other]);links=links.slice(-8)}if(mode==='press'){prints.push({...f,angle:f.angle,open:f.open});prints=prints.slice(-14);f.pressed++;presses++}}if(kind==='move'&&drag){let f=fans[drag.i],dx=(p.x-drag.x)/env.W,dy=(p.y-drag.y)/env.H;if(mode==='open'){f.target=clamp(drag.open+dx*3-dy*1.5,.1,1)}else if(mode==='rotate'){f.angle=drag.angle+Math.atan2(p.y-f.y*env.H,p.x-f.x*env.W)-drag.startAngle}else if(mode==='foil'){f.foil=clamp(f.foil-.015,0,1)}else if(mode==='join'){f.x=clamp(f.x+(p.x-drag.x)/env.W,.08,.92);f.y=clamp(f.y+(p.y-drag.y)/env.H,.12,.91);const ddx=(p.x-drag.x)/env.W,ddy=(p.y-drag.y)/env.H;drag.x=p.x;drag.y=p.y;for(const l of links){if(l.includes(drag.i)){const n=fans[l.find(i=>i!==drag.i)];n.x=clamp(n.x+ddx,.08,.92);n.y=clamp(n.y+ddy,.12,.91)}}}}if(kind==='up'||kind==='cancel')drag=null}
function draw(dt,time){clock=time;c.fillStyle='#f3e9d3';c.fillRect(0,0,env.W,env.H);c.strokeStyle='#8a786721';for(let i=0;i<1250;i++){let x=Math.abs(Math.sin(i*91.31)*73147)%1*env.W,y=Math.abs(Math.sin(i*23.51)*12583)%1*env.H;c.beginPath();c.moveTo(x,y);c.lineTo(x+1.5,y+.4);c.stroke()}c.fillStyle='#ba8956';c.font='11px serif';c.fillText('GILDED / FOLD ARCHIVE',18,24);prints.forEach(p=>fan(p,true));c.lineWidth=2;c.strokeStyle='#b98643';links.forEach(l=>{c.beginPath();c.moveTo(fans[l[0]].x*env.W,fans[l[0]].y*env.H);c.lineTo(fans[l[1]].x*env.W,fans[l[1]].y*env.H);c.stroke()});fans.forEach(f=>{f.open+=(f.target-f.open)*Math.min(1,dt*9);fan(f)})}
function action(id){mode=id;if(id==='bloom'){fans.forEach((f,i)=>{f.target=f.target<.8?.98:.16;f.angle+=i%2?.12:-.12});mode='open'}}
return{reset,draw,input,action,state:()=>({bounded:true,status:({open:'展开：横拖开扇，纵拖收拢；折面会保留',rotate:'转轴：绕金色扇轴拖动，改变朝向',foil:'揭箔：在扇面拖擦，显出下方矿色纸纹',join:'拼扇：点扇建立邻近金线，拖轴布置组合',press:'压印：点扇留下浅金印，再转轴叠印',bloom:'整阵开合'})[mode],mode,selected,openings:fans.map(f=>+f.target.toFixed(2)),foilRemaining:+fans.reduce((a,f)=>a+f.foil,0).toFixed(2),joinedPairs:links.length,imprints:prints.length,presses})};
};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
