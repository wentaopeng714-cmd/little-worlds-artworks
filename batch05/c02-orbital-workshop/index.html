<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星际维修坞 · 小小世界05</title><link rel="stylesheet" href="style.css"><style>:root{--bg:#263851;--stage:#20334c;--ink:#f0dbb6}</style></head><body><main><header class="heading"><div><div class="kicker">C02 / ORBITAL WORKSHOP</div><h1>星际维修坞</h1><p class="description">把太阳翼、引擎和观察窗装进插口，转动船体，操纵机械臂，再让你的组合起飞。</p></div><div class="right"><button id="mute">声音 · 开</button><button id="reset">重置</button></div></header><section class="stage"><canvas id="art" aria-label="星际维修坞互动场景"></canvas></section><footer><nav class="toolbar"><button id="rotate" data-action="rotate">旋转船体</button><button id="launch" data-action="launch">试飞往返</button><button id="detach" data-action="detach">拆回工具架</button><button id="grip" data-action="grip">机械臂抓取</button><button id="lights" data-action="lights">插口提示灯</button><button id="kit" data-action="kit">换装配模块</button></nav><p id="status"></p><span class="small">首次点按启用原创合成音乐 · 鼠标与触控均可 · 本地打开可离线玩</span><details><summary>玩法与来源</summary>拖动两侧六个零件，把它们松手放在船体四个虚线插口里，靠近即可卡合。<br>拖黄色机械臂爪端，或按抓取，机械臂可以搬动零件。<br>拖船体旋转，装好的零件跟着转；试飞会离坞然后返回。<br>拆回工具架、更换模块、旋转和再飞可以不断组合；没有计分。<p>参考：<a href="https://www.moma.org/artists/4163-bruno-munari">Munari几何平面与机械构成的艺术语言，只借鉴块面构图思考，无复制画面、文字或角色。</a></p></details></footer></main><script src="audio.js"></script><script src="config.js"></script><script src="common.js"></script><script src="app.js"></script></body></html>
