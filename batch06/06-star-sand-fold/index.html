<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星砂折流 · 第六组</title><style>:root{--bg:#17181d;--ink:#e2c9a7;--accent:#73bab6;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>星砂折流</h1><p>绘曲渠后注入矿砂；折流改渠形，沉积成细密矿脊，再扬起重走新渠。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="星砂折流，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="canal" id="canal">绘曲渠</button><button data-action="pour" id="pour">注矿砂</button><button data-action="fold" id="fold">折流改道</button><button data-action="settle" id="settle">沉积成脊</button><button data-action="lift" id="lift">再扬砂</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=6;window.artMeta={"number": 6, "slug": "06-star-sand-fold", "title": "星砂折流", "group": "F", "mothers": ["samuel_yan_interactive_mobile_sands.html"], "description": "绘曲渠后注入矿砂；折流改渠形，沉积成细密矿脊，再扬起重走新渠。", "ui": {"bg": "#17181d", "ink": "#e2c9a7", "accent": "#73bab6"}, "controls": [{"id": "canal", "label": "绘曲渠"}, {"id": "pour", "label": "注矿砂"}, {"id": "fold", "label": "折流改道"}, {"id": "settle", "label": "沉积成脊"}, {"id": "lift", "label": "再扬砂"}], "newMechanics": ["持久手绘曲渠改变砂丝路径", "沿渠注砂累计矿料", "折流保留渠形并扭曲", "沉积出多层矿脊", "再扬起已沉积砂走新路"], "artDirection": ["敦煌矿色与暗底", "密细丝束和沉积针纹", "流动砂脊与线性曲渠"], "testPlan": [{"control": "canal", "from": [0.2, 0.72], "to": [0.8, 0.25], "hold": 1200}, {"control": "pour", "from": [0.3, 0.45], "to": [0.7, 0.5], "hold": 900}, {"control": "fold", "from": [0.48, 0.5], "to": [0.62, 0.64], "hold": 800}, {"control": "settle", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 1200}], "stateFields": {"canals": "绘渠后3以上", "sandLoad": "注砂后增加", "deposits": "沉积后1以上", "folds": "改道后1以上"}};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,P=['#ffd35f','#ee743e','#61dbea','#c6d68d'];let motes=[],trail=document.createElement('canvas'),tc=trail.getContext('2d'),canals=[],deposits=[],mode='canal',drag=null,load=1,folds=0,lifts=0,pours=0,dir=1;const R=n=>{let v=Math.sin(n*137.11+41.8)*43758.54;return v-Math.floor(v)};function reset(){canals=[{pts:[[.12,.07],[.32,.25],[.18,.45],[.57,.58],[.32,.91]],col:0,bend:0},{pts:[[.88,.05],[.71,.24],[.83,.45],[.49,.7],[.76,.94]],col:2,bend:0},{pts:[[.44,.03],[.52,.23],[.37,.42],[.7,.58],[.54,.92]],col:1,bend:0}];deposits=[];mode='canal';drag=null;load=1;folds=0;lifts=0;pours=0;dir=1;trail.width=e.W;trail.height=e.H;motes=Array.from({length:1800},(_,k)=>({j:k%3,u:R(k),v:(R(k+200)-.5)*1.8,speed:.03+R(k+90)*.075,prev:null}));}function moving(dt,t){if(trail.width!==Math.round(e.W)||trail.height!==Math.round(e.H)){trail.width=e.W;trail.height=e.H;motes.forEach(p=>p.prev=null)}tc.globalCompositeOperation='destination-out';tc.fillStyle='rgba(0,0,0,.023)';tc.fillRect(0,0,e.W,e.H);tc.globalCompositeOperation='source-over';for(let p of motes){let old=p.u;p.u=(p.u+dt*p.speed*dir*(.6+load*.4)+1)%1;if(Math.abs(p.u-old)>.5){p.prev=null;p.j=(p.j+1)%canals.length}let ch=canals[p.j%canals.length],a=at(ch,p.u),b=at(ch,Math.min(.999,p.u+.001)),dx=(b.x-a.x)*e.W,dy=(b.y-a.y)*e.H,L=Math.hypot(dx,dy)||1,off=p.v*Math.min(e.W,e.H)*.07*Math.pow(Math.sin(Math.PI*p.u),.3)+Math.sin(p.u*33+t*.4+p.v*5)*Math.min(e.W,e.H)*.008,q={x:a.x*e.W-dy/L*off,y:a.y*e.H+dx/L*off};if(p.prev&&Math.hypot(q.x-p.prev.x,q.y-p.prev.y)<Math.min(e.W,e.H)*.08){tc.strokeStyle=P[ch.col];tc.globalAlpha=.45;tc.lineWidth=.5;tc.beginPath();tc.moveTo(p.prev.x,p.prev.y);tc.lineTo(q.x,q.y);tc.stroke()}p.prev=q}tc.globalAlpha=1;}function at(ch,u){let pts=ch.pts,n=pts.length-1,z=e.clamp(u,0,.99999)*n,i=Math.floor(z),v=z-i,a=pts[Math.max(0,i-1)],b=pts[i],d=pts[Math.min(n,i+1)],f=pts[Math.min(n,i+2)];const val=j=>.5*((2*b[j])+(-a[j]+d[j])*v+(2*a[j]-5*b[j]+4*d[j]-f[j])*v*v+(-a[j]+3*b[j]-3*d[j]+f[j])*v*v*v);return{x:val(0)+Math.sin(u*8)*ch.bend,y:val(1)}}function ribbon(ch,j,t,deposit=false){const W=e.W,H=e.H,S=Math.min(W,H),count=deposit?210:380;const samples=[];for(let z=0;z<=44;z++){let u=z/44,p=at(ch,u),q=at(ch,Math.min(.999,u+.001)),dx=(q.x-p.x)*W,dy=(q.y-p.y)*H,L=Math.hypot(dx,dy)||1;samples.push({x:p.x*W,y:p.y*H,nx:-dy/L,ny:dx/L,u})}for(let k=0;k<count;k++){let off=(k/count-.5)*S*(deposit?.19:.14)*(load*.28+.72),col=(k%17===0?j+1:ch.col)%4;c.strokeStyle=P[col];c.globalAlpha=deposit?.17:.09+R(k+j*1000)*.18;c.lineWidth=deposit?.45:.35+R(k+8)*.5;c.beginPath();for(let z=0;z<samples.length;z++){let p=samples[z],pulse=deposit?0:Math.sin(p.u*18+t*.6*dir+R(k)*5)*S*.009,span=Math.pow(Math.sin(Math.PI*p.u),.3),r=off*span+pulse+Math.sin(p.u*35+k*.5)*S*.0015,x=p.x+p.nx*r,y=p.y+p.ny*r;z?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();if(!deposit&&k%5===0){let u=(R(k)+t*.028*dir+2)%1,idx=Math.min(43,Math.floor(u*44)),p=samples[idx],r=off*Math.pow(Math.sin(Math.PI*u),.3);c.globalAlpha=.6;c.fillStyle=P[col];c.fillRect(p.x+p.nx*r,p.y+p.ny*r,.8,1.3)}}c.globalAlpha=1;c.lineWidth=.7;c.strokeStyle=deposit?'#826e48':'#45534f';for(let side of [-1,1]){c.beginPath();samples.forEach((p,z)=>{let r=S*.084*Math.pow(Math.sin(Math.PI*p.u),.3)*side,x=p.x+p.nx*r,y=p.y+p.ny*r;z?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}}
function draw(dt,t){let W=e.W,H=e.H;c.fillStyle='#101215';c.fillRect(0,0,W,H);let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#18202a');g.addColorStop(.4,'#13151b');g.addColorStop(1,'#27231e');c.fillStyle=g;c.fillRect(0,0,W,H);moving(dt,t);for(let k=0;k<1100;k++){c.globalAlpha=.1+R(k+11)*.13;c.fillStyle=k%5?'#988c65':'#55828b';c.fillRect(R(k)*W,R(k+3400)*H,.5,R(k+10)*1.2+.4)}c.globalAlpha=1;for(let j=0;j<deposits.length;j++)ribbon(deposits[j],j,0,true);for(let j=0;j<canals.length;j++)ribbon(canals[j],j,t);c.save();c.globalCompositeOperation='screen';c.drawImage(trail,0,0,W,H);c.restore();if(drag?.ch){c.strokeStyle='#ddbd83';c.globalAlpha=.8;c.lineWidth=1.3;c.beginPath();drag.ch.pts.forEach((p,i)=>i?c.lineTo(p[0]*W,p[1]*H):c.moveTo(p[0]*W,p[1]*H));c.stroke();c.globalAlpha=1}c.font='10px system-ui';c.fillStyle='#a4a28a';c.fillText('曲渠收拢细砂 · 沉积纹脊保留旧的折流',18,H-17)}function closest(x,y){let ch=canals[0],best=Infinity;canals.forEach(a=>{for(let k=0;k<20;k++){let p=at(a,k/20),d=Math.hypot(p.x-x,p.y-y);if(d<best){best=d;ch=a}}});return ch}function settle(){canals.slice(-3).forEach(ch=>deposits.push({pts:ch.pts.map(p=>p.slice()),col:ch.col,bend:ch.bend}));while(deposits.length>6)deposits.shift();load=Math.max(.15,load*.65);artAudio.fx(4,.8)}function input(kind,p){let x=p.x/e.W,y=p.y/e.H;if(kind==='down'){if(mode==='canal'){let ch={pts:[[x,y]],col:canals.length%4,bend:0};canals.push(ch);for(let k=0;k<140&&motes.length<2200;k++)motes.push({j:canals.length-1,u:R(k),v:(R(k+900)-.5)*1.8,speed:.07,prev:null});if(canals.length>7)canals.shift();drag={ch,x,y}}else if(mode==='pour'){load=Math.min(3,load+.3);pours++;drag={x,y};let ch=closest(x,y);ch.col=(ch.col+1)%4}else if(mode==='fold'){drag={target:closest(x,y),x,y};folds++}else if(mode==='settle')settle();else if(mode==='lift'){deposits=[];load=Math.min(3,load+.7);lifts++;dir*=-1}}else if(kind==='move'&&drag){if(drag.ch&&Math.hypot(x-drag.x,y-drag.y)>.018){if(drag.ch.pts.length<65)drag.ch.pts.push([x,y]);drag.x=x;drag.y=y}else if(mode==='fold'){let ch=drag.target;ch.bend=e.clamp(ch.bend+(x-drag.x)*.5,-.17,.17);ch.pts.forEach(a=>{let d=Math.hypot(a[0]-x,a[1]-y);if(d<.3){a[0]=e.clamp(a[0]+(x-drag.x)*(1-d/.3),.02,.98);a[1]=e.clamp(a[1]+(y-drag.y)*(1-d/.3),.02,.98)}});drag.x=x;drag.y=y}else if(mode==='pour'&&Math.hypot(x-drag.x,y-drag.y)>.04){load=Math.min(3,load+.08);drag.x=x;drag.y=y}}else if(kind==='up'||kind==='cancel'){if(drag?.ch&&drag.ch.pts.length<2){drag.ch.pts.push([e.clamp(x+.2,.02,.98),e.clamp(y-.15,.02,.98)])}drag=null}}function action(id){mode=id;if(id==='settle')settle();if(id==='lift'){deposits=[];load=Math.min(3,load+.7);lifts++;dir*=-1}}function state(){return{bounded:true,status:({canal:'拖画曲渠：新渠立即收拢矿色砂丝',pour:'沿曲渠拖注矿砂：料量与矿色一起改变',fold:'抓住曲渠拖折：新砂走改道，旧沉积保留',settle:'已沉积为静止纹脊；继续绘渠叠新的矿砂',lift:'沉积重新扬起，砂丝反向流经新渠'})[mode]+' · 曲渠 '+canals.length+' / 矿脊 '+deposits.length+' / 砂 '+load.toFixed(1),mode,canals:canals.length,sandLoad:+load.toFixed(3),deposits:deposits.length,folds,lifts,pours,direction:dir,trajectoryParticles:motes.length}}return{reset,draw,input,action,state}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
