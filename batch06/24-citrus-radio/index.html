>选部位拖动：眉毛变情绪，嘴型抿／嘟／露齿，脸颊充气，叶片调频道。收录三段表情后开播。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="电台胖柑，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="brow" id="brow">拉眉</button><button data-action="mouth" id="mouth">拉嘴</button><button data-action="cheek" id="cheek">充脸颊</button><button data-action="leaf" id="leaf">转叶片</button><button data-action="capture" id="capture">收录节目</button><button data-action="broadcast" id="broadcast">开播／停播</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=24;window.artMeta={"number": 24, "slug": "24-citrus-radio", "title": "电台胖柑", "group": "T", "mothers": ["cartoon_rig_audio(1).html"], "innovation": "块面柑橘播报员，拉眉/嘴/叶与脸颊，表情组合改变节目状态", "description": "选部位拖动：眉毛变情绪，嘴型抿／嘟／露齿，脸颊充气，叶片调频道。收录三段表情后开播。", "ui": {"bg": "#c2c6b1", "ink": "#233940", "accent": "#e45a3f"}, "controls": [{"id": "brow", "label": "拉眉"}, {"id": "mouth", "label": "拉嘴"}, {"id": "cheek", "label": "充脸颊"}, {"id": "leaf", "label": "转叶片"}, {"id": "capture", "label": "收录节目"}, {"id": "broadcast", "label": "开播／停播"}], "artDirection": ["赭橙角面果皮与细孔", "薄荷绿片叶发冠", "西装织点与瓷麦克风"], "newMechanics": ["拉眉改变粗眉倾角和瞳孔", "拉嘴从抿口变嘟口再露齿大口", "充脸颊扩大整个角脸轮廓", "转叶片切天气/奇闻/夜话频道", "收录节目保留三个表情符号", "开播／停播轮播12秒表情节目并累计期数"], "testPlan": [{"control": "mouth", "from": [0.5, 0.48], "to": [0.58, 0.73], "hold": 250}, {"control": "cheek", "from": [0.62, 0.42], "to": [0.82, 0.42], "hold": 200}, {"control": "leaf", "from": [0.5, 0.2], "to": [0.72, 0.2], "hold": 200}, {"control": "capture", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 100}, {"control": "broadcast", "from": [0.5, 0.5], "to": [0.5, 0.5], "hold": 100}], "stateFields": ["mouthZone: 0/1/2", "cheek:0–1", "channel:0–2", "clips<=3", "programs / onAir"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;

function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}

function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}

window.artAudio={gesture,fx,pause,toggle,reset,snapshot};

const radio=s.onAir?s.clips[Math.floor(s.air/4)%Math.max(1,s.clips.length)]:null;let b=radio?radio.b:s.brow,m=radio?radio.m:s.mouth,cheek=radio?radio.c:s.cheek,leaf=radio?radio.l:s.leaf;const bounce=Math.sin(t*2)*2;
rr(-277,-236,554,34,3,'#233940');txt('CITRUS  •  AM 108   /   柑橘广播社',0,-214,13,'#e7e7cb');
// Broad angular blazer, woven shoulder panels and cut white collar.

for(let i=0;i<18;i++)line([[-222+i*4,135],[-204+i*4,245]],'rgba(165,208,192,.18)',1);poly([[-105,96],[0,168],[-64,194]],'#fff3d1');poly([[105,96],[0,168],[64,194]],'#fff3d1');poly([[0,168],[-20,188],[0,241],[20,188]],'#e54e43');
