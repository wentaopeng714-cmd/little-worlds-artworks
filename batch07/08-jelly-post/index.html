*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{--bg:#191820;--ink:#f9dfba;--accent:#e69065;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;display:grid;grid-template-rows:auto 1fr auto}header{padding:18px 24px 10px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}h1{font:500 clamp(23px,3vw,34px) Georgia,serif;margin:0 0 5px;letter-spacing:.035em}#hint{font-size:14px;line-height:1.6;max-width:750px;opacity:.84}nav{display:flex;gap:7px;align-items:center;flex-shrink:0}button,a{font:inherit;color:inherit}button{min-height:44px;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:999px;padding:9px 16px;background:transparent;cursor:pointer;font-size:14px;touch-action:manipulation}button:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}main{position:relative;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}footer{padding:10px 24px max(12px,env(safe-area-inset-bottom));border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent);display:flex;justify-content:space-between;gap:16px;align-items:center}#tools{display:flex;flex-wrap:wrap;gap:7px}#soundnote{font-size:12px;opacity:.65;max-width:160px;line-height:1.5}#qa{position:absolute;left:0;bottom:0;max-height:70px;overflow:auto;z-index:5;display:none;font:10px monospace;color:#fff;background:#000b;pointer-events:none;white-space:pre-wrap;width:100%}body.qa #qa{display:block}.back{text-decoration:none;font-size:12px;opacity:.6;white-space:nowrap} @media(max-width:650px){header{padding:12px 13px 8px;display:block}header nav{position:absolute;top:10px;right:12px}header nav button{min-height:44px;font-size:12px;padding:7px 10px}#capture{display:none}h1{font-size:23px;padding-right:155px}#hint{font-size:14px;line-height:1.6;padding-top:4px}footer{padding:8px 12px max(10px,env(safe-area-inset-bottom));display:block}#tools{gap:6px}#tools button{font-size:14px;min-height:44px;padding:8px 12px}#soundnote{display:none}.back{position:absolute;right:15px;bottom:10px;display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body data-number="8"><header><div><h1 id="title"></h1><div id="hint"></div></div><nav><button id="sound" type="button" aria-pressed="false">声音开启</button><button id="reset" type="button">重新开始</button><button id="capture" type="button">存画面</button></nav></header><main><canvas aria-label="可拖动的互动艺术画面"></canvas><output id="qa"></output></main><footer><div id="tools" role="group" aria-label="作品工具"></div><div id="soundnote"></div></footer><script>/* 08 · 果冻邮差. Original Canvas character and route simulation. */
(() => {
  'use strict';
  const C={bg:'#c3e4d3',ink:'#193b35',accent:'#ee593a',paper:'#fff5d9',mint:'#81c3a3',red:'#ee593a',orange:'#f6a15b'};
  const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let S,V={w:1000,h:720,u:720},held=null,lastSound=-9;
  const rnd=n=>{let p=Math.sin(n*13.13+44.51)*56783.25;return p-Math.floor(p);};
  function fx(n,k=0){if(S.time-lastSound>.1){window.SOUND?.fx?.(n,k);lastSound=S.time;}}
  function init(){S={mode:'feed',time:0,stamp:0,belly:[],tray:[0,1,2,0].map((k,i)=>({id:i,k,x:.115,y:.38+i*.115})),next:4,boxes:[{x:.79,y:.27,k:0,count:0,pop:0},{x:.82,y:.62,k:1,count:0,pop:0},{x:.29,y:.75,k:2,count:0,pop:0}],route:[0,1,2],editingRoute:false,routeIndex:0,run:false,pos:{x:.47,y:.42},legs:[1,1],legPulls:0,movedBoxes:0,routeEdits:0,totalFed:0,totalDelivered:0,stampEdits:0,fly:[],receipts:[],mouth:0,bodyPulse:0,noMatch:0,toast:'把左边的信拖进大嘴巴，再组合你的送信路线',toastTime:5};held=null;lastSound=-9;}
  function say(s){S.toast=s;S.toastTime=4;}
  function dot(c,x,y,r,color){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
  function stroke(c,col,l,fn){c.strokeStyle=col;c.lineWidth=l;c.lineCap='round';c.lineJoin='round';c.beginPath();fn(c);c.stroke();}
  function rr(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();}
  function symbol(c,x,y,k,r,col=C.ink){c.save();c.translate(x,y);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=r*.13;if(k===0){for(let j=0;j<7;j++){let a=j*TAU/7;stroke(c,col,r*.13,p=>{p.moveTo(Math.cos(a)*r*.65,Math.sin(a)*r*.65);p.lineTo(Math.cos(a)*r,Math.sin(a)*r);});}dot(c,0,0,r*.42,col);}else if(k===1){for(let j=0;j<3;j++)stroke(c,col,r*.17,p=>{p.moveTo(-r,-r*.5+j*r*.5);p.bezierCurveTo(-r*.4,-r+j*r*.5,r*.4,j*r*.5,r,-r*.5+j*r*.5);});}else{c.beginPath();c.moveTo(0,-r);c.bezierCurveTo(r*1.3,-r*.08,r*.95,r,0,r);c.bezierCurveTo(-r*.95,r,-r*1.3,-r*.08,0,-r);c.fill();}c.restore();}
  function envelope(c,x,y,w,k,rot=0){c.save();c.translate(x,y);c.rotate(rot);let h=w*.69;rr(c,-w*.5,-h*.5,w,h,w*.03,C.paper);stroke(c,C.ink,w*.024,p=>{p.rect(-w*.5,-h*.5,w,h);p.moveTo(-w*.48,-h*.48);p.lineTo(0,h*.13);p.lineTo(w*.48,-h*.48);});c.fillStyle=C.red;c.fillRect(w*.2,-h*.39,w*.21,w*.23);symbol(c,w*.31,-h*.23,k,w*.063,C.paper);c.restore();}
  function geom(){let scale=S.run?.66:1;return {x:S.pos.x*V.w,y:S.pos.y*V.h,rx:V.u*.2*scale,ry:V.u*.206*scale,scale};}
  function mailHit(x,y){return S.tray.findIndex(l=>Math.abs(x-l.x)<.075&&Math.abs(y-l.y)<.048);}
  function boxHit(x,y){let best=-1,dist=.11;S.boxes.forEach((b,i)=>{let d=Math.hypot((x-b.x)*V.w/V.u,(y-b.y)*V.h/V.u);if(d<dist){best=i;dist=d;}});return best;}
  function feed(i){if(S.belly.length>=9){say('肚子装满九封信了，先送出一趟');fx(43,1);return;}let l=S.tray[i];if(!l)return;S.belly.push({id:l.id,k:l.k});S.totalFed++;S.mouth=1;S.bodyPulse=1;S.fly.push({x:l.x,y:l.y,to:'mouth',k:l.k,p:0});if(S.fly.length>30)S.fly.shift();S.tray[i]={id:S.next++,k:S.stamp,x:.115,y:.38+i*.115};say(['太阳信让步子更跳','波浪信让身体左右摇摆','水滴信让肚子更圆'][l.k]+' · 已吞 '+S.belly.length+' 封');fx(54+l.k*5,2);}
  function bodyPath(c,rx,ry,filled,t){let extra=1+filled*.025+S.belly.filter(e=>e.k===2).length*.025;c.beginPath();c.moveTo(-rx*.92*extra,ry*.57);c.bezierCurveTo(-rx*1.18*extra,ry*.07,-rx*.91,-ry*1.1,-rx*.1,-ry*1.12);c.bezierCurveTo(rx*.78,-ry*1.25,rx*1.1,-ry*.63,rx*extra,ry*.5);for(let j=0;j<7;j++){let x=rx*extra-j*(rx*1.92*extra/7),nx=rx*extra-(j+1)*(rx*1.92*extra/7);c.quadraticCurveTo((x+nx)/2,ry*(.9+.035*Math.sin(t*2+j)),nx,ry*.61);}c.closePath();}
  function drawJelly(c,t){let g=geom(),{x,y,rx,ry}=g,counts=[0,0,0];S.belly.forEach(b=>counts[b.k]++);let tempo=2.6+counts[0]*.43-counts[1]*.09,step=t*tempo,bob=Math.sin(step)*(S.run?ry*.12:ry*.025),sway=Math.sin(step)*(.024+counts[1]*.012);c.save();c.translate(x,y+bob);c.rotate(sway);
    // Thin endless legs form most of the silhouette, and are genuinely stretchable.
    for(let side of [-1,1]){let i=side===-1?0:1,len=ry*(.57+.37*S.legs[i]),swing=Math.sin(step+side*1.57)*(S.run?rx*.35:rx*.055);stroke(c,C.ink,rx*.12,p=>{p.moveTo(side*rx*.45,ry*.51);p.bezierCurveTo(side*rx*.38+swing,ry*.9,side*rx*.36-swing,ry*.56+len,side*rx*.47+swing,ry*.6+len);});rr(c,side*rx*.47+swing-rx*.1,ry*.52+len,rx*.47,ry*.15,ry*.065,C.red);if(S.mode==='legs')dot(c,side*rx*.47+swing+rx*.06,ry*.58+len,rx*.06,C.paper);}
    c.save();c.translate(rx*.04,ry*.07);bodyPath(c,rx,ry,S.belly.length,step);c.fillStyle=C.ink;c.fill();c.restore();bodyPath(c,rx,ry,S.belly.length,step);c.fillStyle=C.red;c.fill();
    c.save();bodyPath(c,rx,ry,S.belly.length,step);c.clip();c.fillStyle=C.orange;c.beginPath();c.ellipse(rx*.13,ry*.32,rx*(.82+counts[2]*.017),ry*.6,0,0,TAU);c.fill();for(let i=0;i<170;i++){dot(c,(rnd(i+22)-.5)*rx*2.6,(rnd(i+67)-.5)*ry*2.6,rx*(.002+rnd(i+11)*.004),i%3?'#d84934':'#f8bc76');}
    // The stamps survive inside the transparent belly and bend with its rhythm.
    S.belly.forEach((b,i)=>{let xx=((i%3)-1)*rx*.49+Math.sin(step*.8+i)*rx*.032,yy=ry*(.08+Math.floor(i/3)*.26);symbol(c,xx,yy,b.k,rx*.115,C.paper);});c.restore();
    // A horizontal letterbox mouth, a visible tongue, and tiny offset eyes.
    c.save();c.translate(-rx*.04,-ry*.43);c.rotate(-.08);c.fillStyle=C.paper;c.beginPath();c.ellipse(0,0,rx*.93,ry*(.265+S.mouth*.06),0,0,TAU);c.fill();c.fillStyle=C.ink;c.beginPath();c.ellipse(0,0,rx*.84,ry*(.193+S.mouth*.07),0,0,TAU);c.fill();c.fillStyle='#f59d8b';c.beginPath();c.ellipse(rx*.11,ry*.11,rx*.25,ry*.055,0,Math.PI,TAU);c.fill();c.restore();dot(c,-rx*.33,-ry*.86,rx*.043,C.ink);dot(c,rx*.24,-ry*.9,rx*.041,C.ink);stroke(c,C.ink,rx*.025,p=>{p.moveTo(rx*.11,-ry*1.02);p.lineTo(rx*.35,-ry*1.03);});
    stroke(c,C.ink,rx*.045,p=>{p.moveTo(-rx*.91,ry*.1);p.quadraticCurveTo(-rx*1.32,ry*.12,-rx*1.37,-ry*.07);p.moveTo(rx*.97,ry*.03);p.quadraticCurveTo(rx*1.2,-ry*.18,rx*1.32,-ry*.09);});rr(c,rx*1.15,-ry*.1,rx*.28,ry*.19,ry*.025,C.paper);symbol(c,rx*1.29,0,S.stamp,rx*.06,C.red);c.restore();}
  function drawBox(c,b,i){let x=b.x*V.w,y=b.y*V.h,u=V.u,r=u*.058,pop=b.pop;stroke(c,C.ink,u*.012,p=>{p.moveTo(x,y+r*.6);p.lineTo(x,y+r*2);});rr(c,x-r*.55,y+r*1.89,r*1.1,r*.15,r*.05,C.ink);c.save();c.translate(x,y-pop*r*.16);rr(c,-r,-r*.64,r*2,r*1.34,r*.18,C.ink);rr(c,-r*.92,-r*.67,r*1.77,r*1.24,r*.16,C.paper);rr(c,-r*.73,-r*.26,r*1.29,r*.18,r*.035,C.ink);symbol(c,0,r*.2,b.k,r*.18,C.red);stroke(c,C.red,u*.008,p=>{p.moveTo(r*.93,r*.25);p.lineTo(r*.93,-r*(.6+pop*.5));p.lineTo(r*1.3,-r*(.6+pop*.5));});c.fillStyle=C.ink;c.textAlign='center';c.font=`700 ${clamp(u*.014,9,11)}px system-ui`;c.fillText(String.fromCharCode(65+i)+' / '+b.count,0,r*1.1);c.restore();}
  function update(dt){S.time+=dt;S.toastTime=Math.max(0,S.toastTime-dt);S.mouth=Math.max(0,S.mouth-dt*2.3);S.bodyPulse=Math.max(0,S.bodyPulse-dt);S.boxes.forEach(b=>b.pop=Math.max(0,b.pop-dt*1.5));S.fly.forEach(f=>f.p+=dt*2.8);S.fly=S.fly.filter(f=>f.p<1);if(!S.run){S.pos.x+=(.47-S.pos.x)*Math.min(1,dt*3);S.pos.y+=(.42-S.pos.y)*Math.min(1,dt*3);return;}let idx=S.route[S.routeIndex%S.route.length],b=S.boxes[idx];if(!b){S.run=false;return;}let tx=clamp(b.x-.09,.21,.78),ty=clamp(b.y+.025,.27,.66);let dx=tx-S.pos.x,dy=ty-S.pos.y,d=Math.hypot(dx,dy),sun=S.belly.filter(e=>e.k===0).length,speed=(.13+sun*.018)*(S.legs[0]+S.legs[1])/2;if(d>.012){let k=Math.min(1,dt*speed/d);S.pos.x+=dx*k;S.pos.y+=dy*k;}else{let j=S.belly.findIndex(e=>e.k===b.k);if(j>=0){let e=S.belly.splice(j,1)[0];b.count++;b.pop=1;S.totalDelivered++;S.noMatch=0;S.receipts.push({k:e.k,box:idx});if(S.receipts.length>14)S.receipts.shift();S.fly.push({x:S.pos.x,y:S.pos.y,to:idx,k:e.k,p:0});fx(67+e.k*4,1);}else S.noMatch++;S.routeIndex=(S.routeIndex+1)%S.route.length;if(!S.belly.length){S.run=false;say('投递完成！挪动邮箱、换邮票，再组合下一趟');fx(79,2);}else if(S.noMatch>=S.route.length){S.run=false;say('这条路线没有匹配邮箱。把缺的图案邮箱接进路线');}}}
  function draw(c,w,h,t,dt){if(!(w>0&&h>0))return;V={w,h,u:Math.min(w,h)};update(clamp(Number.isFinite(dt)?dt:0,0,.05));let u=V.u;c.fillStyle=C.bg;c.fillRect(0,0,w,h);c.save();c.lineCap='round';
    // Offset print registration, oversize parcel bars, no interchangeable control panels.
    c.fillStyle='#a2cfb9';c.fillRect(w*.03,h*.1,w*.94,h*.006);c.fillStyle=C.red;c.fillRect(0,h*.12,w*.027,h*.53);for(let j=0;j<8;j++){c.save();c.translate(w*.92,h*.047+j*u*.018);c.rotate(-.55);c.fillStyle=j%2?C.ink:C.red;c.fillRect(-u*.025,-u*.003,u*.05,u*.006);c.restore();}
    c.fillStyle=C.ink;c.font=`800 ${clamp(u*.035,17,25)}px system-ui`;c.textAlign='left';c.fillText('JELLY EXPRESS',w*.055,h*.075);c.font=`600 ${clamp(u*.014,9,11)}px system-ui`;c.fillText('大嘴收件 · 伸腿投递',w*.058,h*.155);
    // Every route segment is recomputed from live mailbox positions.
    if(S.route.length){c.strokeStyle=C.red;c.lineWidth=u*.004;c.setLineDash([u*.008,u*.012]);c.beginPath();let last=null;S.route.forEach((bi,i)=>{let b=S.boxes[bi];if(!last)c.moveTo(b.x*w,b.y*h);else c.quadraticCurveTo((last.x+b.x)*w/2,Math.min(last.y,b.y)*h-u*.09,b.x*w,b.y*h);last=b;});c.stroke();c.setLineDash([]);S.route.forEach((bi,i)=>{let b=S.boxes[bi];dot(c,b.x*w-u*.065,b.y*h-u*.055,u*.018,C.red);c.fillStyle=C.paper;c.textAlign='center';c.font=`800 ${clamp(u*.02,10,14)}px system-ui`;c.fillText(i+1,b.x*w-u*.065,b.y*h-u*.048);});}
    S.boxes.forEach((b,i)=>drawBox(c,b,i));
    // Stacked envelopes are actual draggable inventory.
    S.tray.forEach((l,i)=>{if(held?.type==='letter'&&held.index===i)return;c.save();c.translate(l.x*w,l.y*h);c.rotate((i-1.5)*.04);c.fillStyle='#8bbb9c';c.fillRect(-u*.05+3,-u*.033+5,u*.1,u*.069);envelope(c,0,0,u*.105,l.k);c.restore();});
    c.fillStyle=C.ink;c.textAlign='center';c.font=`700 ${clamp(u*.014,9,11)}px system-ui`;c.fillText('待收件',w*.115,h*.315);
    drawJelly(c,S.time);
    if(held?.type==='letter')envelope(c,held.x*w,held.y*h,u*.13,S.tray[held.index].k,-.12);
    S.fly.forEach(f=>{let g=geom(),tx=f.to==='mouth'?g.x/V.w:S.boxes[f.to].x,ty=f.to==='mouth'?(g.y-g.ry*.4)/V.h:S.boxes[f.to].y,p=f.p,xx=(f.x+(tx-f.x)*p)*w,yy=(f.y+(ty-f.y)*p)*h-Math.sin(p*Math.PI)*u*.055;envelope(c,xx,yy,u*.075*(1-.4*p),f.k,p*.3);});
    // Collection strip keeps the history of delivered stamp patterns.
    c.fillStyle=C.paper;c.fillRect(0,h*.916,w,h*.084);for(let i=0;i<Math.ceil(w/(u*.027));i++)dot(c,i*u*.027,h*.916,u*.004,C.bg);
    c.fillStyle=C.ink;c.font=`700 ${clamp(u*.016,9,12)}px system-ui`;c.textAlign='left';c.fillText('已投递 '+String(S.totalDelivered).padStart(2,'0'),w*.04,h*.968);S.receipts.slice(-10).forEach((r,i)=>symbol(c,w*.27+i*Math.min(w*.061,u*.061),h*.956,r.k,u*.015,C.red));
    c.textAlign='center';c.font=`500 ${clamp(u*.016,10,12)}px system-ui`;c.fillStyle=C.ink;let text=S.toastTime>0?S.toast:('肚子 '+S.belly.length+'/9 · 路线 '+S.route.map(i=>String.fromCharCode(65+i)).join(' → '));c.fillText(text,w*.5,h*.88, w*.91);c.restore();}
  function pointer(type,x,y,dx,dy){if(type==='down'){if(S.mode==='feed'){let i=mailHit(x,y);if(i>=0)held={type:'letter',index:i,x,y,sx:x,sy:y};else {let g=geom();if(Math.hypot((x*V.w-g.x)/g.rx,(y*V.h-g.y)/g.ry)<1.2)feed(S.totalFed%4);}}
      else if(S.mode==='legs'){held={type:'leg',index:x<S.pos.x?0:1,sy:y,start:S.legs[x<S.pos.x?0:1]};fx(52,1);}
      else if(S.mode==='box'){let i=boxHit(x,y);if(i>=0)held={type:'box',index:i,ox:S.boxes[i].x-x,oy:S.boxes[i].y-y};}
      else if(S.mode==='route'){if(S.editingRoute){S.route=[];S.editingRoute=false;S.routeIndex=0;S.run=false;}let i=boxHit(x,y);if(i>=0){appendRoute(i);held={type:'route'};}}
      else if(S.mode==='stamp'){let i=mailHit(x,y);if(i>=0){S.tray[i].k=S.stamp;S.stampEdits++;fx(71,1);}else if(S.belly.length){S.belly[S.belly.length-1].k=S.stamp;S.stampEdits++;S.bodyPulse=1;fx(71,1);}}
    }else if(type==='move'&&held){if(held.type==='letter'){held.x=x;held.y=y;}else if(held.type==='leg'){S.legs[held.index]=clamp(held.start+(y-held.sy)*4,.42,1.7);S.legPulls++;fx(44+Math.round(S.legs[held.index]*10));}else if(held.type==='box'){S.boxes[held.index].x=clamp(x+held.ox,.18,.86);S.boxes[held.index].y=clamp(y+held.oy,.22,.75);S.movedBoxes++;}else if(held.type==='route'){let i=boxHit(x,y);if(i>=0)appendRoute(i);}}

  function appendRoute(i){if(S.route[S.route.length-1]!==i&&S.route.length<8){S.route.push(i);S.routeEdits++;fx(57+i*4,1);say('路线 '+S.route.map(j=>String.fromCharCode(65+j)).join(' → '));}}
