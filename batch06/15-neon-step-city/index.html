<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>折线霓城 · 第六组</title><style>:root{--bg:#17121d;--ink:#d8d1c2;--accent:#72ddd0;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>折线霓城</h1><p>拖画连续双轨阶梯，在楼上拉出层高；接桥、拆改后闭合回路，整座城亮起来。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="折线霓城，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="draw" id="draw">双轨引路</button><button data-action="tower" id="tower">建楼升层</button><button data-action="bridge" id="bridge">跨楼接桥</button><button data-action="cut" id="cut">局部拆线</button><button data-action="circuit" id="circuit">闭环通电</button><button data-action="switch" id="switch">电流开关</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=15;window.artMeta={"number": 15, "slug": "15-neon-step-city", "title": "折线霓城", "group": "G", "mothers": ["code_artifact (1).html"], "innovation": "连续双轨正交笔建楼、接桥、回路通电与局部拆改", "description": "拖画连续双轨阶梯，在楼上拉出层高；接桥、拆改后闭合回路，整座城亮起来。", "ui": {"bg": "#17121d", "ink": "#d8d1c2", "accent": "#72ddd0"}, "controls": [{"id": "draw", "label": "双轨引路"}, {"id": "tower", "label": "建楼升层"}, {"id": "bridge", "label": "跨楼接桥"}, {"id": "cut", "label": "局部拆线"}, {"id": "circuit", "label": "闭环通电"}, {"id": "switch", "label": "电流开关"}], "newMechanics": ["显式建楼与持久层高", "两楼之间正交跨桥", "局部拆线打断电流", "闭环时绕接断线，沿线脉冲与建筑楼灯联动"], "artDirection": ["保留正交绘图母本连续双轨、短横绝缘跨线和步进十字笔头", "用青绿、粉朱、金色光墨组成连续阶梯建筑，远离旧雨窗城市美术"], "testPlan": [{"control": "draw", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "tower", "from": [0.42, 0.65], "to": [0.42, 0.43], "hold": 450}, {"control": "bridge", "from": [0.2, 0.64], "to": [0.72, 0.58], "hold": 450}, {"control": "cut", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "circuit", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}], "stateFields": ["vertices<=2800", "queuedSteps<=500", "buildingHeights拖建楼改变", "bridges拖跨楼增加", "closedCircuits点击闭环增加", "powered拆线后false闭环后true", "repairedGaps拆线后闭环出现绕接补线"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,clamp=env.clamp;let route,queue,head,target,buildings,bridges,mode,drag,power,phase,loops,deleted,repaired;const cols=['#70e7dc','#ee718c','#dfbb65','#a697e9'];
function emit(x,y){x=clamp(x,.045,.955);y=clamp(y,.07,.94);if(route.length>2800)route.splice(0,200);head={x,y};route.push({...head,cut:false})}
function lineTo(x,y){let last=queue.length?queue[queue.length-1]:head;queue.push({x,y:last.y},{x,y});queue=queue.slice(-500)}
function outline(b,queued=true){let p=[{x:b.x,y:b.y},{x:b.x,y:b.y-b.h*.64},{x:b.x+b.w*.18,y:b.y-b.h*.64},{x:b.x+b.w*.18,y:b.y-b.h*.8},{x:b.x+b.w*.34,y:b.y-b.h*.8},{x:b.x+b.w*.34,y:b.y-b.h},{x:b.x+b.w*.66,y:b.y-b.h},{x:b.x+b.w*.66,y:b.y-b.h*.8},{x:b.x+b.w*.82,y:b.y-b.h*.8},{x:b.x+b.w*.82,y:b.y-b.h*.64},{x:b.x+b.w,y:b.y-b.h*.64},{x:b.x+b.w,y:b.y}];for(let n of p)if(queued)lineTo(n.x,n.y);else {let dx=n.x-head.x,dy=n.y-head.y;while(Math.abs(dx)>.002){emit(head.x+Math.sign(dx)*Math.min(Math.abs(dx),.008),head.y);dx=n.x-head.x}while(Math.abs(dy)>.002){emit(head.x,head.y+Math.sign(dy)*Math.min(Math.abs(dy),.011));dy=n.y-head.y}}}
function reset(){route=[];queue=[];head={x:.06,y:.8};target=null;emit(head.x,head.y);buildings=[];bridges=[];let mobile=env.W<650;let n=mobile?6:8;for(let i=0;i<n;i++){let b={x:mobile?.12+(i%3)*.28:.065+i*.112,y:mobile?.46+Math.floor(i/3)*.42:.78,w:mobile?.16:.075,h:mobile?.21+(i%2)*.08:.25+(i%3)*.095,col:i%4,charge:0};buildings.push(b);outline(b,false)}mode='draw';drag=null;power=false;phase=0;loops=0;deleted=0;repaired=0}
function nearest(p){let x=p.x/env.W,y=p.y/env.H;return buildings.map((b,i)=>({i,d:Math.hypot((x-b.x-b.w*.5)*env.W,(y-b.y+b.h*.5)*env.H)})).sort((a,b)=>a.d-b.d)[0]}
function input(kind,p){let x=clamp(p.x/env.W,.045,.955),y=clamp(p.y/env.H,.07,.94);if(kind==='down'){drag={x,y};if(mode==='tower'){let n=nearest(p);if(n.d<Math.min(env.W,env.H)*.12)drag.tower=n.i;else if(buildings.length<18){let b={x:clamp(x-.045,.06,.82),y:clamp(y+.12,.3,.9),w:env.W<650?.12:.065,h:.21,col:buildings.length%4,charge:0};buildings.push(b);outline(b);drag.tower=buildings.length-1}}if(mode==='bridge'){let n=nearest(p);drag.bridge=n.i}if(mode==='cut')cut(x,y);if(mode==='draw'){target={x,y}}}if(kind==='move'&&drag){if(mode==='draw')target={x,y};if(mode==='tower'&&drag.tower!==undefined){let b=buildings[drag.tower];b.h=clamp(b.h+(drag.y-y)*.8,.12,.48);drag.y=y}if(mode==='cut')cut(x,y)}if(kind==='up'&&drag){if(mode==='tower'&&drag.tower!==undefined)outline(buildings[drag.tower]);if(mode==='bridge'&&drag.bridge!==undefined){let n=nearest(p);if(n.i!==drag.bridge){let a=buildings[drag.bridge],b=buildings[n.i];bridges.push([drag.bridge,n.i]);bridges=bridges.slice(-16);lineTo(a.x+a.w*.5,a.y-a.h*.6);lineTo(b.x+b.w*.5,b.y-b.h*.6)}}drag=null;target=null}if(kind==='cancel'){drag=null;target=null}}
function cut(x,y){for(let i=1;i<route.length;i++)if(Math.hypot((route[i].x-x)*env.W,(route[i].y-y)*env.H)<Math.min(env.W,env.H)*.045&&!route[i].cut){route[i].cut=true;deleted++}power=false}
function action(id){if(id==='circuit'){let patched=[];for(let i=0;i<route.length;i++){if(!route[i].cut){patched.push(route[i]);continue}let a=patched[patched.length-1]||route[0];while(i<route.length&&route[i].cut)i++;if(i<route.length){let b=route[i],yy=clamp(Math.min(a.y,b.y)-.025,.07,.94);patched.push({x:a.x,y:yy,cut:false},{x:b.x,y:yy,cut:false},{...b,cut:false});repaired++}}route=patched.slice(-2800);lineTo(route[0].x,route[0].y);power=true;loops++;mode='draw';return}if(id==='switch'){power=!power;mode='draw';return}mode=id}
function step(dt){let goal=queue[0]||target;if(!goal)return;for(let k=0;k<Math.ceil(dt*140);k++){let dx=goal.x-head.x,dy=goal.y-head.y;if(Math.abs(dx)+Math.abs(dy)<.003){if(queue.length)queue.shift();goal=queue[0]||target;if(!goal)break;continue}if(Math.abs(dx)*env.W>Math.abs(dy)*env.H)emit(head.x+Math.sign(dx)*Math.min(Math.abs(dx),.008),head.y);else emit(head.x,head.y+Math.sign(dy)*Math.min(Math.abs(dy),.011))}}
function draw(dt,time){phase+=dt;step(dt);c.fillStyle='#17121d';c.fillRect(0,0,env.W,env.H);c.strokeStyle='#51455430';c.lineWidth=1;for(let x=0;x<env.W;x+=24){c.beginPath();c.moveTo(x,0);c.lineTo(x,env.H);c.stroke()}for(let y=0;y<env.H;y+=24){c.beginPath();c.moveTo(0,y);c.lineTo(env.W,y);c.stroke()}c.fillStyle='#b5b0b5';c.font='11px monospace';c.fillText('STEP CITY / TWIN CONDUCTORS',16,25);buildings.forEach(b=>{b.charge+=(Number(power)-b.charge)*Math.min(1,dt*2);let x=b.x*env.W,y=b.y*env.H,w=b.w*env.W,h=b.h*env.H;c.fillStyle=cols[b.col]+'0e';c.fillRect(x,y-h,w,h);c.strokeStyle=cols[b.col]+'46';c.strokeRect(x,y-h,w,h);for(let i=0;i<Math.floor(h/16);i++)for(let j=0;j<3;j++){c.fillStyle=cols[b.col]+(b.charge>.3?'a8':'25');c.fillRect(x+w*(.18+j*.25),y-12-i*16,w*.12,4)}if(b.charge>.2){c.strokeStyle=cols[b.col];c.beginPath();c.moveTo(x+w*.5,y-h);c.lineTo(x+w*.5,y-h-14*b.charge);c.stroke();c.fillStyle='#f4e5a9';c.beginPath();c.arc(x+w*.5,y-h-14*b.charge,3,0,Math.PI*2);c.fill()}});
for(let lane=0;lane<2;lane++){c.strokeStyle=lane?'#ef7d945e':'#6fe1d4';c.lineWidth=lane?1.1:1.9;c.beginPath();route.forEach((p,i)=>{let x=p.x*env.W,y=p.y*env.H+lane*4;if(i===0||p.cut||route[i-1].cut)c.moveTo(x,y);else c.lineTo(x,y)});c.stroke()}c.strokeStyle='#dcbe735c';c.lineWidth=.8;for(let i=0;i<route.length;i+=6){let p=route[i];if(!p.cut){c.beginPath();c.moveTo(p.x*env.W,p.y*env.H);c.lineTo(p.x*env.W,p.y*env.H+4);c.stroke()}}if(power&&route.length){for(let k=0;k<12;k++){let p=route[Math.floor((phase*35+k*route.length/12)%route.length)];if(p.cut)continue;c.fillStyle=cols[k%4];c.shadowColor=cols[k%4];c.shadowBlur=9;c.fillRect(p.x*env.W-2,p.y*env.H-1,4,5)}c.shadowBlur=0}c.strokeStyle='#e8d790';c.lineWidth=1.2;c.beginPath();c.arc(head.x*env.W,head.y*env.H,8,0,Math.PI*2);c.moveTo(head.x*env.W-13,head.y*env.H);c.lineTo(head.x*env.W+13,head.y*env.H);c.stroke();if(target){c.setLineDash([3,5]);c.strokeStyle='#dab67766';c.beginPath();c.moveTo(head.x*env.W,head.y*env.H);c.lineTo(target.x*env.W,target.y*env.H);c.stroke();c.setLineDash([])}}
return{reset,draw,input,action,state:()=>({bounded:true,status:({draw:'引路：拖画双轨阶梯，笔头逐步追随',tower:'建楼：空处点建楼；在楼上纵拖改变层高',bridge:'接桥：从一栋楼拖向另一栋，线路跨接',cut:'拆线：擦过双轨切断；重新闭环才能通电'})[mode]+(power?' · 回路已通电':' · 城市待通电'),mode,vertices:route.length,queuedSteps:queue.length,buildings:buildings.length,buildingHeights:buildings.map(b=>+b.h.toFixed(2)),bridges:bridges.length,closedCircuits:loops,powered:power,cutVertices:route.filter(p=>p.cut).length,repairedGaps:repaired})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
