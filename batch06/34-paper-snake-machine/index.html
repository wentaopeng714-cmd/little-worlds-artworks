<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>纸蛇拉面机 · 第六组</title><style>:root{--bg:#42b096;--ink:#25352c;--accent:#f5c543;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}header h1{font-family:system-ui;font-weight:850}button{border-width:2px}button{box-shadow:2px 2px 0 var(--ink);background:#fff1d8;color:#142a18}button.active{background:var(--accent);color:#142a18}</style><body><header><div><h1>纸蛇拉面机</h1><p>拉长有孔纸蛇、拖动盘绕，撕下入碗；接回整碗再拉、调味重排，让纸链不断再加工。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="纸蛇拉面机，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="pull" id="pull">牵头加长</button><button data-action="curl" id="curl">盘绕纸蛇</button><button data-action="join" id="join">接回长链</button><button data-action="tear" id="tear">撕下入碗</button><button data-action="spice" id="spice">换味摆席</button><button data-action="reverse" id="reverse">纸链逆转</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=34;window.artMeta={"number": 34, "slug": "34-paper-snake-machine", "title": "纸蛇拉面机", "group": "T", "mothers": ["jackpot_pull.html"], "innovation": "有孔纸链伸缩拉撕，接回变纸蛇、折叠蓄力、甩尾与多节摆动", "description": "拉长有孔纸蛇、拖动盘绕，撕下入碗；接回整碗再拉、调味重排，让纸链不断再加工。", "ui": {"bg": "#42b096", "ink": "#25352c", "accent": "#f5c543"}, "controls": [{"id": "pull", "label": "牵头加长"}, {"id": "curl", "label": "盘绕纸蛇"}, {"id": "join", "label": "接回长链"}, {"id": "tear", "label": "撕下入碗"}, {"id": "spice", "label": "换味摆席"}, {"id": "reverse", "label": "纸链逆转"}], "newMechanics": ["纸蛇头位置与链长改变整条曲线，不同卷度形成大轮廓差异", "撕下的长链持久盘入汤碗，可接回再加工", "调味染纸、摆席、逆转与接回保留链材质"], "artDirection": ["青绿场、侧置红色拉面机与白铁滚槽", "蛋黄连孔纸蛇，细框表情头与密纸边节纹", "暖汤象牙碗、盘绕整链与纸屑爆开"], "testPlan": [{"control": "pull", "from": [0.65, 0.56], "to": [0.73, 0.65], "hold": 500}, {"control": "curl", "from": [0.65, 0.56], "to": [0.45, 0.46], "hold": 500}, {"control": "tear", "from": [0.65, 0.56], "to": [0.67, 0.56], "hold": 300}, {"control": "join", "from": [0.54, 0.66], "to": [0.55, 0.67], "hold": 300}], "stateFields": {"segments": "牵头加长，限制7–32节", "bowls": "撕下保存为碗，最多6", "joins": "接回后增加且碗减少", "curl": "盘绕后0.1–1.35之间改变"}, "css": "header h1{font-family:system-ui;font-weight:850}button{border-width:2px}button{box-shadow:2px 2px 0 var(--ink);background:#fff1d8;color:#142a18}button.active{background:var(--accent);color:#142a18}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,TAU=Math.PI*2,cl=env.clamp;let mode,count,curl,head,drag,snakes,spice,tears,joins,confetti,reverse,t;
const colors=['#f5c543','#f0a38c','#c1d87d'];
function reset(){mode='pull';count=12;curl=.55;head={x:.65,y:.56};drag=null;snakes=[];spice=0;tears=0;joins=0;confetti=[];reverse=false;t=0;}
function r(){return Math.min(env.W*(env.W<600?.057:.026),env.H*.045);}
function pos(i,n=count,tx=head.x,ty=head.y,co=curl){let f=i/Math.max(1,n-1),x=.18+(tx-.18)*f+Math.sin(f*TAU*1.3)*Math.sin(f*Math.PI)*co*.23,y=.16+(ty-.16)*f+Math.cos(f*TAU*1.3)*Math.sin(f*Math.PI)*co*.13;return{x:x*env.W,y:y*env.H,a:Math.sin(f*TAU)*co*.65};}
function burst(x,y){for(let j=0;j<20;j++)confetti.push({x,y,vx:(Math.random()-.5)*170,vy:-Math.random()*110,life:1,k:j%3});confetti=confetti.slice(-80);window.artAudio?.fx(3,.9);}
function tear(){snakes.push({x:.54+(snakes.length%2)*.24,y:.66+Math.floor((snakes.length%4)/2)*.16,n:Math.min(count,20),k:spice,rot:snakes.length*.7,coil:curl});if(snakes.length>6)snakes.shift();tears++;count=7;burst(head.x*env.W,head.y*env.H);}
function action(id){mode=id;if(id==='curl'){curl=cl(curl+.25,.1,1.35);if(curl>=1.35)curl=.2;}if(id==='join'&&snakes.length){let s=snakes.pop();count=cl(count+s.n,7,32);spice=s.k;curl=(curl+s.coil)/2;joins++;burst(head.x*env.W,head.y*env.H);}if(id==='tear')tear();if(id==='spice'){spice=(spice+1)%3;snakes.forEach(s=>s.k=spice);}if(id==='reverse'){reverse=!reverse;curl=cl(1.35-curl,.2,1.2);}}
function input(k,p){if(k==='down'){drag={x:p.x,y:p.y,n:count,c:curl,s:snakes.findIndex(s=>Math.hypot(s.x*env.W-p.x,s.y*env.H-p.y)<r()*4)};if(mode==='tear')tear();if(mode==='spice'){spice=(spice+1)%3;}if(mode==='join'&&drag.s>=0){let s=snakes.splice(drag.s,1)[0];count=cl(count+s.n,7,32);joins++;}}
if(k==='move'&&drag){if(mode==='pull'||mode==='reverse'){head.x=cl(p.x/env.W,.24,.88);head.y=cl(p.y/env.H,.28,.66);count=cl(Math.round(drag.n+(p.y-drag.y)/r()),7,32);}if(mode==='curl'){curl=cl(drag.c+(p.x-drag.x)/env.W*2,.1,1.35);head.x=cl(p.x/env.W,.3,.87);head.y=cl(p.y/env.H,.28,.65);}if(mode==='spice'&&drag.s>=0){let s=snakes[drag.s];if(s){s.x=cl(p.x/env.W,.35,.87);s.y=cl(p.y/env.H,.57,.88);s.rot+=(p.x-drag.x)*.004;drag.x=p.x;}}}
if(k==='up'||k==='cancel'){if(drag&&mode==='pull'&&Math.abs(p.x-drag.x)>env.W*.35)tear();drag=null;}}
function fill(col,stroke='#2a352b',w=2){c.fillStyle=col;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=w;c.stroke();}}
function ellipse(x,y,rx,ry,col){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);fill(col,null);}
function segment(rad,k,face,stretch=1){c.save();c.scale(1,stretch);let w=rad*1.8,h=rad*2.1;c.beginPath();c.roundRect(-w*.5,-h*.5,w,h,4);c.shadowColor='#1b5c4040';c.shadowOffsetY=4;c.shadowBlur=5;fill(colors[k]);c.shadowColor='transparent';for(let side of [-1,1]){ellipse(side*w*.5,0,rad*.16,rad*.16,'#42b096');ellipse(0,side*h*.5,rad*.14,rad*.14,'#42b096');}c.strokeStyle='#68572c';c.lineWidth=.8;c.strokeRect(-w*.5+4,-h*.5+5,w-8,h-10);for(let j=0;j<4;j++){c.strokeStyle='#75673555';c.beginPath();c.moveTo(-w*.35,-h*.37+j*rad*.15);c.lineTo(w*.35,-h*.37+j*rad*.15);c.stroke();}if(face){for(let s of [-1,1]){ellipse(s*rad*.35,-rad*.1,rad*.28,rad*.34,'#fff8ec');ellipse(s*rad*.3,-rad*.06,rad*.13,rad*.2,'#29342a');ellipse(s*rad*.55,rad*.3,rad*.045,rad*.045,'#ed4f67');}c.beginPath();c.moveTo(-rad*.27,rad*.4);c.quadraticCurveTo(0,rad*.48,rad*.27,rad*.4);c.quadraticCurveTo(0,rad*.9,-rad*.27,rad*.4);fill('#28352a',null);ellipse(0,rad*.66,rad*.15,rad*.08,'#ef6e89');}else{c.fillStyle='#29342a';c.font=`bold ${rad*.38}px monospace`;c.textAlign='center';c.fillText(k===0?'~':k===1?'≋':'✳',0,rad*.42);}c.restore();}
function bowl(s,time){const rr=r();c.save();c.translate(s.x*env.W,s.y*env.H);if(env.W<600)c.scale(.68,.68);ellipse(3,rr*2.3,rr*4.2,rr*1.3,'#1d6e5850');c.fillStyle='#e6e8dc';c.beginPath();c.moveTo(-rr*4,-rr*.2);c.bezierCurveTo(-rr*4,rr*4,rr*4,rr*4,rr*4,-rr*.2);c.closePath();fill('#faf2d7');ellipse(0,-rr*.2,rr*4,rr*1.5,'#294e45');ellipse(0,-rr*.2,rr*3.65,rr*1.22,'#d19469');
let n=Math.min(s.n,22);for(let i=0;i<n;i++){let a=i*.7+s.rot,rad=rr*(.3+i/n*2.3),x=Math.cos(a)*rad,y=Math.sin(a)*rad*.46-rr*.2;c.save();c.translate(x,y);c.rotate(a+.7);segment(rr*.62,s.k,i===n-1);c.restore();}for(let j=0;j<8;j++){let a=j*2.4+s.rot;ellipse(Math.cos(a)*rr*2.8,Math.sin(a)*rr*.9,rr*.11,rr*.06,'#699554');}c.strokeStyle='#ec6b69';c.lineWidth=rr*.15;c.beginPath();c.moveTo(-rr*1.7,rr*1.85);c.quadraticCurveTo(0,rr*2.6,rr*1.7,rr*1.85);c.stroke();c.restore();}
function draw(dt,time){t=time;let W=env.W,H=env.H,rr=r();c.fillStyle='#42b096';c.fillRect(0,0,W,H);for(let j=0;j<15;j++){c.strokeStyle='#2c8e784f';c.lineWidth=1;c.beginPath();c.moveTo(0,H*.56+j*17);c.lineTo(W,H*.56+j*17);c.stroke();}
// Active paper chain follows a curved centerline, perforations remain visible.
c.lineJoin='round';c.lineCap='round';c.strokeStyle=colors[spice];c.lineWidth=rr*1.45;c.beginPath();for(let j=0;j<=100;j++){let q=pos(j,101);j?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y);}c.stroke();c.strokeStyle='#544329';c.lineWidth=1;c.stroke();
for(let i=0;i<count;i++){let q=pos(reverse?count-1-i:i);c.save();c.translate(q.x,q.y+Math.sin(time*3+i*.5)*2);c.rotate(q.a);segment(rr,spice,i%3===0||i===count-1,1+(drag?.12:0));c.restore();}
// Side-fed noodle roller: red tilted housing, plated slot, exposed crank.
let mx=W*.18,my=H*.12;c.save();c.translate(mx,my);c.beginPath();c.moveTo(-rr*3.1,-rr*1.7);c.lineTo(rr*2.9,-rr*1.7);c.lineTo(rr*3.3,rr*1.4);c.lineTo(-rr*2.7,rr*1.4);c.closePath();fill('#ed3e56');c.fillStyle='#c72c48';c.beginPath();c.moveTo(rr*2.9,-rr*1.7);c.lineTo(rr*3.7,-rr*2.3);c.lineTo(rr*4,rr*.7);c.lineTo(rr*3.3,rr*1.4);c.closePath();c.fill();c.fillStyle='#f1eee3';c.beginPath();c.roundRect(-rr*2.15,-rr*.95,rr*4.3,rr*1.55,3);c.fill();for(let s of [-1,1])for(let z of [-1,1])ellipse(s*rr*1.87,-rr*.17+z*rr*.56,rr*.07,rr*.07,'#454738');c.fillStyle='#222b25';c.beginPath();c.roundRect(-rr*.95,rr*.26,rr*1.9,rr*.23,3);c.fill();c.strokeStyle='#f7eac2';c.lineWidth=rr*.2;c.beginPath();c.moveTo(rr*3.5,0);c.lineTo(rr*4.5,Math.sin(time*2)*rr);c.lineTo(rr*4.9,Math.sin(time*2)*rr);c.stroke();ellipse(rr*4.9,Math.sin(time*2)*rr,rr*.27,rr*.38,'#293b30');c.restore();
snakes.forEach(s=>bowl(s,time));if(!snakes.length){c.strokeStyle='#95ddbc';c.lineWidth=2;c.setLineDash([4,8]);c.beginPath();c.ellipse(W*.66,H*.78,rr*5,rr*2.5,0,0,TAU);c.stroke();c.setLineDash([]);c.font='11px system-ui';c.fillStyle='#fff4d5';c.textAlign='center';c.fillText('撕下的纸蛇会盘进这里',W*.66,H*.83);}
confetti=confetti.filter(q=>q.life>0);confetti.forEach(q=>{q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=240*dt;c.save();c.globalAlpha=Math.max(0,q.life);c.translate(q.x,q.y);c.rotate(time*6);c.fillStyle=colors[q.k];c.fillRect(-3,-5,6,10);c.restore();});c.fillStyle='#fff6d7';c.font=`900 ${W<600?13:24}px system-ui`;c.textAlign='left';c.fillText('一条纸蛇，绕出一碗面',W*.045,H*.94);c.font='11px monospace';c.fillText(`${count} 节 / ${snakes.length} 碗 / ${joins} 次接回`,W*.045,H*.975);}
return{reset,draw,input,action,state:()=>({bounded:true,mode,segments:count,curl:+curl.toFixed(2),bowls:snakes.length,tears,joins,spice,reverse,confetti:confetti.length,status:`${{pull:'拖纸蛇头，下拉加长；大幅横甩可撕',curl:'横拖纸蛇改变弯曲，按键切卷度',join:'点选一碗面接回长链，保留调味',tear:'撕下当前纸蛇，盘入一只碗',spice:'换味给纸染色；拖碗重新摆席',reverse:'逆转纸链，改变顺序和弯曲'}[mode]} · ${count} 节 · ${snakes.length} 碗 · 可接回再拉`})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
