<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拼色折幕 · 第六组</title><style>:root{--bg:#573f42;--ink:#edddc3;--accent:#98bbb0;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}</style><body><header><div><h1>拼色折幕</h1><p>把相邻弧片组成的纸色幕压成窄褶；错动一行、揭开局部，再让纹理墨流过同色片。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="拼色折幕，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="fold" id="fold">整列压折</button><button data-action="stagger" id="stagger">错动横列</button><button data-action="peel" id="peel">揭开幕片</button><button data-action="ink" id="ink">纹理投墨</button><button data-action="roll" id="roll">卷收展开</button><button data-action="flat" id="flat">铺平留墨</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=18;window.artMeta={"number": 18, "slug": "18-chromatic-curtain", "title": "拼色折幕", "group": "G", "mothers": ["code_artifact.html"], "innovation": "纸色弧面织幕压折、错列、局部揭开与纹理投墨", "description": "把相邻弧片组成的纸色幕压成窄褶；错动一行、揭开局部，再让纹理墨流过同色片。", "ui": {"bg": "#573f42", "ink": "#edddc3", "accent": "#98bbb0"}, "controls": [{"id": "fold", "label": "整列压折"}, {"id": "stagger", "label": "错动横列"}, {"id": "peel", "label": "揭开幕片"}, {"id": "ink", "label": "纹理投墨"}, {"id": "roll", "label": "卷收展开"}, {"id": "flat", "label": "铺平留墨"}], "newMechanics": ["列宽真实收窄改变整幅轮廓", "行错位持久保存", "单片绕上缘翻起露织纹背层", "同色域一次投墨且保留印压点", "卷收与已留墨/揭片组合"], "artDirection": ["保留用户母本邻接圆角和大片纸色连续区域，整幅布面以连片结构表现", "朱陶、灰青、矿金、藕粉协调分区，织纹背层、细纸纤维、窄褶阴影"], "testPlan": [{"control": "fold", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "stagger", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "peel", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "ink", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}, {"control": "roll", "from": [0.48, 0.49], "to": [0.67, 0.36], "hold": 450}], "stateFields": ["foldDepths拖压列持久变化", "rowOffsets错行持久变化", "peeledCells揭片增加", "inkedCells投墨后增加", "queue最终0", "rolled卷收true再点false"]};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(env){const c=env.ctx,clamp=env.clamp,pal=['#cf765c','#dcc891','#507877','#7e728d','#acb48b','#dda8a1','#455966'];let nc,nr,cells,folds,shifts,mode,drag,queue,inkRuns,peels,roll,clock;
function idx(x,y){return x>=0&&x<nc&&y>=0&&y<nr?y*nc+x:-1}
function reset(){nc=env.W<650?7:15;nr=env.W<650?12:10;cells=Array.from({length:nc*nr},(_,i)=>{let x=i%nc,y=Math.floor(i/nc);return{x,y,col:(Math.floor(x/3)+Math.floor(y/3)*2+(x%5===0&&y%4===0?1:0))%7,peel:0,ink:0}});folds=Array(nc).fill(0);shifts=Array(nr).fill(0);mode='fold';drag=null;queue=[];inkRuns=peels=clock=0;roll=false}
function geo(){let bw=env.W*.9/nc,bh=env.H*.87/nr,w=folds.map(f=>bw*(1-f*.77)),total=w.reduce((a,b)=>a+b,0),xs=[],x=(env.W-total)/2;for(let q of w){xs.push(x);x+=q}return{bw,bh,w,xs,y:(env.H-bh*nr)/2,total}}
function nearby(p){let g=geo(),row=Math.floor((p.y-g.y)/g.bh);if(row<0||row>=nr)return-1;let x=p.x-shifts[row]*g.bw;let col=g.xs.findIndex((a,i)=>x>=a&&x<a+g.w[i]);return idx(col,row)}
function same(x,y,col){let i=idx(x,y);return i>=0&&cells[i].col===col}
function shape(t,w,h){let rw=w/2,rh=h/2;let round=[!same(t.x-1,t.y,t.col)&&!same(t.x,t.y-1,t.col),!same(t.x+1,t.y,t.col)&&!same(t.x,t.y-1,t.col),!same(t.x+1,t.y,t.col)&&!same(t.x,t.y+1,t.col),!same(t.x-1,t.y,t.col)&&!same(t.x,t.y+1,t.col)];let p=new Path2D();p.moveTo(round[0]?0:-rw,-rh);p.lineTo(round[1]?0:rw,-rh);if(round[1])p.quadraticCurveTo(rw,-rh,rw,0);p.lineTo(rw,round[2]?0:rh);if(round[2])p.quadraticCurveTo(rw,rh,0,rh);p.lineTo(round[3]?0:-rw,rh);if(round[3])p.quadraticCurveTo(-rw,rh,-rw,0);p.lineTo(-rw,round[0]?0:-rh);if(round[0])p.quadraticCurveTo(-rw,-rh,0,-rh);p.closePath();return p}
function flood(i){let original=cells[i].col,visited=new Set([i]),q=[i];for(let k=0;k<q.length;k++){let t=cells[q[k]];for(let [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let j=idx(t.x+dx,t.y+dy);if(j>=0&&!visited.has(j)&&cells[j].col===original){visited.add(j);q.push(j)}}}queue=q.map((i,k)=>({i,col:(original+2)%7,wait:k*.055}));inkRuns++}
function input(kind,p){if(kind==='down'){let i=nearby(p);if(i<0)return;let t=cells[i];drag={i,x:p.x,y:p.y,fold:folds[t.x],shift:shifts[t.y],peel:t.peel};if(mode==='peel'){t.peel=t.peel>.3?0:.75;peels++}if(mode==='ink')flood(i)}if(kind==='move'&&drag){let t=cells[drag.i],g=geo();if(mode==='fold')folds[t.x]=clamp(drag.fold+(p.x-drag.x)/g.bw*.5-(p.y-drag.y)/g.bh*.12,0,.95);if(mode==='stagger')shifts[t.y]=clamp(drag.shift+(p.x-drag.x)/g.bw,-.8,.8);if(mode==='peel')t.peel=clamp(drag.peel-(p.y-drag.y)/g.bh*.5,0,1)}if(kind==='up'||kind==='cancel')drag=null}
function action(id){if(id==='roll'){roll=!roll;folds=folds.map((f,i)=>roll?(i%2?.85:.56):0);return}if(id==='flat'){folds.fill(0);shifts.fill(0);cells.forEach(t=>t.peel=0);return}mode=id}
function draw(dt,time){clock=time;for(let v of queue)v.wait-=dt;let ready=queue.filter(v=>v.wait<=0).slice(0,5);for(let v of ready){cells[v.i].col=v.col;cells[v.i].ink=1;queue.splice(queue.indexOf(v),1)}c.fillStyle='#573f42';c.fillRect(0,0,env.W,env.H);let g=geo(),left=env.W*.05;c.fillStyle='#c5b493';c.fillRect(left,g.y,env.W*.9,g.bh*nr);c.strokeStyle='#4d78736b';c.lineWidth=1;for(let x=left;x<env.W-left;x+=5){c.beginPath();c.moveTo(x,g.y);c.lineTo(x,g.y+g.bh*nr);c.stroke()}c.strokeStyle='#e9d2a96f';for(let y=g.y;y<g.y+g.bh*nr;y+=4){c.beginPath();c.moveTo(left,y);c.lineTo(env.W-left,y);c.stroke()}
for(let t of cells){let w=g.w[t.x],h=g.bh,x=g.xs[t.x]+w/2+shifts[t.y]*g.bw,y=g.y+(t.y+.5)*h,p=shape(t,w,h);c.save();c.translate(x,y);if(t.peel>0){c.translate(0,-h/2);c.scale(1,Math.cos(t.peel*2.3));c.translate(0,h/2)}c.shadowColor='#1e222743';c.shadowBlur=5+folds[t.x]*7;c.shadowOffsetX=folds[t.x]*8;c.shadowOffsetY=t.peel*9;c.fillStyle=pal[t.col];c.fill(p);c.shadowBlur=0;c.shadowOffsetX=c.shadowOffsetY=0;c.save();c.clip(p);let grad=c.createLinearGradient(-w/2,0,w/2,0);grad.addColorStop(0,'#1e252f30');grad.addColorStop(.35,'#fff4d81a');grad.addColorStop(1,'#2a1e3935');c.fillStyle=grad;c.fillRect(-w/2,-h/2,w,h);c.strokeStyle='#f1e4c53d';c.lineWidth=.7;for(let k=0;k<10;k++){let yy=(k/10-.5)*h;c.beginPath();c.moveTo(-w/2,yy);c.lineTo(w/2,yy+Math.sin(k+t.x)*1.3);c.stroke()}for(let k=0;k<14;k++){c.fillStyle='#20363720';c.fillRect(Math.sin(k*2.35+t.y)*w*.43,Math.cos(k*6.77+t.x)*h*.4,1,1)}if(t.ink){c.fillStyle='#efe2b860';for(let k=0;k<6;k++){c.beginPath();c.arc(Math.sin(k*4.31)*w*.3,Math.cos(k*3.33)*h*.32,1.8,0,Math.PI*2);c.fill()}}c.restore();if(t.peel||folds[t.x]){c.strokeStyle='#ecd4b58b';c.lineWidth=.8;c.stroke(p)}c.restore()}
c.strokeStyle='#cfb394';c.lineWidth=2;c.beginPath();c.moveTo(left,g.y-8);c.lineTo(env.W-left,g.y-8);c.stroke();for(let i=0;i<nc;i++){c.fillStyle='#ddbf88';c.beginPath();c.arc(g.xs[i]+g.w[i]/2,g.y-8,2.2,0,Math.PI*2);c.fill()}c.fillStyle='#ead7b4';c.font='10px monospace';c.fillText('CHROMATIC / HINGED SURFACE',16,18)}
return{reset,draw,input,action,state:()=>({bounded:true,status:({fold:'压折：横拖一列压成窄褶，反拖展开；其他材料状态保留',stagger:'错列：横拖一行弧片，让整行持续错位',peel:'揭幕：点一片翻起；纵拖控制开口，露出织纹背层',ink:'纹理投墨：点色域，让墨沿相邻同色片走一次'})[mode],mode,columns:nc,rows:nr,foldDepths:folds.map(f=>+f.toFixed(2)),rowOffsets:shifts.map(f=>+f.toFixed(2)),peeledCells:cells.filter(t=>t.peel>.1).length,inkedCells:cells.filter(t=>t.ink).length,queue:queue.length,inkRuns,peels,rolled:roll})};};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
