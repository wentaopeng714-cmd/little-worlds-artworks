<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pocket weather · Little Worlds</title><style>:root{--bg:#c8d7e3;--ink:#254557}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(26px,env(safe-area-inset-top));left:26px;pointer-events:none}small{font-size:10px;letter-spacing:.2em}h1{font-size:28px;font-weight:500;letter-spacing:-1.2px;margin:7px 0}footer{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:26px;right:26px;display:flex;align-items:center;justify-content:space-between;gap:12px}p{font-size:11px;line-height:1.6;letter-spacing:.03em;margin:0;pointer-events:none}.tools{display:flex;gap:7px}button{background:transparent;border:1px solid currentColor;border-radius:50%;width:40px;height:40px;color:inherit;font-size:15px;cursor:pointer}button:focus-visible{outline:3px solid currentColor;outline-offset:4px}@media(min-width:800px){header{left:48px;top:38px}h1{font-size:34px}footer{left:48px;right:48px;bottom:32px}}</style></head><body><canvas id="art" aria-label="Pocket weather interactive artwork"></canvas><header><small>LITTLE WORLDS / 08</small><h1>Pocket weather</h1></header><footer><p>Hold cloud: rain. Tap sun: bloom.<br>Swipe sky: wind. Tap flowers: seeds.</p><div class="tools"><button id="mute" title="Toggle sound" aria-label="Toggle sound" aria-pressed="false">♪</button><button id="reset" title="Reset" aria-label="Reset">↺</button></div></footer><script>const c=document.getElementById('art'),g=c.getContext('2d');let W,H,D,t=0,muted=false,audio=null,events=0;function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();function unlock(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume().catch(()=>{})}function tone(freq=220,duration=.15,kind='sine',volume=.08){if(muted||!audio)return;const o=audio.createOscillator(),v=audio.createGain();o.type=kind;o.frequency.setValueAtTime(freq,audio.currentTime);v.gain.setValueAtTime(0,audio.currentTime);v.gain.linearRampToValueAtTime(volume,audio.currentTime+.012);v.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+duration+.02)}document.getElementById('mute').onclick=()=>{unlock();muted=!muted;document.getElementById('mute').textContent=muted?'♪̸':'♪';document.getElementById('mute').setAttribute('aria-pressed',String(muted));};function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,Math.max(.1,r),0,Math.PI*2);g.fill()}function line(x,y,xx,yy,color,width){g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(xx,yy);g.stroke()}function loop(){t+=1/60;draw();requestAnimationFrame(loop)}
let nx=.5,ny=.38,drag=false,pressure=0,drops=[],flowers=[],rain=0,lastSound=0,wind=0,mode='CALM',sunny=false,seeds=[],blooms=0,seedCount=0,windGestures=0,sunTaps=0,resets=0,lastX=0,action='',rainbow=0;function reset(){nx=.5;ny=.38;drag=false;pressure=0;drops=[];flowers=Array.from({length:9},(_,i)=>({water:0,growth:.04,bloom:0,hue:i%3,generation:0}));rain=0;events=0;wind=0;sunny=false;seeds=[];blooms=0;seedCount=0;windGestures=0;sunTaps=0;rainbow=0;}reset();
document.getElementById('reset').onclick=()=>{unlock();reset();resets++;tone(440)};
function scatter(i){let f=flowers[i];if(f.bloom<.4)return;for(let j=0;j<3;j++)seeds.push({x:(.1+i*.1)*W,y:H*.77-f.growth*Math.min(H*.18,110),vx:(wind||1)*(1+j),vy:-2-Math.random()*2,hue:f.hue,age:0});f.bloom=.2;seedCount+=3;tone(550+i*35,.25,'triangle',.025);}
c.onpointerdown=e=>{unlock();c.setPointerCapture(e.pointerId);const p=point(e);events++;lastX=p.x;if(Math.hypot(p.x-W*.82,p.y-H*.23)<42){sunny=!sunny;sunTaps++;action='sun';if(sunny&&flowers.some(f=>f.water>.1))rainbow=1;tone(sunny?660:330,.5);return;}if(p.y>H*.61){scatter(Math.max(0,Math.min(8,Math.round((p.x/W-.1)*10))));action='flower';return;}if(Math.hypot((p.x/W-nx)*W,(p.y/H-ny)*H)<Math.min(W*.31,155)){drag=true;sunny=false;action='rain';tone(300,.18);}else{action='wind';windGestures++;}}
c.onpointermove=e=>{const p=point(e);if(action==='rain'){nx=Math.max(.12,Math.min(.88,p.x/W));ny=Math.max(.28,Math.min(.54,p.y/H));}else if(action==='wind'){wind=Math.max(-3,Math.min(3,(p.x-lastX)*.2));lastX=p.x;if(Math.abs(wind)>.6)flowers.forEach((f,i)=>{if(f.bloom>.85)scatter(i);});}};
c.onpointerup=()=>{drag=false;action='';};c.onpointercancel=()=>{drag=false;action='';};
function draw(){wind*=.997;mode=drag?'RAIN':Math.abs(wind)>.35?'WIND':sunny?'SUN':'CALM';g.fillStyle=sunny?'#f0ddb1':'#c8d7e3';g.fillRect(0,0,W,H);const s=Math.min(W*.23,115),cx=nx*W,cy=ny*H,ground=H*.77;pressure+=(Number(drag)-pressure)*.05;
if(rainbow>.01){g.save();g.globalAlpha=rainbow*.5;['#e49570','#f3e6ac','#73977d'].forEach((col,i)=>{g.strokeStyle=col;g.lineWidth=9;g.beginPath();g.arc(W*.5,ground,W*.4+i*12,Math.PI,0);g.stroke();});g.restore();rainbow*=.999;}
circle(W*.82,H*.23,27,sunny?'#f5a644':'#e4e9df');for(let i=0;i<8;i++){let a=i*Math.PI/4+t*.1;line(W*.82+Math.cos(a)*34,H*.23+Math.sin(a)*34,W*.82+Math.cos(a)*40,H*.23+Math.sin(a)*40,'#c29250',2);}g.fillStyle='#254557';g.font='9px Arial';g.textAlign='center';g.fillText('TAP SUN',W*.82,H*.23+56);
g.fillStyle='#aec3a1';g.fillRect(0,ground,W,H-ground);line(W*.08,ground,W*.92,ground,'#254557',1);
for(let i=0;i<9;i++){const f=flowers[i];if(f.water>.01){f.growth=Math.min(1.2,f.growth+.0008);f.water=Math.max(0,f.water-.0001);}if(sunny&&f.water>.04&&f.growth>.18){if(f.bloom===0)blooms++;f.bloom=Math.min(1,f.bloom+.003);f.water=Math.max(0,f.water-.00015);}const x=W*(.1+i*.1),v=f.growth,h=v*Math.min(H*.18,110),bend=wind*h*.12+Math.sin(t*2+i)*2;line(x,ground,x+bend,ground-h,'#537d6c',3);circle(x,ground+8,2+f.water*6,'#477b9c');if(v>.1){g.save();g.translate(x+bend*.5,ground-h*.48);g.rotate(-.7);g.fillStyle='#73977d';g.beginPath();g.ellipse(-5,0,11*v,5*v,0,0,7);g.fill();g.restore()}const r=4+v*10;if(f.bloom>.02){for(let j=0;j<5+f.generation%3;j++){let a=j*Math.PI*2/(5+f.generation%3)+wind*.15;circle(x+bend+Math.cos(a)*r*f.bloom,ground-h+Math.sin(a)*r*f.bloom,r*.55*f.bloom,['#e49570','#f3e6ac','#8b7ba4'][f.hue]);}circle(x+bend,ground-h,r*.3,'#6c7460');}else circle(x+bend,ground-h,3+v*3,'#73977d');}
if(drag&&Math.random()<.8){drops.push({x:cx+(Math.random()-.5)*s*1.65,y:cy+s*.35,v:4+pressure*6});rain++;if(t-lastSound>.15){tone(600+Math.random()*900,.07,'sine',.015);lastSound=t;}}
for(const d of drops){line(d.x,d.y,d.x+wind*2,d.y+9,'#477b9c',2);d.y+=d.v;d.x+=wind;if(d.y>=ground){const n=Math.max(0,Math.min(8,Math.round((d.x/W-.1)*10)));flowers[n].water=Math.min(1,flowers[n].water+.045);flowers[n].growth=Math.min(1.2,flowers[n].growth+.015);d.y=H+50;}}drops=drops.filter(d=>d.y<H);
for(const a of seeds){a.age++;a.x+=a.vx+wind;a.y+=a.vy;a.vy+=.035;if(a.x<15||a.x>W-15)a.vx*=-1;line(a.x,a.y,a.x,a.y-8,'#fbf8eb',1);circle(a.x,a.y-9,3,'#fbf8eb');if(a.y>=ground||a.age>480){let i=Math.max(0,Math.min(8,Math.round((a.x/W-.1)*10))),f=flowers[i];f.generation++;f.hue=(a.hue+1)%3;f.water=Math.max(.18,f.water);f.growth=Math.max(.25,f.growth);f.bloom=0;a.age=999;}}seeds=seeds.filter(a=>a.age<999).slice(-50);
if(Math.abs(wind)>.15){g.strokeStyle='#fbf8eb';g.lineWidth=2;for(let i=0;i<6;i++){let x=((t*wind*45+i*W/5)%W+W)%W,y=H*(.42+(i%3)*.075);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+20,y-7,x+45,y);g.stroke();}}
g.save();g.translate(cx,cy+Math.sin(t)*3);g.scale(1+pressure*.12,1-pressure*.18);g.fillStyle=drag?'#edf0e9':'#fbf8eb';g.beginPath();g.moveTo(-s*.95,s*.38);g.bezierCurveTo(-s*1.7,s*.15,-s*1.1,-s*.55,-s*.6,-s*.33);g.bezierCurveTo(-s*.7,-s*1.1,s*.5,-s*1.13,s*.65,-s*.52);g.bezierCurveTo(s*1.4,-s*.7,s*1.65,s*.36,s*.85,s*.38);g.closePath();g.fill();for(const side of [-1,1]){if(drag)line(side*s*.29-s*.08,-s*.02,side*s*.29+s*.08,-s*.02,'#254557',3);else circle(side*s*.29,-s*.02,s*.036,'#254557');}g.strokeStyle='#254557';g.lineWidth=2;g.beginPath();g.arc(0,s*.07,s*.1,0,Math.PI);g.stroke();g.restore();g.fillStyle='#254557';g.textAlign='center';g.font='10px Arial';g.fillText(mode+' / WATER → SUN → BLOOM → SEED',W/2,H*.86)}window.__artTest={getState:()=>({events,drag,rain,flowers:flowers.map(f=>({...f})),mode,sunny,wind,seeds:seeds.length,seedCount,blooms,windGestures,sunTaps,resets,muted,audio:audio?.state||'locked',geometry:{cloud:[nx,ny],sun:[.82,.23],windStart:[.08,.53],flowerY:.7},width:W,height:H})};loop();
</script></body></html>
