<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>绣球礼焰 · 第六组</title><style>:root{--bg:#090b0e;--ink:#dedfc5;--accent:#f0a8b9;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{min-height:88px;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}header h1{font:500 27px Georgia,serif;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.75;line-height:1.6;max-width:760px}.utility{display:flex;gap:8px;flex-shrink:0}button{font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 92%,var(--ink));border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:22px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation}button.active{background:var(--ink);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#art{display:block;width:100%;height:100%;min-height:0;touch-action:none}footer{padding:10px 20px 13px;min-height:97px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#status{text-align:center;font-size:11px;letter-spacing:.07em;min-height:18px;margin:9px 0 0;opacity:.7}@media(max-width:650px){header{min-height:112px;padding:12px 14px;align-items:flex-start;gap:8px}header h1{font-size:22px}header p{font-size:10px;max-width:240px}.utility{flex-direction:column;gap:5px}.utility button{padding:7px 10px;font-size:11px;min-width:76px}footer{padding:9px 10px 10px;min-height:126px}.tools{gap:6px}.tools button{font-size:11px;padding:8px 11px;min-height:44px;flex:1 0 28%}#status{font-size:10px;margin-top:8px}}header h1{letter-spacing:.08em}</style><body><header><div><h1>绣球礼焰</h1><p>点出珠线礼焰，拉瓣变花形，系成花序再旋拍、轮流开放。</p></div><div class="utility"><button id="mute">声音：待启</button><button id="reset">重新开始</button></div></header><canvas id="art" aria-label="绣球礼焰，可拖动与点按的互动作品"></canvas><footer><div class="tools"><button data-action="plant" id="plant">添礼焰</button><button data-action="stretch" id="stretch">拉花瓣</button><button data-action="tie" id="tie">系花序</button><button data-action="twist" id="twist">旋花拍</button><button data-action="pulse" id="pulse">轮放</button></div><p id="status">点按画面开启音乐 · 多种操作可以组合</p></footer><script>window.ART_SEED=21;window.artMeta={"number": 21, "slug": "21-embroidered-fireflowers", "title": "绣球礼焰", "group": "G", "mothers": ["generative_fireworks_studio.html"], "innovation": "点珠射线花编成花序，拉瓣、系花、旋拍与开放/收束", "description": "点出珠线礼焰，拉瓣变花形，系成花序再旋拍、轮流开放。", "ui": {"bg": "#090b0e", "ink": "#dedfc5", "accent": "#f0a8b9"}, "controls": [{"id": "plant", "label": "添礼焰"}, {"id": "stretch", "label": "拉花瓣"}, {"id": "tie", "label": "系花序"}, {"id": "twist", "label": "旋花拍"}, {"id": "pulse", "label": "轮放"}], "newMechanics": ["点珠花持续保留并编成花序", "拉瓣改变偏心与多层珠环", "系花顺序决定轮放顺序", "旋花对连接花团传递旋转与开合"], "artDirection": ["母本黑底薄环、点珠、暗色同心射线", "粉青橙紫嫩绿协调，密度有主次", "连接组成吊绣花序，收展留下结果"], "testPlan": [{"control": "plant", "from": [0.42, 0.16], "to": [0.42, 0.16], "hold": 650}, {"control": "stretch", "from": [0.5, 0.32], "to": [0.64, 0.44], "hold": 650}, {"control": "tie", "from": [0.23, 0.22], "to": [0.68, 0.61], "hold": 650}, {"control": "twist", "from": [0.68, 0.61], "to": [0.74, 0.53], "hold": 650}, {"control": "pulse", "from": [0.5, 0.32], "to": [0.5, 0.32], "hold": 650}], "stateFields": ["bounded", "mode", "status", "processed", "persistentResult", "flowers", "links", "pulsing", "stretched", "rotations"], "css": "header h1{letter-spacing:.08em}"};</script><script>/* Original Web Audio score and interaction synthesizer for batch06. */
(()=>{
let ac,master,analyser,timer,muted=false,paused=true,unlocked=false,voices=new Set(),peakVoices=0,musicNotes=0,fxNotes=0,step=0,errors=0;
const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,11],[0,4,5,7,9]];
const seed=window.ART_SEED||1,scale=scales[seed%scales.length];
function dispose(v){if(!voices.has(v))return;voices.delete(v);try{v.o.stop();}catch{}v.o.disconnect();v.g.disconnect();}
function clear(){for(const v of [...voices])dispose(v);}
function note(freq,length,volume,type='sine',music=false){if(!ac||muted||paused||ac.state!=='running')return;try{while(voices.size>=6)dispose(voices.values().next().value);const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.artRole=music?'music':'fx';o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.00001,now+length);o.connect(g);g.connect(master);const v={o,g};voices.add(v);peakVoices=Math.max(peakVoices,voices.size);o.onended=()=>dispose(v);o.start();o.stop(now+length+.02);if(music)musicNotes++;else fxNotes++;}catch{errors++;}}
function score(){if(muted||paused)return;const degree=scale[(step*3+seed)%scale.length],base=130.8128*Math.pow(2,(seed%5+degree)/12);note(base,.36,.035,'sine',true);if(step%4===0)note(base*.5,.72,.018,'triangle',true);if(step%3===1)note(base*2,.22,.012,'sine',true);step++;}
function start(){if(timer)clearInterval(timer);score();timer=setInterval(score,420+(seed%5)*24);}
function label(){const b=document.getElementById('mute');if(b){b.textContent=muted?'声音：关':unlocked?'声音：开':'声音：待启';b.setAttribute('aria-pressed',String(muted));}}
async function gesture(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=1024;master.gain.value=muted?0:.7;master.connect(analyser);analyser.connect(ac.destination);}unlocked=true;paused=false;master.gain.cancelScheduledValues(0);master.gain.value=muted?0:.7;await ac.resume();if(!timer)start();label();}catch{errors++;}}
function fx(kind=0,energy=.5){const f=170*Math.pow(2,((seed%6)+scale[Math.abs(kind)%scale.length])/12);note(f*(1+energy*.7),.11+energy*.13,.04+energy*.025,kind%3===0?'triangle':'sine');}
function pause(){paused=true;if(timer){clearInterval(timer);timer=undefined;}clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;ac.suspend().catch(()=>errors++);}}
async function toggle(){muted=!muted;clear();if(ac){master.gain.cancelScheduledValues(0);master.gain.value=0;}await gesture();label();}
function reset(){clear();step=0;if(ac&&!paused&&!muted)score();}
function snapshot(){let rms=0;if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);rms=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);}return{state:ac?ac.state:'not-created',unlocked,muted,paused,rms,voices:voices.size,nodeCount:ac?2+voices.size*2:0,peakVoices,musicNotes,fxNotes,errors};}
window.artAudio={gesture,fx,pause,toggle,reset,snapshot};
document.addEventListener('pointerdown',gesture,{capture:true});document.addEventListener('keydown',e=>{if(!e.repeat)gesture();},{capture:true});
window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mute')?.addEventListener('click',toggle);label();});
})();
</script><script>window.createScene=function(e){const c=e.ctx,cl=e.clamp;let flowers=[],links=[],mode='plant',last=null,selected=-1,tieStart=-1,pulsing=false,beat=0,pulseRoot=0,processed=0,serial=0;const pal=['#47c8a9','#f093a7','#b477dd','#42bdd3','#df8b4f','#b4ce6c'];const label={plant:'添礼焰：点出可保留的珠线绣球',stretch:'拉花瓣：抓近花团拖动，展开偏心珠瓣',tie:'系花序：从一朵拖到另一朵连成花序',twist:'旋花拍：抓花转动，传给已连接花团',pulse:'轮放：沿连接顺序逐朵开放；点花重编起拍'};function add(x,y,r){flowers.push({x,y,r:r||.06+Math.random()*.025,open:1,tx:0,ty:0,rot:serial*.6,id:serial++,phase:0});if(flowers.length>25){let id=flowers.shift().id;links=links.filter(l=>l.a!==id&&l.b!==id)}}function reset(){flowers=[];links=[];serial=0;mode='plant';last=null;selected=-1;tieStart=-1;pulsing=false;beat=0;pulseRoot=0;processed=0;for(let p of [[.23,.22,.105],[.5,.32,.15],[.73,.19,.1],[.31,.61,.16],[.68,.61,.15],[.5,.83,.09],[.12,.46,.04],[.86,.39,.055],[.13,.82,.05],[.85,.83,.055],[.5,.08,.04],[.37,.43,.035],[.62,.8,.04]])add(...p);links=[{a:0,b:1},{a:1,b:2},{a:1,b:3},{a:3,b:4},{a:4,b:5}]}const norm=p=>({x:cl(p.x/e.W,.03,.97),y:cl(p.y/e.H,.03,.97)});function near(q){let best=-1,dist=.23;flowers.forEach((f,i)=>{let d=Math.hypot(f.x-q.x,f.y-q.y);if(d<dist){best=i;dist=d}});return best}function input(k,p){let q=norm(p);if(k==='down'){last=q;selected=near(q);if(mode==='plant'){add(q.x,q.y);selected=flowers.length-1}if(mode==='tie')tieStart=selected;if(mode==='pulse'){if(selected>=0){pulseRoot=flowers[selected].id;beat=0}pulsing=true}processed++}if(k==='move'&&last){let f=flowers[selected];if(f&&mode==='stretch'){f.tx=cl(q.x-f.x,-.2,.2);f.ty=cl(q.y-f.y,-.24,.24);f.open=cl(1+Math.hypot(f.tx,f.ty)*3,.5,1.9)}if(f&&mode==='twist'){let dr=(q.x-last.x-q.y+last.y)*7;f.rot+=dr;for(let l of links){let id=l.a===f.id?l.b:l.b===f.id?l.a:null,a=flowers.find(f=>f.id===id);if(a)a.rot+=dr*.55}}last=q;processed++}if(k==='up'||k==='cancel'){if(mode==='tie'&&tieStart>=0){let n=near(q),a=flowers[tieStart],b=flowers[n];if(b&&a!==b&&!links.some(l=>l.a===a.id&&l.b===b.id||l.a===b.id&&l.b===a.id)){links.push({a:a.id,b:b.id});if(links.length>40)links.shift()}}last=null;tieStart=-1}}
function draw(dt,t){let W=e.W,H=e.H,m=Math.min(W,H);c.fillStyle='#090b0e';c.fillRect(0,0,W,H);let bg=c.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,m*.7);bg.addColorStop(0,'#23302b55');bg.addColorStop(1,'#090b0e');c.fillStyle=bg;c.fillRect(0,0,W,H);if(pulsing)beat+=dt*.8;for(let i=0;i<180;i++){let x=((Math.sin(i*33.1)*91)%1+1)%1*W,y=((Math.sin(i*89.8)*193)%1+1)%1*H;c.fillStyle=pal[i%6]+'40';c.fillRect(x,y,.7,.7)}for(let l of links){let a=flowers.find(f=>f.id===l.a),b=flowers.find(f=>f.id===l.b);if(!a||!b)continue;c.lineWidth=.55;c.strokeStyle=pal[l.a%6]+'60';for(let k=0;k<3;k++){let dx=(b.y-a.y)*m*.1*(k-1),dy=(b.x-a.x)*m*.1*(k-1);c.beginPath();c.moveTo(a.x*W,a.y*H);c.bezierCurveTo((a.x*2+b.x)*W/3+dx,(a.y*2+b.y)*H/3-dy,(b.x*2+a.x)*W/3+dx,(b.y*2+a.y)*H/3-dy,b.x*W,b.y*H);c.stroke()}let z=(beat*.6+l.a*.13)%1,x=(a.x+(b.x-a.x)*z)*W,y=(a.y+(b.y-a.y)*z)*H;c.fillStyle='#e5ce91';c.beginPath();c.arc(x,y,pulsing?2:1,0,7);c.fill()}let order=[pulseRoot],front=0;while(front<order.length){let id=order[front++];for(let l of links){let n=l.a===id?l.b:l.b===id?l.a:null;if(n!==null&&!order.includes(n))order.push(n)}}for(let f of flowers)if(!order.includes(f.id))order.push(f.id);for(let ix=0;ix<flowers.length;ix++){let f=flowers[ix],pulse=pulsing?(.7+.45*Math.max(0,Math.cos(beat*3-order.indexOf(f.id)*.8))):1,r=f.r*m*f.open*pulse;c.save();c.translate(f.x*W,f.y*H);c.rotate(f.rot+.015*Math.sin(t+ix));for(let layer=0;layer<9;layer++){let rr=r*(.15+layer*.115),count=12+(layer%4)*6,shift=layer*.125;c.strokeStyle=pal[(f.id+layer)%6]+(layer%2?'75':'ae');c.lineWidth=.55;c.beginPath();for(let i=0;i<=120;i++){let a=i/120*Math.PI*2+shift,petal=1+.11*Math.sin(a*6+layer*.5),x=Math.cos(a)*rr*petal+f.tx*W*(layer/9),y=Math.sin(a)*rr*petal+f.ty*H*(layer/9);i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();c.stroke();for(let i=0;i<count;i++){let a=i/count*Math.PI*2+shift,petal=1+.11*Math.sin(a*6+layer*.5),x=Math.cos(a)*rr*petal+f.tx*W*(layer/9),y=Math.sin(a)*rr*petal+f.ty*H*(layer/9);c.strokeStyle=pal[(f.id+2)%6]+'38';c.beginPath();c.moveTo(Math.cos(a)*r*.07,Math.sin(a)*r*.07);c.lineTo(x,y);c.stroke();c.fillStyle=pal[(f.id+layer)%6];c.beginPath();c.arc(x,y,(layer%3===0?3.3:1.55)*Math.max(.65,m/720),0,7);c.fill();if(layer%3===0){c.fillStyle='#fff3de80';c.beginPath();c.arc(x-.4,y-.4,.5,0,7);c.fill()}}}c.strokeStyle=pal[f.id%6];c.lineWidth=1;c.beginPath();c.arc(0,0,r*.1,0,7);c.stroke();c.fillStyle=pal[(f.id+1)%6];c.beginPath();c.arc(0,0,2,0,7);c.fill();c.restore()}if(last&&mode==='tie'&&tieStart>=0){let a=flowers[tieStart];c.strokeStyle='#f0dba5';c.setLineDash([3,5]);c.beginPath();c.moveTo(a.x*W,a.y*H);c.lineTo(last.x*W,last.y*H);c.stroke();c.setLineDash([])}}return{reset,draw,input,action(id){mode=id;if(id==='pulse')pulsing=!pulsing},state(){return{bounded:true,mode,processed,persistentResult:flowers.length,flowers:flowers.length,links:links.length,pulsing,stretched:flowers.filter(f=>Math.hypot(f.tx,f.ty)>.025).length,rotations:flowers.reduce((a,f)=>a+Math.abs(f.rot),0),status:label[mode]+' · '+flowers.length+' 球 / '+links.length+' 结'}}}};
</script><script>(()=>{
const m=window.artMeta,canvas=document.getElementById('art'),ctx=canvas.getContext(m.context||'2d',{alpha:false,antialias:true}),pointers=new Map();let W=1,H=1,dpr=1,scene,frames=0,inputs=0,actions=0,resets=0,last=performance.now(),lastFx=0;
const env={canvas,ctx,get W(){return W},get H(){return H},get pointers(){return pointers},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),lerp:(a,b,t)=>a+(b-a)*t,random:Math.random};
function size(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(m.context==='webgl')ctx.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);scene?.resize?.(W,H);}
window.addEventListener('resize',size);size();scene=window.createScene(env);scene.reset();
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pressure:e.pressure||.5};}
function dispatch(kind,e){const p=point(e);inputs++;if(kind==='down'){pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);}else if(kind==='move'){pointers.set(e.pointerId,p);}scene.input?.(kind,p);if(kind==='up'||kind==='cancel')pointers.delete(e.pointerId);if(kind!=='move'||performance.now()-lastFx>120){artAudio.fx((inputs+actions)%5,.6);lastFx=performance.now();}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dispatch('down',e)});canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){e.preventDefault();dispatch('move',e)}else scene.hover?.(point(e));});canvas.addEventListener('pointerup',e=>dispatch('up',e));canvas.addEventListener('pointercancel',e=>dispatch('cancel',e));
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{actions++;scene.action(b.dataset.action);artAudio.fx(actions%5,.8);document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));b.classList.add('active');});
document.getElementById('reset').addEventListener('click',()=>{resets++;pointers.clear();scene.reset();artAudio.reset();document.querySelectorAll('[data-action]').forEach(n=>n.classList.remove('active'));});
window.artState=()=>({inputs,actions,resets,frames,width:W,height:H,...(scene.state?.()||{})});
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!document.hidden){if(m.context!=='webgl')ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(dt,now*.001);frames++;const s=scene.state?.()||{};if(s.status)document.getElementById('status').textContent=s.status;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
